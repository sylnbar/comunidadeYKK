<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LT Server · Streaming Premium</title>
    <meta name="theme-color" content="#0a1628">
    <link rel="icon" href="https://cdn.discordapp.com/attachments/1486811899105640519/1528239344559849582/content.png?ex=6a5d934d&is=6a5c41cd&hm=d07c040e31dba0bfa18b2dab56ccb3f570e0cc98e19c5e8ce9b579f72d84ef28&">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ocean-deep: #040d1a;
            --ocean-dark: #0a1628;
            --ocean-mid: #0f1f3a;
            --ocean-blue: #0c2d4f;
            --ocean-light: #134b7c;
            --ocean-surface: #1a6ba0;
            --ocean-bright: #2196cc;
            --ocean-glow: #3db8e8;
            --ocean-foam: #7dd8f5;
            --accent-teal: #06b6d4;
            --accent-cyan: #22d3ee;
            --text-primary: #e8f4fd;
            --text-secondary: #b8d8f0;
            --text-muted: #7aa8c8;
            --surface-bg: rgba(10, 22, 40, 0.92);
            --card-bg: rgba(15, 31, 58, 0.85);
            --input-bg: rgba(20, 40, 68, 0.8);
            --border-color: rgba(33, 150, 204, 0.25);
            --border-hover: rgba(61, 184, 232, 0.5);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; font-size:16px; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--ocean-deep);
            color: var(--text-primary);
            min-height:100vh;
            line-height:1.6;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
        }
        body::before {
            content:''; position:fixed; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(6,182,212,0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 60%, rgba(33,150,204,0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 90%, rgba(34,211,238,0.08) 0%, transparent 50%);
            pointer-events:none; z-index:-2;
            animation: oceanPulse 8s ease-in-out infinite;
        }
        @keyframes oceanPulse { 0%,100%{ opacity:0.6 } 50%{ opacity:1 } }

        #bubblesContainer {
            position:fixed; top:0; left:0; width:100%; height:100%;
            pointer-events:none; z-index:-1; overflow:hidden;
        }
        .bubble {
            position:absolute; bottom:-50px;
            background: radial-gradient(circle at 30% 30%, rgba(125,216,245,0.5), rgba(33,150,204,0.15));
            border-radius:50%; animation: rise linear infinite;
            box-shadow: 0 0 10px rgba(33,150,204,0.3);
        }
        @keyframes rise {
            0%{ transform:translateY(0) translateX(0) scale(0.5); opacity:0; }
            10%{ opacity:0.9; }
            50%{ transform:translateY(-50vh) translateX(30px) scale(1.1); opacity:0.6; }
            100%{ transform:translateY(-100vh) translateX(-30px) scale(0.3); opacity:0; }
        }
        .particle {
            position:fixed; width:3px; height:3px; background:var(--ocean-foam);
            border-radius:50%; pointer-events:none; z-index:-1;
            animation: floatUp linear infinite;
            box-shadow:0 0 6px var(--ocean-glow);
        }
        @keyframes floatUp {
            0%{ transform:translateY(0) translateX(0) scale(0); opacity:0; }
            20%{ opacity:0.8; transform:scale(1); }
            100%{ transform:translateY(-100vh) translateX(60px) scale(0); opacity:0; }
        }

        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:var(--ocean-dark); }
        ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--ocean-bright),var(--accent-teal)); border-radius:10px; }

        .loading-screen {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:var(--ocean-deep); display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:9999; gap:24px;
        }
        .spinner {
            width:60px; height:60px; border:4px solid rgba(33,150,204,0.2);
            border-top-color:var(--ocean-glow); border-radius:50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .loading-text { font-size:18px; font-weight:600; color:var(--text-secondary); animation:pulseText 1.5s ease-in-out infinite; }
        @keyframes pulseText { 0%,100%{ opacity:0.5 } 50%{ opacity:1 } }

        .toast {
            position:fixed; top:20px; right:20px; padding:16px 24px;
            background:var(--surface-bg); backdrop-filter:blur(20px);
            border:1px solid var(--border-color); border-radius:12px;
            font-weight:500; font-size:14px; z-index:10000;
            box-shadow:0 12px 30px rgba(0,0,0,0.5);
            animation:slideInRight 0.3s ease;
        }
        @keyframes slideInRight { from{ opacity:0; transform:translateX(40px); } }
        .toast.success { background:linear-gradient(135deg,#06b6d4,#0369a1); }
        .toast.error { background:linear-gradient(135deg,#ef4444,#b91c1c); }

        .navbar {
            position:sticky; top:0; z-index:1000;
            background:rgba(10,22,40,0.8); backdrop-filter:blur(30px);
            border-bottom:1px solid var(--border-color); padding:0 20px; height:64px;
        }
        .navbar-content { display:flex; align-items:center; justify-content:space-between; height:100%; max-width:100%; margin:0 auto; }
        .logo { display:flex; align-items:center; gap:12px; cursor:pointer; transition:transform 0.3s; }
        .logo:hover { transform:scale(1.05); }
        .logo-icon {
            width:38px; height:38px; border-radius:10px;
            background-size:cover; background-position:center;
            box-shadow:0 0 20px rgba(33,150,204,0.4);
            background-image:url('https://cdn.discordapp.com/attachments/1486811899105640519/1528239344559849582/content.png?ex=6a5d934d&is=6a5c41cd&hm=d07c040e31dba0bfa18b2dab56ccb3f570e0cc98e19c5e8ce9b579f72d84ef28&');
        }
        .logo-text {
            font-size:22px; font-weight:900;
            background:linear-gradient(135deg,var(--ocean-foam),var(--accent-cyan));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; animation:shimmerText 3s ease-in-out infinite;
        }
        @keyframes shimmerText { 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.3) } }
        .nav-menu { display:flex; gap:4px; flex-wrap:wrap; }
        .nav-item {
            padding:8px 14px; border-radius:8px; cursor:pointer;
            font-weight:600; font-size:13px; color:var(--text-secondary);
            border:none; background:transparent; transition:all 0.3s;
            position:relative; overflow:hidden;
        }
        .nav-item::after {
            content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
            width:0; height:2px; background:var(--accent-cyan); transition:width 0.3s;
        }
        .nav-item:hover::after, .nav-item.active::after { width:60%; }
        .nav-item:hover, .nav-item.active { color:#fff; background:rgba(33,150,204,0.15); }
        .nav-right { display:flex; align-items:center; gap:14px; }
        .user-name { font-weight:600; color:var(--text-secondary); font-size:13px; }
        .btn-outline {
            background:transparent; border:1px solid var(--border-color);
            padding:8px 16px; border-radius:8px; color:var(--text-secondary);
            cursor:pointer; font-size:12px; font-weight:500; transition:all 0.3s;
            position:relative; overflow:hidden;
        }
        .btn-outline:hover { border-color:var(--accent-cyan); color:#fff; box-shadow:0 0 15px rgba(34,211,238,0.2); }

        .content-wrapper { max-width:100%; margin:0 auto; padding:20px 16px; }

        .hero-carousel {
            position:relative; height:520px; border-radius:24px; overflow:hidden;
            margin-bottom:36px; box-shadow:0 20px 60px rgba(0,0,0,0.6);
        }
        .hero-slide {
            position:absolute; inset:0; opacity:0; transition:opacity 1s ease;
            background-size:cover; background-position:center;
        }
        .hero-slide.active { opacity:1; }
        .hero-overlay {
            position:absolute; inset:0;
            background:linear-gradient(to right, rgba(4,13,26,0.9) 0%, rgba(10,22,40,0.5) 50%, rgba(4,13,26,0.7) 100%);
            z-index:1;
        }
        .hero-content { position:relative; z-index:2; padding:0 60px; height:100%; display:flex; flex-direction:column; justify-content:center; max-width:600px; }
        .hero-title {
            font-size:54px; font-weight:900;
            background:linear-gradient(135deg,var(--ocean-foam),var(--accent-cyan),var(--ocean-bright));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; margin-bottom:8px; letter-spacing:-1px;
            animation:heroGlow 3s ease-in-out infinite; transition:all 0.5s;
        }
        @keyframes heroGlow {
            0%,100%{ text-shadow:0 0 20px rgba(34,211,238,0.5); }
            50%{ text-shadow:0 0 40px rgba(34,211,238,0.8),0 0 80px rgba(6,182,212,0.4); }
        }
        .hero-subtitle { font-size:18px; color:var(--text-secondary); margin-bottom:12px; animation:fadeInUp 1s ease; transition:all 0.5s; }
        .hero-description { font-size:14px; color:var(--text-muted); margin-bottom:24px; animation:fadeInUp 1.2s ease; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        @keyframes fadeInUp { from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
        .btn-primary {
            display:inline-flex; align-items:center; gap:10px;
            padding:15px 28px; background:linear-gradient(135deg,var(--ocean-surface),var(--accent-teal));
            color:#fff; border:none; border-radius:12px; font-weight:700; font-size:16px;
            cursor:pointer; transition:all 0.3s; text-decoration:none;
            position:relative; overflow:hidden;
        }
        .btn-primary:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(6,182,212,0.4); }
        .hero-nav { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:3; }
        .hero-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.3); cursor:pointer; transition:all 0.3s; }
        .hero-dot.active { background:var(--accent-cyan); width:24px; border-radius:5px; }

        .section-title { font-size:22px; font-weight:800; margin-bottom:18px; color:var(--text-primary); }
        .content-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px; margin-bottom:36px; }

        .card {
            background:var(--card-bg); backdrop-filter:blur(15px);
            border-radius:16px; border:1px solid var(--border-color);
            overflow:hidden; cursor:pointer; transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
            position:relative;
        }
        .card::before {
            content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
            background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
            opacity:0; transition:opacity 0.4s; pointer-events:none; z-index:2;
        }
        .card:hover::before { opacity:1; }
        .card:hover {
            transform:translateY(-12px) scale(1.02);
            box-shadow:0 24px 50px rgba(0,0,0,0.5),0 0 30px rgba(33,150,204,0.25);
            border-color:var(--border-hover);
        }
        .card-img { width:100%; height:400px; object-fit:cover; transition:transform 0.6s ease; }
        .card:hover .card-img { transform:scale(1.08); }
        .card-body { padding:16px; }
        .card-title { font-size:17px; font-weight:700; margin-bottom:8px; color:var(--text-primary); }
        .card-description {
            font-size:12px; color:var(--text-secondary); margin-bottom:10px;
            display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4;
        }
        .card-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .card-type { background:rgba(6,182,212,0.2); padding:4px 10px; border-radius:14px; font-size:11px; color:var(--accent-cyan); font-weight:600; }
        .card-actions { display:flex; gap:6px; margin-top:8px; }
        .btn-card-action {
            padding:6px 12px; border-radius:6px; border:1px solid var(--border-color);
            background:var(--input-bg); color:var(--text-secondary); cursor:pointer;
            font-size:11px; font-weight:500; transition:all 0.2s;
            position:relative; overflow:hidden;
        }
        .btn-card-action:hover { border-color:var(--accent-cyan); color:#fff; }
        .btn-card-action.active-action { background:rgba(6,182,212,0.3); border-color:var(--accent-cyan); color:#fff; }

        .ripple {
            position:absolute; border-radius:50%; background:rgba(255,255,255,0.3);
            transform:scale(0); animation:rippleEffect 0.6s linear; pointer-events:none;
        }
        @keyframes rippleEffect { to{ transform:scale(4); opacity:0; } }

        .search-box { max-width:500px; margin:0 auto 28px; }
        .search-box input {
            width:100%; padding:14px 22px; background:var(--input-bg);
            border:1px solid var(--border-color); border-radius:30px; color:#fff;
            font-size:14px; outline:none; transition:0.3s;
        }
        .search-box input:focus { border-color:var(--ocean-glow); box-shadow:0 0 25px rgba(33,150,204,0.2); }

        .filters { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
        .filter-btn {
            padding:8px 16px; border-radius:20px; border:1px solid var(--border-color);
            background:var(--card-bg); color:var(--text-secondary); cursor:pointer;
            font-size:12px; transition:0.3s; position:relative; overflow:hidden;
        }
        .filter-btn.active, .filter-btn:hover {
            background:linear-gradient(135deg,var(--ocean-surface),var(--accent-teal));
            color:#fff; border-color:transparent;
        }

        .modal-overlay {
            position:fixed; inset:0; background:rgba(4,13,26,0.85); backdrop-filter:blur(15px);
            display:flex; align-items:center; justify-content:center; z-index:2000;
            opacity:0; visibility:hidden; transition:0.3s;
        }
        .modal-overlay.active { opacity:1; visibility:visible; }
        .modal {
            background:var(--surface-bg); backdrop-filter:blur(25px); border-radius:20px;
            padding:28px; max-width:800px; width:92%; max-height:85vh; overflow-y:auto;
            border:1px solid var(--border-color);
        }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
        .modal-close { background:none; border:none; color:var(--text-muted); font-size:28px; cursor:pointer; transition:0.2s; }
        .modal-close:hover { color:#fff; }

        .form-group { margin-bottom:16px; }
        .form-label { display:block; margin-bottom:6px; font-weight:600; color:var(--text-secondary); }
        .form-input, .form-textarea {
            width:100%; padding:12px; background:var(--input-bg);
            border:1px solid var(--border-color); border-radius:10px; color:#fff;
            font-size:14px; outline:none;
        }
        .form-input:focus { border-color:var(--ocean-glow); }

        .footer-wave { width:100%; margin-top:60px; flex-shrink:0; }
        .footer-wave svg { display:block; width:100%; }
        .footer-credit { text-align:center; padding:10px; color:var(--text-muted); font-size:12px; opacity:0.8; transition:opacity 0.3s; }
        .footer-credit:hover { opacity:1; }

        .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
        .empty-state h3 { font-size:20px; margin-bottom:8px; color:var(--text-secondary); }

        @media (max-width:768px) {
            .hero-title { font-size:34px; }
            .hero-content { padding:0 24px; }
            .content-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
            .nav-menu { gap:2px; }
            .nav-item { padding:6px 10px; font-size:11px; }
            .card-img { height:300px; }
        }
    </style>
</head>
<body>

    <div id="bubblesContainer"></div>

    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Carregando LT Server...</div>
    </div>

    <div id="app" style="display:none;">
        <header class="navbar">
            <div class="navbar-content">
                <div class="logo" onclick="switchTab('home')">
                    <div class="logo-icon"></div>
                    <div class="logo-text">LT Server</div>
                </div>
                <nav class="nav-menu">
                    <button class="nav-item active" data-tab="home">Início</button>
                    <button class="nav-item" data-tab="catalog">Catálogo</button>
                    <button class="nav-item" data-tab="mylist">Minha Lista</button>
                    <button class="nav-item" data-tab="continue">Continuar Vendo</button>
                    <button class="nav-item" data-tab="admin">Admin</button>
                </nav>
                <div class="nav-right">
                    <span class="user-name" id="userNameDisplay">Visitante</span>
                    <button class="btn-outline" id="logoutButton">Login</button>
                </div>
            </div>
        </header>

        <main class="content-wrapper">
            <div id="contentArea"></div>
        </main>

        <div class="footer-wave">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                <path fill="rgba(6,182,212,0.15)" d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,42.7C672,32,768,32,864,42.7C960,53,1056,75,1152,74.7C1248,75,1344,53,1392,42.7L1440,32L1440,120L1392,120C1344,120,1248,120,1152,120C1056,120,960,120,864,120C768,120,672,120,576,120C480,120,384,120,288,120C192,120,96,120,48,120L0,120Z">
                    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
                        M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,42.7C672,32,768,32,864,42.7C960,53,1056,75,1152,74.7C1248,75,1344,53,1392,42.7L1440,32L1440,120L0,120Z;
                        M0,58L48,58C96,58,192,58,288,69C384,80,480,90,576,85C672,80,768,58,864,48C960,37,1056,37,1152,48C1248,58,1344,80,1392,90L1440,101L1440,120L0,120Z;
                        M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,42.7C672,32,768,32,864,42.7C960,53,1056,75,1152,74.7C1248,75,1344,53,1392,42.7L1440,32L1440,120L0,120Z
                    " />
                </path>
            </svg>
            <div class="footer-credit">Made by Sylnar</div>
        </div>
    </div>

    <!-- Modal de conteúdo -->
    <div id="contentModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle" style="font-size:22px;"></h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Modal de login -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal" style="max-width:400px;">
            <div class="modal-header">
                <h2>Login / Cadastro</h2>
                <button class="modal-close" onclick="closeLoginModal()">&times;</button>
            </div>
            <div id="loginForm">
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="loginEmail" class="form-input" placeholder="seu@email.com"></div>
                <div class="form-group"><label class="form-label">Senha</label><input type="password" id="loginPassword" class="form-input" placeholder="••••••••"></div>
                <button onclick="handleLogin()" class="btn-primary" style="width:100%;margin-bottom:10px;">Entrar</button>
                <button onclick="showRegisterForm()" class="btn-outline" style="width:100%;margin-bottom:6px;">Criar Conta</button>
                <button onclick="resetPassword()" class="btn-outline" style="width:100%;">Esqueci minha senha</button>
            </div>
            <div id="registerForm" style="display:none;">
                <div class="form-group"><label class="form-label">Nome</label><input type="text" id="registerName" class="form-input"></div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="registerEmail" class="form-input"></div>
                <div class="form-group"><label class="form-label">Senha</label><input type="password" id="registerPassword" class="form-input" placeholder="Mínimo 6 caracteres"></div>
                <div class="form-group"><label class="form-label">Confirmar Senha</label><input type="password" id="registerConfirmPassword" class="form-input"></div>
                <button onclick="handleRegister()" class="btn-primary" style="width:100%;margin-bottom:10px;">Criar Conta</button>
                <button onclick="showLoginForm()" class="btn-outline" style="width:100%;">Voltar para Login</button>
            </div>
        </div>
    </div>

    <!-- Modal de edição (admin) -->
    <div id="editModal" class="modal-overlay">
        <div class="modal" style="max-width:700px;">
            <div class="modal-header">
                <h2 id="editModalTitle">Editar Conteúdo</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div id="editModalBody"></div>
        </div>
    </div>

    <!-- Overlay do Player Nativo -->
    <div id="videoPlayerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:10000;align-items:center;justify-content:center;flex-direction:column;">
        <div style="width:90%;max-width:1100px;">
            <div style="position:relative; width:100%; max-height: 80vh; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
                <video id="videoPlayer" style="width:100%; max-height: 80vh; outline: none;" controls preload="metadata">
                    <source id="videoSource" src="" type="video/mp4">
                    Seu navegador não suporta a reprodução deste vídeo.
                </video>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:16px;">

        // Função para upload via Bytescale
        async function uploadToBytescale(file) {
            const formData = new FormData();
            formData.append('file', file);

                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${BYTESCALE_PUBLIC_KEY}`

                body: formData
            });
            if (!response.ok) {
                throw new Error('Upload falhou: ' + (await response.text()));

            const data = await response.json();
            return data.fileUrl; // URL pública do arquivo

        function updateCardButtons() {

        // Efeitos visuais
        function createBubbles() {
            const container = document.getElementById('bubblesContainer');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 45 + 10;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = (Math.random() * 18 + 10) + 's';
                bubble.style.animationDelay = (Math.random() * 14) + 's';
                bubble.style.opacity = Math.random() * 0.6 + 0.2;
                container.appendChild(bubble);
            }
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 12 + 8) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = (Math.random() * 3 + 1) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        }

        // Som
        let audioCtx = null;
        function playBubbleSound() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            const types = ['triangle', 'sine'];
            osc.type = types[Math.floor(Math.random() * types.length)];
            filter.type = 'lowpass';
            const filterStart = Math.random() * 400 + 200;
            filter.frequency.setValueAtTime(filterStart, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
            const baseFreq = Math.random() * 150 + 100;
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
            const gainStart = Math.random() * 0.2 + 0.2;
            gain.gain.setValueAtTime(gainStart, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.2);
        }

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (btn) {
                playBubbleSound();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            }
        });

        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        function esc(str) { return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]) : ''; }

        function showLoading() { document.getElementById('loadingScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; }
        function hideLoading() { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('app').style.display = 'block'; }

        // Carregar todo o conteúdo do Firestore
        async function loadAllContent() {
            const [aSnap, sSnap] = await Promise.all([db.collection('animes').get(), db.collection('series').get()]);
            const items = [];
            aSnap.forEach(d => items.push({ id: d.id, type: 'movie', ...d.data() }));
            sSnap.forEach(d => items.push({ id: d.id, type: 'series', ...d.data() }));
            return items;
        }

        function observeCards() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.card').forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(card);
            });
        }

        function startHeroCarousel() {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.hero-dot');
            if (!slides.length) return;
            let current = 0;
            function showSlide(index) {
                slides.forEach(s => s.classList.remove('active'));
                dots.forEach(d => d.classList.remove('active'));
                slides[index].classList.add('active');
                dots[index].classList.add('active');
                if (carouselItems[index]) {
                    document.querySelector('.hero-title').textContent = carouselItems[index].title || 'LT Server';
                    document.querySelector('.hero-subtitle').textContent = carouselItems[index].type === 'movie' ? 'Filme' : 'Série';
                    document.querySelector('.hero-description').textContent = carouselItems[index].description || '';
                }
            }
            if (heroInterval) clearInterval(heroInterval);
            heroInterval = setInterval(() => { current = (current + 1) % slides.length; showSlide(current); }, 4000);
            dots.forEach((dot, i) => {
                dot.addEventListener('click', () => {
                    current = i;
                    showSlide(i);
                    clearInterval(heroInterval);
                    heroInterval = setInterval(() => { current = (current + 1) % slides.length; showSlide(current); }, 4000);
                });
            });
        }

        function makeCard(item) {
            return `
            <div class="card" onclick="openModalById('${item.id}')">
            <img src="${item.imageUrl || 'https://via.placeholder.com/400x600'}" class="card-img" alt="${esc(item.title)}">
            <div class="card-body">
            <div class="card-title">${esc(item.title)}</div>
            <div class="card-description">${esc(item.description || 'Sem descrição.')}</div>
            <div class="card-meta"><span class="card-type">${item.type==='movie'?'Filme':'Série'}</span></div>
            <div class="card-actions" onclick="event.stopPropagation();">
            <button class="btn-card-action ${myList.includes(item.id)?'active-action':''}" data-mylist-btn="${item.id}" onclick="addToMyList('${item.id}')">${myList.includes(item.id)?'Na Lista':'+ Lista'}</button>
            <button class="btn-card-action ${continueWatching.includes(item.id)?'active-action':''}" data-continue-btn="${item.id}" onclick="addToContinueWatching('${item.id}')">${continueWatching.includes(item.id)?'Continuando':'+ Continuar'}</button>
            </div></div></div>`;
        }

        function renderHome() {
            const area = document.getElementById('contentArea');
            const recent = [...allContent].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0,12);

            <div class="hero-overlay"></div>
            <div class="hero-content"><h1 class="hero-title">LT Server</h1><p class="hero-subtitle">Os melhores animes e séries em um só lugar.</p><p class="hero-description"></p><button class="btn-primary" onclick="switchTab('catalog')">Assistir Agora</button></div>
            </div>`;
            area.innerHTML = `${heroHTML}<h2 class="section-title">Adicionados Recentemente</h2><div class="content-grid">${recent.map(makeCard).join('')}</div>`;

        function renderCatalog() {
            const area = document.getElementById('contentArea');
            const genres = [...new Set(allContent.flatMap(i => i.categories || []))].sort();
            area.innerHTML = `
            <h1 style="font-size:36px;font-weight:900;text-align:center;margin-bottom:24px;">Catálogo</h1>
            <div class="search-box"><input type="text" id="searchInput" placeholder="Buscar..." oninput="filterCatalog(this.value)"></div>
            <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all')">Todos</button>
            <button class="filter-btn" onclick="setFilter('movie')">Filmes</button>
            <button class="filter-btn" onclick="setFilter('series')">Séries</button>

            <div id="catalogGrid" class="content-grid"></div>`;
            filteredContent = [...allContent];
            renderCatalogGrid();
            observeCards();
        }

        function renderCatalogGrid() {
            const grid = document.getElementById('catalogGrid');
            if (!grid) return;
            if (!filteredContent.length) { grid.innerHTML = '<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;">Nenhum resultado.</p>'; return; }
            grid.innerHTML = filteredContent.map(makeCard).join('');
            observeCards();
        }

        function setFilter(f) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (f === 'all') filteredContent = [...allContent];
            else if (f === 'movie' || f === 'series') filteredContent = allContent.filter(i => i.type === f);
            else filteredContent = allContent.filter(i => i.categories && i.categories.includes(f));
            renderCatalogGrid();
        }

        function filterCatalog(term) {
            const t = term.toLowerCase().trim();
            filteredContent = t ? allContent.filter(i => i.title.toLowerCase().includes(t)) : [...allContent];
            renderCatalogGrid();
        }

        function renderMyList() {
            const area = document.getElementById('contentArea');
            const items = allContent.filter(i => myList.includes(i.id));
            area.innerHTML = `<h1 style="font-size:36px;font-weight:900;text-align:center;margin-bottom:24px;">Minha Lista</h1>

            observeCards();
        }

        function renderContinueWatching() {
            const area = document.getElementById('contentArea');
            const items = allContent.filter(i => continueWatching.includes(i.id));
            area.innerHTML = `<h1 style="font-size:36px;font-weight:900;text-align:center;margin-bottom:24px;">Continuar Vendo</h1>
            ${items.length?`<div class="content-grid">${items.map(makeCard).join('')}</div>`:`
            <div class="empty-state"><h3>Nada aqui ainda</h3><p>Marque itens como "Continuar Vendo".</p><button class="btn-primary" style="margin-top:16px;" onclick="switchTab('catalog')">Explorar Catálogo</button></div>`}`;
            observeCards();
        }

        // Player de vídeo nativo
        function openVideoPlayer(videoUrl) {
            const overlay = document.getElementById('videoPlayerOverlay');
            const video = document.getElementById('videoPlayer');
            const source = document.getElementById('videoSource');
            source.src = videoUrl;
            video.load();
            video.play().catch(() => {});
            overlay.style.display = 'flex';
            document.getElementById('episodeNav').style.display = 'none';
        }

        function closeVideoPlayer() {
            const overlay = document.getElementById('videoPlayerOverlay');
            const video = document.getElementById('videoPlayer');
            const source = document.getElementById('videoSource');
            video.pause();
            source.src = '';
            video.load();
            overlay.style.display = 'none';
            currentEpisodes = [];
            currentEpisodeIndex = 0;
        }

        function prevEpisode() {
            if (currentEpisodeIndex > 0) {
                currentEpisodeIndex--;
                const ep = currentEpisodes[currentEpisodeIndex];
                openVideoPlayer(ep.videoUrl);
                document.getElementById('epIndicator').textContent = `${currentEpisodeIndex+1}/${currentEpisodes.length}`;
            }
        }

        function nextEpisode() {
            if (currentEpisodeIndex < currentEpisodes.length-1) {
                currentEpisodeIndex++;
                const ep = currentEpisodes[currentEpisodeIndex];
                openVideoPlayer(ep.videoUrl);
                document.getElementById('epIndicator').textContent = `${currentEpisodeIndex+1}/${currentEpisodes.length}`;
            }
        }

        function openModalById(id) {
            const item = allContent.find(i => i.id === id);
            if (!item) return;
            document.getElementById('modalTitle').textContent = item.title;
            const body = document.getElementById('modalBody');
            if (item.type === 'movie') {
                body.innerHTML = `
                <img src="${item.imageUrl}" style="width:100%;max-height:350px;object-fit:cover;border-radius:12px;margin-bottom:16px;">
                <p style="color:var(--text-secondary);margin-bottom:12px;">${esc(item.description||'Sem descrição.')}</p>
                <button class="btn-primary" onclick="playMovie('${item.id}')">Assistir</button>
                <div style="display:flex;gap:8px;margin-top:12px;"><button class="btn-outline ${myList.includes(id)?'active-action':''}" onclick="addToMyList('${id}');closeModal();">${myList.includes(id)?'Na Lista':'+ Minha Lista'}</button><button class="btn-outline ${continueWatching.includes(id)?'active-action':''}" onclick="addToContinueWatching('${id}');closeModal();">${continueWatching.includes(id)?'Continuando':'+ Continuar Vendo'}</button></div>`;
            } else {
                let eps = '';
                if (item.seasons) {
                    Object.entries(item.seasons).forEach(([sn, episodes]) => {
                        eps += `<h4 style="margin-top:16px;color:var(--text-primary);border-bottom:1px solid var(--border-color);padding-bottom:4px;">${esc(sn)}</h4>`;
                        episodes.forEach(ep => {
                            eps += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--input-bg);margin:4px 0;border-radius:8px;"><span>${esc(ep.name)}</span><button class="btn-outline" onclick="playEpisode('${ep.videoUrl}','${sn}','${esc(ep.name)}')">Assistir</button></div>`;
                        });
                    });
                }
                body.innerHTML = `
                <img src="${item.imageUrl}" style="width:100%;max-height:350px;object-fit:cover;border-radius:12px;margin-bottom:16px;">
                <p style="color:var(--text-secondary);margin-bottom:12px;">${esc(item.description||'Sem descrição.')}</p>
                <div style="display:flex;gap:8px;margin-bottom:16px;"><button class="btn-outline ${myList.includes(id)?'active-action':''}" onclick="addToMyList('${id}');closeModal();">${myList.includes(id)?'Na Lista':'+ Minha Lista'}</button><button class="btn-outline ${continueWatching.includes(id)?'active-action':''}" onclick="addToContinueWatching('${id}');closeModal();">${continueWatching.includes(id)?'Continuando':'+ Continuar Vendo'}</button></div>
                ${eps||'<p style="color:var(--text-muted);">Nenhum episódio disponível.</p>'}`;
            }
            document.getElementById('contentModal').classList.add('active');
        }

        function playMovie(movieId) {
            const movie = allContent.find(i => i.id === movieId);
            if (movie && movie.videoUrl) {
                openVideoPlayer(movie.videoUrl);
            } else {
                showToast('Nenhum vídeo disponível.', 'error');
            }
        }

        function playEpisode(videoUrl, season, epName) {
            openVideoPlayer(videoUrl);
            // Configurar navegação de episódios
            const series = allContent.find(i => i.type === 'series' && i.seasons);
            if (series) {
                const allEps = Object.values(series.seasons).flat();
                currentEpisodes = allEps;
                currentEpisodeIndex = allEps.findIndex(e => e.name === epName && e.videoUrl === videoUrl);
                const nav = document.getElementById('episodeNav');
                nav.style.display = 'flex';
                document.getElementById('epIndicator').textContent = `${currentEpisodeIndex+1}/${currentEpisodes.length}`;
            }
        }

        function closeModal() { document.getElementById('contentModal').classList.remove('active'); }

        // Login / Registro
        function showLoginForm() { document.getElementById('loginForm').style.display = 'block'; document.getElementById('registerForm').style.display = 'none'; }
        function showRegisterForm() { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'block'; }
        function showLoginModal() { document.getElementById('loginModal').classList.add('active'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

        async function handleLogin() {
            const e = document.getElementById('loginEmail').value;
            const p = document.getElementById('loginPassword').value;
            if (!e || !p) return showToast('Preencha os campos', 'error');
            try {
                const uc = await auth.signInWithEmailAndPassword(e,p);
                if (!uc.user.emailVerified) { showToast('Verifique seu email!', 'info'); await uc.user.sendEmailVerification(); }
                showToast('Login realizado!', 'success');
                closeLoginModal();
            } catch (err) { showToast('Erro: ' + err.message, 'error'); }
        }

        async function handleRegister() {
            const n = document.getElementById('registerName').value;
            const e = document.getElementById('registerEmail').value;
            const p = document.getElementById('registerPassword').value;
            const c = document.getElementById('registerConfirmPassword').value;
            if (!n || !e || !p || !c) return showToast('Preencha todos', 'error');
            if (p !== c) return showToast('Senhas não conferem', 'error');
            if (p.length < 6) return showToast('Senha muito curta', 'error');
            try {
                const uc = await auth.createUserWithEmailAndPassword(e,p);
                await uc.user.sendEmailVerification();
                await uc.user.updateProfile({ displayName: n });
                showToast('Conta criada! Verifique seu email.', 'success');
                closeLoginModal();
            } catch (err) { showToast('Erro: ' + err.message, 'error'); }
        }

        async function resetPassword() {
            const e = document.getElementById('loginEmail').value;
            if (!e) return showToast('Digite seu email', 'error');
            try { await auth.sendPasswordResetEmail(e); showToast('Email de redefinição enviado!', 'success'); }
            catch (err) { showToast('Erro: ' + err.message, 'error'); }
        }

        function updateAuthUI() {
            const nud = document.getElementById('userNameDisplay');
            const lb = document.getElementById('logoutButton');
            const at = document.querySelector('[data-tab="admin"]');
            if (at) at.style.display = (currentUser?.email === OWNER_EMAIL) ? 'flex' : 'none';
            if (currentUser) {
                nud.textContent = currentUser.displayName || currentUser.email;
                lb.textContent = 'Sair';
                lb.onclick = () => { auth.signOut(); showToast('Logout!', 'success'); };
            } else {
                nud.textContent = 'Visitante';
                lb.textContent = 'Login';
                lb.onclick = showLoginModal;
            }
        }

        // ===== ADMIN =====
        async function loadAdmin() {
            if (currentUser?.email !== OWNER_EMAIL) { document.getElementById('contentArea').innerHTML = '<p style="text-align:center;padding:60px;">Acesso restrito ao proprietário.</p>'; return; }
            const items = await loadAllContent();
            allContent = items;
            const movies = items.filter(i => i.type === 'movie');
            const series = items.filter(i => i.type === 'series');
            document.getElementById('contentArea').innerHTML = `
            <div style="background:var(--surface-bg);border-radius:16px;padding:24px;border:1px solid var(--border-color);">
            <h2 style="margin-bottom:16px;">Painel Admin</h2>
            <button class="btn-primary" onclick="addMovieForm()" style="margin-right:10px;">+ Filme</button>
            <button class="btn-primary" onclick="addSeriesForm()">+ Série</button>
            <div id="adminFormContainer" style="margin-top:20px;"></div>
            <h3 style="margin-top:30px;">Filmes (${movies.length})</h3>
            ${movies.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--input-bg);margin:4px 0;border-radius:6px;"><span>${esc(i.title)}</span><div><button class="btn-outline" onclick="openEditModal('${i.id}','movie')">Editar</button><button class="btn-outline" style="margin-left:6px;" onclick="deleteContent('${i.id}','movie')">Excluir</button></div></div>`).join('')}
            <h3 style="margin-top:20px;">Séries (${series.length})</h3>
            ${series.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--input-bg);margin:4px 0;border-radius:6px;"><span>${esc(i.title)}</span><div><button class="btn-outline" onclick="openEditModal('${i.id}','series')">Editar</button><button class="btn-outline" style="margin-left:6px;" onclick="deleteContent('${i.id}','series')">Excluir</button></div></div>`).join('')}
            </div>`;
        }

        function addMovieForm() {
            document.getElementById('adminFormContainer').innerHTML = `
            <h4>Adicionar Filme</h4>
            <div class="form-group"><label>Título</label><input id="movTitle" class="form-input"></div>
            <div class="form-group"><label>Descrição</label><textarea id="movDesc" class="form-textarea"></textarea></div>
            <div class="form-group"><label>Imagem URL</label><input id="movImg" class="form-input"></div>
            <div class="form-group"><label>Categorias</label><input id="movCat" class="form-input" placeholder="Ação, Drama"></div>
            <div class="form-group"><label>Arquivo de Vídeo (.mp4)</label><input type="file" id="movVideoFile" class="form-input" accept="video/mp4,video/webm"></div>
            <button class="btn-primary" onclick="submitMovie()">Salvar</button>`;
        }

        async function submitMovie() {
            const fileInput = document.getElementById('movVideoFile');
            let videoUrl = '';
            if (fileInput.files.length > 0) {
                showToast('Enviando vídeo...', 'info');
                try {
                    videoUrl = await uploadToBytescale(fileInput.files[0]);
                } catch (err) {
                    showToast('Erro no upload: ' + err.message, 'error');
                    return;
                }
            }
            await db.collection('animes').add({
                title: document.getElementById('movTitle').value,
                description: document.getElementById('movDesc').value,
                imageUrl: document.getElementById('movImg').value,
                categories: document.getElementById('movCat').value.split(',').map(s => s.trim()),
                videoUrl: videoUrl,
                averageRating: 0, ratings: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast('Filme adicionado!', 'success');
            loadAdmin();
        }

        function addSeriesForm() {
            document.getElementById('adminFormContainer').innerHTML = `
            <h4>Adicionar Série</h4>
            <div class="form-group"><label>Título</label><input id="serTitle" class="form-input"></div>
            <div class="form-group"><label>Descrição</label><textarea id="serDesc" class="form-textarea"></textarea></div>
            <div class="form-group"><label>Imagem URL</label><input id="serImg" class="form-input"></div>
            <div class="form-group"><label>Categorias</label><input id="serCat" class="form-input"></div>
            <div class="form-group"><label>Temporada</label><input id="serSeason" class="form-input" value="Temporada 1"></div>
            <div class="form-group"><label>Episódio</label><input id="serEpName" class="form-input" value="Episódio 1"></div>
            <div class="form-group"><label>Arquivo de Vídeo (.mp4)</label><input type="file" id="serEpVideo" class="form-input" accept="video/mp4,video/webm"></div>
            <button class="btn-primary" onclick="submitSeries()">Salvar</button>`;
        }

        async function submitSeries() {
            const season = document.getElementById('serSeason').value;
            const epName = document.getElementById('serEpName').value;
            const fileInput = document.getElementById('serEpVideo');
            let videoUrl = '';
            if (fileInput.files.length > 0) {
                showToast('Enviando vídeo...', 'info');
                try {
                    videoUrl = await uploadToBytescale(fileInput.files[0]);
                } catch (err) {
                    showToast('Erro no upload: ' + err.message, 'error');
                    return;
                }
            }
            const seasons = {};
            seasons[season] = [{ name: epName, videoUrl: videoUrl }];
            await db.collection('series').add({
                title: document.getElementById('serTitle').value,
                description: document.getElementById('serDesc').value,
                imageUrl: document.getElementById('serImg').value,
                categories: document.getElementById('serCat').value.split(',').map(s => s.trim()),
                seasons, averageRating: 0, ratings: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast('Série adicionada!', 'success');
            loadAdmin();
        }

        async function deleteContent(id, type) {
            if (!confirm('Excluir?')) return;
            await db.collection(type === 'movie' ? 'animes' : 'series').doc(id).delete();
            showToast('Excluído!', 'success');
            loadAdmin();
        }

        // EDIÇÃO
        async function openEditModal(id, type) {
            const col = type === 'movie' ? 'animes' : 'series';
            const doc = await db.collection(col).doc(id).get();
            if (!doc.exists) { showToast('Conteúdo não encontrado.', 'error'); return; }
            const data = doc.data();
            const modal = document.getElementById('editModal');
            document.getElementById('editModalTitle').textContent = `Editar ${type === 'movie' ? 'Filme' : 'Série'}`;
            const body = document.getElementById('editModalBody');

            if (type === 'movie') {
                body.innerHTML = `
                <div class="form-group"><label>Título</label><input id="editTitle" class="form-input" value="${esc(data.title)}"></div>
                <div class="form-group"><label>Descrição</label><textarea id="editDesc" class="form-textarea">${esc(data.description||'')}</textarea></div>
                <div class="form-group"><label>Imagem URL</label><input id="editImg" class="form-input" value="${esc(data.imageUrl)}"></div>
                <div class="form-group"><label>Categorias</label><input id="editCat" class="form-input" value="${esc((data.categories||[]).join(', '))}"></div>
                <div class="form-group"><label>Vídeo atual</label><input id="editVideoUrl" class="form-input" value="${esc(data.videoUrl||'')}" readonly></div>
                <div class="form-group"><label>Substituir vídeo (deixe vazio para manter)</label><input type="file" id="editVideoFile" class="form-input" accept="video/mp4,video/webm"></div>
                <button class="btn-primary" onclick="saveEdit('${id}','movie')">Salvar Alterações</button>`;
            } else {
                let seasonsHtml = '';
                if (data.seasons) {
                    Object.entries(data.seasons).forEach(([seasonName, episodes]) => {
                        seasonsHtml += `<div class="season-field" style="background:var(--card-bg);padding:14px;border-radius:10px;margin-bottom:12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <input class="form-input season-name-input" value="${esc(seasonName)}" style="flex:1;margin-right:8px;">
                        <button class="btn-outline" onclick="this.closest('.season-field').remove()">Remover</button>
                        </div>
                        <div class="episodes-container">`;
                        episodes.forEach(ep => {
                            seasonsHtml += `<div class="episode-field" style="background:var(--input-bg);padding:8px;border-radius:6px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;">
                            <input class="form-input episode-name-input" value="${esc(ep.name)}" style="flex:1;min-width:120px;">
                            <input class="form-input episode-video-input" value="${esc(ep.videoUrl||'')}" placeholder="URL do vídeo" style="flex:1;min-width:200px;" readonly>
                            <input type="file" class="form-input episode-file-input" accept="video/mp4,video/webm" style="min-width:150px;">
                            <button class="btn-outline" onclick="this.parentElement.remove()">×</button>
                            </div>`;
                        });
                        seasonsHtml += `</div><button class="btn-outline" onclick="addEpisodeToSeason(this)">+ Episódio</button></div>`;
                    });
                }
                body.innerHTML = `
                <div class="form-group"><label>Título</label><input id="editTitle" class="form-input" value="${esc(data.title)}"></div>
                <div class="form-group"><label>Descrição</label><textarea id="editDesc" class="form-textarea">${esc(data.description||'')}</textarea></div>
                <div class="form-group"><label>Imagem URL</label><input id="editImg" class="form-input" value="${esc(data.imageUrl)}"></div>
                <div class="form-group"><label>Categorias</label><input id="editCat" class="form-input" value="${esc((data.categories||[]).join(', '))}"></div>
                <h4 style="margin:20px 0 10px;">Temporadas e Episódios</h4>
                <div id="seasonsEditContainer">${seasonsHtml}</div>
                <button class="btn-outline" onclick="addSeasonEdit()" style="margin-top:10px;">+ Nova Temporada</button>
                <button class="btn-primary" onclick="saveEdit('${id}','series')" style="margin-top:20px;">Salvar Alterações</button>`;
            }
            modal.classList.add('active');
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }

        window.addEpisodeToSeason = function(btn) {
            const container = btn.previousElementSibling;
            const div = document.createElement('div');
            div.className = 'episode-field';
            div.style.cssText = 'background:var(--input-bg);padding:8px;border-radius:6px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;';
            div.innerHTML = `
            <input class="form-input episode-name-input" placeholder="Nome do episódio" style="flex:1;min-width:120px;">
            <input class="form-input episode-video-input" placeholder="URL do vídeo (será preenchido após upload)" style="flex:1;min-width:200px;" readonly>
            <input type="file" class="form-input episode-file-input" accept="video/mp4,video/webm" style="min-width:150px;">
            <button class="btn-outline" onclick="this.parentElement.remove()">×</button>`;
            container.appendChild(div);
        };

        window.addSeasonEdit = function() {
            const container = document.getElementById('seasonsEditContainer');
            const div = document.createElement('div');
            div.className = 'season-field';
            div.style.cssText = 'background:var(--card-bg);padding:14px;border-radius:10px;margin-bottom:12px;';
            div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <input class="form-input season-name-input" value="Nova Temporada" style="flex:1;margin-right:8px;">
            <button class="btn-outline" onclick="this.closest('.season-field').remove()">Remover</button>
            </div>
            <div class="episodes-container">
            <div class="episode-field" style="background:var(--input-bg);padding:8px;border-radius:6px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;">
            <input class="form-input episode-name-input" value="Episódio 1" style="flex:1;min-width:120px;">
            <input class="form-input episode-video-input" placeholder="URL do vídeo" style="flex:1;min-width:200px;" readonly>
            <input type="file" class="form-input episode-file-input" accept="video/mp4,video/webm" style="min-width:150px;">
            <button class="btn-outline" onclick="this.parentElement.remove()">×</button>
            </div></div>
            <button class="btn-outline" onclick="addEpisodeToSeason(this)">+ Episódio</button>`;
            container.appendChild(div);
        };

        async function saveEdit(id, type) {
            const col = type === 'movie' ? 'animes' : 'series';
            const title = document.getElementById('editTitle').value;
            const desc = document.getElementById('editDesc').value;
            const img = document.getElementById('editImg').value;
            const cat = document.getElementById('editCat').value.split(',').map(s => s.trim());
            const updateData = { title, description: desc, imageUrl: img, categories: cat };

            if (type === 'movie') {
                const fileInput = document.getElementById('editVideoFile');
                if (fileInput.files.length > 0) {
                    showToast('Enviando novo vídeo...', 'info');
                    try {
                        updateData.videoUrl = await uploadToBytescale(fileInput.files[0]);
                    } catch (err) {
                        showToast('Erro no upload: ' + err.message, 'error');
                        return;
                    }
                } else {
                    updateData.videoUrl = document.getElementById('editVideoUrl').value;
                }
            } else {
                const seasons = {};
                const promises = [];
                document.querySelectorAll('#seasonsEditContainer .season-field').forEach(sf => {
                    const seasonName = sf.querySelector('.season-name-input').value.trim();
                    if (!seasonName) return;
                    const episodes = [];
                    sf.querySelectorAll('.episode-field').forEach(ef => {
                        const epName = ef.querySelector('.episode-name-input').value.trim();
                        const videoUrlInput = ef.querySelector('.episode-video-input');
                        const fileInput = ef.querySelector('.episode-file-input');
                        if (!epName) return;
                        const epData = { name: epName, videoUrl: videoUrlInput.value };
                        episodes.push(epData);
                        if (fileInput.files.length > 0) {
                            promises.push((async () => {
                                try {
                                    epData.videoUrl = await uploadToBytescale(fileInput.files[0]);
                                } catch (err) {
                                    showToast('Erro no upload de episódio: ' + err.message, 'error');
                                }
                            })());
                        }
                    });
                    if (episodes.length) seasons[seasonName] = episodes;
                });
                await Promise.all(promises);
                updateData.seasons = seasons;
            }

            await db.collection(col).doc(id).update(updateData);
            showToast('Atualizado!', 'success');
            closeEditModal();
            loadAdmin();
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`[data-tab="${tab}"]`);
            if (btn) btn.classList.add('active');
            if (tab === 'home') renderHome();
            else if (tab === 'catalog') renderCatalog();
            else if (tab === 'mylist') renderMyList();
            else if (tab === 'continue') renderContinueWatching();
            else if (tab === 'admin') loadAdmin();
            if (heroInterval) clearInterval(heroInterval);
        }

        async function init() {
            try {
                showLoading();
                createBubbles();
                allContent = await loadAllContent();
                updateAuthUI();
                loadUserData();
                renderHome();
                hideLoading();
            } catch (e) {
                console.error(e);
                hideLoading();
                showToast('Erro ao carregar. Recarregue a página.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
            document.getElementById('contentModal').addEventListener('click', e => { if (e.target.id === 'contentModal') closeModal(); });
            document.getElementById('editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeEditModal(); });
            init();
        });

        auth.onAuthStateChanged(user => { currentUser = user; updateAuthUI(); if (user) loadUserData(); });
    </script>
</body>
</html>
