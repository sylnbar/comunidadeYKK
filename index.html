<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>YK Server · Animes & Games</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: radial-gradient(circle at 10% 20%, #0f0b1a, #08050f);
      color: #f5e6f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e1a2a; }
    ::-webkit-scrollbar-thumb { background: #ff5a8a; border-radius: 10px; }

    /* Animações */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 5px rgba(255,90,138,0.3); }
      50% { box-shadow: 0 0 20px rgba(255,90,138,0.6); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff3366;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: bold;
      z-index: 1000;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      animation: fadeInUp 0.3s ease, shakeError 0.4s ease;
      backdrop-filter: blur(8px);
      font-size: 14px;
      max-width: 90vw;
      text-align: center;
      white-space: normal;
    }
    .success-toast { background: #4caf50; animation: fadeInUp 0.3s ease; }

    /* Login Screen - original */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #1a0f2e, #0a0512);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }
    .login-card {
      background: rgba(30, 22, 45, 0.8);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 56px;
      width: 380px;
      max-width: 90%;
      border: 1px solid rgba(255, 90, 138, 0.4);
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ff90b5, #ff5a8a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 32px;
    }
    .login-card input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: rgba(42, 34, 59, 0.8);
      border: 1px solid rgba(255, 90, 138, 0.3);
      border-radius: 60px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .login-card input:focus { border-color: #ff5a8a; box-shadow: 0 0 10px rgba(255,90,138,0.3); }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff5a8a, #ff3366);
      border: none;
      border-radius: 60px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }
    .login-card .switch {
      text-align: center;
      margin-top: 20px;
      color: #ccb0e0;
      cursor: pointer;
      font-size: 13px;
    }
    .app { display: none; min-height: 100vh; flex-direction: column; }
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0512;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99;
      flex-direction: column;
      gap: 20px;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 90, 138, 0.3);
      border-top: 4px solid #ff5a8a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Top bar - estilo original (grande) */
    .top-bar {
      background: rgba(19, 14, 28, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 32px;
      border-bottom: 1px solid rgba(255, 90, 138, 0.3);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .yk-logo {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ff5a8a, #ff3366, #ff8ab5);
      background-size: 200% 200%;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 28px;
      color: white;
      box-shadow: 0 0 20px rgba(255, 90, 138, 0.6);
      animation: gradientShift 3s ease infinite, pulseGlow 2s ease infinite;
    }
    .top-bar h1 {
      font-size: 22px;
      background: linear-gradient(135deg, #ff90b5, #ff5a8a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 600;
    }
    .user-info { display: flex; gap: 20px; align-items: center; }
    .user-info span { font-size: 14px; }
    .logout-btn {
      background: transparent;
      border: 1px solid #ff7aa8;
      padding: 6px 20px;
      border-radius: 40px;
      cursor: pointer;
      color: #ff90b5;
      transition: 0.2s;
    }
    .logout-btn:hover { background: rgba(255, 90, 138, 0.2); }

    /* Main layout - sidebar original */
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 250px;
      background: rgba(17, 12, 28, 0.7);
      backdrop-filter: blur(8px);
      padding: 28px 16px;
      border-right: 1px solid rgba(255, 90, 138, 0.2);
      transition: transform 0.3s ease;
    }
    .nav-item {
      padding: 12px 18px;
      margin: 8px 0;
      cursor: pointer;
      border-radius: 40px;
      transition: 0.2s;
      font-weight: 600;
      color: #e2ccee;
      white-space: nowrap;
    }
    .nav-item:hover { background: rgba(255, 90, 138, 0.2); transform: translateX(5px); }
    .nav-item.active { background: linear-gradient(135deg, #ff5a8a, #ff3366); color: white; }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      background: rgba(8, 5, 15, 0.6);
    }

    /* Mobile menu button (só aparece no mobile) */
    .mobile-menu-btn {
      display: none;
      background: rgba(255, 90, 138, 0.2);
      border: 1px solid rgba(255, 90, 138, 0.5);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      font-size: 20px;
      color: #ff90b5;
    }
    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 90;
    }

    /* Grid - PC: cards MAIORES (280px mínimo) */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }
    .anime-card {
      background: rgba(23, 17, 38, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
      border: 1px solid rgba(255, 90, 138, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .anime-card:hover { transform: translateY(-8px) scale(1.02); border-color: #ff5a8a; }
    .anime-card .anime-image {
      width: 100%;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #1a1530;
    }
    .anime-card .anime-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .anime-card:hover .anime-image img { transform: scale(1.05); }
    .card-content {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-content h3 {
      font-size: 15px;
      margin-bottom: 4px;
      color: #ffc0dd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .categories-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0 8px 0;
    }
    .category-badge {
      font-size: 10px;
      background: rgba(47, 35, 75, 0.8);
      padding: 3px 8px;
      border-radius: 20px;
      color: #ffafcf;
    }
    /* Estrelas */
    .rating-stars {
      display: flex;
      align-items: center;
      gap: 3px;
      margin: 5px 0;
      font-size: 14px;
    }
    .star-filled { color: #ffcc00; }
    .star-empty { color: #555; }
    .rating-value {
      font-size: 11px;
      margin-left: 5px;
      color: #ffc0dd;
    }
    .watch-btn {
      margin-top: 6px;
      padding: 6px;
      background: linear-gradient(135deg, #ff5a8a, #ff3366);
      text-align: center;
      border-radius: 30px;
      color: white;
      font-weight: bold;
      font-size: 12px;
      margin-top: auto;
      cursor: pointer;
    }
    .favorite-btn-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 30px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 14px;
      z-index: 10;
      opacity: 0;
      transition: 0.2s;
    }
    .anime-card:hover .favorite-btn-overlay { opacity: 1; }
    .favorite-btn-overlay.active { opacity: 1; background: #ff5a8a; }
    .novidade-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: linear-gradient(135deg, #ff5a8a, #ff3366);
      padding: 3px 10px;
      border-radius: 30px;
      font-size: 9px;
      font-weight: bold;
      z-index: 2;
    }

    /* Admin form - original */
    .admin-form {
      background: rgba(22, 16, 41, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 32px;
      border: 1px solid rgba(255, 90, 138, 0.3);
    }
    .admin-form input, .admin-form textarea, .admin-form select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #251f36;
      border: 1px solid rgba(255, 90, 138, 0.3);
      border-radius: 24px;
      color: white;
      font-size: 14px;
    }
    .categories-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
      padding: 12px;
      background: rgba(37, 31, 54, 0.6);
      border-radius: 24px;
    }
    .categories-checkbox-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .season-item {
      background: rgba(31, 24, 48, 0.8);
      padding: 18px;
      border-radius: 24px;
      margin-bottom: 18px;
    }
    .episode-item {
      background: rgba(42, 35, 64, 0.8);
      padding: 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .upload-container {
      background: #1a1329;
      border-radius: 20px;
      padding: 8px;
      min-width: 200px;
    }
    .upload-area { display: flex; flex-direction: column; gap: 5px; }
    .upload-label {
      background: #a85c7c;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 11px;
      text-align: center;
    }
    .progress-bar-container {
      width: 100%;
      height: 20px;
      background: #2a2340;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff5a8a, #ff3366);
      width: 0%;
      transition: width 0.3s;
    }
    .search-bar {
      background: rgba(26, 19, 41, 0.8);
      border-radius: 60px;
      padding: 8px 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 90, 138, 0.3);
    }
    .search-bar input {
      background: transparent;
      border: none;
      color: white;
      width: 100%;
      outline: none;
      font-size: 14px;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }
    .filter-chip {
      background: rgba(31, 24, 48, 0.8);
      padding: 5px 18px;
      border-radius: 40px;
      font-size: 12px;
      cursor: pointer;
      color: #e2ccee;
      white-space: nowrap;
    }
    .filter-chip.active { background: linear-gradient(135deg, #ff5a8a, #ff3366); color: white; }

    /* Modal - original */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-detail {
      background: #1c152e;
      width: 95vw;
      max-width: 1300px;
      height: 90vh;
      border-radius: 48px;
      display: flex;
      flex-direction: column;
      border: 1px solid #ff7aa8;
      overflow: hidden;
    }
    .modal-header {
      padding: 18px 25px;
      border-bottom: 1px solid rgba(255, 90, 138, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(28, 21, 46, 0.9);
    }
    .modal-header h2 { color: #ff8ab5; font-size: 24px; }
    .close-modal { background: none; border: none; font-size: 32px; color: #ffb0cc; cursor: pointer; }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-top { display: flex; flex-wrap: wrap; gap: 25px; }
    .modal-image { flex: 0 0 200px; }
    .modal-image img { width: 100%; border-radius: 16px; }
    .modal-categories { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .modal-cat {
      background: rgba(255, 90, 138, 0.2);
      padding: 4px 16px;
      border-radius: 60px;
      font-size: 12px;
    }
    .modal-desc {
      background: rgba(15, 11, 28, 0.8);
      padding: 16px;
      border-radius: 24px;
      line-height: 1.5;
      font-size: 14px;
    }
    .modal-rating {
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .star-rating-select {
      display: flex;
      gap: 5px;
      cursor: pointer;
    }
    .star-select {
      font-size: 28px;
      color: #555;
      transition: 0.1s;
    }
    .star-select.active, .star-select:hover { color: #ffcc00; transform: scale(1.1); }
    .season-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
      border-bottom: 1px solid rgba(255, 90, 138, 0.3);
      padding-bottom: 12px;
    }
    .season-tab {
      background: #2f234b;
      padding: 6px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .season-tab.active { background: linear-gradient(135deg, #ff5a8a, #ff3366); color: white; }
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
    }
    .episode-card-modal {
      background: rgba(37, 31, 54, 0.9);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .episode-img-modal {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 12px;
    }
    .audio-buttons { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .audio-link {
      background: #ff5a8a;
      padding: 3px 10px;
      border-radius: 30px;
      text-decoration: none;
      color: white;
      font-size: 10px;
    }
    .inicio-card {
      background: rgba(23, 17, 38, 0.8);
      border-radius: 48px;
      padding: 36px;
      text-align: center;
    }
    .btn-sugestao {
      background: linear-gradient(135deg, #ff5a8a, #ff3366);
      padding: 12px 28px;
      border-radius: 80px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .add-season-btn, .add-ep-btn-season {
      background: #6a4c7c;
      padding: 8px 16px;
      border-radius: 40px;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 12px;
      margin-top: 10px;
    }
    .remove-season-btn, .remove-ep {
      background: #a5426a;
      padding: 4px 12px;
      border-radius: 40px;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 11px;
    }

    /* ========== MOBILE (<=768px) - COMPACTO, MAS 2 COLUNAS ========== */
    @media (max-width: 768px) {
      .top-bar { padding: 8px 16px; }
      .top-bar h1 { font-size: 14px; white-space: normal; max-width: 140px; }
      .yk-logo { width: 36px; height: 36px; font-size: 20px; }
      .user-info span { font-size: 11px; }
      .logout-btn { padding: 4px 12px; font-size: 11px; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        z-index: 100;
        transform: translateX(-100%);
        background: rgba(17, 12, 28, 0.98);
        backdrop-filter: blur(16px);
        padding-top: 70px;
        overflow-y: auto;
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: block; }
      .mobile-overlay.active { display: block; }
      .main-layout { flex-direction: column; overflow: visible; }
      .content-area { padding: 16px; }

      /* Grid mobile: 2 colunas e compacto */
      .anime-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .card-content { padding: 8px; }
      .card-content h3 { font-size: 12px; }
      .category-badge { font-size: 8px; padding: 2px 6px; }
      .rating-stars { font-size: 11px; gap: 2px; }
      .rating-value { font-size: 9px; }
      .watch-btn { font-size: 9px; padding: 4px; }
      .filter-chip { font-size: 10px; padding: 4px 12px; }
      .search-bar { padding: 6px 16px; margin-bottom: 12px; }
      .filter-bar { gap: 6px; margin-bottom: 16px; }

      .modal-detail { width: 98vw; height: 95vh; border-radius: 24px; }
      .modal-header h2 { font-size: 18px; }
      .modal-image { flex: 0 0 110px; }
      .modal-desc { font-size: 12px; }
      .star-select { font-size: 22px; }
      .episodes-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .anime-grid { gap: 10px; }
      .card-content h3 { font-size: 11px; }
      .category-badge { font-size: 7px; }
    }
  </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>🌸 YK Server 🌸</h2>
    <div id="authFields"><input type="email" id="loginEmail" placeholder="E-mail"><input type="password" id="loginPassword" placeholder="Senha"></div>
    <button id="authBtn">Entrar na comunidade</button>
    <div id="switchMode" class="switch">Criar nova conta</div>
    <div id="forgotPwd" class="switch" style="margin-top:5px;">Esqueceu a senha?</div>
  </div>
</div>
<div id="loadingScreen" class="loading-screen" style="display:none;">
  <div class="loading-spinner"></div>
  <p>Carregando YK Server...</p>
</div>
<div id="app" class="app">
  <div class="top-bar">
    <div class="logo-area">
      <div class="mobile-menu-btn" id="mobileMenuBtn">☰</div>
      <div class="yk-logo">YK</div>
      <h1>✦ YK Server · Animes & Games ✦</h1>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <button class="logout-btn" id="logoutBtn">Sair</button>
    </div>
  </div>
  <div class="main-layout">
    <div class="sidebar" id="sidebar">
      <div class="nav-item" data-tab="inicio">🏠 Início</div>
      <div class="nav-item" data-tab="animes">📺 Animes</div>
      <div class="nav-item" data-tab="mangas">📚 Mangás</div>
      <div class="nav-item" data-tab="favoritos">⭐ Favoritos</div>
      <div class="nav-item" data-tab="edit" id="editTab" style="display:none;">✏️ Editar</div>
      <div class="nav-item" data-tab="avisos">📢 Avisos</div>

<script>
  // ==================== FIREBASE ====================
  const firebaseConfig = {

    authDomain: "yk-comunidade.firebaseapp.com",
    projectId: "yk-comunidade",
    storageBucket: "yk-comunidade.appspot.com",
    messagingSenderId: "682166331452",
    appId: "1:682166331452:web:9e0e8553646d44060ebb39"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();
  const MASTER_EMAIL = "joaodidier@proton.me";

  let currentUser = null;
  let userData = null;
  let isLogin = true;
  let userFavorites = new Set();
  let activeUploads = new Map();

  // ==================== UTILITÁRIOS ====================
  function showMessage(text, isError = true) {
    const div = document.createElement('div');
    div.className = `error-toast ${!isError ? 'success-toast' : ''}`;
    div.innerText = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
      if (m === "&") return "&amp;";
      if (m === "<") return "&lt;";
      if (m === ">") return "&gt;";
      return m;
    });
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function getItemCategories(item) {
    if (item.categories && Array.isArray(item.categories)) return item.categories;
    if (item.category) return [item.category];
    return [];
  }

  function isNovidade(createdAtDate) {
    if (!createdAtDate) return false;
    const data = createdAtDate.toDate ? createdAtDate.toDate() : new Date(createdAtDate);
    const diff = (new Date() - data) / (1000 * 3600 * 24);
    return diff <= 7;
  }

  // ==================== SISTEMA DE AVALIAÇÃO (CORRIGIDO) ====================
  async function getAverageRating(animeId) {
    try {
      const snap = await db.collection("avaliacoes").where("animeId", "==", animeId).get();
      let total = 0, count = 0;
      snap.forEach(doc => { total += doc.data().nota; count++; });
      return count > 0 ? (total / count).toFixed(1) : null;
    } catch(e) { console.error(e); return null; }
  }

  async function getUserRating(animeId, userId) {
    if (!userId) return null;
    try {
      const doc = await db.collection("avaliacoes").doc(`${animeId}_${userId}`).get();
      return doc.exists ? doc.data().nota : null;
    } catch(e) { return null; }
  }

  async function setRating(animeId, nota) {
    if (!currentUser) {
      showMessage("Faça login para avaliar!");
      return false;
    }
    try {
      const docId = `${animeId}_${currentUser.uid}`;
      await db.collection("avaliacoes").doc(docId).set({
        animeId,
        userId: currentUser.uid,
        nota,
        createdAt: new Date()
      });
      showMessage(`⭐ Avaliação ${nota} estrelas salva!`, false);
      return true;
    } catch(e) {
      showMessage("Erro ao salvar avaliação: " + e.message);
      return false;
    }
  }

  // Renderiza estrelas (modo leitura ou interativo) - CORRIGIDO: evento de clique bem definido
  function renderStars(rating, interactive = false, onClick = null) {
    const fullStars = Math.floor(rating);
    const hasHalf = (rating - fullStars) >= 0.5;
    let starsHtml = '';
    for (let i = 1; i <= 5; i++) {
      let starClass = 'star-empty';
      if (i <= fullStars) starClass = 'star-filled';
      else if (i === fullStars + 1 && hasHalf) starClass = 'star-filled';
      if (interactive) {
        starsHtml += `<span class="star-select" data-value="${i}">★</span>`;
      } else {
        starsHtml += `<span class="${starClass}">★</span>`;
      }
    }
    if (interactive) {
      const container = document.createElement('div');
      container.className = 'star-rating-select';
      container.innerHTML = starsHtml;
      // Adiciona evento de clique em cada estrela
      container.querySelectorAll('.star-select').forEach(star => {
        star.addEventListener('click', async (e) => {
          e.stopPropagation();
          const val = parseInt(star.dataset.value);
          if (onClick) {
            await onClick(val);
          } else {
            // Fallback: tenta salvar diretamente (mas o ideal é passar o callback)
            console.log("Estrela clicada, valor:", val);
          }
        });
      });
      return container;
    } else {
      return `<div class="rating-stars">${starsHtml}<span class="rating-value">(${rating})</span></div>`;
    }
  }

  // ==================== UPLOAD ====================
  async function uploadVideo(file, path, onProgress) {
    if (!file) return null;
    const storageRef = storage.ref(path);
    const uploadTask = storageRef.put(file);
    const uploadId = Date.now() + Math.random();
    activeUploads.set(uploadId, uploadTask);
    return new Promise((resolve, reject) => {
      uploadTask.on('state_changed',
        (snapshot) => {
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          if (onProgress) onProgress({ progress: Math.round(progress), bytesTransferred: snapshot.bytesTransferred, totalBytes: snapshot.totalBytes });
        },
        (error) => { activeUploads.delete(uploadId); reject(error); },
        async () => { activeUploads.delete(uploadId); resolve(await uploadTask.snapshot.ref.getDownloadURL()); }
      );
    });
  }

  function cancelUpload(uploadId) {
    const task = activeUploads.get(uploadId);
    if (task) { task.cancel(); activeUploads.delete(uploadId); return true; }
    return false;
  }

  function createUploadComponent(type, label, onUrlReceived) {
    const container = document.createElement('div');
    container.className = 'upload-container';
    container.innerHTML = `
      <div class="upload-area">
        <div class="upload-label">📁 ${label}</div>
        <input type="file" class="upload-file-input" accept="video/mp4,video/webm,video/mkv" style="display:none;">
        <div class="file-name"></div>
        <div class="progress-bar-container" style="display:none;"><div class="progress-bar-fill"></div></div>
        <div class="upload-status" style="display:none;"><span class="status-text"></span><button class="cancel-upload">Cancelar</button></div>
        <input type="text" class="upload-link-input" placeholder="Ou cole um link aqui...">
      </div>
    `;
    const fileInput = container.querySelector('.upload-file-input');
    const uploadLabel = container.querySelector('.upload-label');
    const fileNameDiv = container.querySelector('.file-name');
    const progressBar = container.querySelector('.progress-bar-container');
    const progressFill = container.querySelector('.progress-bar-fill');
    const statusDiv = container.querySelector('.upload-status');
    const statusText = container.querySelector('.status-text');
    const cancelBtn = container.querySelector('.cancel-upload');
    const linkInput = container.querySelector('.upload-link-input');
    let currentUploadId = null;
    uploadLabel.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileNameDiv.innerText = `📹 ${file.name} (${formatFileSize(file.size)})`;
      progressBar.style.display = 'block';
      statusDiv.style.display = 'flex';
      progressFill.style.width = '0%';
      statusText.innerText = '📤 Iniciando upload...';
      const path = `videos/${type}/${Date.now()}_${file.name.replace(/[^a-z0-9]/gi, '_')}`;
      try {
        const url = await uploadVideo(file, path, (p) => {
          progressFill.style.width = `${p.progress}%`;
          statusText.innerText = `📤 ${p.progress}% - ${formatFileSize(p.bytesTransferred)} / ${formatFileSize(p.totalBytes)}`;
        });
        if (url) {
          linkInput.value = url;
          progressBar.style.display = 'none';
          statusDiv.style.display = 'none';
          fileNameDiv.innerHTML = `✅ ${file.name} - Enviado!`;
          onUrlReceived(url);
        }
      } catch (error) {
        statusText.innerText = '❌ Falha no upload! Tente usar link.';
      }
    };
    cancelBtn.onclick = () => {
      if (currentUploadId && cancelUpload(currentUploadId)) {
        statusText.innerText = '⏹️ Cancelado';
        setTimeout(() => { progressBar.style.display = 'none'; statusDiv.style.display = 'none'; }, 2000);
      }
    };
    linkInput.onchange = () => { if (linkInput.value.trim()) onUrlReceived(linkInput.value.trim()); };
    return container;
  }

  // ==================== FAVORITOS ====================
  async function loadUserFavorites() {
    if (!currentUser) return;
    try {
      const favSnap = await db.collection("favoritos").doc(currentUser.uid).get();
      if (favSnap.exists && favSnap.data().animes) userFavorites = new Set(favSnap.data().animes);
      else userFavorites.clear();
    } catch (e) { console.log("Erro ao carregar favoritos"); }
  }

  async function toggleFavorite(animeId) {
    if (!currentUser) { showMessage("Faça login para favoritar!"); return; }
    const favRef = db.collection("favoritos").doc(currentUser.uid);
    const favDoc = await favRef.get();
    let favorites = favDoc.exists && favDoc.data().animes ? favDoc.data().animes : [];
    if (userFavorites.has(animeId)) {
      favorites = favorites.filter(id => id !== animeId);
      userFavorites.delete(animeId);
      showMessage(`❤️ Removido dos favoritos!`, false);
    } else {
      favorites.push(animeId);
      userFavorites.add(animeId);
      showMessage(`✨ Adicionado aos favoritos!`, false);

    await favRef.set({ animes: favorites, userId: currentUser.uid, updatedAt: new Date() });

  async function loadMedia(type) {
    const content = document.getElementById("content");

    let items = [];

    let html = `

    `;
    if (userData?.isAdmin) {
      html += `
        <div class="admin-form">

    if (userData?.isAdmin) {

        div.querySelector(".remove-season-btn").onclick = () => div.remove();

      function addEpisode(seasonId) {
        const seasonDiv = document.querySelector(`.season-item[data-season-id="${seasonId}"]`);

        epDiv.innerHTML = `
          <input class="ep-name" placeholder="Nome do episódio" style="flex:1; min-width:120px;">
          <div class="audio-group" style="flex:3; gap:10px;"><div style="flex:1;"></div><div style="flex:1;"></div></div>
          <input class="ep-img" placeholder="URL da imagem" style="flex:0.5;">
          <button class="remove-ep" style="background:#a5426a; padding:4px 10px; border-radius:40px;">🗑</button>
        `;
        const audioGroup = epDiv.querySelector('.audio-group');
        audioGroup.children[0].replaceWith(dubContainer);
        audioGroup.children[1].replaceWith(legContainer);
        const dubInput = document.createElement('input'); dubInput.type = 'hidden'; dubInput.className = 'ep-dub-link';

        epDiv.querySelector(".remove-ep").onclick = () => epDiv.remove();
        episodesDiv.appendChild(epDiv);

      document.getElementById("addSeasonBtn").onclick = () => addSeason();

      `).join('')}</div>`;
    }

    let starsSelectHtml = '';
    if (currentUser) {
      const selectContainer = renderStars(userRating || 0, true, async (val) => {
        // Callback chamado quando uma estrela é clicada
        await setRating(item.id, val);
        // Recarrega o modal para mostrar a nova nota
        openDetailModal(item);
      });
      const wrapper = document.createElement('div');
      wrapper.className = 'modal-rating';
      wrapper.innerHTML = '<strong>Sua nota:</strong>';
      wrapper.appendChild(selectContainer);
      starsSelectHtml = wrapper.outerHTML;
    }

    modalBody.innerHTML = `
      <div class="modal-top">
        <div class="modal-image"><img src="${item.imageUrl || 'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div>
        <div class="modal-info">
          <h3>${escapeHtml(item.title)}</h3>
          <div class="modal-categories">${getItemCategories(item).map(c => `<span class="modal-cat">🎭 ${escapeHtml(c)}</span>`).join('')}</div>
          <div class="modal-desc">${escapeHtml(item.description || "Sem descrição.").replace(/\n/g, '<br>')}</div>
          ${starsSelectHtml}
          <div class="modal-rating"><strong>Média geral:</strong> ${avgRating ? renderStars(parseFloat(avgRating), false) : 'Sem avaliações'}</div>
        </div>
      </div>
      <div>
        <div class="season-tabs" id="seasonTabs">${seasonNames.map(s => `<div class="season-tab" data-season="${s}">${escapeHtml(s)}</div>`).join('')}</div>
        <div id="episodesBySeason">${seasonNames.length ? renderSeason(seasonNames[0]) : '<center>Nenhum episódio cadastrado</center>'}</div>
      </div>
    `;
    modal.classList.add("active");
    document.querySelectorAll(".season-tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".season-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("episodesBySeason").innerHTML = renderSeason(tab.dataset.season);
      };
    });
    if (seasonNames.length) document.querySelector(".season-tab")?.classList.add("active");
    document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("active");
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("active"); };
  }

  async function loadFavoritos() {
    if (!currentUser) { document.getElementById("content").innerHTML = "<div class='admin-form'>Faça login</div>"; return; }
    const favDoc = await db.collection("favoritos").doc(currentUser.uid).get();
    const favoriteIds = favDoc.exists && favDoc.data().animes ? favDoc.data().animes : [];
    if (favoriteIds.length === 0) { document.getElementById("content").innerHTML = `<div class="admin-form"><h3>⭐ Favoritos</h3><div class="empty-favorites">💔 Nenhum favorito ainda.<br>Clique no ❤️ nos cards para adicionar!</div></div>`; return; }
    let allItems = [];
    for (const type of ["animes", "mangas"]) {
      const snap = await db.collection(type).get();
      snap.forEach(doc => { if (favoriteIds.includes(doc.id)) allItems.push({ id: doc.id, ...doc.data(), type }); });
    }
    let html = `<div class="admin-form"><h3>⭐ Seus Favoritos (${allItems.length})</h3><div class="anime-grid">` +
      allItems.map(item => `
        <div class="anime-card" data-item='${JSON.stringify(item).replace(/'/g, "&#39;")}'>
          <div class="anime-image"><img src="${item.imageUrl || 'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div>
          <div class="card-content">
            <h3>${escapeHtml(item.title)}</h3>
            <div class="categories-wrapper">${getItemCategories(item).map(c => `<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div>
            <div class="watch-btn">🎬 ${item.seasons ? Object.keys(item.seasons).length : 0} temporada(s)</div>
          </div>
        </div>
      `).join('') + `</div></div>`;
    document.getElementById("content").innerHTML = html;
    document.querySelectorAll(".anime-card").forEach(card => {
      card.addEventListener("click", (e) => { const raw = card.getAttribute("data-item"); if (raw) openDetailModal(JSON.parse(raw)); });
    });
  }

  async function loadEditMode() {
    const content = document.getElementById("content");
    content.innerHTML = `<div class="admin-form"><h2 style="color:#ff9ac2; margin-bottom:20px;">✏️ MODO EDIÇÃO - GERENCIAR OBRAS ✏️</h2><div style="display:flex; gap:15px; margin-bottom:25px;"><button id="editAnimesBtn" class="filter-chip active">📺 Editar Animes</button><button id="editMangasBtn" class="filter-chip">📚 Editar Mangás</button></div><div id="editGridContainer"></div></div>`;
    let currentType = "animes";
    async function loadEditGrid() {
      const snapshot = await db.collection(currentType).get();
      let items = [];
      snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data(), type: currentType }));
      const container = document.getElementById("editGridContainer");
      if (items.length === 0) { container.innerHTML = `<p style="text-align:center; padding:40px;">Nenhum ${currentType === "animes" ? "anime" : "mangá"} encontrado.</p>`; return; }
      container.innerHTML = `<div class="edit-mode-grid">${items.map(item => `
        <div class="anime-card" style="position:relative;">
          <button class="edit-btn" data-id="${item.id}" data-type="${currentType}" style="right:55px;">✏️ Editar</button>
          <button class="delete-btn" data-id="${item.id}" data-type="${currentType}" style="right:8px;">🗑</button>
          <div class="anime-image"><img src="${item.imageUrl || 'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div>
          <div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c => `<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div><div class="watch-btn" style="background:#6a4c7c;">${item.seasons ? Object.keys(item.seasons).length : 0} temporada(s)</div></div>
        </div>
      `).join('')}</div>`;
      document.querySelectorAll(".edit-btn").forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const type = btn.dataset.type;
          const docSnap = await db.collection(type).doc(id).get();
          if (docSnap.exists) openEditModal({ id, ...docSnap.data(), type });
        };
      });
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          if (confirm("Deletar permanentemente?")) {
            await db.collection(btn.dataset.type).doc(btn.dataset.id).delete();
            showMessage("🗑 Deletada!", false);
            loadEditGrid();
          }
        };
      });
    }
    document.getElementById("editAnimesBtn").onclick = () => { currentType = "animes"; document.getElementById("editAnimesBtn").classList.add("active"); document.getElementById("editMangasBtn").classList.remove("active"); loadEditGrid(); };
    document.getElementById("editMangasBtn").onclick = () => { currentType = "mangas"; document.getElementById("editMangasBtn").classList.add("active"); document.getElementById("editAnimesBtn").classList.remove("active"); loadEditGrid(); };
    loadEditGrid();
  }

  function openEditModal(item) {
    // Função de edição (pode manter a original)
    showMessage("Edição completa disponível na versão anterior");
  }

  async function loadAvisos() {
    const snap = await db.collection("avisos").orderBy("createdAt", "desc").get();
    let avisos = [];
    snap.forEach(d => avisos.push({ id: d.id, ...d.data() }));
    let html = `<div class="admin-form"><h3>📢 Central de Avisos</h3>`;
    if (userData?.isAdmin) {
      html += `<textarea id="newAvisoMsg" rows="3" placeholder="Escreva um novo aviso..." style="width:100%; background:#251f36; border-radius:20px; padding:12px; margin-bottom:10px;"></textarea>
        <button id="postAvisoBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); padding:10px 24px; border-radius:60px; border:none; color:white; font-weight:bold; cursor:pointer;">📢 Publicar Aviso</button>
        <hr style="margin:20px 0; border-color:#333;">`;
    }
    html += `<div id="avisosList">`;
    if (avisos.length === 0) html += `<p style="text-align:center; padding:20px;">Nenhum aviso ainda.</p>`;
    else {
      avisos.forEach(a => {
        html += `<div class="announcement-card">
          <strong>📣 ${escapeHtml(a.authorName)}</strong> <small>${a.createdAt?.toDate?.().toLocaleString() || 'agora'}</small>
          <p style="margin-top:8px;">${escapeHtml(a.message)}</p>
          ${userData?.isAdmin ? `<button class="deleteAvisoBtn" data-id="${a.id}" style="background:#a5426a; border:none; border-radius:40px; padding:4px 12px; margin-top:8px; cursor:pointer;">🗑 Remover</button>` : ''}
        </div>`;
      });
    }
    html += `</div></div>`;
    document.getElementById("content").innerHTML = html;
    if (userData?.isAdmin) {
      document.getElementById("postAvisoBtn")?.addEventListener("click", async () => {
        const msg = document.getElementById("newAvisoMsg").value.trim();
        if (!msg) return showMessage("Digite uma mensagem!");
        await db.collection("avisos").add({ message: msg, authorName: userData.name, authorId: currentUser.uid, createdAt: new Date() });
        showMessage("✅ Aviso publicado!", false);
        loadAvisos();
      });
      document.querySelectorAll(".deleteAvisoBtn").forEach(btn => {
        btn.onclick = async () => {
          if (confirm("Remover?")) {
            await db.collection("avisos").doc(btn.dataset.id).delete();
            showMessage("Removido!", false);
            loadAvisos();
          }
        };
      });
    }
  }

  async function loadAdminPanel() {
    if (!userData?.isAdmin) { document.getElementById("content").innerHTML = "<div class='admin-form'>🔒 Acesso restrito</div>"; return; }
    const usersSnapshot = await db.collection("users").get();
    let usersList = [];
    usersSnapshot.forEach(doc => usersList.push({ id: doc.id, ...doc.data() }));
    let html = `<div class="admin-form"><h3>👥 Gerenciar Administradores</h3><p style="margin-bottom:15px; color:#aaa;">Promova usuários para Admin.</p>`;
    usersList.forEach(u => {
      html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:#1f1830; margin:8px 0; border-radius:28px; flex-wrap:wrap; gap:10px;">
        <div><strong>${escapeHtml(u.name)}</strong><br><small>${u.email}</small></div>
        ${!u.isAdmin && u.email !== MASTER_EMAIL ?
          `<button class="promote-btn" data-uid="${u.id}" style="background:#ff5a8a; border:none; border-radius:40px; padding:6px 16px; cursor:pointer;">🌸 Promover a Admin</button>` :
          u.isAdmin ? "<span style='color:#ff5a8a;'>✅ Administrador</span>" : "<span style='color:#888;'>Usuário comum</span>"}
      </div>`;
    });
    html += `<hr style="margin:20px 0;"><h3>✨ Informações do Sistema</h3><p>⭐ Sistema de avaliação por estrelas ativo!</p><p>📹 Upload de vídeos com barra de progresso</p></div>`;
    document.getElementById("content").innerHTML = html;
    document.querySelectorAll(".promote-btn").forEach(btn => {
      btn.onclick = async () => {
        await db.collection("users").doc(btn.dataset.uid).update({ isAdmin: true });
        showMessage("✅ Promovido!", false);
        loadAdminPanel();
      };
    });
  }

  // ==================== AUTH ====================
  function updateAuthUI() {
    const authFields = document.getElementById("authFields");
    if (isLogin) {
      authFields.innerHTML = `<input type="email" id="loginEmail" placeholder="E-mail"><input type="password" id="loginPassword" placeholder="Senha">`;
      document.getElementById("authBtn").innerText = "Entrar";
      document.getElementById("switchMode").innerText = "Criar nova conta";
    } else {
      authFields.innerHTML = `<input type="text" id="signupName" placeholder="Nome"><input type="email" id="signupEmail" placeholder="E-mail"><input type="password" id="signupPassword" placeholder="Senha">`;
      document.getElementById("authBtn").innerText = "Cadastrar";
      document.getElementById("switchMode").innerText = "Já tenho conta";
    }
  }

  document.getElementById("switchMode").onclick = () => { isLogin = !isLogin; updateAuthUI(); };
  document.getElementById("forgotPwd").onclick = async () => {
    const email = prompt("Digite seu e-mail:");
    if (email) try { await auth.sendPasswordResetEmail(email); showMessage("Email de recuperação enviado!", false); } catch (e) { showMessage("Erro ao enviar email"); }
  };
  document.getElementById("authBtn").onclick = async () => {
    if (isLogin) {
      const email = document.getElementById("loginEmail")?.value, pwd = document.getElementById("loginPassword")?.value;
      if (!email || !pwd) return showMessage("Preencha todos os campos");
      try { await auth.signInWithEmailAndPassword(email, pwd); } catch (e) { showMessage("Erro: " + e.message); }
    } else {
      const name = document.getElementById("signupName")?.value, email = document.getElementById("signupEmail")?.value, pwd = document.getElementById("signupPassword")?.value;
      if (!name || !email || !pwd) return showMessage("Preencha todos os campos");
      if (pwd.length < 6) return showMessage("A senha precisa ter no mínimo 6 caracteres");
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pwd);
        await cred.user.sendEmailVerification();
        await db.collection("users").doc(cred.user.uid).set({ name, email, isAdmin: email === MASTER_EMAIL, createdAt: new Date() });
        showMessage("📧 Verifique seu e-mail antes de fazer login!", false);
        await auth.signOut();
        isLogin = true;
        updateAuthUI();
      } catch (e) { showMessage("Erro: " + e.message); }
    }
  };
  document.getElementById("logoutBtn").onclick = () => auth.signOut();

  auth.onAuthStateChanged(async (user) => {
    const loading = document.getElementById("loadingScreen");
    if (user) {
      loading.style.display = "flex";
      if (!user.emailVerified && user.email !== MASTER_EMAIL) {
        showMessage("⚠️ Verifique seu e-mail antes de acessar.");
        await auth.signOut();
        loading.style.display = "none";
        return;
      }
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        userData = doc.data();
        currentUser = user;
        document.getElementById("userName").innerText = userData.name;
        const isAdmin = userData.isAdmin || user.email === MASTER_EMAIL;
        document.getElementById("adminTab").style.display = isAdmin ? "block" : "none";
        document.getElementById("editTab").style.display = isAdmin ? "block" : "none";
        if (user.email === MASTER_EMAIL && !userData.isAdmin) {
          await db.collection("users").doc(user.uid).update({ isAdmin: true });
          userData.isAdmin = true;
        }
      }
      await loadUserFavorites();
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "flex";
      loading.style.display = "none";
      loadTab("inicio");
      attachNavEvents();
    } else {
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("app").style.display = "none";
      loading.style.display = "none";
      isLogin = true;
      updateAuthUI();
    }
  });
</script>
</body>
</html>
