<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YK Server - Streaming de animes e séries com a melhor qualidade">
    <meta name="theme-color" content="#0f0f23">
    <title>YK Server · Streaming Premium</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=64">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ======== RESET & BASE STYLES ======== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-pink: #ff6b9d;
            --primary-pink-dark: #e84a7f;
            --primary-pink-light: #ff8fb3;
            --secondary-purple: #c084fc;
            --bg-primary: #1a0a1a;
            --bg-secondary: #2d1a2d;
            --bg-card: #3d203d;
            --bg-hover: #4d2a4d;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #6b3d6b;
            --border-hover: #ff6b9d;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
            --transition-fast: 150ms;
            --transition-normal: 250ms;
        }

        html { scroll-behavior: smooth; font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--primary-pink); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-pink-dark); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; gap: 24px;
        }

        .loading-spinner {
            width: 50px; height: 50px; border: 3px solid var(--bg-card);
            border-top-color: var(--primary-pink); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text { font-size: 16px; color: var(--text-secondary); font-weight: 500; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); color: var(--text-primary); padding: 12px 24px;
            border-radius: 8px; font-weight: 500; font-size: 14px; z-index: 10000;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);
            animation: slideUp var(--transition-normal);
        }

        .toast.success { background: #1a4d2e; border-color: #2ecc71; }
        .toast.error { background: #4a1a1a; border-color: #e74c3c; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 15, 35, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); padding: 0 24px; height: 64px;
        }

        .navbar-content { display: flex; align-items: center; justify-content: space-between; height: 100%; max-width: 100%; }

        .logo-section { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: opacity var(--transition-fast); }
        .logo-section:hover { opacity: 0.9; }

        .yk-logo { width: 36px; height: 36px; border-radius: 8px; background: url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover; }
        .site-title { font-size: 18px; font-weight: 700; color: var(--primary-pink); }

        .nav-menu { display: flex; gap: 8px; }

        .nav-item {
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
            font-size: 14px; color: var(--text-secondary); border: none; background: transparent;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 8px;
        }

        .nav-item:hover { color: var(--text-primary); background: var(--bg-hover); }
        .nav-item.active { color: var(--text-primary); background: var(--primary-pink); }

        .content-wrapper { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .content-section { margin-bottom: 48px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 24px; font-weight: 700; color: var(--text-primary); }

        .admin-panel { background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; }
        .admin-tab { padding: 8px 16px; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 600; border: none; color: var(--text-secondary); font-size: 14px; transition: all var(--transition-fast); }
        .admin-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
        .admin-tab.active { color: var(--text-primary); background: var(--primary-pink); }

        .admin-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .form-input, .form-select, .form-textarea {
            padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; outline: none;
            transition: border-color var(--transition-fast);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary-pink); }
        .form-textarea { min-height: 100px; resize: vertical; font-family: inherit; }

        .btn-primary { padding: 12px 24px; border-radius: 8px; background: var(--primary-pink); color: white; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: background var(--transition-fast); }
        .btn-primary:hover { background: var(--primary-pink-dark); }
        .btn-danger { padding: 8px 16px; border-radius: 6px; background: #e74c3c; color: white; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: background var(--transition-fast); }
        .btn-danger:hover { background: #c0392b; }

        .hidden { display: none !important; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card); padding: 20px; border-radius: 8px; text-align: center; 
            border: 1px solid var(--border-color); transition: transform var(--transition-fast);
        }

        .stat-card:hover { transform: translateY(-2px); }

        .stat-number {
            font-size: 24px; font-weight: bold; color: var(--primary-pink); margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary); font-size: 14px;
        }

        .content-selector {
            display: flex; justify-content: center; gap: 16px; margin-bottom: 24px;
        }

        .content-type-btn {
            padding: 12px 24px; border-radius: 8px; background: var(--bg-secondary); 
            border: 2px solid var(--border-color); color: var(--text-primary); 
            font-weight: 600; cursor: pointer; transition: all var(--transition-fast);
        }

        .content-type-btn.active {
            background: var(--primary-pink); border-color: var(--primary-pink);
        }

        .content-type-btn:hover {
            border-color: var(--primary-pink);
        }

        .content-indicator {
            text-align: center; margin-bottom: 20px; color: var(--text-secondary); 
            font-size: 14px; font-weight: 500;
        }

        .season-field {
            background: var(--bg-card); padding: 16px; border-radius: 8px; 
            margin-bottom: 12px; border: 1px solid var(--border-color);
        }

        .episode-field {
            background: var(--bg-secondary); padding: 12px; border-radius: 6px; 
            margin-bottom: 8px;
        }

        .season-header {
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px;
        }

        .season-title {
            margin: 0; color: var(--text-primary); font-size: 16px; font-weight: 600;
        }

        .episodes-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }

        .remove-btn {
            background: #e74c3c; border: none; padding: 6px 12px; 
            border-radius: 4px; color: white; cursor: pointer; font-size: 12px;
        }

        .add-episode-btn {
            background: var(--secondary-purple); border: none; padding: 6px 12px; 
            border-radius: 4px; color: white; cursor: pointer; margin-top: 12px;
        }

        .manage-table {
            width: 100%; border-collapse: collapse; background: var(--bg-card);
            border-radius: 8px; overflow: hidden;
        }

        .manage-table th {
            background: var(--bg-secondary); padding: 12px; text-align: left; 
            border-bottom: 2px solid var(--border-color); font-weight: 600;
        }

        .manage-table td {
            padding: 12px; border-bottom: 1px solid var(--border-color);
        }

        .manage-table tr:hover {
            background: var(--bg-hover);
        }

        .content-preview {
            display: flex; align-items: center; gap: 12px;
        }

        .content-thumbnail {
            width: 50px; height: 75px; object-fit: cover; border-radius: 4px;
        }

        .content-info h4 {
            margin: 0 0 4px 0; font-weight: 600; color: var(--text-primary);
        }

        .content-info p {
            margin: 0; font-size: 12px; color: var(--text-muted);
        }

        .category-tag {
            background: var(--bg-secondary); padding: 4px 8px; border-radius: 12px; 
            font-size: 12px; margin-right: 4px; display: inline-block;
        }

        .rating-display {
            color: var(--primary-pink); font-weight: 600;
        }

        .action-buttons {
            display: flex; gap: 8px;
        }

        .edit-btn {
            background: var(--primary-pink); border: none; padding: 6px 12px; 
            border-radius: 4px; color: white; cursor: pointer;
        }

        @media (max-width: 768px) {
            .navbar { padding: 0 16px; }
            .nav-menu { display: none; }
            .content-wrapper { padding: 16px; }
            .admin-tabs { flex-direction: column; }
            .stats-grid { grid-template-columns: 1fr; }
            .content-selector { flex-direction: column; }
            .episodes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando YK Server...</div>
    </div>

    <div id="app" style="display: none;">
        <header class="navbar">
            <div class="navbar-content">
                <div class="logo-section" id="logoSection">
                    <div class="yk-logo"></div>
                    <div class="site-title">YK Server</div>
                </div>
                
                <nav class="nav-menu">
                    <button class="nav-item active" data-tab="admin">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                        </svg>
                        <span>Admin</span>
                    </button>
                </nav>
                
                <div class="nav-section">
                    <span class="user-name" id="userNameDisplay">Admin</span>
                    <button class="logout-btn" id="logoutButton" style="background: transparent; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: all var(--transition-fast);">Sair</button>
                </div>
            </div>
        </header>

        <main class="content-wrapper">
            <div id="contentArea"></div>
        </main>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCTnC0RGSWRcr2ehQGimK6nIra9H8NH8Ks",
            authDomain: "yk-comunidade.firebaseapp.com",
            projectId: "yk-comunidade",
            storageBucket: "yk-comunidade.appspot.com",
            messagingSenderId: "682166331452",
            appId: "1:682166331452:web:9e0e8553646d44060ebb39"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userData = null;
        let seasonCounter = 0;

        const OWNER_EMAIL = 'joaodidier@proton.me';

        function isOwner() {
            return currentUser && currentUser.email && currentUser.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
        }

        function showToast(message, isError = true) {
            const div = document.createElement('div');
            div.className = `toast ${!isError ? 'success' : ''}`;
            div.innerText = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function escapeHtml(str) { 
            if (!str) return ""; 
            return str.replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'':'&#39;'
            })[m]); 
        }

        async function loadAllContent() {
            try {
                const [animesSnap, seriesSnap] = await Promise.all([
                    db.collection('animes').get(),
                    db.collection('series').get()
                ]);
                
                let items = [];
                
                animesSnap.forEach(doc => {
                    items.push({
                        id: doc.id,
                        type: 'movies',
                        ...doc.data()
                    });
                });
                
                seriesSnap.forEach(doc => {
                    items.push({
                        id: doc.id,
                        type: 'series',
                        ...doc.data()
                    });
                });
                
                return items;
            } catch (error) {
                console.error('Error loading content:', error);
                return [];
            }
        }

        async function loadAdminTab() {
            if (!isOwner()) {
                const contentArea = document.getElementById('contentArea');
                contentArea.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-secondary);"><h3>Acesso Restrito</h3><p>Apenas o proprietário pode acessar esta área.</p></div>';
                return;
            }
            
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '<div style="display: flex; justify-content: center; padding: 50px;"><div class="loading-spinner"></div></div>';
            
            try {
                const items = await loadAllContent();
                const movies = items.filter(item => item.type === 'movies');
                const series = items.filter(item => item.type === 'series');
                
                const html = `
                    <div class="content-section">
                        <h2 style="margin-bottom: 24px; color: var(--text-primary);">📊 Estatísticas</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number">${movies.length + series.length}</div>
                                <div class="stat-label">Total de Conteúdo</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${movies.length}</div>
                                <div class="stat-label">Filmes</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${series.length}</div>
                                <div class="stat-label">Séries</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="content-section">
                        <div class="admin-panel">
                            <div class="admin-tabs">
                                <button class="admin-tab active" data-admin-tab="add-content">➕ Adicionar Conteúdo</button>
                                <button class="admin-tab" data-admin-tab="manage-movies">🎬 Gerenciar Filmes</button>
                                <button class="admin-tab" data-admin-tab="manage-series">📺 Gerenciar Séries</button>
                            </div>
                            
                            <div id="admin-add-content" class="admin-tab-content">
                                <h3 style="margin-bottom: 20px; color: var(--text-primary); text-align: center;">📝 Adicionar Novo Conteúdo</h3>
                                
                                <div class="content-selector">
                                    <button id="contentTypeMovie" class="content-type-btn" onclick="selectContentType('movies')">
                                        🎬 Filme
                                    </button>
                                    <button id="contentTypeSeries" class="content-type-btn" onclick="selectContentType('series')">
                                        📺 Série
                                    </button>
                                </div>
                                
                                <div id="contentTypeIndicator" class="content-indicator">
                                    Selecione o tipo de conteúdo que deseja adicionar
                                </div>
                                
                                <div id="dynamicContentForm"></div>
                            </div>
                            
                            <div id="admin-manage-movies" class="admin-tab-content hidden">
                                ${generateManageContentTable(movies, 'movies')}
                            </div>
                            
                            <div id="admin-manage-series" class="admin-tab-content hidden">
                                ${generateManageContentTable(series, 'series')}
                            </div>
                        </div>
                    </div>
                `;
                
                contentArea.innerHTML = html;
                attachAdminListeners();
                
            } catch (error) {
                console.error('Error loading admin tab:', error);
                contentArea.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-secondary);"><h3>Erro ao carregar painel</h3><p>Tente novamente mais tarde</p></div>';
            }
        }

        function generateManageContentTable(items, type) {
            return `
                <h3 style="margin-bottom: 20px; color: var(--text-primary);">
                    ${type === 'movies' ? '🎬 Gerenciar Filmes' : '📺 Gerenciar Séries'}
                </h3>
                <div style="overflow-x: auto;">
                    <table class="manage-table">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Categorias</th>
                                <th>Avaliação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>
                                        <div class="content-preview">
                                            <img src="${item.imageUrl || 'https://via.placeholder.com/50x75'}" 
                                                 alt="${escapeHtml(item.title)}" class="content-thumbnail">
                                            <div class="content-info">
                                                <h4>${escapeHtml(item.title)}</h4>
                                                <p>${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : 'N/A'}</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        ${(item.categories || []).map(cat => `<span class="category-tag">${escapeHtml(cat)}</span>`).join('')}
                                    </td>
                                    <td>
                                        <span class="rating-display">
                                            ⭐ ${item.averageRating ? item.averageRating.toFixed(1) : '0.0'}
                                        </span>
                                    </td>
                                    <td>
                                        <div class="action-buttons">
                                            <button onclick="editContent('${item.id}', '${type}')" class="edit-btn">
                                                Editar
                                            </button>
                                            <button onclick="deleteContent('${item.id}', '${type}')" class="remove-btn">
                                                Excluir
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function selectContentType(type) {
            const movieBtn = document.getElementById('contentTypeMovie');
            const seriesBtn = document.getElementById('contentTypeSeries');
            const indicator = document.getElementById('contentTypeIndicator');
            const formContainer = document.getElementById('dynamicContentForm');
            
            // Reset button styles
            movieBtn.classList.remove('active');
            seriesBtn.classList.remove('active');
            
            // Highlight selected button
            if (type === 'movies') {
                movieBtn.classList.add('active');
                indicator.textContent = 'Adicionando um Filme';
            } else {
                seriesBtn.classList.add('active');
                indicator.textContent = 'Adicionando uma Série';
            }
            
            // Show appropriate form
            if (type === 'movies') {
                formContainer.innerHTML = generateMovieForm();
            } else {
                formContainer.innerHTML = generateSeriesForm();
            }
        }

        function generateMovieForm() {
            return `
                <form id="addMovieForm" class="admin-form">
                    <div class="form-group">
                        <label class="form-label">Título do Filme</label>
                        <input type="text" class="form-input" id="movieTitle" required placeholder="Ex: Attack on Titan">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-textarea" id="movieDescription" required placeholder="Descreva o filme..." rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL da Imagem</label>
                        <input type="url" class="form-input" id="movieImage" required placeholder="https://exemplo.com/imagem.jpg">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Categorias (separadas por vírgula)</label>
                        <input type="text" class="form-input" id="movieCategories" required placeholder="Ação, Drama, Aventura">
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL Dublado</label>
                        <input type="url" class="form-input" id="movieDubLink" placeholder="https://exemplo.com/video-dublado.mp4">
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL Legendado</label>
                        <input type="url" class="form-input" id="movieLegLink" placeholder="https://exemplo.com/video-legendado.mp4">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Avaliação (0-5)</label>
                        <input type="number" class="form-input" id="movieRating" min="0" max="5" step="0.1" placeholder="4.5">
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 16px;">
                        🎬 Adicionar Filme
                    </button>
                </form>
            `;
        }

        function generateSeriesForm() {
            return `
                <form id="addSeriesForm" class="admin-form">
                    <div class="form-group">
                        <label class="form-label">Título da Série</label>
                        <input type="text" class="form-input" id="seriesTitle" required placeholder="Ex: Demon Slayer">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-textarea" id="seriesDescription" required placeholder="Descreva a série..." rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL da Imagem</label>
                        <input type="url" class="form-input" id="seriesImage" required placeholder="https://exemplo.com/imagem.jpg">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Categorias (separadas por vírgula)</label>
                        <input type="text" class="form-input" id="seriesCategories" required placeholder="Ação, Aventura, Shounen">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Avaliação (0-5)</label>
                        <input type="number" class="form-input" id="seriesRating" min="0" max="5" step="0.1" placeholder="4.7">
                    </div>
                    <div style="background: var(--bg-secondary); padding: 20px; border-radius: 8px; margin: 20px 0;">
                        <h4 style="margin-bottom: 16px; color: var(--text-primary);">📺 Gerenciar Temporadas</h4>
                        <div id="seasonsContainer"></div>
                        <button type="button" onclick="addSeasonField()" class="btn-primary">
                            ➕ Adicionar Temporada
                        </button>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 16px;">
                        📺 Adicionar Série
                    </button>
                </form>
            `;
        }

        function addSeasonField() {
            seasonCounter++;
            const container = document.getElementById('seasonsContainer');
            const seasonDiv = document.createElement('div');
            seasonDiv.className = 'season-field';
            seasonDiv.innerHTML = `
                <div class="season-header">
                    <h5 class="season-title">Temporada ${seasonCounter}</h5>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="remove-btn">
                        Remover
                    </button>
                </div>
                <div class="form-group">
                    <label class="form-label">Nome da Temporada</label>
                    <input type="text" class="form-input season-name" required placeholder="Ex: Temporada 1">
                </div>
                <div class="episodes-container" id="episodesContainer${seasonCounter}">
                    <div class="episode-field">
                        <h6 style="margin-bottom: 8px; color: var(--text-primary);">Episódios</h6>
                        <div class="episode-field" style="margin-bottom: 8px;">
                            <input type="text" class="form-input episode-name" placeholder="Nome do episódio" style="margin-bottom: 8px;">
                            <div class="episodes-grid">
                                <input type="url" class="form-input episode-dub" placeholder="URL Dublado">
                                <input type="url" class="form-input episode-leg" placeholder="URL Legendado">
                            </div>
                        </div>
                        <button type="button" onclick="addEpisodeField(${seasonCounter})" class="add-episode-btn">
                            ➕ Adicionar Episódio
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(seasonDiv);
        }

        function addEpisodeField(seasonId) {
            const container = document.getElementById(`episodesContainer${seasonId}`);
            const episodeDiv = document.createElement('div');
            episodeDiv.className = 'episode-field';
            episodeDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="color: var(--text-secondary); font-size: 14px;">Novo Episódio</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="remove-btn" style="font-size: 10px; padding: 4px 8px;">
                        ×
                    </button>
                </div>
                <input type="text" class="form-input episode-name" placeholder="Nome do episódio" style="margin-bottom: 8px;">
                <div class="episodes-grid">
                    <input type="url" class="form-input episode-dub" placeholder="URL Dublado">
                    <input type="url" class="form-input episode-leg" placeholder="URL Legendado">
                </div>
            `;
            container.appendChild(episodeDiv);
        }

        function attachAdminListeners() {
            // Admin tab switching
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.admin-tab-content').forEach(content => content.classList.add('hidden'));
                    
                    const targetId = `admin-${tab.dataset.adminTab}`;
                    const targetElement = document.getElementById(targetId);
                    if (targetElement) {
                        targetElement.classList.remove('hidden');
                    }
                });
            });

            // Movie form submission
            document.getElementById('addMovieForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const title = document.getElementById('movieTitle').value;
                const description = document.getElementById('movieDescription').value;
                const imageUrl = document.getElementById('movieImage').value;
                const categories = document.getElementById('movieCategories').value.split(',').map(c => c.trim());
                const dubLink = document.getElementById('movieDubLink').value;
                const legLink = document.getElementById('movieLegLink').value;
                const rating = parseFloat(document.getElementById('movieRating').value) || 0;
                
                try {
                    await db.collection('animes').add({
                        title,
                        description,
                        imageUrl,
                        categories,
                        dubLink,
                        legLink,
                        averageRating: rating,
                        ratings: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast('Filme adicionado com sucesso!', false);
                    document.getElementById('addMovieForm').reset();
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao adicionar filme: ' + error.message);
                }
            });

            // Series form submission
            document.getElementById('addSeriesForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const title = document.getElementById('seriesTitle').value;
                const description = document.getElementById('seriesDescription').value;
                const imageUrl = document.getElementById('seriesImage').value;
                const categories = document.getElementById('seriesCategories').value.split(',').map(c => c.trim());
                const rating = parseFloat(document.getElementById('seriesRating').value) || 0;
                
                // Collect seasons and episodes
                const seasons = {};
                document.querySelectorAll('.season-field').forEach(seasonField => {
                    const seasonName = seasonField.querySelector('.season-name').value;
                    if (seasonName) {
                        const episodes = [];
                        seasonField.querySelectorAll('.episode-field').forEach(episodeField => {
                            const episodeName = episodeField.querySelector('.episode-name').value;
                            const dubLink = episodeField.querySelector('.episode-dub').value;
                            const legLink = episodeField.querySelector('.episode-leg').value;
                            
                            if (episodeName && (dubLink || legLink)) {
                                episodes.push({
                                    name: episodeName,
                                    dubLink,
                                    legLink
                                });
                            }
                        });
                        
                        if (episodes.length > 0) {
                            seasons[seasonName] = episodes;
                        }
                    }
                });
                
                try {
                    await db.collection('series').add({
                        title,
                        description,
                        imageUrl,
                        categories,
                        averageRating: rating,
                        ratings: [],
                        seasons,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast('Série adicionada com sucesso!', false);
                    document.getElementById('addSeriesForm').reset();
                    seasonCounter = 0;
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao adicionar série: ' + error.message);
                }
            });
        }

        async function deleteContent(id, type) {
            if (!confirm('Tem certeza que deseja excluir este conteúdo?')) {
                return;
            }
            
            try {
                const collection = type === 'movies' ? 'animes' : 'series';
                await db.collection(collection).doc(id).delete();
                showToast('Conteúdo excluído com sucesso!', false);
                loadAdminTab();
            } catch (error) {
                showToast('Erro ao excluir conteúdo: ' + error.message);
            }
        }

        function editContent(id, type) {
            showToast('Função de editar em desenvolvimento...', false);
        }

        async function initializeApp() {
            try {
                // Auto-login as owner for demo
                currentUser = { email: OWNER_EMAIL };
                userData = { name: 'Admin', email: OWNER_EMAIL };
                
                const userNameDisplay = document.getElementById('userNameDisplay');
                if (userNameDisplay) {
                    userNameDisplay.textContent = userData.name;
                }
                
                await loadAdminTab();
                
                const app = document.getElementById('app');
                const loading = document.getElementById('loadingScreen');
                
                if (app) {
                    app.style.display = 'block';
                    setTimeout(() => app.classList.add('active'), 100);
                }
                
                if (loading) {
                    loading.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Error initializing app:', error);
                showToast('Erro ao inicializar aplicação');
                
                // Fallback: hide loading screen even if initialization fails
                const loading = document.getElementById('loadingScreen');
                const app = document.getElementById('app');
                if (loading) loading.style.display = 'none';
                if (app) {
                    app.style.display = 'block';
                    app.classList.add('active');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Fallback timeout to prevent infinite loading
            setTimeout(() => {
                const loading = document.getElementById('loadingScreen');
                const app = document.getElementById('app');
                if (loading && loading.style.display !== 'none') {
                    console.warn('Loading timeout - forcing app to show');
                    loading.style.display = 'none';
                    if (app) { 
                        app.style.display = 'block'; 
                        app.classList.add('active'); 
                    }
                }
            }, 5000);
            
            // Initialize app
            initializeApp();
        });

        document.getElementById('logoutButton')?.addEventListener('click', () => {
            if (confirm('Tem certeza que deseja sair?')) {
                showToast('Logout realizado com sucesso!', false);
                setTimeout(() => location.reload(), 1000);
            }
        });
    </script>
</body>
</html>
