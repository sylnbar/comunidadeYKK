        // ======== FILTERS ========
        function filterContent(items) {
            let filtered = [...items];
            
            // Filter by catalog tab
            if (currentCatalogTab !== 'Todos') {
                if (currentCatalogTab === 'Filmes') {
                    filtered = filtered.filter(item => item.type === 'movies');
                } else if (currentCatalogTab === 'Séries') {
                    filtered = filtered.filter(item => item.type === 'series');
                }
            }
            
            // Filter by genre
            if (currentGenre !== 'Todos') {
                filtered = filtered.filter(item => 
                    getItemCategories(item).includes(currentGenre)
                );
            }
            
            // Filter by search term
            if (searchTerm) {
                const searchLower = searchTerm.toLowerCase();
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(searchLower) ||
                    getItemCategories(item).some(cat => 
                        cat.toLowerCase().includes(searchLower)
                    )
                );
            }
            
            // Sort by most recent
            filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            return filtered;
        }

        async function saveEditChanges(itemId, itemType) {
            try {
                const title = document.getElementById('editTitle').value.trim();
                const type = document.getElementById('editType').value;
                const description = document.getElementById('editDescription').value.trim();
                const imageUrl = document.getElementById('editImage').value.trim();
                const genres = document.getElementById('editGenres').value.split(',').map(g => g.trim()).filter(g => g);
                const rating = parseFloat(document.getElementById('editRating').value);
                
                if (!title || !description) {
                    showToast('Preencha pelo menos título e descrição');
                    return;
                }
                
                const updatedContent = {
                    title,
                    type,
                    description,
                    imageUrl: imageUrl || `https://picsum.photos/seed/${title}/300/450`,
                    categories: genres,
                    averageRating: rating || 0,
                    updatedAt: new Date()
                };
                
                // Update in Firestore
                await db.collection(itemType).doc(itemId).update(updatedContent);
                
                // Clear cache and refresh
                allContentCache = [];
                showToast('Conteúdo atualizado com sucesso!', 'success');
                closeModal();
                renderAdmin();
            } catch (error) {
                showToast('Erro ao atualizar conteúdo');
            }
        }

        async function updateUserRating(itemId, rating) {
            if (!currentUser) {
                showToast('Faça login para avaliar');
                return;
            }
            
            try {
                // Save user rating
                await db.collection('users').doc(currentUser.uid).collection('ratings').doc(itemId).set({
                    rating: rating,
                    timestamp: new Date()
                });
                
                // Update item average rating
                await updateItemAverageRating(itemId);
                
                showToast('Avaliação salva!', 'success');
            } catch (error) {
                console.error('Error saving rating:', error);
                showToast('Erro ao salvar avaliação');
            }
        }
        
        async function updateItemAverageRating(itemId) {
            try {
                // Get all ratings for this item
                const ratingsSnap = await db.collectionGroup('ratings').where('itemId', '==', itemId).get();
                
                if (ratingsSnap.empty) return;
                
                // Calculate average
                let totalRating = 0;
                ratingsSnap.forEach(doc => {
                    totalRating += doc.data().rating;
                });
                const averageRating = totalRating / ratingsSnap.size;
                
                // Find which collection the item belongs to
                const item = allContentCache.find(i => i.id === itemId);
                if (item) {
                    await db.collection(item.type).doc(itemId).update({
                        averageRating: averageRating,
                        totalRatings: ratingsSnap.size
                    });
                    
                    // Update cache
                    const cacheIndex = allContentCache.findIndex(i => i.id === itemId);
                    if (cacheIndex !== -1) {
                        allContentCache[cacheIndex].averageRating = averageRating;
                        allContentCache[cacheIndex].totalRatings = ratingsSnap.size;
                    }
                }
            } catch (error) {
                console.error('Error updating average rating:', error);
            }
        }

        function attachAddContentListeners() {
            const contentType = document.getElementById('contentType');
            const seriesFields = document.getElementById('seriesFields');
            const episodeFields = document.getElementById('episodeFields');
            
            // Toggle series/episode fields based on type
            contentType?.addEventListener('change', () => {
                const isSeries = contentType.value === 'series';
                seriesFields.style.display = isSeries ? 'block' : 'none';
                episodeFields.style.display = isSeries ? 'block' : 'none';
            });
            
            const saveBtn = document.getElementById('saveContentBtn');
            if (saveBtn) {
                saveBtn.addEventListener('click', async () => {
                    const title = document.getElementById('contentTitle').value.trim();
                    const type = document.getElementById('contentType').value;
                    const description = document.getElementById('contentDescription').value.trim();
                    const imageUrl = document.getElementById('contentImage').value.trim();
                    const genres = document.getElementById('contentGenres').value.split(',').map(g => g.trim()).filter(g => g);
                    const rating = parseFloat(document.getElementById('contentRating').value);
                    
                    if (!title || !description) {
                        showToast('Preencha pelo menos título e descrição');
                        return;
                    }
                    
                    try {
                        const newContent = {
                            title,
                            type,
                            description,
                            imageUrl: imageUrl || `https://picsum.photos/seed/${title}/300/450`,
                            categories: genres,
                            averageRating: rating || 0,
                            createdAt: new Date()
                        };
                        
                        // Add seasons and episodes for series/anime
                        if (type === 'series') {
                            const seasonsText = document.getElementById('contentSeasons').value.trim();
                            const episodesText = document.getElementById('contentEpisodes').value.trim();
                            
                            if (seasonsText && episodesText) {
                                const seasons = seasonsText.split('\n').filter(s => s.trim());
                                const episodes = episodesText.split('\n').filter(e => e.trim());
                                
                                newContent.seasons = {};
                                
                                // Create season structure
                                seasons.forEach(season => {
                                    newContent.seasons[season.trim()] = [];
                                });
                                
                                // Parse and add episodes
                                episodes.forEach(episodeLine => {
                                    const parts = episodeLine.split('-').map(p => p.trim());
                                    if (parts.length >= 5) {
                                        const [season, episodeNum, episodeName, dubLink, legLink] = parts;
                                        const episodeNameFull = `${episodeNum.trim()}: ${episodeName.trim()}`;
                                        
                                        if (newContent.seasons[season]) {
                                            newContent.seasons[season].push({
                                                name: episodeNameFull,
                                                dubLink: dubLink.trim(),
                                                legLink: legLink.trim()
                                            });
                                        }
                                    }
                                });
                            }
                        } else {
                            // Add movie links
                            newContent.dubLink = '';
                            newContent.legLink = '';
                        }
                        
                        // Add to Firestore
                        await db.collection(type).add(newContent);
                        
                        // Clear cache and refresh
                        allContentCache = [];
                        showToast('Conteúdo adicionado com sucesso!', 'success');
                        
                        // Switch back to content tab
                        document.querySelector('[data-admin-tab="content"]').click();
                    } catch (error) {
                        showToast('Erro ao adicionar conteúdo');
                    }
                });
            }
        }

        // ======== ERROR HANDLING ========
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showToast('Ocorreu um erro inesperado');
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            showToast('Ocorreu um erro inesperado');
        });
        
        // ======== START APP ========
        // Initialize app immediately on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Add timeout to ensure loading screen is never stuck
            setTimeout(() => {
                const loading = document.getElementById('loadingScreen');
                const app = document.getElementById('app');
                const loginScreen = document.getElementById('loginScreen');
                
                if (loading && loading.style.display !== 'none') {
                    console.warn('Loading screen timeout - forcing hide');
                    loading.style.display = 'none';
                    
                    // Show app as fallback
                    if (app) {
                        app.style.display = 'flex';
                        app.classList.add('active');
                    }
                    if (loginScreen) {
                        loginScreen.style.display = 'none';
                    }
                }
            }, 5000); // 5 second timeout
            
            initializeAppWithoutAuth();
        });

        // ======== NAVIGATION EVENT LISTENERS ========
        function setupNavigation() {
            // Navigation items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const tabName = item.dataset.tab;
                    if (tabName) {
                        // Update active state
                        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                        item.classList.add('active');
                        
                        // Load tab content
                        loadTab(tabName);
                    }
                });
            });

            // Logo click - go to home
            document.querySelector('.logo-area')?.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                document.querySelector('[data-tab="home"]').classList.add('active');
                loadTab('home');
            });

            // User dropdown
            document.getElementById('settingsIcon')?.addEventListener('click', () => {
                // Toggle user menu (you can implement this)
                showToast('Menu do usuário em desenvolvimento');
            });

            // Logout button
            document.getElementById('logoutBtn')?.addEventListener('click', () => {
                if (confirm('Tem certeza que deseja sair?')) {
                    // Reset to login screen
                    document.getElementById('app').style.display = 'none';
                    document.getElementById('loginScreen').style.display = 'flex';
                    showToast('Logout realizado com sucesso!', 'success');
                }
            });
        }
