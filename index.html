<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>YK Server · Filmes & Séries</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: radial-gradient(circle at 10% 20%, #0f0b1a, #08050f);
      color: #f5e6f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1e1a2a; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ff5a8a, #ff3366); border-radius: 10px; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    @keyframes pulseGlow { 0%,100% { box-shadow:0 0 5px rgba(255,90,138,0.3); } 50% { box-shadow:0 0 25px rgba(255,90,138,0.8); } }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    @keyframes float { 0% { transform:translateY(0px); } 50% { transform:translateY(-10px); } 100% { transform:translateY(0px); } }
    @keyframes starBounce { 0% { transform:scale(1); } 50% { transform:scale(1.3); color:#ffcc00; } 100% { transform:scale(1); } }
    .toast {
      position:fixed; top:30px; left:50%; transform:translateX(-50%);
      background:linear-gradient(135deg,#ff3366,#cc2255); color:white; padding:12px 28px;
      border-radius:60px; font-weight:bold; z-index:1000; backdrop-filter:blur(8px);
      font-size:14px; animation:fadeInUp 0.3s ease; box-shadow:0 5px 20px rgba(0,0,0,0.3);
    }
    .toast.success { background:linear-gradient(135deg,#4caf50,#388e3c); }
    .beta-banner {
      background:linear-gradient(135deg,#ff5a8a,#ff3366); text-align:center; padding:8px;
      font-size:12px; font-weight:bold; animation:pulseGlow 2s infinite;
    }
    .credit-footer {
      text-align:center; padding:20px; font-size:13px; color:#aa99cc;
      border-top:1px solid rgba(255,90,138,0.2); margin-top:20px;
      background:rgba(10,5,18,0.8); backdrop-filter:blur(8px);
    }
    .login-screen {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:radial-gradient(circle at 30% 20%, #1a0f2e, #0a0512);
      display:flex; justify-content:center; align-items:center; z-index:100; padding:16px;
    }
    .login-card {
      background:rgba(30,22,45,0.8); backdrop-filter:blur(20px); padding:45px;
      border-radius:56px; width:400px; max-width:90%; border:1px solid rgba(255,90,138,0.4);
      text-align:center; animation:scaleIn 0.5s ease;
    }
    .login-card h2 {
      margin-bottom:25px; background:linear-gradient(135deg,#ff90b5,#ff5a8a);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      font-size:34px; font-weight:700;
    }
    .login-card input {
      width:100%; padding:14px 18px; margin:12px 0;
      background:rgba(42,34,59,0.8); border:1px solid rgba(255,90,138,0.3);
      border-radius:60px; color:white; font-size:15px; outline:none;
    }
    .login-card input:focus { border-color:#ff5a8a; box-shadow:0 0 15px rgba(255,90,138,0.4); transform:scale(1.02); }
    .login-card button {
      width:100%; padding:14px; background:linear-gradient(135deg,#ff5a8a,#ff3366);
      border:none; border-radius:60px; color:white; font-weight:bold; cursor:pointer;
      margin-top:15px; font-size:16px; transition:0.3s;
    }
    .login-card button:hover { transform:scale(1.02); box-shadow:0 8px 25px rgba(255,90,138,0.4); }
    .login-card .switch {
      margin-top:20px; color:#ccb0e0; cursor:pointer; font-size:13px; transition:0.3s;
    }
    .login-card .switch:hover { color:#ff90b5; transform:translateX(3px); }
    .app { display:none; min-height:100vh; flex-direction:column; }
    .loading-screen {
      position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0512;
      display:flex; justify-content:center; align-items:center; z-index:99;
      flex-direction:column; gap:25px;
    }
    .loading-spinner {
      width:60px; height:60px; border:3px solid rgba(255,90,138,0.2);
      border-top:3px solid #ff5a8a; border-right:3px solid #ff3366;
      border-radius:50%; animation:spin 1s linear infinite;
    }
    .top-bar {
      background:rgba(19,14,28,0.85); backdrop-filter:blur(12px);
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 32px; border-bottom:1px solid rgba(255,90,138,0.3);
      position:sticky; top:0; z-index:50;
    }
    .logo-area { display:flex; align-items:center; gap:15px; }
    .yk-logo {
      width:50px; height:50px; border-radius:25px;
      background:url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover no-repeat;
      background-color:#ff5a8a; box-shadow:0 0 20px rgba(255,90,138,0.6);
      animation:pulseGlow 2s ease infinite;
    }
    .top-bar h1 {
      font-size:22px; background:linear-gradient(135deg,#ff90b5,#ff5a8a);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .user-info { display:flex; gap:20px; align-items:center; }
    .logout-btn {
      background:transparent; border:1px solid #ff7aa8; padding:8px 22px;
      border-radius:40px; cursor:pointer; color:#ff90b5; transition:0.3s;
    }
    .logout-btn:hover { background:rgba(255,90,138,0.2); transform:scale(1.05); }
    .main-layout { display:flex; flex:1; overflow:hidden; }
    .sidebar {
      width:260px; background:rgba(17,12,28,0.7); backdrop-filter:blur(12px);
      padding:30px 16px; border-right:1px solid rgba(255,90,138,0.2);
    }
    .nav-item {
      padding:12px 18px; margin:10px 0; cursor:pointer; border-radius:45px;
      font-weight:600; color:#e2ccee; display:flex; align-items:center; gap:12px;
      transition:0.3s;
    }
    .nav-item:hover { background:rgba(255,90,138,0.2); transform:translateX(8px); }
    .nav-item.active { background:linear-gradient(135deg,#ff5a8a,#ff3366); color:white; box-shadow:0 4px 15px rgba(255,90,138,0.4); }
    .nav-icon { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; }
    .content-area { flex:1; overflow-y:auto; padding:30px; background:rgba(8,5,15,0.4); }
    .anime-grid {
      display:grid; grid-template-columns:repeat(6,1fr); gap:25px;
      animation:fadeInUp 0.5s ease;
    }
    @media (max-width:1600px) { .anime-grid { grid-template-columns:repeat(5,1fr); } }
    @media (max-width:1400px) { .anime-grid { grid-template-columns:repeat(4,1fr); } }
    @media (max-width:1100px) { .anime-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:768px) {
      .top-bar { padding:10px 20px; }
      .top-bar h1 { font-size:14px; }
      .yk-logo { width:36px; height:36px; }
      .sidebar { position:fixed; top:0; left:0; width:260px; height:100vh; z-index:100; transform:translateX(-100%); background:rgba(17,12,28,0.98); backdrop-filter:blur(16px); padding-top:70px; transition:0.3s; }
      .sidebar.open { transform:translateX(0); }
      .mobile-menu-btn { display:block; background:rgba(255,90,138,0.2); border:1px solid rgba(255,90,138,0.5); border-radius:12px; padding:10px; cursor:pointer; font-size:22px; color:#ff90b5; }
      .mobile-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:90; backdrop-filter:blur(4px); }
      .mobile-overlay.active { display:block; }
      .content-area { padding:16px; }
      .anime-grid { grid-template-columns:repeat(2,1fr); gap:12px; }
    }
    .anime-card {
      background:rgba(23,17,38,0.9); backdrop-filter:blur(8px); border-radius:24px;
      overflow:hidden; cursor:pointer; border:1px solid rgba(255,90,138,0.3);
      transition:0.4s; position:relative;
    }
    .anime-card:hover { transform:translateY(-10px) scale(1.02); border-color:#ff5a8a; box-shadow:0 25px 40px -15px rgba(255,90,138,0.4); }
    .anime-card .anime-image { width:100%; aspect-ratio:2/3; overflow:hidden; background:#1a1530; }
    .anime-card .anime-image img { width:100%; height:100%; object-fit:cover; transition:transform 0.6s; }
    .anime-card:hover .anime-image img { transform:scale(1.1); }
    .card-content { padding:14px; flex:1; display:flex; flex-direction:column; }
    .card-content h3 { font-size:15px; margin-bottom:8px; color:#ffc0dd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .categories-wrapper { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    .category-badge { font-size:10px; background:linear-gradient(135deg,rgba(79,58,108,0.9),rgba(55,40,80,0.9)); padding:4px 10px; border-radius:30px; color:#ffcfdf; }
    .rating-stars { display:flex; align-items:center; gap:4px; margin:10px 0 6px; font-size:14px; }
    .star-filled { color:#ffcc00; }
    .star-empty { color:#555; }
    .watch-btn {
      margin-top:10px; padding:8px; background:linear-gradient(135deg,#ff5a8a,#ff3366);
      text-align:center; border-radius:40px; color:white; font-weight:bold; font-size:12px;
    }
    .favorite-btn-overlay {
      position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
      border:none; border-radius:30px; padding:6px 10px; cursor:pointer; font-size:14px;
      z-index:10; opacity:0; transition:0.3s;
    }
    .anime-card:hover .favorite-btn-overlay { opacity:1; }
    .favorite-btn-overlay.active { opacity:1; background:#ff5a8a; }
    .novidade-badge {
      position:absolute; top:10px; left:10px; background:linear-gradient(135deg,#ff5a8a,#ff3366);
      padding:4px 12px; border-radius:30px; font-size:9px; font-weight:bold; animation:pulseGlow 1.5s infinite;
    }
    .modal-overlay {
      position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95);
      backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center;
      z-index:200; visibility:hidden; opacity:0; transition:0.3s;
    }
    .modal-overlay.active { visibility:visible; opacity:1; }
    .modal-detail {
      background:#1c152e; width:95vw; max-width:1300px; height:90vh;
      border-radius:56px; display:flex; flex-direction:column; border:1px solid #ff7aa8; overflow:hidden;
    }
    .modal-header {
      padding:20px 28px; border-bottom:1px solid rgba(255,90,138,0.3);
      display:flex; justify-content:space-between; align-items:center; background:rgba(28,21,46,0.9);
    }
    .modal-header h2 { color:#ff8ab5; font-size:24px; }
    .close-modal { background:none; border:none; font-size:32px; color:#ffb0cc; cursor:pointer; }
    .modal-body { flex:1; overflow-y:auto; padding:28px; display:flex; flex-direction:column; gap:25px; }
    .modal-episode-list { display:flex; flex-direction:column; gap:12px; max-height:320px; overflow-y:auto; }
    .modal-episode-item {
      background:rgba(42,35,64,0.8); border-radius:20px; padding:14px 18px;
      cursor:pointer; transition:0.3s; display:flex; justify-content:space-between; align-items:center;
    }
    .modal-episode-item:hover { background:#ff5a8a; transform:translateX(8px); }
    .episode-audio-badge { font-size:11px; padding:4px 12px; border-radius:30px; background:#2f234b; }
    .modal-top { display:flex; flex-wrap:wrap; gap:30px; margin-bottom:20px; }
    .modal-image { flex:0 0 200px; }
    .modal-image img { width:100%; border-radius:20px; }
    .modal-categories { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
    .modal-cat { background:rgba(255,90,138,0.2); padding:6px 18px; border-radius:60px; font-size:13px; }
    .modal-desc { background:rgba(15,11,28,0.8); padding:20px; border-radius:28px; line-height:1.6; font-size:14px; }
    .modal-rating { margin:15px 0; display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
    .star-rating-select { display:flex; gap:8px; cursor:pointer; }
    .star-select { font-size:32px; color:#555; transition:0.2s; }
    .star-select:hover { color:#ffcc00; transform:scale(1.2); }
    .season-tabs { display:flex; flex-wrap:wrap; gap:12px; margin:15px 0; border-bottom:1px solid rgba(255,90,138,0.3); padding-bottom:15px; }
    .season-tab { background:#2f234b; padding:8px 24px; border-radius:40px; cursor:pointer; font-weight:bold; font-size:13px; }
    .season-tab.active { background:linear-gradient(135deg,#ff5a8a,#ff3366); color:white; }
    .video-player-container {
      background:#0a0512; border-radius:24px; padding:16px; margin:20px 0;
      border:1px solid rgba(255,90,138,0.4); animation:fadeInUp 0.3s ease;
    }
    .video-player-container iframe, .video-player-container video {
      width:100%; height:450px; border-radius:16px; background:#000; border:none;
    }
    .close-player-btn, .next-ep-btn {
      background:#a5426a; border:none; border-radius:40px; padding:6px 18px;
      color:white; font-size:12px; cursor:pointer; margin-top:10px;
      transition:0.3s;
    }
    .next-ep-btn { background:#6a4c7c; }
    .close-player-btn:hover, .next-ep-btn:hover { transform:scale(1.02); background:#ff5a8a; }
    .admin-form { background:rgba(22,16,41,0.9); border-radius:32px; padding:28px; margin-bottom:35px; border:1px solid rgba(255,90,138,0.3); }
    .admin-form input, .admin-form textarea { width:100%; padding:14px; margin:10px 0; background:#251f36; border:1px solid rgba(255,90,138,0.3); border-radius:28px; color:white; }
    .categories-checkbox-group { display:flex; flex-wrap:wrap; gap:12px; margin:15px 0; padding:15px; background:rgba(37,31,54,0.6); border-radius:28px; }
    .search-bar { background:rgba(26,19,41,0.8); border-radius:60px; padding:10px 22px; margin-bottom:25px; border:1px solid rgba(255,90,138,0.3); }
    .search-bar input { background:transparent; border:none; color:white; width:100%; outline:none; }
    .filter-bar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:30px; }
    .filter-chip { background:rgba(31,24,48,0.8); padding:8px 20px; border-radius:40px; font-size:13px; cursor:pointer; color:#e2ccee; }
    .filter-chip.active { background:linear-gradient(135deg,#ff5a8a,#ff3366); color:white; }
    .donation-container { max-width:950px; margin:0 auto; animation:fadeInUp 0.6s ease; }
    .donation-card {
      background:linear-gradient(135deg,rgba(30,22,45,0.95),rgba(22,16,41,0.95));
      backdrop-filter:blur(12px); border-radius:56px; padding:45px; border:1px solid rgba(255,90,138,0.4);
      transition:0.3s;
    }
    .donation-card:hover { transform:translateY(-5px); border-color:rgba(255,90,138,0.7); }
    .donation-header { text-align:center; margin-bottom:35px; }
    .donation-header h2 { background:linear-gradient(135deg,#ff90b5,#ff5a8a); -webkit-background-clip:text; background-clip:text; color:transparent; font-size:34px; }
    .donation-content { display:flex; flex-wrap:wrap; gap:45px; justify-content:center; }
    .donation-info { flex:1; min-width:260px; }
    .donation-info h3 { color:#ff9ac2; margin-bottom:18px; font-size:22px; }
    .donation-info ul { list-style:none; padding:0; }
    .donation-info li { margin:18px 0; display:flex; align-items:center; gap:14px; font-size:15px; color:#e2ccee; }
    .donation-info li span { font-size:26px; }
    .goal-box { background:rgba(255,90,138,0.12); border-radius:28px; padding:25px; margin-top:30px; text-align:center; border:1px solid rgba(255,90,138,0.3); transition:0.3s; }
    .goal-box:hover { background:rgba(255,90,138,0.18); transform:scale(1.02); }
    .goal-box .amount { font-size:36px; font-weight:bold; color:#ff5a8a; }
    .qr-code-container {
      flex:0 0 260px; text-align:center; background:white; padding:25px; border-radius:40px;
      animation:float 4s ease-in-out infinite; transition:0.3s;
    }
    .qr-code-container:hover { transform:scale(1.02); }
    .pix-key { background:#1a1329; padding:12px; border-radius:20px; word-break:break-all; cursor:pointer; color:#ffcfdf; }
    .copy-btn { background:#ff5a8a; border:none; padding:12px 24px; border-radius:40px; color:white; font-weight:bold; cursor:pointer; margin-top:18px; width:100%; transition:0.3s; }
    .copy-btn:hover { background:#ff3366; transform:scale(1.02); }
    .donation-footer { text-align:center; margin-top:35px; padding-top:25px; border-top:1px solid rgba(255,90,138,0.2); font-size:12px; color:#888; }
    .inicio-card {
      background:rgba(23,17,38,0.8); backdrop-filter:blur(8px); border-radius:56px;
      padding:45px; text-align:center; transition:0.3s; animation:fadeInUp 0.6s ease;
    }
    .inicio-card:hover { box-shadow:0 0 40px rgba(255,90,138,0.15); transform:scale(1.01); }
    .btn-sugestao {
      background:linear-gradient(135deg,#ff5a8a,#ff3366); padding:14px 32px; border-radius:80px;
      border:none; color:white; font-weight:bold; cursor:pointer; margin-top:25px;
      transition:0.3s; font-size:15px; position:relative; overflow:hidden;
    }
    .btn-sugestao::before {
      content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
      transition:left 0.5s;
    }
    .btn-sugestao:hover::before { left:100%; }
    .btn-sugestao:hover { transform:scale(1.05); box-shadow:0 8px 25px rgba(255,90,138,0.4); }
    .edit-form-modal { background:#1c152e; border-radius:40px; padding:30px; max-width:850px; max-height:85vh; overflow-y:auto; animation:scaleIn 0.4s ease; }
    .season-edit-item, .episode-edit-item { background:rgba(31,24,48,0.8); padding:15px; border-radius:24px; margin-bottom:15px; }
    .add-season-btn, .add-episode-btn, .add-ep-btn-season { background:#6a4c7c; border:none; border-radius:40px; padding:8px 20px; color:white; cursor:pointer; transition:0.3s; }
    .remove-season-btn, .remove-ep, .remove-episode-btn { background:#a5426a; border:none; border-radius:40px; padding:4px 12px; color:white; cursor:pointer; transition:0.3s; }
    .episode-item { background:rgba(42,35,64,0.8); padding:15px; border-radius:24px; margin-bottom:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .upload-container { background:#1a1329; border-radius:24px; padding:10px; min-width:210px; }
    .announcement-card {
      background:linear-gradient(135deg,rgba(42,26,58,0.9),rgba(31,24,48,0.9));
      border-left:6px solid #ff5a8a; padding:16px 24px; border-radius:28px; margin-bottom:20px;
      transition:0.3s;
    }
    .announcement-card:hover { transform:translateX(5px); border-left-width:8px; }
    .edit-btn, .delete-btn, .move-btn {
      position:absolute; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
      border:none; border-radius:30px; padding:5px 10px; cursor:pointer; font-size:11px; color:white;
      z-index:3; transition:0.3s;
    }
    .edit-btn { right:100px; top:10px; background:rgba(58,42,85,0.9); }
    .move-btn { right:55px; top:10px; background:rgba(255,90,138,0.8); }
    .delete-btn { right:8px; top:10px; background:rgba(165,66,106,0.8); }
    .edit-btn:hover, .move-btn:hover, .delete-btn:hover { transform:scale(1.1); }
    .promote-btn { background:#ff5a8a; border:none; border-radius:40px; padding:6px 16px; cursor:pointer; color:white; transition:0.3s; }
    .promote-btn:hover { transform:scale(1.05); background:#ff3366; }
  </style>
</head>
<body>
<div class="beta-banner">BETA</div>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>YK Server</h2>
    <div id="loginFields">
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="password" placeholder="Senha">
    </div>
    <div id="signupFields" style="display:none;">
      <input type="text" id="signupName" placeholder="Nome de usuário">
      <input type="email" id="signupEmail" placeholder="E-mail">
      <input type="password" id="signupPassword" placeholder="Senha (mínimo 6 caracteres)">
    </div>
    <button id="loginBtn">Entrar</button>
    <div id="switchMode" class="switch">Criar nova conta</div>
    <div id="forgotBtn" class="switch">Esqueceu a senha?</div>
  </div>
</div>
<div id="loadingScreen" class="loading-screen" style="display:none;"><div class="loading-spinner"></div><p>Carregando YK Server...</p></div>
<div id="app" class="app">
  <div class="top-bar">

<script>
  // ==================== FIREBASE ====================
  const firebaseConfig = {

  // ==================== UTILITÁRIOS ====================
  function showMessage(text, isError = true) {
    const div = document.createElement('div');
    div.className = `toast ${!isError ? 'success' : ''}`;
    div.innerText = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
  function getItemCategories(item) { return item.categories && Array.isArray(item.categories) ? item.categories : (item.category ? [item.category] : []); }
  function isNovidade(date) { if (!date) return false; const d = date.toDate ? date.toDate() : new Date(date); return (new Date() - d) / (1000 * 3600 * 24) <= 7; }

  // ==================== ESTRELAS APENAS VISUAL ====================
  function renderStarsVisual(rating = 0, interactive = true, onRatingChange = null) {
    const full = Math.floor(rating);
    const container = document.createElement('div');
    container.className = 'star-rating-select';
    for (let i = 1; i <= 5; i++) {
      const star = document.createElement('span');
      star.className = 'star-select';
      star.textContent = '★';
      star.style.color = i <= full ? '#ffcc00' : '#555';
      star.style.fontSize = '32px';
      star.style.cursor = 'pointer';
      star.addEventListener('click', (e) => {
        e.stopPropagation();
        for (let j = 1; j <= 5; j++) {
          const s = container.children[j-1];
          s.style.color = j <= i ? '#ffcc00' : '#555';
        }
        if (onRatingChange) onRatingChange(i);
      });
      container.appendChild(star);
    }
    return container;
  }

  // ==================== FAVORITOS ====================
  async function loadUserFavorites() { if (!currentUser) return; try { const s = await db.collection("favoritos").doc(currentUser.uid).get(); userFavorites = new Set(s.exists && s.data().itens ? s.data().itens : []); } catch (e) { } }
  async function toggleFavorite(id) { if (!currentUser) { showMessage("Login necessário"); return; } const ref = db.collection("favoritos").doc(currentUser.uid); const doc = await ref.get(); let arr = doc.exists && doc.data().itens ? doc.data().itens : []; if (userFavorites.has(id)) { arr = arr.filter(i => i !== id); userFavorites.delete(id); showMessage("Removido dos favoritos", false); } else { arr.push(id); userFavorites.add(id); showMessage("Adicionado aos favoritos", false); } await ref.set({ itens: arr, userId: currentUser.uid, updatedAt: new Date() }); }

  // ==================== CONTINUAR ASSISTINDO ====================
  async function saveProgress(mediaId, seasonName, episodeIndex, audioType) { if (!currentUser) return; await db.collection("progresso").doc(`${currentUser.uid}_${mediaId}`).set({ userId: currentUser.uid, mediaId, seasonName, episodeIndex, audioType, updatedAt: new Date() }, { merge: true }); }

  // ==================== MOBILE MENU ====================
  function isMobile() { return window.innerWidth <= 768; }

  const sidebarEl = document.getElementById('sidebar'), mobileMenuBtn = document.getElementById('mobileMenuBtn'), mobileOverlay = document.getElementById('mobileOverlay');
  function toggleSidebar() { if (isMobile()) { sidebarOpen = !sidebarOpen; sidebarEl.classList.toggle('open', sidebarOpen); mobileOverlay.classList.toggle('active', sidebarOpen); } }
  function closeSidebar() { if (isMobile()) { sidebarOpen = false; sidebarEl.classList.remove('open'); mobileOverlay.classList.remove('active'); } }

  // ==================== MODAL COM PLAYER UNIVERSAL ====================
  async function openDetailModal(item) {
    const modal = document.getElementById("detailModal");
    const modalBody = document.getElementById("modalBody");
    const seasons = item.seasons || {};
    const seasonNames = Object.keys(seasons);
    let currentSeason = seasonNames[0] || "";
    let currentEpisodes = seasons[currentSeason] || [];
    let currentEpisodeIndex = -1;

    function isDirectVideoLink(url) { if (!url) return false; return /\.(mp4|webm|mkv|mov|avi)(\?.*)?$/i.test(url); }

    function loadMediaAtIndex(idx) {
      if (idx < 0 || idx >= currentEpisodes.length) { showMessage("Fim dos episódios!", false); closePlayer(); return; }
      currentEpisodeIndex = idx;
      const ep = currentEpisodes[idx];
      let mediaUrl = ep.dubLink || ep.legLink;
      if (!mediaUrl) { showMessage("Nenhum link de vídeo"); return; }
      const container = document.getElementById("videoPlayerContainer");
      const videoElem = document.getElementById("nativeVideo");
      const iframeElem = document.getElementById("embedIframe");
      if (!container) return;
      videoElem.style.display = "none"; iframeElem.style.display = "none";
      videoElem.pause(); videoElem.src = ""; iframeElem.src = "";
      container.style.display = "block";
      if (isDirectVideoLink(mediaUrl)) {
        videoElem.style.display = "block"; iframeElem.style.display = "none";
        videoElem.src = mediaUrl; videoElem.load();
        videoElem.play().catch(e => console.log);
        videoElem.oncanplay = () => { if (videoElem.requestFullscreen) videoElem.requestFullscreen(); };
      } else {
        videoElem.style.display = "none"; iframeElem.style.display = "block";
        let embedUrl = mediaUrl;
        if (mediaUrl.includes("<iframe")) { const m = mediaUrl.match(/src=["']([^"']+)["']/); if (m) embedUrl = m[1]; else embedUrl = mediaUrl; }
        iframeElem.src = embedUrl;
      }
      if (currentUser && item.id) saveProgress(item.id, currentSeason, idx, ep.dubLink ? "dub" : "leg");
      showMessage(`Reproduzindo: ${ep.name}`, false);
      setTimeout(() => { container.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
    }

    function closePlayer() {
      const c = document.getElementById("videoPlayerContainer"); if (c) c.style.display = "none";
      const v = document.getElementById("nativeVideo"); if (v) { v.pause(); v.src = ""; }
      const i = document.getElementById("embedIframe"); if (i) i.src = "";
    }

    function nextEpisode() {
      if (currentEpisodeIndex + 1 < currentEpisodes.length) loadMediaAtIndex(currentEpisodeIndex + 1);
      else { showMessage("Último episódio da temporada!", false); closePlayer(); }
    }

    function renderSeasonEpisodes(sname) {
      const eps = seasons[sname] || [];
      currentEpisodes = eps;
      if (eps.length === 0) return '<div style="text-align:center;padding:20px;">Nenhum episódio</div>';
      return `<div class="modal-episode-list">${eps.map((ep, i) => `<div class="modal-episode-item" data-ep-index="${i}" data-ep-name="${escapeHtml(ep.name)}"><span>▶ ${escapeHtml(ep.name)}</span><div>${ep.dubLink ? `<span class="episode-audio-badge">DUB</span>` : ''}${ep.legLink ? `<span class="episode-audio-badge">LEG</span>` : ''}</div></div>`).join('')}</div>`;
    }

    function renderSeasonTabs() {
      if (seasonNames.length === 0) return '<div>Nenhuma temporada</div>';
      return `<div class="season-tabs" id="seasonTabsModal">${seasonNames.map(s => `<div class="season-tab" data-season="${s}">${escapeHtml(s)}</div>`).join('')}</div><div id="episodesListModal">${renderSeasonEpisodes(currentSeason)}</div>`;
    }

    const starsDiv = document.createElement('div'); starsDiv.className = 'modal-rating'; starsDiv.innerHTML = '<strong>Sua nota:</strong> ';
    const starsContainer = renderStarsVisual(0, true);
    starsDiv.appendChild(starsContainer);

    modalBody.innerHTML = `
      <div class="modal-top">
        <div class="modal-image"><img src="${item.imageUrl || 'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div>
        <div><h3>${escapeHtml(item.title)}</h3>
        <div class="modal-categories">${getItemCategories(item).map(c => `<span class="modal-cat">${c}</span>`).join('')}</div>
        <div class="modal-desc">${escapeHtml(item.description || "Sem descrição.").replace(/\n/g, '<br>')}</div>
        ${starsDiv.outerHTML}
        <div><strong>Média geral:</strong> <span class="rating-stars">☆☆☆☆☆</span> (avaliações apenas visuais)</div></div>
      </div>
      <div id="videoPlayerContainer" class="video-player-container" style="display:none;">
        <video id="nativeVideo" controls style="width:100%; height:450px; background:#000; display:none;"></video>
        <iframe id="embedIframe" frameborder="0" allowfullscreen style="width:100%; height:450px; display:none;"></iframe>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
          <button class="close-player-btn" id="closePlayerBtn">Fechar</button>
          <button class="next-ep-btn" id="nextEpisodeBtn">Próximo episódio</button>
        </div>
      </div>
      <div>${renderSeasonTabs()}</div>
    `;

    document.getElementById("nextEpisodeBtn")?.addEventListener("click", nextEpisode);
    document.getElementById("closePlayerBtn")?.addEventListener("click", closePlayer);
    document.getElementById("nativeVideo")?.addEventListener("ended", nextEpisode);

    document.querySelectorAll("#seasonTabsModal .season-tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll("#seasonTabsModal .season-tab").forEach(tt => tt.classList.remove("active"));
        t.classList.add("active"); currentSeason = t.dataset.season;
        document.getElementById("episodesListModal").innerHTML = renderSeasonEpisodes(currentSeason);
        attachEpisodeEvents(); closePlayer();
      };
    });
    if (seasonNames.length) document.querySelector("#seasonTabsModal .season-tab")?.classList.add("active");

    function attachEpisodeEvents() {
      document.querySelectorAll(".modal-episode-item").forEach(el => {
        const idx = parseInt(el.dataset.epIndex);
        el.onclick = () => loadMediaAtIndex(idx);
      });
    }
    attachEpisodeEvents();

    modal.classList.add("active");
    document.getElementById("closeModalBtn").onclick = () => { closePlayer(); modal.classList.remove("active"); };
    modal.onclick = e => { if (e.target === modal) { closePlayer(); modal.classList.remove("active"); } };
  }

  // ==================== FUNÇÃO PARA MOVER ITEM ENTRE COLEÇÕES ====================
  async function moveItemBetweenCollections(item, targetCollection) {
    if (!confirm(`Mover "${item.title}" para ${targetCollection === 'animes' ? 'FILMES' : 'SÉRIES'}? Os dados serão transferidos.`)) return;
    try {
      const sourceCollection = item.type;
      if (sourceCollection === targetCollection) {
        showMessage("O item já está nesta categoria!");
        return;
      }
      const newDocRef = db.collection(targetCollection).doc(item.id);
      const newData = { ...item };
      delete newData.type;
      await newDocRef.set(newData);
      await db.collection(sourceCollection).doc(item.id).delete();
      
      const favSnapshot = await db.collection("favoritos").get();
      for (const favDoc of favSnapshot.docs) {
        const data = favDoc.data();
        if (data.itens && data.itens.includes(item.id)) {
          const newItens = data.itens.filter(id => id !== item.id);
          newItens.push(item.id);
          await favDoc.ref.update({ itens: newItens, updatedAt: new Date() });
        }
      }
      
      const progSnapshot = await db.collection("progresso").where("mediaId", "==", item.id).get();
      for (const progDoc of progSnapshot.docs) {
        await progDoc.ref.update({ mediaId: item.id });
      }
      
      showMessage(`Item movido para ${targetCollection === 'animes' ? 'FILMES' : 'SÉRIES'}!`, false);
      loadEditMode();
    } catch (error) {
      console.error(error);
      showMessage("Erro ao mover item.");
    }
  }

  // ==================== DIÁLOGO PARA ESCOLHER FILME/SÉRIE ====================
  function showMoveDialog(item) {
    const modalDiv = document.createElement('div');
    modalDiv.style.position = 'fixed';
    modalDiv.style.top = '0';
    modalDiv.style.left = '0';
    modalDiv.style.width = '100%';
    modalDiv.style.height = '100%';
    modalDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
    modalDiv.style.display = 'flex';
    modalDiv.style.alignItems = 'center';
    modalDiv.style.justifyContent = 'center';
    modalDiv.style.zIndex = '1000';
    modalDiv.innerHTML = `
      <div style="background:#1c152e; padding:30px; border-radius:30px; text-align:center; border:1px solid #ff5a8a;">
        <h3 style="margin-bottom:20px;">Mover: ${escapeHtml(item.title)}</h3>
        <div style="display:flex; gap:20px; justify-content:center;">
          <button id="moveToMovies" style="background:#ff5a8a; border:none; padding:10px 25px; border-radius:40px; color:white; cursor:pointer;">Filmes</button>
          <button id="moveToSeries" style="background:#6a4c7c; border:none; padding:10px 25px; border-radius:40px; color:white; cursor:pointer;">Séries</button>
          <button id="cancelMove" style="background:#a5426a; border:none; padding:10px 25px; border-radius:40px; color:white; cursor:pointer;">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById('moveToMovies').onclick = () => {
      modalDiv.remove();
      moveItemBetweenCollections(item, 'animes');
    };
    document.getElementById('moveToSeries').onclick = () => {
      modalDiv.remove();
      moveItemBetweenCollections(item, 'series');
    };
    document.getElementById('cancelMove').onclick = () => modalDiv.remove();
  }

  // ==================== LOAD MEDIA (FILMES E SÉRIES) ====================
  async function loadMedia(collectionName, typeLabel) {
    const content = document.getElementById("content");
    const snap = await db.collection(collectionName).get();
    let items = []; snap.forEach(d => items.push({ id: d.id, ...d.data(), type: collectionName }));
    items.sort((a, b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));

    let html = `<div class="search-bar"><input type="text" id="searchInput" placeholder="Pesquisar..."></div><div class="filter-bar"><div class="filter-chip active" data-cat="Todos">Todos</div>${CATEGORIES.map(c => `<div class="filter-chip" data-cat="${c}">${c}</div>`).join('')}</div>`;

    if (userData?.isAdmin) {
      html += `<div class="admin-form"><h3>PUBLICAR NOVO ${typeLabel.toUpperCase()}</h3>
        <input id="newTitle" placeholder="Título">
        <textarea id="newDesc" rows="2" placeholder="Descrição"></textarea>
        <div class="categories-checkbox-group"><strong>Categorias:</strong><br>${CATEGORIES.map(c => `<label><input type="checkbox" value="${c}" class="cat-checkbox"> ${c}</label>`).join('')}</div>
        <input id="newImage" placeholder="URL da capa">
        <div id="seasonsContainer"></div>
        <button type="button" id="addSeasonBtn" class="add-season-btn">+ Adicionar Temporada</button>
        <button id="publishBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); margin-top:15px; padding:12px; width:100%; border-radius:60px; border:none; color:white; font-weight:bold;">PUBLICAR</button></div>`;
    }

    html += `<div class="anime-grid" id="mediaGrid"></div>`;
    content.innerHTML = html;

    if (userData?.isAdmin) {
      let seasonCounter = 1;
      function addSeason(seasonName = null) {
        const container = document.getElementById("seasonsContainer");
        const seasonId = Date.now() + seasonCounter;
        const seasonTitle = seasonName || `Temporada ${seasonCounter}`;
        const div = document.createElement('div'); div.className = "season-item"; div.setAttribute("data-season-id", seasonId);
        div.innerHTML = `<h4>${escapeHtml(seasonTitle)} <button class="remove-season-btn" style="background:#a5426a; padding:4px 12px; border-radius:40px;">Remover</button></h4><div class="episodes-list-${seasonId}"></div><button class="add-ep-btn-season" data-season="${seasonId}" style="background:#6a4c7c; padding:6px 12px; border-radius:40px;">+ Episódio</button>`;
        container.appendChild(div);
        div.querySelector(".remove-season-btn").onclick = () => div.remove();
        div.querySelector(".add-ep-btn-season").onclick = () => addEpisode(seasonId);
        seasonCounter++;
      }
      function addEpisode(seasonId) {
        const seasonDiv = document.querySelector(`.season-item[data-season-id="${seasonId}"]`);
        const episodesDiv = seasonDiv.querySelector(`.episodes-list-${seasonId}`);
        const epDiv = document.createElement('div'); epDiv.className = "episode-item";
        epDiv.innerHTML = `<input class="ep-name" placeholder="Nome do episódio" style="flex:1; min-width:120px;"><input class="ep-dub-link" placeholder="Link DUB (qualquer link)" style="flex:2;"><input class="ep-leg-link" placeholder="Link LEG (qualquer link)" style="flex:2;"><input class="ep-img" placeholder="URL da imagem" style="flex:1;"><button class="remove-ep" style="background:#a5426a; padding:4px 10px; border-radius:40px;">Remover</button>`;
        epDiv.querySelector(".remove-ep").onclick = () => epDiv.remove();
        episodesDiv.appendChild(epDiv);
      }
      document.getElementById("addSeasonBtn").onclick = () => addSeason();
      addSeason("Temporada 1");
      document.getElementById("publishBtn").onclick = async () => {
        const title = document.getElementById("newTitle").value.trim();
        const desc = document.getElementById("newDesc").value;
        const cats = Array.from(document.querySelectorAll(".cat-checkbox:checked")).map(cb => cb.value);
        const img = document.getElementById("newImage").value;
        if (!title) return showMessage("Título obrigatório");
        if (!cats.length) return showMessage("Selecione categorias");
        const seasons = {};
        const sDivs = document.querySelectorAll("#seasonsContainer .season-item");
        for (let s of sDivs) {
          let sName = s.querySelector("h4")?.innerText.replace("Remover", "").trim();
          if (!sName) continue;
          const eps = [];
          const eDivs = s.querySelectorAll(".episode-item");
          for (let e of eDivs) {
            const epName = e.querySelector(".ep-name")?.value.trim();
            const dub = e.querySelector(".ep-dub-link")?.value.trim();
            const leg = e.querySelector(".ep-leg-link")?.value.trim();
            const epImg = e.querySelector(".ep-img")?.value.trim();
            if (epName && (dub || leg)) eps.push({ name: epName, dubLink: dub || "", legLink: leg || "", imageUrl: epImg || "" });
          }
          if (eps.length) seasons[sName] = eps;
        }
        if (Object.keys(seasons).length === 0) return showMessage("Adicione pelo menos uma temporada com episódios!");
        await db.collection(collectionName).add({ title, description: desc, categories: cats, imageUrl: img, seasons, createdAt: new Date() });
        showMessage("Publicado!", false);
        loadMedia(collectionName, typeLabel);
      };
    }

    let currentFilter = "Todos", searchTerm = "";
    async function renderGrid(list, filter, search) {
      let filtered = list;
      if (filter !== "Todos") filtered = list.filter(i => getItemCategories(i).includes(filter));
      if (search) filtered = filtered.filter(i => i.title.toLowerCase().includes(search.toLowerCase()));
      const grid = document.getElementById("mediaGrid");
      if (!grid) return;
      if (!filtered.length) { grid.innerHTML = "<div style='text-align:center;padding:40px;'>Nenhum resultado</div>"; return; }
      grid.innerHTML = filtered.map(item => {
        const isFav = userFavorites.has(item.id);

          <input type="text" class="edit-ep-dub" value="${escapeHtml(ep.dubLink || '')}" placeholder="Link DUB" style="width:100%; margin-bottom:5px;">

        <div class="edit-season-header"><input type="text" class="edit-season-name" value="${escapeHtml(seasonName)}" placeholder="Nome da Temporada" style="flex:1;"><button class="remove-season-btn" style="background:#a5426a; border:none; border-radius:20px; padding:4px 12px; margin-left:10px;">Remover Temporada</button></div>

      </div>`;
    }
    modalDiv.innerHTML = `<div class="edit-form-modal"><div style="display:flex; justify-content:space-between;"><h2>Editando: ${escapeHtml(item.title)}</h2><button class="close-edit-modal" style="background:none; border:none; font-size:28px;">✕</button></div>
      <input id="editTitle" value="${escapeHtml(item.title)}" placeholder="Título"><textarea id="editDesc" rows="3">${escapeHtml(item.description || '')}</textarea>
      <div class="categories-checkbox-group">${CATEGORIES.map(c => `<label><input type="checkbox" value="${c}" class="edit-cat" ${getItemCategories(item).includes(c) ? 'checked' : ''}> ${c}</label>`).join('')}</div>
      <input id="editImage" value="${escapeHtml(item.imageUrl || '')}" placeholder="URL da capa"><div id="editSeasonsContainer">${seasonsHtml || '<p>Nenhuma temporada.</p>'}</div>
      <button id="addSeasonEditBtn" class="add-season-btn" style="margin-top:15px;">+ Nova Temporada</button>
      <button id="saveEditBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); margin-top:20px; padding:12px; width:100%; border-radius:60px; color:white; font-weight:bold;">SALVAR ALTERAÇÕES</button></div>`;
    document.body.appendChild(modalDiv);
    modalDiv.querySelector('.close-edit-modal').onclick = () => modalDiv.remove();
    modalDiv.onclick = (e) => { if (e.target === modalDiv) modalDiv.remove(); };
    modalDiv.querySelector('#addSeasonEditBtn').onclick = () => {
      const newSeasonName = prompt("Nome da nova temporada:");
      if (!newSeasonName) return;
      const container = modalDiv.querySelector('#editSeasonsContainer');
      const seasonDiv = document.createElement('div'); seasonDiv.className = 'season-edit-item';
      seasonDiv.innerHTML = `<div class="edit-season-header"><input type="text" class="edit-season-name" value="${escapeHtml(newSeasonName)}" style="flex:1;"><button class="remove-season-btn" style="background:#a5426a; border:none; border-radius:20px; padding:4px 12px; margin-left:10px;">Remover Temporada</button></div><div class="episodes-edit-container"></div><button class="add-episode-btn" style="margin-top:10px; background:#6a4c7c; border:none; border-radius:20px; padding:6px 12px;">+ Adicionar Episódio</button>`;
      attachSeasonEvents(seasonDiv);
      container.appendChild(seasonDiv);
    };
    function attachSeasonEvents(seasonDiv) {
      seasonDiv.querySelector('.add-episode-btn').onclick = () => {
        const epsContainer = seasonDiv.querySelector('.episodes-edit-container');
        const epDiv = document.createElement('div'); epDiv.className = 'episode-edit-item';
        epDiv.innerHTML = `<input type="text" class="edit-ep-name" placeholder="Nome do Episódio" style="width:100%;"><input type="text" class="edit-ep-dub" placeholder="Link DUB" style="width:100%;"><input type="text" class="edit-ep-leg" placeholder="Link LEG" style="width:100%;"><input type="text" class="edit-ep-img" placeholder="URL da Imagem" style="width:100%;"><button class="remove-episode-btn" style="background:#a5426a; border:none; border-radius:20px; padding:4px 12px;">Remover Episódio</button>`;
        epDiv.querySelector('.remove-episode-btn').onclick = () => epDiv.remove();
        epsContainer.appendChild(epDiv);
      };
      seasonDiv.querySelector('.remove-season-btn').onclick = () => seasonDiv.remove();
    }
    modalDiv.querySelectorAll('.season-edit-item').forEach(attachSeasonEvents);
    modalDiv.querySelector('#saveEditBtn').onclick = async () => {
      const newTitle = modalDiv.querySelector('#editTitle').value.trim();
      const newDesc = modalDiv.querySelector('#editDesc').value;
      const newCats = Array.from(modalDiv.querySelectorAll('.edit-cat:checked')).map(cb => cb.value);
      const newImg = modalDiv.querySelector('#editImage').value;
      if (!newTitle) return showMessage("Título obrigatório!");
      if (!newCats.length) return showMessage("Selecione pelo menos uma categoria!");
      const newSeasons = {};
      const seasonDivs = modalDiv.querySelectorAll('#editSeasonsContainer .season-edit-item');
      for (let sDiv of seasonDivs) {
        let seasonName = sDiv.querySelector('.edit-season-name')?.value.trim();
        if (!seasonName) continue;
        const episodes = [];
        const epDivs = sDiv.querySelectorAll('.episode-edit-item');
        for (let epDiv of epDivs) {
          const epName = epDiv.querySelector('.edit-ep-name')?.value.trim();
          const dubLink = epDiv.querySelector('.edit-ep-dub')?.value.trim();
          const legLink = epDiv.querySelector('.edit-ep-leg')?.value.trim();
          const epImg = epDiv.querySelector('.edit-ep-img')?.value.trim();
          if (epName && (dubLink || legLink)) episodes.push({ name: epName, dubLink: dubLink || "", legLink: legLink || "", imageUrl: epImg || "" });
        }
        if (episodes.length) newSeasons[seasonName] = episodes;
      }
      await db.collection(item.type).doc(item.id).update({ title: newTitle, description: newDesc, categories: newCats, imageUrl: newImg, seasons: newSeasons, updatedAt: new Date() });
      showMessage("Obra atualizada com sucesso!", false);
      modalDiv.remove();
      loadEditMode();
    };
  }

  async function loadTab(tab) {
    if (tab === "inicio") await loadInicio();
    else if (tab === "filmes") await loadMedia("animes", "Filmes");
    else if (tab === "series") await loadMedia("series", "Séries");
    else if (tab === "favoritos") await loadFavoritos();

  // ==================== AUTH ====================
  function updateUI() {
    const btn = document.getElementById("loginBtn");
    const sw = document.getElementById("switchMode");
    const loginFields = document.getElementById("loginFields");
    const signupFields = document.getElementById("signupFields");
    if (isLogin) {
      btn.innerText = "Entrar";
      sw.innerText = "Criar nova conta";
      loginFields.style.display = "block";
      signupFields.style.display = "none";
    } else {
      btn.innerText = "Cadastrar";
      sw.innerText = "Já tenho conta";
      loginFields.style.display = "none";
      signupFields.style.display = "block";
    }
  }
  document.getElementById("switchMode").onclick = () => { isLogin = !isLogin; updateUI(); };
  document.getElementById("forgotBtn").onclick = async () => { const email = prompt("Digite seu e-mail:"); if (email) try { await auth.sendPasswordResetEmail(email); showMessage("Email de recuperação enviado!", false); } catch (e) { showMessage("Erro ao enviar email"); } };
  document.getElementById("loginBtn").onclick = async () => {
    const loading = document.getElementById("loadingScreen");
    loading.style.display = "flex";
    try {
      if (isLogin) {
        const email = document.getElementById("email").value;
        const pwd = document.getElementById("password").value;
        if (!email || !pwd) { showMessage("Preencha email e senha!"); loading.style.display = "none"; return; }
        await auth.signInWithEmailAndPassword(email, pwd);
        showMessage("Login realizado!", false);
      } else {
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value;
        const pwd = document.getElementById("signupPassword").value;
        if (!name || !email || !pwd) { showMessage("Preencha todos os campos!"); loading.style.display = "none"; return; }
        if (pwd.length < 6) { showMessage("Senha precisa ter 6+ caracteres"); loading.style.display = "none"; return; }
        const cred = await auth.createUserWithEmailAndPassword(email, pwd);
        await cred.user.sendEmailVerification();
        await db.collection("users").doc(cred.user.uid).set({ name: name, email: email, isAdmin: email === MASTER_EMAIL, createdAt: new Date() });
        showMessage("Conta criada! Verifique seu e-mail.", false);
        await auth.signOut();
        isLogin = true;
        updateUI();
      }
    } catch (e) { showMessage("Erro: " + e.message); }
    finally { loading.style.display = "none"; }
  };
  document.getElementById("logoutBtn").onclick = () => auth.signOut();

  auth.onAuthStateChanged(async (user) => {
    const loading = document.getElementById("loadingScreen");
    if (user) {
      loading.style.display = "flex";
      if (!user.emailVerified && user.email !== MASTER_EMAIL) { showMessage("Verifique seu e-mail antes de acessar."); await auth.signOut(); loading.style.display = "none"; return; }
      let doc = await db.collection("users").doc(user.uid).get();
      let userName = user.email.split("@")[0];
      if (!doc.exists) await db.collection("users").doc(user.uid).set({ name: userName, email: user.email, isAdmin: user.email === MASTER_EMAIL, createdAt: new Date() });
      else userName = doc.data().name;
      currentUser = user;
      userData = { name: userName, email: user.email, isAdmin: user.email === MASTER_EMAIL };
      document.getElementById("userName").innerText = userName;
      const isAdmin = user.email === MASTER_EMAIL;
      document.getElementById("adminTab").style.display = isAdmin ? "block" : "none";
      document.getElementById("editTab").style.display = isAdmin ? "block" : "none";
      await loadUserFavorites();
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "flex";
      loading.style.display = "none";
      loadTab("inicio");
      attachNavEvents();
    } else {
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("app").style.display = "none";
      loading.style.display = "none";
      isLogin = true;
      updateUI();
    }
  });
</script>
</body>
</html>
