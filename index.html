<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="YK Server - Streaming de animes e séries com a melhor qualidade">
    <meta name="theme-color" content="#0f0f23">
    <title>YK Server · Streaming Premium</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=64">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ======== RESET & BASE STYLES ======== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #ff5a8a, #ff3366, #ff1a75);
            --secondary-gradient: linear-gradient(135deg, #ff90b5, #ff5a8a, #ff4081);
            --accent-gradient: linear-gradient(135deg, #7c3aed, #a855f7, #b046ff);
            --dark-bg: radial-gradient(ellipse at top, #1a0f2e 0%, #0a0512 50%, #050208 100%);
            --surface-bg: rgba(23, 17, 38, 0.95);
            --card-bg: rgba(31, 24, 48, 0.8);
            --input-bg: rgba(42, 34, 59, 0.8);
            --border-color: rgba(255, 90, 138, 0.2);
            --border-hover: rgba(255, 90, 138, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #e4d4f1;
            --text-muted: #b19cd9;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 32px rgba(255, 90, 138, 0.3);
            --shadow-neon: 0 0 20px rgba(255, 90, 138, 0.5), 0 0 40px rgba(255, 51, 102, 0.3);
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 90, 138, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: ambientPulse 8s ease-in-out infinite;
        }

        /* ======== SCROLLBAR ======== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 26, 42, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: opacity 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }

        /* ======== ANIMATIONS ======== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 90, 138, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 90, 138, 0.8); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes ambientPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ======== LOADING SCREEN ======== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            gap: 24px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 90, 138, 0.2);
            border-top: 4px solid #ff5a8a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
            animation: pulse 2s ease-in-out infinite;
        }

        /* ======== TOAST NOTIFICATIONS ======== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface-bg);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            z-index: 10000;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            animation: slideInRight var(--transition-normal);
            max-width: 400px;
        }

        .toast.success {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.9), rgba(16, 185, 129, 0.9));
            border-color: rgba(34, 197, 94, 0.3);
        }

        .toast.error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(220, 38, 38, 0.9));
            border-color: rgba(239, 68, 68, 0.3);
        }

        .toast.info {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.9));
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* ======== NAVIGATION ======== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 70px;
        }

        .navbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .logo-section:hover {
            transform: scale(1.05);
        }

        .yk-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover;
            box-shadow: var(--shadow-sm);
        }

        .site-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .nav-menu {
            display: flex;
            gap: 8px;
        }

        .nav-item {
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            transition: left var(--transition-normal);
            z-index: -1;
        }

        .nav-item:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .nav-item:hover::before {
            left: 0;
        }

        .nav-item.active {
            color: var(--text-primary);
            background: var(--primary-gradient);
            box-shadow: var(--shadow-glow);
        }

        .nav-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .logout-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: var(--card-bg);
        }

        /* ======== MAIN CONTENT ======== */
        .content-wrapper {
            flex: 1;
            padding: 32px 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .content-section {
            margin-bottom: 48px;
            animation: fadeIn var(--transition-normal);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ======== HERO SECTION ======== */
        .hero-section {
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 90, 138, 0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        /* ======== SEARCH BAR ======== */
        .search-container {
            max-width: 600px;
            margin: 0 auto 48px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: all var(--transition-normal);
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            border-color: #ff5a8a;
            box-shadow: 0 0 0 4px rgba(255, 90, 138, 0.1);
            transform: translateY(-2px);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* ======== FILTER BAR ======== */
        .filter-container {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            box-shadow: var(--shadow-glow);
        }

        /* ======== CONTENT GRID ======== */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            margin-bottom: 48px;
        }

        /* ======== MEDIA CARD ======== */
        .media-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all var(--transition-normal);
            cursor: pointer;
            position: relative;
        }

        .media-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            border-color: var(--border-hover);
        }

        .media-thumbnail {
            width: 100%;
            height: 400px;
            object-fit: cover;
            background: var(--input-bg);
        }

        .media-content {
            padding: 24px;
        }

        .media-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .media-rating {
            color: #ff5a8a;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .media-type {
            background: var(--input-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .media-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .category-tag {
            background: var(--input-bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .media-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--card-bg);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .btn-secondary.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        /* ======== MODAL ======== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-normal);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform var(--transition-normal);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            padding: 8px;
            transition: color var(--transition-fast);
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* ======== ADMIN PANEL ======== */
        .admin-panel {
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
        }

        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 12px 24px;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            border-radius: 10px;
            transition: all var(--transition-fast);
        }

        .admin-tab:hover {
            color: var(--text-primary);
            background: var(--card-bg);
        }

        .admin-tab.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #ff5a8a;
            box-shadow: 0 0 0 4px rgba(255, 90, 138, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .content-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .content-type-btn {
            padding: 16px 32px;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .content-type-btn:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .content-type-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .content-indicator {
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
        }

        /* ======== SEASON & EPISODE FIELDS ======== */
        .season-field {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .episode-field {
            background: var(--input-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .season-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .season-title {
            margin: 0;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-remove {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .btn-remove:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-add {
            background: var(--accent-gradient);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ======== STATS ======== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            transition: all var(--transition-fast);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-hover);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 600;
        }

        /* ======== TABLE ======== */
        .manage-table {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .manage-table th {
            background: var(--input-bg);
            padding: 20px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
        }

        .manage-table td {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .manage-table tr:hover {
            background: var(--input-bg);
        }

        .content-preview {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .content-thumbnail {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .content-info h4 {
            margin: 0 0 8px 0;
            font-weight: 700;
            color: var(--text-primary);
        }

        .content-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .edit-btn {
            background: var(--accent-gradient);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all var(--transition-fast);
        }

        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ======== RESPONSIVE ======== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 16px;
            }

            .nav-menu {
                display: none;
            }

            .content-wrapper {
                padding: 20px 16px;
            }

            .admin-tabs {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .content-selector {
                flex-direction: column;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 16px;
            }

            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }

            .modal-content {
                padding: 20px;
            }
        }

        /* ======== CAROUSEL ======== */
        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 40px;
            background: linear-gradient(to right, transparent, rgba(255, 90, 138, 0.05), transparent);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 16px;
            padding: 0 8px;
        }

        .carousel-item {
            flex: 0 0 calc(20% - 13px);
            min-width: 0;
            position: relative;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .carousel-item:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .carousel-controls {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }

        .carousel-btn {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: all;
            font-size: 20px;
            opacity: 0;
            transform: scale(0.9);
        }

        .carousel-container:hover .carousel-btn {
            opacity: 1;
            transform: scale(1);
        }

        .carousel-btn:hover {
            background: rgba(255, 90, 138, 0.9);
            border-color: rgba(255, 90, 138, 0.5);
            transform: scale(1.1);
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
        }

        .carousel-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: #ff5a8a;
            width: 20px;
            border-radius: 3px;
        }

        /* ======== SECTIONS ======== */
        .section-carousel {
            padding: 24px 0;
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .section-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color var(--transition-fast);
        }

        .section-link:hover {
            color: #ff5a8a;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .featured-card {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 8px;
            background: transparent;
        }

        .featured-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .featured-card:hover .featured-thumbnail {
            filter: brightness(1.1);
        }

        .featured-card:hover .featured-overlay {
            opacity: 1;
        }

        .featured-thumbnail {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            transition: filter 0.3s ease;
        }

        .featured-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, transparent 100%);
            padding: 24px 16px 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .featured-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .featured-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            line-height: 1.4;
        }

        .featured-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .featured-rating {
            color: #ff5a8a;
            font-weight: 700;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .featured-type {
            background: rgba(255, 90, 138, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #ff5a8a;
            font-weight: 600;
        }

        .featured-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .featured-category {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        /* ======== FILTER STYLES ======== */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .filter-btn {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover {
            background: var(--surface-bg);
            border-color: var(--border-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            box-shadow: var(--shadow-md);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--border-hover);
            background: var(--surface-bg);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* ======== CATALOG GRID ======== */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            padding: 0 20px;
        }

        .media-card {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(20px);
        }

        .media-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-hover);
        }

        .media-thumbnail {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .media-content {
            padding: 20px;
        }

        .media-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .media-rating {
            color: #ff5a8a;
            font-weight: 700;
            font-size: 14px;
        }

        .media-type {
            background: rgba(255, 90, 138, 0.2);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #ff5a8a;
            font-weight: 600;
        }

        .media-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .category-tag {
            background: var(--input-bg);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .media-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--surface-bg);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .btn-favorite.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        /* ======== UTILITIES ======== */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mb-4 {
            margin-bottom: 24px;
        }

        .transition-normal {
            transition: all 0.3s ease;
        }

        .transition-fast {
            transition: all 0.15s ease;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando YK Server...</div>
    </div>

    <!-- Main App -->
    <div id="app" style="display: none;">
        <!-- Navigation -->
        <header class="navbar">
            <div class="navbar-content">
                <div class="logo-section" id="logoSection">
                    <div class="yk-logo"></div>
                    <div class="site-title">YK Server</div>
                </div>
                
                <nav class="nav-menu">
                    <button class="nav-item active" data-tab="home">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                        </svg>
                        <span>Início</span>
                    </button>
                    <button class="nav-item" data-tab="catalog">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2l-5.5 9h11z M12 22l5.5-9h-11z M3.5 9L12 2l8.5 7z"/>
                        </svg>
                        <span>Catálogo</span>
                    </button>
                    <button class="nav-item" data-tab="admin">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                        </svg>
                        <span>Admin</span>
                    </button>
                </nav>
                
                <div class="nav-section">
                    <span class="user-name" id="userNameDisplay">Visitante</span>
                    <button class="logout-btn" id="logoutButton">Login</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-wrapper">
            <div id="contentArea"></div>
        </main>
    </div>

    <!-- Content Modal -->
    <div id="contentModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title"></h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCTnC0RGSWRcr2ehQGimK6nIra9H8NH8Ks",
            authDomain: "yk-comunidade.firebaseapp.com",
            projectId: "yk-comunidade",
            storageBucket: "yk-comunidade.appspot.com",
            messagingSenderId: "682166331452",
            appId: "1:682166331452:web:9e0e8553646d44060ebb39"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Global Variables
        let currentUser = null;
        let userData = null;
        let allContent = [];
        let filteredContent = [];
        let currentFilter = 'all';
        let seasonCounter = 0;
        let favorites = [];
        let watchlist = [];
        let currentTab = 'home';

        const OWNER_EMAIL = 'joaodidier@proton.me';

        // Utility Functions
        function isOwner() {
            return currentUser && currentUser.email && currentUser.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"
            })[m]);
        }

        function hideLoading() {
            const loading = document.getElementById('loadingScreen');
            const app = document.getElementById('app');
            
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 300);
            }
            
            if (app) {
                app.style.display = 'block';
                setTimeout(() => {
                    app.style.opacity = '1';
                }, 100);
            }
        }

        function showLoading() {
            const loading = document.getElementById('loadingScreen');
            const app = document.getElementById('app');
            
            if (loading) {
                loading.style.display = 'flex';
                loading.style.opacity = '1';
            }
            
            if (app) {
                app.style.opacity = '0';
            }
        }

        // Firebase Functions
        async function loadAllContent() {
            try {
                const [animesSnap, seriesSnap] = await Promise.all([
                    db.collection('animes').get(),
                    db.collection('series').get()
                ]);
                
                let items = [];
                
                animesSnap.forEach(doc => {
                    items.push({
                        id: doc.id,
                        type: 'movie',
                        ...doc.data()
                    });
                });
                
                seriesSnap.forEach(doc => {
                    items.push({
                        id: doc.id,
                        type: 'series',
                        ...doc.data()
                    });
                });
                
                return items;
            } catch (error) {
                console.error('Error loading content:', error);
                showToast('Erro ao carregar conteúdo: ' + error.message, 'error');
                return [];
            }
        }

        // User Preferences
        function loadUserPreferences() {
            if (currentUser) {
                const prefs = localStorage.getItem(`userPrefs_${currentUser.uid}`);
                if (prefs) {
                    const parsed = JSON.parse(prefs);
                    favorites = parsed.favorites || [];
                    watchlist = parsed.watchlist || [];
                }
            }
        }

        function saveUserPreferences() {
            if (currentUser) {
                localStorage.setItem(`userPrefs_${currentUser.uid}`, JSON.stringify({
                    favorites,
                    watchlist
                }));
            }
        }

        function toggleFavorite(contentId) {
            if (!currentUser) {
                showToast('Faça login para adicionar aos favoritos', 'info');
                return;
            }

            const index = favorites.indexOf(contentId);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('Removido dos favoritos', 'success');
            } else {
                favorites.push(contentId);
                showToast('Adicionado aos favoritos', 'success');
            }
            
            saveUserPreferences();
            updateFavoriteButtons();
        }

        function toggleWatchlist(contentId) {
            if (!currentUser) {
                showToast('Faça login para adicionar à lista', 'info');
                return;
            }

            const index = watchlist.indexOf(contentId);
            if (index > -1) {
                watchlist.splice(index, 1);
                showToast('Removido da lista', 'success');
            } else {
                watchlist.push(contentId);
                showToast('Adicionado à lista', 'success');
            }
            
            saveUserPreferences();
            updateWatchlistButtons();
        }

        function updateFavoriteButtons() {
            document.querySelectorAll('.btn-favorite').forEach(btn => {
                const contentId = btn.dataset.contentId;
                if (favorites.includes(contentId)) {
                    btn.classList.add('active');
                    btn.innerHTML = '❤️';
                } else {
                    btn.classList.remove('active');
                    btn.innerHTML = '🤍';
                }
            });
        }

        function updateWatchlistButtons() {
            document.querySelectorAll('.btn-watchlist').forEach(btn => {
                const contentId = btn.dataset.contentId;
                if (watchlist.includes(contentId)) {
                    btn.classList.add('active');
                    btn.innerHTML = '✓ Lista';
                } else {
                    btn.classList.remove('active');
                    btn.innerHTML = '+ Lista';
                }
            });
        }

        // Modal Functions
        function openContentModal(content) {
            const modal = document.getElementById('contentModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = content.title;

            if (content.type === 'movie') {
                modalBody.innerHTML = `
                    <div style="margin-bottom: 24px;">
                        <img src="${content.imageUrl}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px;">
                    </div>
                    <h3 style="color: var(--text-primary); margin-bottom: 16px;">${escapeHtml(content.title)}</h3>
                    <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px;">${escapeHtml(content.description)}</p>
                    <div style="margin-bottom: 24px;">

        // Carousel Movement Function
        function moveCarousel(button, direction) {
            const container = button.closest('.carousel-container');
            const track = container.querySelector('.carousel-track');
            const items = track.querySelectorAll('.carousel-item');
            const itemWidth = items[0].offsetWidth + 16; // width + gap
            const visibleItems = Math.floor(container.offsetWidth / itemWidth);
            const maxIndex = Math.max(0, items.length - visibleItems);
            
            let currentTransform = track.style.transform || 'translateX(0px)';
            let currentX = parseInt(currentTransform.replace('translateX(', '').replace('px)', '')) || 0;
            
            const newX = Math.max(-maxIndex * itemWidth, Math.min(0, currentX + (direction * itemWidth * visibleItems)));
            track.style.transform = `translateX(${newX}px)`;
        }

        // Admin Functions

            const movieBtn = document.getElementById('contentTypeMovie');
            const seriesBtn = document.getElementById('contentTypeSeries');
            const indicator = document.getElementById('contentTypeIndicator');
            const formContainer = document.getElementById('dynamicContentForm');
            
            movieBtn.classList.remove('active');
            seriesBtn.classList.remove('active');

            } else {
                seriesBtn.classList.add('active');
                indicator.textContent = 'Adicionando uma Série';

        function generateManageContentTable(items, type) {

            return `
                <h3 style="color: var(--text-primary); margin-bottom: 24px;">📺 Gerenciar ${typeName}</h3>
                <div style="overflow-x: auto;">
                    <table class="manage-table">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Categorias</th>
                                <th>Avaliação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td>
                                        <div class="content-preview">
                                            <img src="${item.imageUrl || 'https://via.placeholder.com/60x90'}" 
                                                 alt="${escapeHtml(item.title)}" class="content-thumbnail">
                                            <div class="content-info">
                                                <h4>${escapeHtml(item.title)}</h4>
                                                <p>${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : 'N/A'}</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        ${(item.categories || []).map(cat => `<span class="category-tag">${escapeHtml(cat)}</span>`).join('')}
                                    </td>
                                    <td>
                                        <span style="color: #ff5a8a; font-weight: 700;">⭐ ${item.averageRating ? item.averageRating.toFixed(1) : '0.0'}</span>
                                    </td>
                                    <td>
                                        <div class="action-buttons">
                                            <button class="edit-btn" onclick="editContent(&quot;${item.id}&quot;, &quot;${type}&quot;)">
                                                Editar
                                            </button>
                                            <button class="btn-remove" onclick="deleteContent(&quot;${item.id}&quot;, &quot;${type}&quot;)">
                                                Excluir

                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function attachAdminListeners() {
            // Admin tab switching
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.admin-tab-content').forEach(content => content.classList.add('hidden'));
                    
                    const targetId = `admin-${tab.dataset.adminTab}`;
                    const targetElement = document.getElementById(targetId);
                    if (targetElement) {
                        targetElement.classList.remove('hidden');
                    }
                });
            });

            // Movie form submission
            document.getElementById('addMovieForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const title = document.getElementById('movieTitle').value;
                const description = document.getElementById('movieDescription').value;
                const imageUrl = document.getElementById('movieImage').value;
                const categories = document.getElementById('movieCategories').value.split(',').map(c => c.trim());
                const dubLink = document.getElementById('movieDubLink').value;
                const legLink = document.getElementById('movieLegLink').value;
                const rating = parseFloat(document.getElementById('movieRating').value) || 0;
                
                try {
                    await db.collection('animes').add({
                        title,
                        description,
                        imageUrl,
                        categories,
                        dubLink,
                        legLink,
                        averageRating: rating,
                        ratings: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast('Filme adicionado com sucesso!', 'success');
                    document.getElementById('addMovieForm').reset();
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao adicionar filme: ' + error.message, 'error');
                }
            });

            // Series form submission
            document.getElementById('addSeriesForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const title = document.getElementById('seriesTitle').value;
                const description = document.getElementById('seriesDescription').value;
                const imageUrl = document.getElementById('seriesImage').value;
                const categories = document.getElementById('seriesCategories').value.split(',').map(c => c.trim());
                const rating = parseFloat(document.getElementById('seriesRating').value) || 0;
                
                const seasons = {};
                document.querySelectorAll('.season-field').forEach(seasonField => {
                    const seasonName = seasonField.querySelector('.season-name').value;
                    if (seasonName) {
                        const episodes = [];
                        seasonField.querySelectorAll('.episode-field').forEach(episodeField => {
                            const episodeName = episodeField.querySelector('.episode-name').value;
                            const dubLink = episodeField.querySelector('.episode-dub').value;
                            const legLink = episodeField.querySelector('.episode-leg').value;
                            
                            if (episodeName && (dubLink || legLink)) {
                                episodes.push({
                                    name: episodeName,
                                    dubLink,
                                    legLink
                                });
                            }
                        });
                        
                        if (episodes.length > 0) {
                            seasons[seasonName] = episodes;
                        }
                    }
                });
                
                try {
                    await db.collection('series').add({
                        title,
                        description,
                        imageUrl,
                        categories,
                        averageRating: rating,
                        ratings: [],
                        seasons,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast('Série adicionada com sucesso!', 'success');
                    document.getElementById('addSeriesForm').reset();
                    seasonCounter = 0;
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao adicionar série: ' + error.message, 'error');
                }
            });
        }

        async function deleteContent(id, type) {
            if (!confirm('Tem certeza que deseja excluir este conteúdo?')) {
                return;
            }
            
            try {
                const collection = type === 'movie' ? 'animes' : 'series';
                await db.collection(collection).doc(id).delete();
                showToast('Conteúdo excluído com sucesso!', 'success');
                loadAdminTab();
            } catch (error) {
                showToast('Erro ao excluir conteúdo: ' + error.message, 'error');
            }
        }

        async function editContent(id, type) {
            try {
                const collection = type === 'movie' ? 'animes' : 'series';
                const doc = await db.collection(collection).doc(id).get();
                
                if (!doc.exists) {
                    showToast('Conteúdo não encontrado', 'error');
                    return;
                }
                
                const content = doc.data();
                
                // Create edit modal
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.style.display = 'flex';
                modal.innerHTML = `
                    <div class="modal-content" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
                        <div class="modal-header">
                            <h2 class="modal-title">Editar ${type === 'movie' ? 'Filme' : 'Série'}</h2>
                            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <form id="editForm" class="admin-form">
                                <div class="form-group">
                                    <label class="form-label">Título</label>
                                    <input type="text" class="form-input" id="editTitle" value="${escapeHtml(content.title)}" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Descrição</label>
                                    <textarea class="form-textarea" id="editDescription" required rows="4">${escapeHtml(content.description || '')}</textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">URL da Imagem</label>
                                    <input type="url" class="form-input" id="editImage" value="${escapeHtml(content.imageUrl)}" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Categorias (separadas por vírgula)</label>
                                    <input type="text" class="form-input" id="editCategories" value="${escapeHtml((content.categories || []).join(', '))}" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Avaliação (0-5)</label>
                                    <input type="number" class="form-input" id="editRating" min="0" max="5" step="0.1" value="${content.averageRating || 0}">
                                </div>
                                ${type === 'movie' ? `
                                    <div class="form-group">
                                        <label class="form-label">URL Dublado</label>
                                        <input type="url" class="form-input" id="editDubLink" value="${escapeHtml(content.dubLink || '')}" placeholder="https://exemplo.com/video-dublado.mp4">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">URL Legendado</label>
                                        <input type="url" class="form-input" id="editLegLink" value="${escapeHtml(content.legLink || '')}" placeholder="https://exemplo.com/video-legendado.mp4">
                                    </div>
                                ` : ''}
                                <div style="display: flex; gap: 12px;">
                                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Salvar Alterações</button>
                                    <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(modal);
                
                // Handle form submission
                const form = document.getElementById('editForm');
                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        
                        const updatedData = {
                            title: document.getElementById('editTitle').value,
                            description: document.getElementById('editDescription').value,
                            imageUrl: document.getElementById('editImage').value,
                            categories: document.getElementById('editCategories').value.split(',').map(c => c.trim()),
                            averageRating: parseFloat(document.getElementById('editRating').value) || 0
                        };
                        
                        if (type === 'movie') {
                            updatedData.dubLink = document.getElementById('editDubLink').value;
                            updatedData.legLink = document.getElementById('editLegLink').value;
                        }
                        
                        await db.collection(collection).doc(id).update(updatedData);
                        showToast('Conteúdo atualizado com sucesso!', 'success');
                        modal.remove();
                        loadAdminTab();
                    });
                }    
            } catch (error) {
                showToast('Erro ao carregar conteúdo para edição: ' + error.message, 'error');
            }
        }

        // Navigation Functions
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            
            switch(tabName) {
                case 'home':
                    loadHomeTab();
                    break;
                case 'catalog':
                    loadCatalogTab();
                    break;
                case 'admin':
                    loadAdminTab();
                    break;
            }
        }

        function updateAuthUI() {
            const userNameDisplay = document.getElementById('userNameDisplay');
            const logoutButton = document.getElementById('logoutButton');
            
            if (currentUser) {
                userNameDisplay.textContent = userData?.name || currentUser.email;
                logoutButton.textContent = 'Sair';
                logoutButton.onclick = () => {
                    auth.signOut();
                    showToast('Logout realizado com sucesso!', 'success');
                };
            } else {
                userNameDisplay.textContent = 'Visitante';
                logoutButton.textContent = 'Login';
                logoutButton.onclick = () => {
                    showToast('Sistema de login em desenvolvimento...', 'info');
                };
            }
        }

        // Initialize App
        async function initializeApp() {
            try {
                // Auto-login as owner for demo
                currentUser = { email: OWNER_EMAIL };
                userData = { name: 'Admin', email: OWNER_EMAIL };
                
                updateAuthUI();
                loadUserPreferences();
                loadHomeTab();
                
            } catch (error) {
                console.error('Error initializing app:', error);
                showToast('Erro ao inicializar aplicação', 'error');
                hideLoading();
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Setup navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const tabName = item.dataset.tab;
                    switchTab(tabName);
                });
            });

            // Modal close on overlay click
            document.getElementById('contentModal').addEventListener('click', (e) => {
                if (e.target.id === 'contentModal') {
                    closeModal();
                }
            });

            // Initialize app
            setTimeout(() => {
                initializeApp();
            }, 500);
        });

        // Firebase auth state listener
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            updateAuthUI();
        });
    </script>
</body>
</html>
