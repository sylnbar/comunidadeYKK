<script>
  const firebaseConfig = { apiKey: "AIzaSyCTnC0RGSWRcr2ehQGimK6nIra9H8NH8Ks", authDomain: "yk-comunidade.firebaseapp.com", projectId: "yk-comunidade", storageBucket: "yk-comunidade.appspot.com", messagingSenderId: "682166331452", appId: "1:682166331452:web:9e0e8553646d44060ebb39" };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(); const db = firebase.firestore(); const storage = firebase.storage();
  const MASTER_EMAIL = "joaodidier@proton.me";
  let currentUser = null, userData = null, isLogin = true;
  let userFavorites = new Set();
  let activeUploads = new Map(); // Para rastrear uploads ativos
  
  function showMessage(text, isError = true) { 
    const div = document.createElement('div'); 
    div.className = `error-toast ${!isError ? 'success-toast' : ''}`; 
    div.innerText = text; 
    document.body.appendChild(div); 
    setTimeout(() => div.remove(), 3000); 
  }
  
  // Função de upload MELHORADA com barra de progresso REAL
  async function uploadVideo(file, path, onProgress, onCancel) {
    if(!file) return null;
    const storageRef = storage.ref(path);
    const uploadTask = storageRef.put(file);
    const uploadId = Date.now() + Math.random();
    
    // Armazenar a tarefa para possível cancelamento
    activeUploads.set(uploadId, uploadTask);
    
    return new Promise((resolve, reject) => {
      uploadTask.on('state_changed',
        (snapshot) => {
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          const bytesTransferred = snapshot.bytesTransferred;
          const totalBytes = snapshot.totalBytes;
          const speed = snapshot.bytesTransferred / (Date.now() - (uploadTask.snapshot?.metadata?.timeCreated || Date.now())) * 1000;
          
          if(onProgress) {
            onProgress({
              progress: Math.round(progress),
              bytesTransferred,
              totalBytes,
              speed: speed > 0 ? (speed / (1024 * 1024)).toFixed(2) : 0
            });
          }
        },
        (error) => {
          activeUploads.delete(uploadId);
          console.error("Upload error:", error);
          reject(error);
        },
        async () => {
          activeUploads.delete(uploadId);
          const url = await uploadTask.snapshot.ref.getDownloadURL();
          resolve(url);
        }
      );
    });
  }
  
  function cancelUpload(uploadId) {
    const task = activeUploads.get(uploadId);
    if(task) {
      task.cancel();
      activeUploads.delete(uploadId);
      return true;
    }
    return false;
  }
  
  function formatFileSize(bytes) {
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if(bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }
  
  function updateAuthUI() { 
    const authFields = document.getElementById("authFields");
    if(isLogin){ 
      authFields.innerHTML=`<input type="email" id="loginEmail" placeholder="E-mail"><input type="password" id="loginPassword" placeholder="Senha">`; 
      document.getElementById("authBtn").innerText="Entrar"; 
      document.getElementById("switchMode").innerText="Criar nova conta"; 
    } else { 
      authFields.innerHTML=`<input type="text" id="signupName" placeholder="Nome"><input type="email" id="signupEmail" placeholder="E-mail"><input type="password" id="signupPassword" placeholder="Senha">`; 
      document.getElementById("authBtn").innerText="Cadastrar"; 
      document.getElementById("switchMode").innerText="Já tenho conta"; 
    }
  }
  
  document.getElementById("switchMode").onclick = () => { isLogin = !isLogin; updateAuthUI(); };
  document.getElementById("forgotPwd").onclick = async () => { 
    const email = prompt("Digite seu e-mail:"); 
    if(email) try{ await auth.sendPasswordResetEmail(email); showMessage("Email de recuperação enviado!", false); }catch(e){ showMessage("Erro ao enviar email"); } 
  };
  
  document.getElementById("authBtn").onclick = async () => {
    if(isLogin){

  function isNovidade(createdAtDate){ 
    if(!createdAtDate) return false; 
    const data = createdAtDate.toDate ? createdAtDate.toDate() : new Date(createdAtDate); 
    const diff = (new Date() - data)/(1000*3600*24); 
    return diff <= 7; 
  }

  // Função para criar o componente de upload com barra de progresso
  function createUploadComponent(type, label, onUrlReceived) {
    const container = document.createElement('div');
    container.className = 'upload-container';
    container.innerHTML = `
      <div class="upload-area">
        <div class="upload-label">📁 ${label}</div>
        <input type="file" class="upload-file-input" accept="video/mp4,video/webm,video/mkv" style="display:none;">
        <div class="file-name"></div>
        <div class="progress-bar-container" style="display:none;">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="upload-status" style="display:none;">
          <span class="status-text"></span>
          <button class="cancel-upload">Cancelar</button>
        </div>
        <input type="text" class="upload-link-input" placeholder="Ou cole um link aqui...">
      </div>
    `;
    
    const fileInput = container.querySelector('.upload-file-input');
    const uploadLabel = container.querySelector('.upload-label');
    const fileNameDiv = container.querySelector('.file-name');
    const progressBar = container.querySelector('.progress-bar-container');
    const progressFill = container.querySelector('.progress-bar-fill');
    const statusDiv = container.querySelector('.upload-status');
    const statusText = container.querySelector('.status-text');
    const cancelBtn = container.querySelector('.cancel-upload');
    const linkInput = container.querySelector('.upload-link-input');
    
    let currentUploadId = null;
    
    uploadLabel.onclick = () => fileInput.click();
    
    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      
      fileNameDiv.innerText = `📹 ${file.name} (${formatFileSize(file.size)})`;
      progressBar.style.display = 'block';
      statusDiv.style.display = 'flex';
      progressFill.style.width = '0%';
      statusText.innerText = '📤 Iniciando upload...';
      
      const path = `videos/${type}/${Date.now()}_${file.name.replace(/[^a-z0-9]/gi, '_')}`;
      
      try {
        const url = await uploadVideo(file, path, (progressData) => {
          progressFill.style.width = `${progressData.progress}%`;
          statusText.innerText = `📤 ${progressData.progress}% - ${formatFileSize(progressData.bytesTransferred)} / ${formatFileSize(progressData.totalBytes)} - ${progressData.speed} MB/s`;
        }, (uploadId) => { currentUploadId = uploadId; });
        
        if(url) {
          linkInput.value = url;
          progressBar.style.display = 'none';
          statusDiv.style.display = 'none';
          fileNameDiv.innerHTML = `✅ ${file.name} - Enviado!`;
          onUrlReceived(url);
        }
      } catch(error) {
        statusText.innerText = '❌ Falha no upload! Tente usar link.';
        console.error(error);
      }
    };
    
    cancelBtn.onclick = () => {
      if(currentUploadId && cancelUpload(currentUploadId)) {
        statusText.innerText = '⏹️ Upload cancelado';
        setTimeout(() => {
          progressBar.style.display = 'none';
          statusDiv.style.display = 'none';
        }, 2000);
      }
    };
    
    linkInput.onchange = () => {
      if(linkInput.value.trim()) {
        onUrlReceived(linkInput.value.trim());
      }
    };
    
    return container;
  }

  async function toggleFavorite(animeId) {
    if(!currentUser) { showMessage("Faça login para favoritar!"); return; }

    const favDoc = await favRef.get();
    let favorites = favDoc.exists && favDoc.data().animes ? favDoc.data().animes : [];

        epsHtml += `<div class="episode-item"><input class="edit-ep-name" value="${escapeHtml(ep.name)}" placeholder="Nome" style="flex:1;">
          <div class="audio-group">
            <div class="audio-input-group"><span class="audio-label">🎙️ DUB:</span><input class="edit-ep-dub" value="${escapeHtml(ep.dubLink || '')}" placeholder="Link" style="flex:2;"></div>
            <div class="audio-input-group"><span class="audio-label">📝 LEG:</span><input class="edit-ep-leg" value="${escapeHtml(ep.legLink || '')}" placeholder="Link" style="flex:2;"></div>
          </div>
          <input class="edit-ep-img" value="${escapeHtml(ep.imageUrl || '')}" placeholder="Imagem" style="flex:0.5;">
          <button class="remove-ep-edit" style="background:#a5426a; padding:4px 10px; border-radius:40px;">🗑</button></div>`;
      });
      seasonsHtml += `<div class="season-item" data-season="${seasonName}"><h4>📀 ${escapeHtml(seasonName)} <button class="remove-season-edit" style="background:#a5426a; padding:4px 12px; border-radius:40px;">🗑 Remover</button></h4><div class="season-episodes">${epsHtml}</div><button class="add-ep-in-season" style="background:#6a4c7c; padding:6px 12px; border-radius:40px; margin-top:10px;">+ Episódio</button></div>`;
    }
    modalDiv.innerHTML = `<div class="modal-detail" style="max-width:900px; width:95%; height:85vh;"><div class="modal-header"><h2>✏️ Editando: ${escapeHtml(item.title)}</h2><button class="close-modal" id="closeEditModal">✕</button></div><div class="modal-body"><input id="editTitle" value="${escapeHtml(item.title)}" placeholder="Título"><textarea id="editDesc" rows="3" placeholder="Descrição">${escapeHtml(item.description || '')}</textarea><div class="categories-checkbox-group"><strong>Categorias:</strong><br>${CATEGORIES.map(c => `<label><input type="checkbox" value="${c}" class="edit-cat-checkbox" ${currentCategories.includes(c) ? 'checked' : ''}> ${c}</label>`).join('')}</div><input id="editImage" value="${escapeHtml(item.imageUrl || '')}" placeholder="URL da capa (pôster 600x900)"><div id="editSeasonsContainer">${seasonsHtml || '<p>Nenhuma temporada</p>'}</div><button id="addSeasonEditBtn" class="add-season-btn">+ Nova Temporada</button><button id="saveEditBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); margin-top:20px; padding:14px; width:100%; border-radius:60px; border:none; color:white; font-weight:bold;">💾 SALVAR</button></div></div>`;
    document.body.appendChild(modalDiv);
    document.getElementById("closeEditModal").onclick = () => modalDiv.remove();
    modalDiv.onclick = (e) => { if(e.target === modalDiv) modalDiv.remove(); };
    function attachSeasonEvents(seasonDiv){
      seasonDiv.querySelector(".add-ep-in-season")?.addEventListener("click", () => {
        const epsDiv = seasonDiv.querySelector(".season-episodes");
        const newDiv = document.createElement('div'); newDiv.className = "episode-item";
        newDiv.innerHTML = `<input class="edit-ep-name" placeholder="Nome" style="flex:1;"><div class="audio-group"><div class="audio-input-group"><span class="audio-label">DUB:</span><input class="edit-ep-dub" placeholder="Link" style="flex:2;"></div><div class="audio-input-group"><span class="audio-label">LEG:</span><input class="edit-ep-leg" placeholder="Link" style="flex:2;"></div></div><input class="edit-ep-img" placeholder="Imagem" style="flex:0.5;"><button class="remove-ep-edit" style="background:#a5426a; padding:4px 10px;">🗑</button>`;
        newDiv.querySelector(".remove-ep-edit").onclick = () => newDiv.remove();
        epsDiv.appendChild(newDiv);
      });
      seasonDiv.querySelector(".remove-season-edit")?.addEventListener("click", () => seasonDiv.remove());
    }
    document.querySelectorAll(".season-item").forEach(attachSeasonEvents);
    document.getElementById("addSeasonEditBtn").onclick = () => {
      const newSeasonName = prompt("Nome da nova temporada:");
      if(!newSeasonName) return;
      const container = document.getElementById("editSeasonsContainer");
      const div = document.createElement('div'); div.className = "season-item";
      div.innerHTML = `<h4>📀 ${escapeHtml(newSeasonName)} <button class="remove-season-edit" style="background:#a5426a; padding:4px 12px;">🗑 Remover</button></h4><div class="season-episodes"><div class="episode-item"><input class="edit-ep-name" placeholder="Nome" style="flex:1;"><div class="audio-group"><div class="audio-input-group"><span class="audio-label">DUB:</span><input class="edit-ep-dub" placeholder="Link" style="flex:2;"></div><div class="audio-input-group"><span class="audio-label">LEG:</span><input class="edit-ep-leg" placeholder="Link" style="flex:2;"></div></div><input class="edit-ep-img" placeholder="Imagem" style="flex:0.5;"><button class="remove-ep-edit" style="background:#a5426a;">🗑</button></div></div><button class="add-ep-in-season" style="background:#6a4c7c; margin-top:10px;">+ Episódio</button>`;
      attachSeasonEvents(div);
      container.appendChild(div);
    };
    document.getElementById("saveEditBtn").onclick = async () => {
      const newTitle = document.getElementById("editTitle").value.trim();
      const newDesc = document.getElementById("editDesc").value;
      const selectedCats = Array.from(document.querySelectorAll(".edit-cat-checkbox:checked")).map(cb => cb.value);
      const newImg = document.getElementById("editImage").value;
      if(!newTitle) return showMessage("Título obrigatório!");
      if(selectedCats.length === 0) return showMessage("Selecione pelo menos uma categoria!");
      const newSeasons = {};
      const seasonDivs = document.querySelectorAll("#editSeasonsContainer .season-item");
      for(let sDiv of seasonDivs){
        let seasonName = sDiv.querySelector("h4")?.innerText.replace("📀 ", "").replace("🗑 Remover", "").trim();
        if(!seasonName) continue;
        const episodes = [];
        const epDivs = sDiv.querySelectorAll(".episode-item");
        for(let epDiv of epDivs){
          const epName = epDiv.querySelector(".edit-ep-name")?.value.trim();
          const dubLink = epDiv.querySelector(".edit-ep-dub")?.value.trim();
          const legLink = epDiv.querySelector(".edit-ep-leg")?.value.trim();
          const epImg = epDiv.querySelector(".edit-ep-img")?.value.trim();
          if(epName && (dubLink || legLink)) episodes.push({ name: epName, dubLink: dubLink || "", legLink: legLink || "", imageUrl: epImg || "" });
        }
        if(episodes.length) newSeasons[seasonName] = episodes;
      }
      await db.collection(item.type).doc(item.id).update({ title: newTitle, description: newDesc, categories: selectedCats, imageUrl: newImg, seasons: newSeasons, updatedAt: new Date() });
      showMessage("✅ Atualizado!", false);
      modalDiv.remove();
      loadEditMode();
    };
  }
  
  async function loadFavoritos(){
    if(!currentUser) { document.getElementById("content").innerHTML = "<div class='admin-form'>Faça login</div>"; return; }
    const favDoc = await db.collection("favoritos").doc(currentUser.uid).get();
    const favoriteIds = favDoc.exists && favDoc.data().animes ? favDoc.data().animes : [];
    if(favoriteIds.length === 0){ document.getElementById("content").innerHTML = `<div class="admin-form"><h3>⭐ Favoritos</h3><div class="empty-favorites">💔 Nenhum favorito ainda.<br>Clique no ❤️ nos cards para adicionar!</div></div>`; return; }
    let allItems = [];
    for(const type of ["animes", "mangas"]){ const snap = await db.collection(type).get(); snap.forEach(doc => { if(favoriteIds.includes(doc.id)) allItems.push({ id: doc.id, ...doc.data(), type }); }); }
    let html = `<div class="admin-form"><h3>⭐ Seus Favoritos (${allItems.length})</h3><div class="anime-grid">` + allItems.map(item => `<div class="anime-card" data-item='${JSON.stringify(item).replace(/'/g, "&#39;")}'><div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div><div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c=>`<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div><div class="watch-btn">🎬 ${item.seasons ? Object.keys(item.seasons).length : 0} temporada(s)</div></div></div>`).join('') + `</div></div>`;
    document.getElementById("content").innerHTML = html;
    document.querySelectorAll(".anime-card").forEach(card => { card.addEventListener("click", (e) => { const raw = card.getAttribute("data-item"); if(raw) openDetailModal(JSON.parse(raw)); }); });
  }
  
  async function loadAvisos(){
    const snap = await db.collection("avisos").orderBy("createdAt", "desc").get();
    let avisos = []; 
    snap.forEach(d => avisos.push({ id: d.id, ...d.data() }));
    
    let html = `<div class="admin-form">
      <h3>📢 Central de Avisos</h3>`;
    
    if(userData?.isAdmin){
      html += `<textarea id="newAvisoMsg" rows="3" placeholder="Escreva um novo aviso..." style="width:100%; background:#251f36; border-radius:20px; padding:12px; margin-bottom:10px;"></textarea>
      <button id="postAvisoBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); padding:10px 24px; border-radius:60px; border:none; color:white; font-weight:bold; cursor:pointer;">📢 Publicar Aviso</button>
      <hr style="margin:20px 0; border-color:#333;">`;
    }
    
    html += `<div id="avisosList">`;
    if(avisos.length === 0){
      html += `<p style="text-align:center; padding:20px;">Nenhum aviso ainda. Seja o primeiro a publicar!</p>`;
    } else {
      avisos.forEach(a => {
        html += `<div class="announcement-card">
          <strong>📣 ${escapeHtml(a.authorName)}</strong> <small>${a.createdAt?.toDate?.().toLocaleString() || 'agora'}</small>
          <p style="margin-top:8px;">${escapeHtml(a.message)}</p>
          ${userData?.isAdmin ? `<button class="deleteAvisoBtn" data-id="${a.id}" style="background:#a5426a; border:none; border-radius:40px; padding:4px 12px; margin-top:8px; cursor:pointer;">🗑 Remover</button>` : ''}
        </div>`;
      });
    }
    html += `</div></div>`;
    
    document.getElementById("content").innerHTML = html;
    
    if(userData?.isAdmin){
      const postBtn = document.getElementById("postAvisoBtn");
      if(postBtn){
        postBtn.onclick = async () => {
          const msg = document.getElementById("newAvisoMsg").value.trim();
          if(!msg) return showMessage("Digite uma mensagem para o aviso!");
          try {
            await db.collection("avisos").add({ 
              message: msg, 
              authorName: userData.name, 
              authorId: currentUser.uid, 
              createdAt: new Date() 
            });
            showMessage("✅ Aviso publicado com sucesso!", false);
            document.getElementById("newAvisoMsg").value = "";
            loadAvisos();
          } catch(e) {
            showMessage("Erro ao publicar aviso: " + e.message);
          }
        };
      }
      
      document.querySelectorAll(".deleteAvisoBtn").forEach(btn => {
        btn.onclick = async () => {
          if(confirm("Remover este aviso?")){
            await db.collection("avisos").doc(btn.dataset.id).delete();
            showMessage("🗑 Aviso removido!", false);
            loadAvisos();
          }
        };
      });
    }
  }
  
  async function loadAdminPanel(){
    if(!userData?.isAdmin){ 
      document.getElementById("content").innerHTML="<div class='admin-form'>🔒 Acesso restrito a administradores</div>"; 
      return; 
    }
    
    const usersSnapshot = await db.collection("users").get();
    let usersList = [];
    usersSnapshot.forEach(doc => {
      usersList.push({ id: doc.id, ...doc.data() });
    });
    
    let html = `<div class="admin-form">
      <h3>👥 Gerenciar Administradores</h3>
      <p style="margin-bottom:15px; color:#aaa;">Abaixo estão todos os usuários cadastrados. Promova qualquer um para Admin clicando no botão.</p>`;
    
    if(usersList.length === 0){
      html += `<p>Nenhum usuário encontrado.</p>`;
    } else {
      usersList.forEach(u => {
        html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:#1f1830; margin:8px 0; border-radius:28px;">
          <div><strong>${escapeHtml(u.name)}</strong><br><small>${u.email}</small></div>
          ${!u.isAdmin && u.email !== MASTER_EMAIL ? 
            `<button class="promote-btn" data-uid="${u.id}" style="background:#ff5a8a; border:none; border-radius:40px; padding:6px 16px; cursor:pointer;">🌸 Promover a Admin</button>` : 
            u.isAdmin ? "<span style='color:#ff5a8a;'>✅ Administrador</span>" : "<span style='color:#888;'>Usuário comum</span>"}
        </div>`;
      });
    }
    
    html += `<hr style="margin:20px 0;"><h3>✨ Informações do Sistema</h3>
      <p>📹 Upload de vídeos com BARRA DE PROGRESSO REAL!</p>
      <p>📹 Suporte a UPLOAD de arquivos de vídeo para DUBLADO e LEGENDADO</p>
      <p>🖼️ Pôsteres verticais 2:3 (600x900) - estilo Crunchyroll</p>
      <p>⭐ Sistema de favoritos funcionando</p>
      <p>✏️ Edição completa de obras</p>
      <p>📢 Canal de avisos funcionando</p>
      <p>👑 Gerencie administradores aqui</p>
      <p>🚀 Upload com barra de progresso, velocidade e opção de cancelar!</p>
    </div>`;
    
    document.getElementById("content").innerHTML = html;
    
    document.querySelectorAll(".promote-btn").forEach(btn => {
      btn.onclick = async () => {
        try {
          await db.collection("users").doc(btn.dataset.uid).update({ isAdmin: true });
          showMessage("✅ Usuário promovido a administrador!", false);
          loadAdminPanel();
        } catch(e) {
          showMessage("Erro ao promover: " + e.message);
        }
      };
    });
  }
</script>
