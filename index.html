<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>YK Server · Animes & Games</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui;
      background: radial-gradient(circle at 10% 20%, #0f0b1a, #08050f);
      color: white;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e1a2a; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 5px rgba(255,90,138,0.3); } 50% { box-shadow: 0 0 25px rgba(255,90,138,0.7); } }

    .toast.success { background: #4caf50; }
    .login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 20%, #1a0f2e, #0a0512);
      display: flex; justify-content: center; align-items: center; z-index: 100; padding: 16px;
    }
    .login-card {
      background: rgba(30,22,45,0.8); backdrop-filter: blur(20px); padding: 40px;
      border-radius: 56px; width: 380px; max-width: 90%; border: 1px solid rgba(255,90,138,0.4);
      text-align: center; transition: 0.3s; animation: fadeInUp 0.5s ease;
    }
    .login-card h2 { margin-bottom: 20px; background: linear-gradient(135deg,#ff90b5,#ff5a8a); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 32px; }
    .login-card input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(42,34,59,0.8); border: 1px solid rgba(255,90,138,0.3); border-radius: 60px; color: white; font-size: 14px; outline: none; }
    .login-card input:focus { border-color: #ff5a8a; box-shadow: 0 0 10px rgba(255,90,138,0.3); }
    .login-card button { width: 100%; padding: 12px; background: linear-gradient(135deg,#ff5a8a,#ff3366); border: none; border-radius: 60px; color: white; font-weight: bold; cursor: pointer; margin-top: 12px; transition: 0.3s; }
    .login-card button:hover { transform: scale(1.02); }
    .login-card .switch { margin-top: 20px; color: #ccb0e0; cursor: pointer; font-size: 13px; }
    .app { display: none; min-height: 100vh; flex-direction: column; }
    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0512; display: flex; justify-content: center; align-items: center;
      z-index: 99; flex-direction: column; gap: 20px;
    }
    .loading-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,90,138,0.3); border-top: 4px solid #ff5a8a; border-radius: 50%; animation: spin 1s linear infinite; }
    .top-bar {
      background: rgba(19,14,28,0.85); backdrop-filter: blur(12px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 32px; border-bottom: 1px solid rgba(255,90,138,0.3);
      position: sticky; top: 0; z-index: 50;
    }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .yk-logo {
      width: 50px; height: 50px; border-radius: 25px;
      background: url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover no-repeat;
      background-color: #ff5a8a; box-shadow: 0 0 20px rgba(255,90,138,0.6);
      animation: pulseGlow 2s ease infinite;
    }
    .top-bar h1 { font-size: 22px; background: linear-gradient(135deg,#ff90b5,#ff5a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .user-info { display: flex; gap: 20px; align-items: center; }
    .logout-btn { background: transparent; border: 1px solid #ff7aa8; padding: 6px 20px; border-radius: 40px; cursor: pointer; color: #ff90b5; }
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 250px; background: rgba(17,12,28,0.7); backdrop-filter: blur(8px);
      padding: 28px 16px; border-right: 1px solid rgba(255,90,138,0.2);
    }
    .nav-item {
      padding: 12px 18px; margin: 8px 0; cursor: pointer; border-radius: 40px;
      transition: 0.3s; font-weight: 600; color: #e2ccee;
    }
    .nav-item:hover { background: rgba(255,90,138,0.2); transform: translateX(8px); }
    .nav-item.active { background: linear-gradient(135deg,#ff5a8a,#ff3366); color: white; }
    .content-area { flex: 1; overflow-y: auto; padding: 28px; background: rgba(8,5,15,0.6); }
    .mobile-menu-btn { display: none; background: rgba(255,90,138,0.2); border: 1px solid rgba(255,90,138,0.5); border-radius: 12px; padding: 10px; cursor: pointer; font-size: 20px; }
    .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90; }
    .anime-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }
    @media (max-width: 1600px) { .anime-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1400px) { .anime-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1100px) { .anime-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      .top-bar { padding: 8px 16px; }
      .top-bar h1 { font-size: 14px; }
      .yk-logo { width: 36px; height: 36px; }
      .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; z-index: 100; transform: translateX(-100%); background: rgba(17,12,28,0.98); padding-top: 70px; }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: block; }
      .mobile-overlay.active { display: block; }
      .main-layout { flex-direction: column; }
      .content-area { padding: 16px; }
      .anime-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
    .anime-card {
      background: rgba(23,17,38,0.9); border-radius: 20px; overflow: hidden;
      transition: 0.3s; cursor: pointer; border: 1px solid rgba(255,90,138,0.3);
      display: flex; flex-direction: column; position: relative;
    }
    .anime-card:hover { transform: translateY(-8px) scale(1.02); border-color: #ff5a8a; box-shadow: 0 20px 30px -12px rgba(255,90,138,0.5); }
    .anime-card .anime-image { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #1a1530; }
    .anime-card .anime-image img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .anime-card:hover .anime-image img { transform: scale(1.08); }
    .card-content { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .card-content h3 { font-size: 15px; margin-bottom: 6px; color: #ffc0dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .categories-wrapper { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .category-badge { font-size: 11px; background: linear-gradient(135deg, rgba(79,58,108,0.9), rgba(55,40,80,0.9)); padding: 4px 10px; border-radius: 30px; color: #ffcfdf; }
    .rating-stars { display: flex; align-items: center; gap: 4px; margin: 8px 0 4px; font-size: 14px; }
    .star-filled { color: #ffcc00; }
    .star-empty { color: #555; }
    .rating-value { font-size: 11px; margin-left: 6px; color: #ffc0dd; }
    .watch-btn { margin-top: 8px; padding: 6px; background: linear-gradient(135deg,#ff5a8a,#ff3366); text-align: center; border-radius: 30px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .favorite-btn-overlay {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
      border-radius: 30px; padding: 5px 8px; cursor: pointer; font-size: 14px;
      z-index: 10; opacity: 0; transition: 0.3s;
    }
    .anime-card:hover .favorite-btn-overlay { opacity: 1; }
    .favorite-btn-overlay.active { opacity: 1; background: #ff5a8a; }
    .novidade-badge {
      position: absolute; top: 8px; left: 8px;
      background: linear-gradient(135deg,#ff5a8a,#ff3366);
      padding: 3px 10px; border-radius: 30px; font-size: 9px; font-weight: bold;
      animation: pulseGlow 1.5s infinite;
    }
    .admin-form { background: rgba(22,16,41,0.9); border-radius: 28px; padding: 24px; margin-bottom: 32px; border: 1px solid rgba(255,90,138,0.3); }
    .admin-form input, .admin-form textarea { width: 100%; padding: 12px; margin: 8px 0; background: #251f36; border: 1px solid rgba(255,90,138,0.3); border-radius: 24px; color: white; }
    .categories-checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; padding: 12px; background: rgba(37,31,54,0.6); border-radius: 24px; }
    .categories-checkbox-group label { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .season-item { background: rgba(31,24,48,0.8); padding: 18px; border-radius: 24px; margin-bottom: 18px; }
    .episode-item { background: rgba(42,35,64,0.8); padding: 12px; border-radius: 20px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search-bar { background: rgba(26,19,41,0.8); border-radius: 60px; padding: 8px 20px; margin-bottom: 20px; border: 1px solid rgba(255,90,138,0.3); }
    .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 14px; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
    .filter-chip { background: rgba(31,24,48,0.8); padding: 6px 18px; border-radius: 40px; font-size: 12px; cursor: pointer; color: #e2ccee; }
    .filter-chip.active { background: linear-gradient(135deg,#ff5a8a,#ff3366); color: white; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 200; visibility: hidden; opacity: 0; transition: 0.2s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-detail { background: #1c152e; width: 95vw; max-width: 1300px; height: 90vh; border-radius: 48px; display: flex; flex-direction: column; border: 1px solid #ff7aa8; overflow: hidden; }
    .modal-header { padding: 18px 25px; border-bottom: 1px solid rgba(255,90,138,0.3); display: flex; justify-content: space-between; background: rgba(28,21,46,0.9); }
    .modal-header h2 { color: #ff8ab5; font-size: 24px; }
    .close-modal { background: none; border: none; font-size: 32px; color: #ffb0cc; cursor: pointer; }
    .modal-body { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
    .player-container { background: #000; border-radius: 24px; overflow: hidden; aspect-ratio: 16/9; width: 100%; }
    .player-container video, .player-container iframe { width: 100%; height: 100%; border: none; }
    .episode-nav { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
    .nav-btn { background: linear-gradient(135deg,#ff5a8a,#ff3366); border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; }
    .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .audio-selector { display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 40px; }
    .audio-option { background: #2f234b; border: none; padding: 5px 15px; border-radius: 30px; color: white; cursor: pointer; }
    .audio-option.active { background: #ff5a8a; }
    .episode-info { background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 40px; font-size: 14px; }
    .episodes-list-modal { display: flex; flex-wrap: wrap; gap: 10px; max-height: 200px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 24px; }
    .episode-thumb { background: #2f234b; padding: 8px 12px; border-radius: 30px; cursor: pointer; font-size: 13px; }
    .episode-thumb:hover, .episode-thumb.active-ep { background: #ff5a8a; }
    .modal-top { display: flex; flex-wrap: wrap; gap: 25px; margin-bottom: 20px; }
    .modal-image { flex: 0 0 200px; }
    .modal-image img { width: 100%; border-radius: 16px; }
    .modal-categories { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .modal-cat { background: rgba(255,90,138,0.2); padding: 5px 16px; border-radius: 60px; font-size: 13px; }
    .modal-desc { background: rgba(15,11,28,0.8); padding: 16px; border-radius: 24px; line-height: 1.5; font-size: 14px; }
    .modal-rating { margin: 12px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .star-rating-select { display: flex; gap: 8px; cursor: pointer; }
    .star-select { font-size: 32px; color: #555; transition: 0.2s; }
    .star-select:hover { color: #ffcc00; transform: scale(1.2); }
    .season-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; border-bottom: 1px solid rgba(255,90,138,0.3); padding-bottom: 12px; }
    .season-tab { background: #2f234b; padding: 6px 20px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .season-tab.active { background: linear-gradient(135deg,#ff5a8a,#ff3366); color: white; }
    .inicio-card { background: rgba(23,17,38,0.8); border-radius: 48px; padding: 36px; text-align: center; }
    .btn-sugestao { background: linear-gradient(135deg,#ff5a8a,#ff3366); padding: 12px 28px; border-radius: 80px; border: none; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
    .add-season-btn, .add-ep-btn-season { background: #6a4c7c; padding: 8px 16px; border-radius: 40px; border: none; color: white; cursor: pointer; font-size: 12px; margin-top: 10px; }
    .remove-season-btn, .remove-ep { background: #a5426a; padding: 4px 12px; border-radius: 40px; border: none; color: white; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>🌸 YK Server 🌸</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="password" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <div id="switchMode" class="switch">Criar nova conta</div>
    <div id="forgotBtn" class="switch">Esqueceu a senha?</div>
  </div>
</div>
<div id="loadingScreen" class="loading-screen" style="display:none;">
  <div class="loading-spinner"></div>
  <p>Carregando YK Server...</p>
</div>
<div id="app" class="app">
  <div class="top-bar">
    <div class="logo-area">
      <div class="mobile-menu-btn" id="mobileMenuBtn">☰</div>
      <div class="yk-logo"></div>
      <h1>✦ YK Server · Animes & Games ✦</h1>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <button class="logout-btn" id="logoutBtn">Sair</button>
    </div>
  </div>
  <div class="main-layout">
    <div class="sidebar" id="sidebar">
      <div class="nav-item" data-tab="inicio">🏠 Início</div>
      <div class="nav-item" data-tab="animes">📺 Animes</div>
      <div class="nav-item" data-tab="mangas">📚 Mangás</div>
      <div class="nav-item" data-tab="favoritos">⭐ Favoritos</div>
      <div class="nav-item" data-tab="continuar">⏯️ Continuar</div>
      <div class="nav-item" data-tab="edit" id="editTab" style="display:none;">✏️ Editar</div>
      <div class="nav-item" data-tab="avisos">📢 Avisos</div>
      <div class="nav-item" data-tab="admin" id="adminTab" style="display:none;">👑 Admin</div>
    </div>
    <div class="content-area" id="content"></div>
  </div>
</div>
<div id="mobileOverlay" class="mobile-overlay"></div>
<div id="detailModal" class="modal-overlay"><div class="modal-detail"><div class="modal-header"><h2>📘 Ficha completa</h2><button class="close-modal" id="closeModalBtn">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>

<script>
  // ==================== FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyCTnC0RGSWRcr2ehQGimK6nIra9H8NH8Ks",
    authDomain: "yk-comunidade.firebaseapp.com",
    projectId: "yk-comunidade",
    storageBucket: "yk-comunidade.appspot.com",
    messagingSenderId: "682166331452",
    appId: "1:682166331452:web:9e0e8553646d44060ebb39"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const MASTER_EMAIL = "joaodidier@proton.me";

  let currentUser = null;
  let userData = null;
  let isLogin = true;
  let userFavorites = new Set();

  // ==================== UTILITÁRIOS ====================
  function showMessage(text, isError = true) {
    const div = document.createElement('div');
    div.className = `toast ${!isError ? 'success' : ''}`;
    div.innerText = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function getItemCategories(item) { return item.categories && Array.isArray(item.categories) ? item.categories : (item.category ? [item.category] : []); }
  function isNovidade(date) { if(!date) return false; const d = date.toDate ? date.toDate() : new Date(date); return (new Date()-d)/(1000*3600*24) <= 7; }

  // ==================== AVALIAÇÕES ====================
  async function getAverageRating(animeId) {
    try { const snap = await db.collection("avaliacoes").where("animeId", "==", animeId).get(); let total=0,count=0; snap.forEach(d=>{total+=d.data().nota; count++;}); return count>0?(total/count).toFixed(1):null; } catch(e){return null;}
  }
  async function getUserRating(animeId, userId) { if(!userId) return null; try{ const doc = await db.collection("avaliacoes").doc(`${animeId}_${userId}`).get(); return doc.exists?doc.data().nota:null; }catch(e){return null;} }
  async function setRating(animeId, nota) { if(!currentUser){ showMessage("Faça login para avaliar!"); return false; } try{ await db.collection("avaliacoes").doc(`${animeId}_${currentUser.uid}`).set({ animeId, userId: currentUser.uid, nota, createdAt: new Date() }); showMessage(`⭐ Avaliação ${nota} estrela${nota>1?'s':''} salva!`, false); return true; }catch(e){ showMessage("Erro: "+e.message); return false; } }
  function renderStars(rating, interactive=false, onClick=null){
    const full=Math.floor(rating);
    let html='';
    for(let i=1;i<=5;i++){
      let cls='star-empty';
      if(i<=full) cls='star-filled';
      if(interactive) html+=`<span class="star-select" data-value="${i}">★</span>`;
      else html+=`<span class="${cls}">★</span>`;
    }
    if(interactive){
      const div=document.createElement('div'); div.className='star-rating-select'; div.innerHTML=html;
      div.querySelectorAll('.star-select').forEach(s=>{ s.addEventListener('click', async e=>{ e.stopPropagation(); const v=parseInt(s.dataset.value); if(onClick) await onClick(v); }); });
      return div;
    } else return `<div class="rating-stars">${html}<span class="rating-value">(${rating})</span></div>`;
  }

  // ==================== FAVORITOS ====================
  async function loadUserFavorites() { if(!currentUser) return; try{ const s=await db.collection("favoritos").doc(currentUser.uid).get(); userFavorites=new Set(s.exists&&s.data().animes?s.data().animes:[]); }catch(e){} }
  async function toggleFavorite(id) { if(!currentUser){ showMessage("Login necessário"); return; } const ref=db.collection("favoritos").doc(currentUser.uid); const doc=await ref.get(); let arr=doc.exists&&doc.data().animes?doc.data().animes:[]; if(userFavorites.has(id)){ arr=arr.filter(i=>i!==id); userFavorites.delete(id); showMessage("❤️ Removido dos favoritos!", false); }else{ arr.push(id); userFavorites.add(id); showMessage("✨ Adicionado aos favoritos!", false); } await ref.set({ animes:arr, userId:currentUser.uid, updatedAt:new Date() }); }

  // ==================== CONTINUAR ASSISTINDO ====================
  async function saveProgress(animeId, seasonName, episodeIndex, currentTime, audioType) { if(!currentUser) return; await db.collection("progresso").doc(`${currentUser.uid}_${animeId}`).set({ userId: currentUser.uid, animeId, seasonName, episodeIndex, currentTime, audioType, updatedAt: new Date() }, { merge: true }); }
  async function getProgress(animeId) { if(!currentUser) return null; const doc = await db.collection("progresso").doc(`${currentUser.uid}_${animeId}`).get(); return doc.exists ? doc.data() : null; }

  // ==================== MOBILE MENU ====================
  function isMobile(){ return window.innerWidth<=768; }
  let sidebarOpen=false;
  const sidebarEl=document.getElementById('sidebar'), mobileMenuBtn=document.getElementById('mobileMenuBtn'), mobileOverlay=document.getElementById('mobileOverlay');
  function toggleSidebar(){ if(isMobile()){ sidebarOpen=!sidebarOpen; sidebarEl.classList.toggle('open',sidebarOpen); mobileOverlay.classList.toggle('active',sidebarOpen); } }
  function closeSidebar(){ if(isMobile()){ sidebarOpen=false; sidebarEl.classList.remove('open'); mobileOverlay.classList.remove('active'); } }
  if(mobileMenuBtn) mobileMenuBtn.onclick=e=>{ e.stopPropagation(); toggleSidebar(); };
  if(mobileOverlay) mobileOverlay.onclick=closeSidebar;
  function attachNavEvents(){ document.querySelectorAll(".nav-item").forEach(el=>{ el.onclick=()=>{ loadTab(el.dataset.tab); document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active")); el.classList.add("active"); closeSidebar(); }; }); }

  const CATEGORIES = ["Ação","Comédia","Drama","Shounen","Isekai","Romance","Fantasia","Terror","Esportes","Mecha","Slice of Life","Shoujo","Aventura","Suspense","Psicológico"];

  async function loadTab(tab){
    if(tab==="inicio") await loadInicio();
    else if(tab==="animes") await loadMedia("animes");
    else if(tab==="mangas") await loadMedia("mangas");
    else if(tab==="favoritos") await loadFavoritos();
    else if(tab==="continuar") await loadContinuar();
    else if(tab==="edit" && userData?.isAdmin) await loadEditMode();
    else if(tab==="avisos") await loadAvisos();
    else if(tab==="admin") await loadAdminPanel();
  }

  // ==================== LOAD MEDIA ====================
  async function loadMedia(type){
    const content=document.getElementById("content");
    const snap=await db.collection(type).get();
    let items=[]; snap.forEach(d=>items.push({id:d.id,...d.data(),type}));
    items.sort((a,b)=>(b.createdAt?.toDate?.()||0)-(a.createdAt?.toDate?.()||0));
    
    let html=`<div class="search-bar"><input type="text" id="searchInput" placeholder="🔎 Pesquisar..."></div><div class="filter-bar"><div class="filter-chip active" data-cat="Todos">Todos</div>${CATEGORIES.map(c=>`<div class="filter-chip" data-cat="${c}">${c}</div>`).join('')}</div>`;
    html+=`<div class="anime-grid" id="mediaGrid"></div>`;
    content.innerHTML=html;
    
    let currentFilter="Todos", searchTerm="";
    async function renderGrid(list,filter,search){
      let filtered=list;
      if(filter!=="Todos") filtered=list.filter(i=>getItemCategories(i).includes(filter));
      if(search) filtered=filtered.filter(i=>i.title.toLowerCase().includes(search.toLowerCase()));
      const grid=document.getElementById("mediaGrid");
      if(!grid) return;
      if(!filtered.length){ grid.innerHTML="<div style='text-align:center;padding:40px;'>Nenhum resultado</div>"; return; }
      const ratings=new Map();
      for(let i of filtered){ const avg=await getAverageRating(i.id); if(avg) ratings.set(i.id,avg); }
      grid.innerHTML=filtered.map(item=>{ 
        const isFav=userFavorites.has(item.id); 
        const avgR=ratings.get(item.id); 
        const stars=avgR?renderStars(parseFloat(avgR),false):'<div class="rating-stars">☆☆☆☆☆</div>'; 
        return `<div class="anime-card" data-item='${JSON.stringify(item).replace(/'/g,"&#39;")}'>${isNovidade(item.createdAt)?'<div class="novidade-badge">✨ NOVIDADE</div>':''}<button class="favorite-btn-overlay ${isFav?'active':''}" data-id="${item.id}">${isFav?'❤️':'🤍'}</button><div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div><div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c=>`<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div>${stars}<div class="watch-btn">🎬 ${item.seasons?Object.keys(item.seasons).length:0} temporada(s)</div></div></div>`; 
      }).join('');
      document.querySelectorAll(".anime-card").forEach(c=>c.addEventListener("click",(e)=>{ if(e.target.classList.contains("favorite-btn-overlay")) return; const raw=c.dataset.item; if(raw) openDetailModal(JSON.parse(raw)); }));
      document.querySelectorAll(".favorite-btn-overlay").forEach(btn=>{ btn.onclick=async e=>{ e.stopPropagation(); await toggleFavorite(btn.dataset.id); await loadUserFavorites(); renderGrid(list,filter,searchTerm); }; });
    }
    document.querySelectorAll(".filter-chip").forEach(chip=>{ chip.onclick=()=>{ currentFilter=chip.dataset.cat; document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active")); chip.classList.add("active"); renderGrid(items,currentFilter,searchTerm); }; });
    document.getElementById("searchInput")?.addEventListener("input",e=>{ searchTerm=e.target.value.toLowerCase(); renderGrid(items,currentFilter,searchTerm); });
    await renderGrid(items,"Todos","");
  }

  // ==================== MODAL COM PLAYER ====================
  async function openDetailModal(item, savedProgress = null){
    const modal=document.getElementById("detailModal");
    const modalBody=document.getElementById("modalBody");
    const seasons=item.seasons||{};
    const seasonNames=Object.keys(seasons);
    let currentSeason=seasonNames[0]||"";
    let currentEpisodeIndex=0;
    let currentAudioType="dub";
    let episodesList=currentSeason? (seasons[currentSeason]||[]) : [];
    let currentEpisode=episodesList[currentEpisodeIndex]||null;

    if(savedProgress){
      currentSeason = savedProgress.seasonName;
      currentEpisodeIndex = savedProgress.episodeIndex;
      currentAudioType = savedProgress.audioType || "dub";
      episodesList = seasons[currentSeason] || [];
      currentEpisode = episodesList[currentEpisodeIndex] || null;
    } else if(currentUser){
      const prog = await getProgress(item.id);
      if(prog && seasons[prog.seasonName] && seasons[prog.seasonName][prog.episodeIndex]){
        currentSeason = prog.seasonName;
        currentEpisodeIndex = prog.episodeIndex;
        currentAudioType = prog.audioType || "dub";
        episodesList = seasons[currentSeason] || [];
        currentEpisode = episodesList[currentEpisodeIndex] || null;
      }
    }

    function getPlayerHtml(url){
      if(!url) return `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#000;color:#fff;">Vídeo indisponível</div>`;
      if(url.includes("youtube.com/watch") || url.includes("youtu.be")){
        let videoId="";
        if(url.includes("youtu.be")) videoId=url.split("/").pop().split("?")[0];
        else if(url.includes("watch?v=")) videoId=url.split("watch?v=")[1].split("&")[0];
        return `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
      } else {
        return `<video controls src="${url}" style="width:100%;height:100%;"></video>`;
      }
    }

    function loadEpisode(){
      if(!currentEpisode) return;
      const url = currentAudioType==="dub" ? currentEpisode.dubLink : currentEpisode.legLink;
      const playerDiv = document.getElementById("playerContainer");
      if(playerDiv) playerDiv.innerHTML = getPlayerHtml(url);
      const video = playerDiv?.querySelector("video");
      if(video){
        video.addEventListener("timeupdate", async () => {
          if(currentUser && video.currentTime > 0){
            await saveProgress(item.id, currentSeason, currentEpisodeIndex, video.currentTime, currentAudioType);
          }
        });
        if(savedProgress?.currentTime) video.currentTime = savedProgress.currentTime;
      }
      const epInfoDiv = document.getElementById("episodeInfo");
      if(epInfoDiv) epInfoDiv.innerText = `${currentEpisode.name} (${currentAudioType==="dub"?"Dublado":"Legendado"})`;
      document.querySelectorAll(".episode-thumb").forEach((el,idx)=>{
        if(idx===currentEpisodeIndex) el.classList.add("active-ep");
        else el.classList.remove("active-ep");
      });
      const prevBtn=document.getElementById("prevEpisodeBtn");
      const nextBtn=document.getElementById("nextEpisodeBtn");
      if(prevBtn) prevBtn.disabled = (currentEpisodeIndex===0);
      if(nextBtn) nextBtn.disabled = (currentEpisodeIndex===episodesList.length-1);
    }

    function changeSeason(seasonName){
      currentSeason=seasonName;
      episodesList=seasons[seasonName]||[];
      currentEpisodeIndex=0;
      currentEpisode=episodesList[0];
      const episodesListDiv = document.getElementById("episodesListModal");
      if(episodesListDiv){
        episodesListDiv.innerHTML = episodesList.map((ep,idx)=>`<div class="episode-thumb ${idx===0?'active-ep':''}" data-ep-index="${idx}">${escapeHtml(ep.name)}</div>`).join('');
        episodesListDiv.querySelectorAll(".episode-thumb").forEach(el=>{
          el.addEventListener("click",()=>{
            currentEpisodeIndex=parseInt(el.dataset.epIndex);
            currentEpisode=episodesList[currentEpisodeIndex];
            loadEpisode();
            updateAudioSelector();
          });
        });
      }
      loadEpisode();
    }

    function updateAudioSelector(){
      const hasDub = currentEpisode?.dubLink;
      const hasLeg = currentEpisode?.legLink;
      const audioDiv = document.getElementById("audioSelector");
      if(audioDiv){
        audioDiv.innerHTML = `
          ${hasDub ? `<button class="audio-option ${currentAudioType==='dub'?'active':''}" data-audio="dub">🎙️ DUB</button>` : ''}
          ${hasLeg ? `<button class="audio-option ${currentAudioType==='leg'?'active':''}" data-audio="leg">📝 LEG</button>` : ''}
        `;
        audioDiv.querySelectorAll(".audio-option").forEach(btn=>{
          btn.addEventListener("click",()=>{
            currentAudioType = btn.dataset.audio;
            loadEpisode();
            audioDiv.querySelectorAll(".audio-option").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
          });
        });
      }
    }

    const avgRating = await getAverageRating(item.id);
    const userRating = currentUser ? await getUserRating(item.id, currentUser.uid) : null;
    let starsSelectHtml='';
    if(currentUser){
      const selectContainer = renderStars(userRating||0, true, async (val)=>{ await setRating(item.id,val); openDetailModal(item); });
      const wrapper=document.createElement('div'); wrapper.className='modal-rating'; wrapper.innerHTML='<strong>Sua nota:</strong>'; wrapper.appendChild(selectContainer);
      starsSelectHtml=wrapper.outerHTML;
    }

    modalBody.innerHTML = `
      <div class="modal-top">
        <div class="modal-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div>
        <div class="modal-info">
          <h3>${escapeHtml(item.title)}</h3>
          <div class="modal-categories">${getItemCategories(item).map(c=>`<span class="modal-cat">🎭 ${escapeHtml(c)}</span>`).join('')}</div>
          <div class="modal-desc">${escapeHtml(item.description||"Sem descrição.").replace(/\n/g,'<br>')}</div>
          ${starsSelectHtml}
          <div class="modal-rating"><strong>Média geral:</strong> ${avgRating ? renderStars(parseFloat(avgRating), false) : 'Sem avaliações'}</div>
        </div>
      </div>
      <div class="player-container" id="playerContainer"></div>
      <div class="episode-nav">
        <button class="nav-btn" id="prevEpisodeBtn" ${episodesList.length===0 ? 'disabled' : ''}>◀ Anterior</button>
        <div class="episode-info" id="episodeInfo">${currentEpisode ? `${currentEpisode.name} (${currentAudioType==="dub"?"Dublado":"Legendado"})` : 'Nenhum episódio'}</div>
        <div id="audioSelector" class="audio-selector"></div>
        <button class="nav-btn" id="nextEpisodeBtn" ${episodesList.length===0 ? 'disabled' : ''}>Próximo ▶</button>
      </div>
      <div>
        <div class="season-tabs" id="seasonTabs">${seasonNames.map(s=>`<div class="season-tab" data-season="${s}">${escapeHtml(s)}</div>`).join('')}</div>
        <div class="episodes-list-modal" id="episodesListModal">
          ${episodesList.map((ep,idx)=>`<div class="episode-thumb ${idx===currentEpisodeIndex?'active-ep':''}" data-ep-index="${idx}">${escapeHtml(ep.name)}</div>`).join('')}
        </div>
      </div>
    `;

    if(currentEpisode){
      const url = currentAudioType==="dub" ? currentEpisode.dubLink : currentEpisode.legLink;
      document.getElementById("playerContainer").innerHTML = getPlayerHtml(url);
      document.getElementById("episodeInfo").innerText = `${currentEpisode.name} (${currentAudioType==="dub"?"Dublado":"Legendado"})`;
    } else {
      document.getElementById("playerContainer").innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#000;color:#fff;">Nenhum episódio disponível</div>`;
    }
    updateAudioSelector();

    const prevBtn = document.getElementById("prevEpisodeBtn");
    const nextBtn = document.getElementById("nextEpisodeBtn");
    if(prevBtn) prevBtn.onclick = () => { if(currentEpisodeIndex > 0){ currentEpisodeIndex--; currentEpisode = episodesList[currentEpisodeIndex]; loadEpisode(); updateAudioSelector(); } };
    if(nextBtn) nextBtn.onclick = () => { if(currentEpisodeIndex < episodesList.length-1){ currentEpisodeIndex++; currentEpisode = episodesList[currentEpisodeIndex]; loadEpisode(); updateAudioSelector(); } };

    document.querySelectorAll(".season-tab").forEach(tab=>{
      tab.onclick = () => { document.querySelectorAll(".season-tab").forEach(t=>t.classList.remove("active")); tab.classList.add("active"); changeSeason(tab.dataset.season); updateAudioSelector(); };
    });
    if(seasonNames.length) document.querySelector(".season-tab")?.classList.add("active");

    document.querySelectorAll(".episode-thumb").forEach(el=>{
      el.addEventListener("click",()=>{ currentEpisodeIndex = parseInt(el.dataset.epIndex); currentEpisode = episodesList[currentEpisodeIndex]; loadEpisode(); updateAudioSelector(); });
    });

    modal.classList.add("active");
    document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("active");
    modal.onclick = (e) => { if(e.target === modal) modal.classList.remove("active"); };
  }

  // ==================== FUNÇÕES ADMIN ====================

      gridDiv.innerHTML=`<div class="anime-grid">${items.map(item=>`<div class="anime-card" style="position:relative;"><button class="edit-btn" data-id="${item.id}" data-type="${currentType}" style="position:absolute; right:55px; top:8px; background:rgba(58,42,85,0.9); border:none; border-radius:30px; padding:4px 8px; cursor:pointer; font-size:10px; color:white; z-index:3;">✏️ Editar</button><button class="delete-btn" data-id="${item.id}" data-type="${currentType}" style="position:absolute; right:8px; top:8px; background:rgba(165,66,106,0.8); border:none; border-radius:30px; padding:4px 8px; cursor:pointer; font-size:10px; color:white; z-index:3;">🗑</button><div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div><div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c=>`<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div><div class="watch-btn">${item.seasons?Object.keys(item.seasons).length:0} temporada(s)</div></div></div>`).join('')}</div>`;
      document.querySelectorAll(".edit-btn").forEach(btn=>{ btn.onclick=async e=>{ e.stopPropagation(); const id=btn.dataset.id; const type=btn.dataset.type; const doc=await db.collection(type).doc(id).get(); if(doc.exists) openEditModal({id,...doc.data(),type}); }; });
      document.querySelectorAll(".delete-btn").forEach(btn=>{ btn.onclick=async e=>{ e.stopPropagation(); if(confirm("Deletar permanentemente?")){ await db.collection(btn.dataset.type).doc(btn.dataset.id).delete(); showMessage("Deletado!",false); loadEditGrid(); } }; });
    }
    document.getElementById("editAnimesBtn").onclick=()=>{ currentType="animes"; document.getElementById("editAnimesBtn").classList.add("active"); document.getElementById("editMangasBtn").classList.remove("active"); loadEditGrid(); };
    document.getElementById("editMangasBtn").onclick=()=>{ currentType="mangas"; document.getElementById("editMangasBtn").classList.add("active"); document.getElementById("editAnimesBtn").classList.remove("active"); loadEditGrid(); };
    loadEditGrid();
  }

  async function loadFavoritos(){ 
    if(!currentUser){ document.getElementById("content").innerHTML="<div class='admin-form'>Faça login</div>"; return; } 
    const favDoc=await db.collection("favoritos").doc(currentUser.uid).get(); 
    const favIds=favDoc.exists&&favDoc.data().animes?favDoc.data().animes:[]; 
    if(!favIds.length){ document.getElementById("content").innerHTML=`<div class="admin-form"><h3>⭐ Favoritos</h3><div class="empty-favorites">Nenhum favorito ainda.</div></div>`; return; } 
    let items=[]; 
    for(const t of ["animes","mangas"]){ const snap=await db.collection(t).get(); snap.forEach(doc=>{ if(favIds.includes(doc.id)) items.push({id:doc.id,...doc.data(),type:t}); }); } 
    let html=`<div class="admin-form"><h3>⭐ Seus Favoritos (${items.length})</h3><div class="anime-grid">`+items.map(item=>`<div class="anime-card" data-item='${JSON.stringify(item).replace(/'/g,"&#39;")}'><div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div><div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c=>`<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div><div class="watch-btn">🎬 ${item.seasons?Object.keys(item.seasons).length:0} temporada(s)</div></div></div>`).join('')+`</div></div>`; 
    document.getElementById("content").innerHTML=html; 
    document.querySelectorAll(".anime-card").forEach(card=>{ card.addEventListener("click",()=>{ const raw=card.dataset.item; if(raw) openDetailModal(JSON.parse(raw)); }); }); 
  }

  async function loadContinuar() { 
    if(!currentUser) { document.getElementById("content").innerHTML = "<div class='admin-form'>Faça login</div>"; return; } 
    const snap = await db.collection("progresso").where("userId", "==", currentUser.uid).get(); 
    let progressos = []; snap.forEach(doc => progressos.push({ id: doc.id, ...doc.data() })); 
    if(progressos.length === 0) { document.getElementById("content").innerHTML = "<div class='admin-form'><h3>⏯️ Continuar Assistindo</h3><p style='text-align:center;padding:40px;'>Nenhum episódio em andamento.</p></div>"; return; } 
    let items = []; 
    for(let prog of progressos){ const animeDoc = await db.collection("animes").doc(prog.animeId).get(); if(animeDoc.exists){ items.push({ ...animeDoc.data(), id: prog.animeId, progress: prog }); } } 
    let html = `<div class="admin-form"><h3>⏯️ Continuar Assistindo</h3><div class="anime-grid">`; 
    for(let item of items){ const season = item.seasons[item.progress.seasonName]; const episode = season ? season[item.progress.episodeIndex] : null; html += `<div class="anime-card" data-item='${JSON.stringify({ id: item.id, ...item }).replace(/'/g, "&#39;")}' data-progress='${JSON.stringify(item.progress).replace(/'/g, "&#39;")}'><div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='https://placehold.co/600x900?text=Sem+Imagem'"></div><div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c=>`<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div><div style="font-size:12px; margin:5px 0;">${escapeHtml(item.progress.seasonName)} - ${episode ? escapeHtml(episode.name) : 'Episódio'}</div><div class="watch-btn">▶️ Continuar</div></div></div>`; } 
    html += `</div></div>`; 
    document.getElementById("content").innerHTML = html; 
    document.querySelectorAll(".anime-card").forEach(card => { card.addEventListener("click", (e) => { const raw = card.dataset.item; const prog = JSON.parse(card.dataset.progress); if(raw) openDetailModal(JSON.parse(raw), prog); }); }); 
  }

  // ==================== AUTH ====================
  function updateUI() {
    const btn = document.getElementById("loginBtn");
    const switchText = document.getElementById("switchMode");
    if (isLogin) {
      btn.innerText = "Entrar";
      switchText.innerText = "Criar nova conta";
    } else {
      btn.innerText = "Cadastrar";
      switchText.innerText = "Já tenho conta";
    }
  }

  document.getElementById("switchMode").onclick = () => { isLogin = !isLogin; updateUI(); };
  document.getElementById("forgotBtn").onclick = async () => { const email = prompt("Digite seu e-mail:"); if(email) try{ await auth.sendPasswordResetEmail(email); showMessage("Email de recuperação enviado!", false); }catch(e){ showMessage("Erro ao enviar email"); } };
  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value;
    const pwd = document.getElementById("password").value;
    if (!email || !pwd) { showMessage("Preencha email e senha!"); return; }
    const loading = document.getElementById("loadingScreen");
    loading.style.display = "flex";
    try {
      if (isLogin) {
        await auth.signInWithEmailAndPassword(email, pwd);
        showMessage("✅ Login realizado!", false);
      } else {
        if (pwd.length < 6) { showMessage("Senha precisa ter 6+ caracteres"); loading.style.display = "none"; return; }
        const cred = await auth.createUserWithEmailAndPassword(email, pwd);
        await cred.user.sendEmailVerification();
        await db.collection("users").doc(cred.user.uid).set({ name: email.split("@")[0], email: email, isAdmin: email === MASTER_EMAIL, createdAt: new Date() });
        showMessage("📧 Conta criada! Verifique seu e-mail.", false);
        await auth.signOut();
        isLogin = true;
        updateUI();
      }
    } catch (e) {
      if (e.code === 'auth/user-not-found') showMessage("❌ Conta não encontrada");
      else if (e.code === 'auth/wrong-password') showMessage("🔐 Senha incorreta");
      else if (e.code === 'auth/email-already-in-use') showMessage("📧 E-mail já cadastrado");
      else showMessage("Erro: " + e.message);
    } finally {
      loading.style.display = "none";
    }
  };
  document.getElementById("logoutBtn").onclick = () => auth.signOut();

  // ==================== ON AUTH STATE CHANGED ====================
  auth.onAuthStateChanged(async (user) => {
    const loading = document.getElementById("loadingScreen");
    if (user) {
      loading.style.display = "flex";
      if (!user.emailVerified && user.email !== MASTER_EMAIL) {
        showMessage("⚠️ Verifique seu e-mail antes de acessar.");
        await auth.signOut();
        loading.style.display = "none";
        return;
      }
      let doc = await db.collection("users").doc(user.uid).get();
      let userName = user.email.split("@")[0];
      if (!doc.exists) {
        await db.collection("users").doc(user.uid).set({ name: userName, email: user.email, isAdmin: user.email === MASTER_EMAIL, createdAt: new Date() });
      } else {
        userName = doc.data().name;
      }
      userData = { name: userName, email: user.email, isAdmin: user.email === MASTER_EMAIL };
      currentUser = user;
      document.getElementById("userName").innerText = userName;
      const isAdmin = user.email === MASTER_EMAIL;
      document.getElementById("adminTab").style.display = isAdmin ? "block" : "none";
      document.getElementById("editTab").style.display = isAdmin ? "block" : "none";
      await loadUserFavorites();
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "flex";
      loading.style.display = "none";
      loadTab("inicio");
      attachNavEvents();
    } else {
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("app").style.display = "none";
      loading.style.display = "none";
      isLogin = true;
      updateUI();
    }
  });
</script>
</body>
</html>
