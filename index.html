<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YK Server - Streaming de animes e séries com a melhor qualidade">
    <meta name="theme-color" content="#0f0f23">
    <title>YK Server · Streaming Premium</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=64">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ======== RESET & BASE STYLES ======== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-pink: #ff6b9d;
            --primary-pink-dark: #e84a7f;
            --primary-pink-light: #ff8fb3;
            --secondary-purple: #c084fc;
            --bg-primary: #1a0a1a;
            --bg-secondary: #2d1a2d;
            --bg-card: #3d203d;
            --bg-hover: #4d2a4d;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #6b3d6b;
            --border-hover: #ff6b9d;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
            --transition-fast: 150ms;
            --transition-normal: 250ms;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        html { scroll-behavior: smooth; font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--primary-pink); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-pink-dark); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideLeft { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; gap: 24px;
        }

        .loading-spinner {
            width: 50px; height: 50px; border: 3px solid var(--bg-card);
            border-top-color: var(--primary-pink); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text { font-size: 16px; color: var(--text-secondary); font-weight: 500; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); color: var(--text-primary); padding: 12px 24px;
            border-radius: 8px; font-weight: 500; font-size: 14px; z-index: 10000;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);
            animation: slideUp var(--transition-normal);
        }

        .toast.success { background: #1a4d2e; border-color: #2ecc71; }
        .toast.error { background: #4a1a1a; border-color: #e74c3c; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 15, 35, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); padding: 0 24px; height: 64px;
        }

        .navbar-content { display: flex; align-items: center; justify-content: space-between; height: 100%; max-width: 100%; }

        .logo-section { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: opacity var(--transition-fast); }
        .logo-section:hover { opacity: 0.9; }

        .yk-logo { width: 36px; height: 36px; border-radius: 8px; background: url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover; }
        .site-title { font-size: 18px; font-weight: 700; color: var(--primary-pink); }

        .nav-menu { display: flex; gap: 8px; }

        .nav-item {
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
            font-size: 14px; color: var(--text-secondary); border: none; background: transparent;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 8px;
        }

        .nav-item:hover { color: var(--text-primary); background: var(--bg-hover); }
        .nav-item.active { color: var(--text-primary); background: var(--primary-pink); }

        .nav-section { display: flex; align-items: center; gap: 16px; }

        .search-container { position: relative; display: flex; align-items: center; }

        .search-icon {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); border-radius: 8px; transition: all var(--transition-fast);
        }

        .search-icon:hover { color: var(--text-primary); background: var(--bg-hover); }

        .search-input {
            width: 0; padding: 0; border: none; background: var(--bg-card); color: var(--text-primary);
            font-size: 14px; outline: none; border-radius: 8px; opacity: 0; transition: all var(--transition-normal);
        }

        .search-input.expanded { width: 280px; padding: 10px 16px; opacity: 1; border: 1px solid var(--border-color); }
        .search-input.expanded:focus { border-color: var(--primary-pink); }

        .user-section { display: flex; align-items: center; gap: 12px; }

        .user-name { font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: color var(--transition-fast); }
        .user-name:hover { color: var(--text-primary); }

        .logout-btn {
            background: transparent; border: 1px solid var(--border-color); padding: 8px 16px;
            border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 14px;
            font-weight: 500; transition: all var(--transition-fast);
        }

        .logout-btn:hover { background: var(--bg-hover); border-color: var(--primary-pink); color: var(--text-primary); }

        .hamburger-menu { display: none; flex-direction: column; gap: 4px; cursor: pointer; padding: 8px; }
        .hamburger-menu span { width: 24px; height: 2px; background: var(--text-primary); transition: all var(--transition-fast); }

        .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 16px; z-index: 99; }
        .mobile-menu.active { display: block; }
        .mobile-menu .nav-item { width: 100%; padding: 12px; justify-content: center; margin-bottom: 8px; }

        .content-wrapper { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .content-section { margin-bottom: 48px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .section-action { color: var(--primary-pink); font-size: 14px; cursor: pointer; font-weight: 600; transition: color var(--transition-fast); }
        .section-action:hover { color: var(--primary-pink-dark); }

        .hero-banner { position: relative; height: 500px; margin-bottom: 48px; border-radius: 12px; overflow: hidden; background: var(--bg-secondary); }
        .hero-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: brightness(0.4); }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(15, 15, 35, 0.95) 0%, rgba(15, 15, 35, 0.7) 50%, rgba(15, 15, 35, 0.3) 100%); }
        .hero-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 48px; max-width: 60%; }
        .hero-title { font-size: 48px; font-weight: 800; margin-bottom: 16px; line-height: 1.1; }
        .hero-description { font-size: 16px; line-height: 1.6; margin-bottom: 24px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

        .hero-btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; transition: all var(--transition-fast); }
        .hero-btn-primary { background: var(--primary-pink); color: white; }
        .hero-btn-primary:hover { background: var(--primary-pink-dark); transform: translateY(-2px); }
        .hero-btn-secondary { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); }
        .hero-btn-secondary:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        .media-card {
            background: var(--bg-card); border-radius: 8px; overflow: hidden; cursor: pointer;
            transition: all var(--transition-normal); border: 1px solid transparent; position: relative;
        }

        .media-card:hover { transform: translateY(-4px); border-color: var(--primary-pink); box-shadow: var(--shadow-lg); }

        .media-card-image { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: var(--bg-secondary); position: relative; }
        .media-card-image img { width: 100%; height: 100%; object-fit: cover; }

        .media-card-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.3) 60%, transparent 100%);
            opacity: 0; transition: opacity var(--transition-normal); display: flex; align-items: flex-end; padding: 12px;
        }

        .media-card:hover .media-card-overlay { opacity: 1; }

        .media-card-actions { display: flex; gap: 8px; width: 100%; }

        .media-card-action-btn {
            flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600;
            font-size: 12px; transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        .media-card-action-btn.play { background: var(--primary-pink); color: white; }
        .media-card-action-btn.play:hover { background: var(--primary-pink-dark); }
        .media-card-action-btn.favorite { background: rgba(255, 255, 255, 0.2); color: white; }
        .media-card-action-btn.favorite:hover { background: rgba(255, 255, 255, 0.3); }
        .media-card-action-btn.favorite.active { background: #e74c3c; }

        .media-card-content { padding: 12px; }
        .media-card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .media-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
        .media-card-rating { display: flex; align-items: center; gap: 4px; color: var(--primary-pink); font-weight: 600; }
        .media-card-year { background: var(--bg-secondary); padding: 2px 8px; border-radius: 4px; }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        .skeleton-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            height: 320px;
        }

        .skeleton-image {
            width: 100%;
            aspect-ratio: 2/3;
        }

        .skeleton-content {
            padding: 12px;
        }

        .skeleton-title {
            height: 16px;
            width: 80%;
            margin-bottom: 8px;
        }

        .skeleton-meta {
            height: 12px;
            width: 60%;
        }

        /* Content animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        .slide-up {
            animation: slideUp 0.4s ease-out;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }

        .carousel-container { position: relative; }
        .carousel { display: flex; overflow-x: auto; gap: 16px; padding: 8px 0; scroll-behavior: smooth; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        .carousel .media-card { flex: 0 0 200px; }

        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: var(--bg-card);
            border: 1px solid var(--border-color); color: var(--text-primary); width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all var(--transition-fast); opacity: 0;
        }

        .carousel-container:hover .carousel-btn { opacity: 1; }
        .carousel-btn:hover { background: var(--primary-pink); border-color: var(--primary-pink); }
        .carousel-btn-left { left: -20px; }
        .carousel-btn-right { right: -20px; }

        .catalog-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; }
        .catalog-tab { padding: 8px 16px; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 600; border: none; color: var(--text-secondary); font-size: 14px; transition: all var(--transition-fast); }
        .catalog-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
        .catalog-tab.active { color: var(--text-primary); background: var(--primary-pink); }

        .filter-bar { background: var(--bg-card); padding: 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border-color); }
        .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-secondary); cursor: pointer; font-size: 14px; font-weight: 500; transition: all var(--transition-fast); }
        .filter-btn:hover { border-color: var(--primary-pink); color: var(--text-primary); }
        .filter-btn.active { background: var(--primary-pink); border-color: var(--primary-pink); color: white; }

        .anime-detail { display: grid; grid-template-columns: 300px 1fr; gap: 32px; margin-bottom: 48px; }
        .anime-poster { width: 100%; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; background: var(--bg-card); }
        .anime-poster img { width: 100%; height: 100%; object-fit: cover; }
        .anime-info { background: var(--bg-card); padding: 24px; border-radius: 12px; }
        .anime-info h1 { font-size: 32px; font-weight: 800; margin-bottom: 16px; }
        .anime-meta { display: flex; gap: 16px; margin-bottom: 16px; font-size: 14px; color: var(--text-secondary); }
        .anime-description { color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
        .anime-genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .genre-tag { padding: 6px 12px; background: var(--bg-secondary); border-radius: 20px; font-size: 12px; color: var(--text-secondary); }

        .seasons-container { margin-top: 32px; }
        .season-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 16px; background: var(--bg-card); border-radius: 8px; cursor: pointer; transition: background var(--transition-fast); }
        .season-header:hover { background: var(--bg-hover); }
        .season-title { font-size: 18px; font-weight: 700; }
        .season-episodes-count { color: var(--text-muted); font-size: 14px; }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 16px; }
        .episode-card { background: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: all var(--transition-fast); border: 1px solid transparent; }
        .episode-card:hover { border-color: var(--primary-pink); background: var(--bg-hover); }
        .episode-number { font-size: 12px; color: var(--primary-pink); font-weight: 600; margin-bottom: 4px; }
        .episode-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .episode-actions { display: flex; gap: 8px; }
        .episode-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all var(--transition-fast); }
        .episode-btn.dub { background: var(--primary-pink); color: white; }
        .episode-btn.dub:hover { background: var(--primary-pink-dark); }
        .episode-btn.leg { background: var(--secondary-purple); color: white; }
        .episode-btn.leg:hover { background: #a855f7; }

        .episode-card.watched {
            opacity: 0.6;
            border-left: 3px solid #2ecc71;
        }

        .episode-card.watched .episode-number::after {
            content: ' ✓';
            color: #2ecc71;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .breadcrumb-item {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .breadcrumb-item:hover {
            color: var(--primary-pink);
        }

        .breadcrumb-separator {
            color: var(--text-muted);
        }

        .breadcrumb-item.active {
            color: var(--text-primary);
            font-weight: 600;
        }

        .next-episode-suggestion {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-top: 24px;
            border: 1px solid var(--border-color);
        }

        .next-episode-suggestion h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .next-episode-btn {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .next-episode-btn:hover {
            background: var(--primary-pink-dark);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-btn {
            background: var(--bg-hover);
            border: none;
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
        }

        .volume-btn:hover {
            background: var(--primary-pink);
        }

        .volume-slider {
            width: 100px;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: var(--bg-hover);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--primary-pink);
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: var(--primary-pink);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .admin-panel { background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; }
        .admin-tab { padding: 8px 16px; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 600; border: none; color: var(--text-secondary); font-size: 14px; transition: all var(--transition-fast); }
        .admin-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
        .admin-tab.active { color: var(--text-primary); background: var(--primary-pink); }

        .admin-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .form-input, .form-select, .form-textarea {
            padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; outline: none;
            transition: border-color var(--transition-fast);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary-pink); }
        .form-textarea { min-height: 100px; resize: vertical; font-family: inherit; }

        .btn-primary { padding: 12px 24px; border-radius: 8px; background: var(--primary-pink); color: white; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: background var(--transition-fast); }
        .btn-primary:hover { background: var(--primary-pink-dark); }
        .btn-danger { padding: 8px 16px; border-radius: 6px; background: #e74c3c; color: white; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: background var(--transition-fast); }
        .btn-danger:hover { background: #c0392b; }

        .donation-container { max-width: 600px; margin: 0 auto; text-align: center; }

        firebase.initializeApp(firebaseConfig);

        let currentUser = null;

        let currentTab = 'home';
        let searchTerm = '';
        let currentCatalogTab = 'Todos';
        let currentGenre = 'Todos';

        let allContentCache = [];
        
        // Console protection - prevent manipulation
        (function() {
            const originalSetItem = Object.getOwnPropertyDescriptor(Storage.prototype, 'setItem');
            Object.defineProperty(Storage.prototype, 'setItem', {
                configurable: true,
                enumerable: true,
                value: function(...args) {
                    // Prevent tampering with localStorage
                    if (args[0] === 'cachedContent' || args[0].includes('admin') || args[0].includes('user')) {
                        console.warn('Attempt to modify protected localStorage detected');
                        return;
                    }
                    return originalSetItem.value.apply(this, args);
                }
            });

        })();
        
        // Security: Input validation and sanitization
        function sanitizeInput(input) {
            if (!input) return '';
            return input
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;')
                .replace(/javascript:/gi, '')
                .replace(/on\w+=/gi, '')
                .replace(/data:/gi, '')
                .replace(/vbscript:/gi, '')
                .replace(/&/g, '&amp;')
                .trim();
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        function validateUrl(url) {
            try {
                new URL(url);
                return true;
            } catch {
                return false;
            }
        }

        function validateText(text, minLength = 1, maxLength = 1000) {
            if (typeof text !== 'string') return false;
            const sanitized = sanitizeInput(text);
            return sanitized.length >= minLength && sanitized.length <= maxLength;
        }

        function validatePassword(password) {
            return password && password.length >= 6;
        }

        // Security: Rate limiting
        const rateLimitMap = new Map();
        const RATE_LIMIT_WINDOW = 60000; // 1 minute
        const RATE_LIMIT_MAX_REQUESTS = 10;

        // Security: Owner verification - ONLY joaodidier@proton.me can access admin functions
        const OWNER_EMAIL = 'joaodidier@proton.me';
        let ownerVerified = false;

        function isOwner() {
            return currentUser && currentUser.email && currentUser.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
        }

        function checkRateLimit(action, userId) {
            const key = `${action}_${userId}`;
            const now = Date.now();
            const requests = rateLimitMap.get(key) || [];
            
            // Remove old requests outside the window
            const recentRequests = requests.filter(time => now - time < RATE_LIMIT_WINDOW);
            
            if (recentRequests.length >= RATE_LIMIT_MAX_REQUESTS) {
                return false;
            }
            
            recentRequests.push(now);
            rateLimitMap.set(key, recentRequests);
            return true;
        }

        // Security: Owner verification - REMOVED admin password, only email check
        async function verifyOwner() {
            if (!currentUser) return false;
            
            // Double-check with Firestore (server-side verification)
            try {
                const userDoc = await db.collection('users').doc(currentUser.uid).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    // Only allow access if email matches exactly
                    return currentUser.email && currentUser.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
                }
            } catch (error) {
                console.error('Error verifying owner status:', error);
            }
            
            return false;
        }
        
        // Security: Freeze critical functions to prevent redefinition
        try {
            Object.freeze(verifyOwner);
            Object.freeze(sanitizeInput);
            Object.freeze(validateEmail);
            Object.freeze(validateUrl);
        } catch (e) {}

        // Theme toggle
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        }

        // Watched episodes
        function markEpisodeAsWatched(animeId, seasonName, episodeIndex) {
            const key = `watched_${animeId}_${seasonName}_${episodeIndex}`;
            localStorage.setItem(key, 'true');
        }

        function isEpisodeWatched(animeId, seasonName, episodeIndex) {
            const key = `watched_${animeId}_${seasonName}_${episodeIndex}`;
            return localStorage.getItem(key) === 'true';
        }

        function saveToLocalStorage(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }

        function loadFromLocalStorage(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            } catch (error) {
                console.error('Error loading from localStorage:', error);
                return null;
            }
        }

        // Enhanced content loading with localStorage fallback
        async function loadAllContent() {
            // Force reload from Firebase - no cache, no mock
            allContentCache = [];
            
            try {
                console.log('=== LOADING FROM FIREBASE ===');
                const [animesSnap, seriesSnap, ratingsSnap] = await Promise.all([
                    db.collection('animes').get(),
                    db.collection('series').get(),
                    db.collection('ratings').get()
                ]);
                
                console.log('Animes from Firebase:', animesSnap.size);
                console.log('Series from Firebase:', seriesSnap.size);
                console.log('Ratings from Firebase:', ratingsSnap.size);
                
                let items = [];
                
                animesSnap.forEach(doc => {
                    const data = doc.data();
                    items.push({
                        id: doc.id,
                        type: 'movies',
                        ...data
                    });
                });
                
                seriesSnap.forEach(doc => {
                    const data = doc.data();
                    items.push({
                        id: doc.id,
                        type: 'series',
                        ...data
                    });
                });
                
                // Calculate average ratings from user ratings
                const ratingsMap = {};
                ratingsSnap.forEach(doc => {
                    const data = doc.data();
                    const animeId = data.animeId;
                    if (!ratingsMap[animeId]) {
                        ratingsMap[animeId] = [];
                    }
                    ratingsMap[animeId].push(data.rating);
                });
                
                // Update items with calculated average rating
                items.forEach(item => {
                    if (!item.averageRating && ratingsMap[item.id]) {
                        const ratings = ratingsMap[item.id];
                        const sum = ratings.reduce((a, b) => a + b, 0);
                        item.averageRating = sum / ratings.length;
                    }
                    // Ensure averageRating exists (default to 0)
                    if (!item.averageRating) {
                        item.averageRating = 0;
                    }
                });
                
                console.log('Total items from Firebase:', items.length);
                console.log('Item titles:', items.map(i => i.title));
                console.log('==========================');
                
                allContentCache = items;
                return items;
            } catch (error) {
                console.error('Error loading content:', error);
                showToast('Erro ao carregar conteúdo: ' + error.message);
                return [];
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

            const div = document.createElement('div');

                });

            });

            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('section-action') && e.target.dataset.action === 'catalog') {

                }

        async function loadTab(tabName) {
            currentTab = tabName;
            try {
                switch (tabName) {
                    case 'home': await loadHomeTab(); break;
                    case 'catalog': await loadCatalogTab(); break;
                    case 'admin': await loadAdminTab(); break;
                    case 'donation': await loadDonationTab(); break;
                    default: await loadHomeTab();
                }
            } catch (error) {
                console.error('Error loading tab:', error);
                showToast('Erro ao carregar conteúdo');
            }
        }

        async function initializeApp() {
            try {
                console.log('Initializing YK Server...');
                
                // Check for authenticated user
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists) {
                            userData = userDoc.data();
                            
                            // Check email verification
                            if (user.emailVerified && !userData.emailVerified) {
                                await db.collection('users').doc(user.uid).update({ emailVerified: true });
                                userData.emailVerified = true;
                            }
                        } else {
                            // Create user document
                            userData = { 
                                name: user.email.split('@')[0], 
                                email: user.email, 
                                isAdmin: false, // No more admins, only owner
                                emailVerified: user.emailVerified 
                            };
                            await db.collection('users').doc(user.uid).set(userData);
                        }
                        document.getElementById('userNameDisplay').textContent = userData.name;
                        setupNavigation();
                        await loadTab('home');
                        const app = document.getElementById('app');
                        const loading = document.getElementById('loadingScreen');
                        app.style.display = 'block';
                        setTimeout(() => app.classList.add('active'), 100);
                        loading.style.display = 'none';
                        console.log('YK Server initialized successfully');
                    } else {
                        // Show login screen
                        showLoginScreen();
                    }
                });
            } catch (error) {
                console.error('Error initializing app:', error);
                showToast('Erro ao inicializar aplicação');
                const app = document.getElementById('app');
                const loading = document.getElementById('loadingScreen');
                if (app) app.style.display = 'block';
                if (loading) loading.style.display = 'none';
            }
        }

        function showLoginScreen() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
                    <div style="background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px;">
                        <h2 style="text-align: center; margin-bottom: 24px; color: var(--primary-pink);">YK Server</h2>
                        <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="loginEmail" required placeholder="seu@email.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-input" id="loginPassword" required placeholder="******">
                            </div>
                            <button type="submit" class="btn-primary">Entrar</button>
                            <button type="button" class="btn-secondary" id="registerBtn">Criar conta</button>
                        </form>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = sanitizeInput(document.getElementById('loginEmail').value);
                const password = document.getElementById('loginPassword').value;
                
                if (!validateEmail(email)) {
                    showToast('Email inválido');
                    return;
                }
                
                if (!validatePassword(password)) {
                    showToast('Senha deve ter pelo menos 6 caracteres');
                    return;
                }
                
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    showToast('Login realizado com sucesso!', 'success');
                } catch (error) {
                    showToast('Erro ao fazer login: ' + error.message);
                }
            });
            
            document.getElementById('registerBtn')?.addEventListener('click', showRegisterScreen);
            
            const loading = document.getElementById('loadingScreen');
            if (loading) loading.style.display = 'none';
            const app = document.getElementById('app');
            if (app) { app.style.display = 'block'; app.classList.add('active'); }
        }

        function showRegisterScreen() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
                    <div style="background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px;">
                        <h2 style="text-align: center; margin-bottom: 24px; color: var(--primary-pink);">Criar Conta</h2>
                        <form id="registerForm" style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-input" id="registerName" required placeholder="Seu nome">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="registerEmail" required placeholder="seu@email.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-input" id="registerPassword" required placeholder="******" minlength="6">
                            </div>
                            <button type="submit" class="btn-primary">Criar conta</button>
                            <button type="button" class="btn-secondary" id="backToLoginBtn">Voltar</button>
                        </form>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = sanitizeInput(document.getElementById('registerName').value);
                const email = sanitizeInput(document.getElementById('registerEmail').value);
                const password = document.getElementById('registerPassword').value;
                
                if (!validateText(name, 2, 50)) {
                    showToast('Nome deve ter entre 2 e 50 caracteres');
                    return;
                }
                
                if (!validateEmail(email)) {
                    showToast('Email inválido');
                    return;
                }
                
                if (!validatePassword(password)) {
                    showToast('Senha deve ter pelo menos 6 caracteres');
                    return;
                }
                
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    // Send email verification
                    await userCredential.user.sendEmailVerification();
                    // All users are regular users, only owner has special access
                    await db.collection('users').doc(userCredential.user.uid).set({
                        name,
                        email,
                        isAdmin: false, // No admins anymore
                        emailVerified: false,
                        createdAt: new Date()
                    });
                    showToast('Conta criada! Verifique seu email para confirmar.', 'success');
                    showLoginScreen();
                } catch (error) {
                    showToast('Erro ao criar conta: ' + error.message);
                }
            });
            
            document.getElementById('backToLoginBtn')?.addEventListener('click', showLoginScreen);
        }

        // Utility functions
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Chave PIX copiada!');
            }).catch(() => {
                showToast('Erro ao copiar chave PIX');
            });
        }

        function setCatalogTab(tab) {
            currentCatalogTab = tab;
            loadCatalogTab();
        }

        function playMedia(id, type) {
            // Implementation for playing media
            showToast('Reproduzindo mídia...');
        }

        function showAnimeDetail(id, type) {
            // Implementation for showing anime details
            showToast('Carregando detalhes...');
        }

        function toggleFavorite(id) {
            // Implementation for toggling favorites
            showToast('Adicionado aos favoritos!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Load saved theme
            loadTheme();
            
            // Theme toggle listener
            document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
            
            setTimeout(() => {
                const loading = document.getElementById('loadingScreen');
                const app = document.getElementById('app');
                if (loading && loading.style.display !== 'none') {
                    console.warn('Loading timeout - forcing app to show');
                    loading.style.display = 'none';
                    if (app) { app.style.display = 'block'; app.classList.add('active'); }
                }
            }, 3000);
            initializeApp();
        });

        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showToast('Ocorreu um erro inesperado');
        });
    </script>
</body>
</html>
