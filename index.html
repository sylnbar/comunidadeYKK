<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>YK Server · Catálogo</title>
  <link rel="icon" type="image/png" href="https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=64">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #ededed;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e1a2a; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ff5a8a, #ff3366); border-radius: 10px; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes pulseGlow { 0%,100% { box-shadow:0 0 5px rgba(255,90,138,0.3); } 50% { box-shadow:0 0 20px rgba(255,90,138,0.8); } }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    @keyframes float { 0% { transform:translateY(0px); } 50% { transform:translateY(-8px); } 100% { transform:translateY(0px); } }
    @keyframes gradientShift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
    .toast {
      position:fixed; top:20px; left:50%; transform:translateX(-50%);
      background:linear-gradient(135deg,#ff3366,#cc2255); color:white; padding:10px 24px;
      border-radius:40px; font-weight:500; z-index:1000; backdrop-filter:blur(8px);
      font-size:14px; animation:fadeInUp 0.2s ease; box-shadow:0 5px 20px rgba(0,0,0,0.3);
    }
    .toast.success { background:linear-gradient(135deg,#4caf50,#388e3c); }
    .beta-banner {
      background:linear-gradient(135deg,#ff5a8a,#ff3366); text-align:center; padding:6px;
      font-size:11px; font-weight:600; letter-spacing:1px;
      animation:gradientShift 3s ease infinite; background-size:200% 200%;
    }
    .credit-footer {
      text-align:center; padding:20px; font-size:12px; color:#aa99cc;
      border-top:1px solid rgba(255,90,138,0.15); margin-top:40px;
      background:rgba(10,5,18,0.8);
    }
    /* Login */
    .login-screen {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:radial-gradient(circle at 30% 20%, #1a0f2e, #0a0512);
      display:flex; justify-content:center; align-items:center; z-index:100; padding:16px;
    }
    .login-card {
      background:rgba(30,22,45,0.8); backdrop-filter:blur(20px); padding:40px;
      border-radius:48px; width:380px; max-width:90%; border:1px solid rgba(255,90,138,0.4);
      text-align:center; animation:fadeInUp 0.4s ease;
    }
    .login-card h2 {
      margin-bottom:24px; background:linear-gradient(135deg,#ff90b5,#ff5a8a);
      -webkit-background-clip:text; background-clip:text; color:transparent; font-size:32px;
    }
    .login-card input {
      width:100%; padding:12px 16px; margin:10px 0;
      background:rgba(42,34,59,0.8); border:1px solid rgba(255,90,138,0.3);
      border-radius:40px; color:white; font-size:14px; outline:none; transition:0.2s;
    }
    .login-card input:focus { border-color:#ff5a8a; box-shadow:0 0 12px rgba(255,90,138,0.4); transform:scale(1.01); }
    .login-card button {
      width:100%; padding:12px; background:linear-gradient(135deg,#ff5a8a,#ff3366);
      border:none; border-radius:40px; color:white; font-weight:600; cursor:pointer;
      margin-top:15px; font-size:15px; transition:0.2s;
    }
    .login-card button:hover { transform:scale(1.02); box-shadow:0 6px 20px rgba(255,90,138,0.4); }
    .login-card .switch { margin-top:16px; color:#ccb0e0; cursor:pointer; font-size:13px; transition:0.2s; }
    .login-card .switch:hover { color:#ff90b5; }
    .app { display:none; min-height:100vh; flex-direction:column; }
    .loading-screen {
      position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0512;
      display:flex; justify-content:center; align-items:center; z-index:99;
      flex-direction:column; gap:20px;
    }
    .loading-spinner {
      width:50px; height:50px; border:3px solid rgba(255,90,138,0.2);
      border-top:3px solid #ff5a8a; border-right:3px solid #ff3366;
      border-radius:50%; animation:spin 0.8s linear infinite;
    }
    /* Top Bar */
    .top-bar {
      background:rgba(15,12,25,0.9); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,90,138,0.2);
      position:sticky; top:0; z-index:50;
      padding:12px 32px;
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:15px;
    }
    .logo-area { display:flex; align-items:center; gap:12px; }
    .yk-logo {
      width:40px; height:40px; border-radius:20px;
      background:url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover no-repeat;
      background-color:#ff5a8a; box-shadow:0 0 12px rgba(255,90,138,0.5);
      animation:pulseGlow 2s ease infinite; transition:0.2s;
    }
    .yk-logo:hover { transform:rotate(5deg) scale(1.05); }
    .site-title {
      font-size:20px; font-weight:700;
      background:linear-gradient(135deg,#ff90b5,#ff5a8a);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .nav-links { display:flex; flex-wrap:wrap; gap:8px; }
    .nav-link {
      padding:8px 20px; border-radius:40px; cursor:pointer; font-weight:600;
      font-size:14px; transition:all 0.2s; color:#ccc; background:rgba(31,24,48,0.6);
    }
    .nav-link:hover { background:rgba(255,90,138,0.3); color:white; transform:translateY(-2px); }
    .nav-link.active { background:linear-gradient(135deg,#ff5a8a,#ff3366); color:white; box-shadow:0 2px 10px rgba(255,90,138,0.3); }
    .user-info { display:flex; gap:15px; align-items:center; }
    .user-name { font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .user-name:hover { color:#ff90b5; }
    .settings-icon { font-size:20px; cursor:pointer; transition:0.2s; }
    .settings-icon:hover { transform:rotate(30deg); color:#ff90b5; }
    .logout-btn {
      background:transparent; border:1px solid #ff7aa8; padding:6px 18px;
      border-radius:40px; cursor:pointer; color:#ff90b5; transition:0.2s; font-size:13px;
    }
    .logout-btn:hover { background:rgba(255,90,138,0.2); transform:scale(1.02); }
    /* Modal de Perfil */
    .profile-modal {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.95); backdrop-filter:blur(12px);
      display:flex; align-items:center; justify-content:center;
      z-index:200; visibility:hidden; opacity:0; transition:0.2s;
    }
    .profile-modal.active { visibility:visible; opacity:1; }
    .profile-modal-content {
      background:#1c152e; width:90vw; max-width:1000px; max-height:85vh;
      border-radius:48px; display:flex; flex-direction:column;
      border:1px solid #ff7aa8; overflow:hidden; animation:fadeInUp 0.3s ease;
    }
    .profile-modal-header {
      padding:20px 24px; border-bottom:1px solid rgba(255,90,138,0.3);
      display:flex; justify-content:space-between; align-items:center;
    }
    .profile-modal-header h2 { color:#ff8ab5; font-size:24px; }
    .close-profile-modal { background:none; border:none; font-size:28px; color:#ffb0cc; cursor:pointer; transition:0.2s; }
    .close-profile-modal:hover { transform:rotate(90deg); color:#ff5a8a; }
    .profile-modal-body { flex:1; overflow-y:auto; padding:24px; }
    .profile-avatar {
      width:100px; height:100px; border-radius:50%; background:#1a1530;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
      border:3px solid #ff5a8a; cursor:pointer; margin-bottom:20px; transition:0.2s;
    }
    .profile-avatar:hover { transform:scale(1.05); }
    .profile-avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-avatar span { font-size:48px; font-weight:bold; color:#ff90b5; }
    .profile-tabs {
      display:flex; gap:10px; margin-bottom:25px; border-bottom:1px solid rgba(255,90,138,0.3); padding-bottom:10px;
    }
    .profile-tab {
      padding:10px 24px; border-radius:40px; cursor:pointer; font-weight:500;
      background:rgba(31,24,48,0.6); transition:0.2s;
    }
    .profile-tab:hover { background:rgba(255,90,138,0.3); }
    .profile-tab.active { background:linear-gradient(135deg,#ff5a8a,#ff3366); color:white; }
    .profile-section { display:none; animation:fadeIn 0.3s ease; }
    .profile-section.active { display:block; }
    .fav-watchlist-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:20px;
    }
    @media (max-width:1000px) { .fav-watchlist-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:700px) { .fav-watchlist-grid { grid-template-columns:repeat(2,1fr); } }
    .change-password-form input {
      width:100%; padding:12px; margin:10px 0; background:#251f36;
      border:1px solid rgba(255,90,138,0.3); border-radius:24px; color:white;
    }
    /* Catálogo header */
    .catalog-header {
      background:rgba(8,5,15,0.8); border-bottom:1px solid rgba(255,90,138,0.2);
      padding:16px 32px; margin-bottom:24px; display:flex; flex-wrap:wrap;
      align-items:center; justify-content:space-between; gap:20px;
    }
    .type-buttons { display:flex; gap:15px; }
    .type-btn {
      padding:10px 28px; border-radius:50px; font-weight:700; font-size:15px;
      cursor:pointer; background:rgba(31,24,48,0.8); color:#ccc; border:none;
      transition:all 0.2s; position:relative; overflow:hidden;
    }
    .type-btn::before {
      content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition:left 0.4s;
    }
    .type-btn:hover::before { left:100%; }
    .type-btn.active {
      background:linear-gradient(135deg,#ff5a8a,#ff3366); color:white;
      box-shadow:0 0 15px rgba(255,90,138,0.5); transform:scale(1.02);
    }
    .search-box { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .search-wrapper { position:relative; }
    .search-wrapper i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#aaa; font-style:normal; }
    .search-box input {
      padding:10px 16px 10px 40px; border-radius:50px;
      background:rgba(26,19,41,0.8); border:1px solid rgba(255,90,138,0.3);
      color:white; outline:none; font-size:14px; width:240px; transition:0.2s;
    }
    .search-box input:focus { border-color:#ff5a8a; box-shadow:0 0 10px rgba(255,90,138,0.3); }
    .search-box select {
      padding:10px 16px; border-radius:50px; background:#251f36;
      border:1px solid rgba(255,90,138,0.3); color:white; cursor:pointer; font-size:14px;
    }
    /* Dropdown de Gêneros - clicável */
    .genres-dropdown { position:relative; display:inline-block; }
    .genres-btn {
      background:rgba(31,24,48,0.8); color:#ccc; padding:10px 24px;
      border-radius:50px; cursor:pointer; font-weight:500; border:none; font-size:14px;
      transition:0.2s;
    }
    .genres-btn:hover { background:rgba(255,90,138,0.3); }
    .genres-content {
      position:absolute; top:100%; left:0; background:rgba(25,18,38,0.98);
      backdrop-filter:blur(12px); min-width:200px; border-radius:20px;
      z-index:60; border:1px solid rgba(255,90,138,0.3); margin-top:8px;
      display:none; max-height:300px; overflow-y:auto;
    }
    .genres-content.show { display:block; }
    .genres-content a {
      color:#ccc; padding:10px 16px; display:block; font-size:13px;
      cursor:pointer; border-radius:12px; margin:4px 8px; transition:0.1s;
    }
    .genres-content a:hover { background:rgba(255,90,138,0.3); color:white; }
    /* Conteúdo principal */
    .content-area { padding:0 32px 32px; min-height:70vh; }
    .anime-grid {
      display:grid; grid-template-columns:repeat(6,1fr); gap:24px;
      animation:fadeInUp 0.4s ease;
    }
    @media (max-width:1600px) { .anime-grid { grid-template-columns:repeat(5,1fr); } }
    @media (max-width:1400px) { .anime-grid { grid-template-columns:repeat(4,1fr); } }
    @media (max-width:1100px) { .anime-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:768px) {
      .top-bar { flex-direction:column; align-items:stretch; padding:12px; }
      .nav-links { justify-content:center; }
      .catalog-header { flex-direction:column; align-items:stretch; padding:12px; }
      .search-box { justify-content:space-between; }
      .search-box input { width:100%; }
      .content-area { padding:0 16px 16px; }
      .anime-grid { grid-template-columns:repeat(2,1fr); gap:16px; }
      .type-buttons { justify-content:center; }
    }
    .anime-card {
      background:rgba(23,17,38,0.85); backdrop-filter:blur(4px);
      border-radius:20px; overflow:hidden; cursor:pointer;
      border:1px solid rgba(255,90,138,0.2);
      transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1.1);
      position:relative;
    }
    .anime-card:hover {
      transform:translateY(-8px); border-color:#ff5a8a;
      box-shadow:0 20px 30px -12px rgba(255,90,138,0.3);
    }
    .anime-card .anime-image { width:100%; aspect-ratio:2/3; overflow:hidden; background:#1a1530; }
    .anime-card .anime-image img {
      width:100%; height:100%; object-fit:cover; transition:transform 0.4s;
    }
    .anime-card:hover .anime-image img { transform:scale(1.08); }
    .card-content { padding:12px; }
    .card-content h3 { font-size:14px; margin-bottom:6px; color:#ffc0dd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .categories-wrapper { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
    .category-badge {
      font-size:9px; background:linear-gradient(135deg,rgba(79,58,108,0.9),rgba(55,40,80,0.9));
      padding:3px 8px; border-radius:20px; color:#ffcfdf;
    }
    .rating-stars { display:flex; align-items:center; gap:3px; margin:8px 0 4px; font-size:11px; }
    .star-filled { color:#ffcc00; text-shadow:0 0 2px #ff9900; }
    .star-empty { color:#555; }
    .watch-btn {
      margin-top:8px; padding:6px; background:linear-gradient(135deg,#ff5a8a,#ff3366);
      text-align:center; border-radius:30px; color:white; font-weight:600; font-size:11px;
      transition:0.2s;
    }
    .watch-btn:hover { opacity:0.9; transform:scale(1.02); }
    .favorite-btn-overlay, .watchlist-btn-overlay {
      position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6);
      backdrop-filter:blur(4px); border:none; border-radius:30px; padding:4px 8px;
      cursor:pointer; font-size:12px; z-index:10; opacity:0; transition:0.2s;
    }
    .watchlist-btn-overlay { right:48px; }
    .anime-card:hover .favorite-btn-overlay, .anime-card:hover .watchlist-btn-overlay { opacity:1; }
    .favorite-btn-overlay.active { opacity:1; background:#ff5a8a; }
    .watchlist-btn-overlay.active { opacity:1; background:#6a4c7c; }
    .novidade-badge {
      position:absolute; top:8px; left:8px; background:linear-gradient(135deg,#ff5a8a,#ff3366);
      padding:3px 10px; border-radius:20px; font-size:8px; font-weight:bold;
      animation:pulseGlow 1.5s infinite;
    }
    .load-more-btn {
      background:linear-gradient(135deg,#ff5a8a,#ff3366); border:none;
      border-radius:60px; padding:12px 28px; color:white; font-weight:700;
      cursor:pointer; margin-top:30px; display:block; width:200px;
      margin-left:auto; margin-right:auto; transition:0.2s;
    }
    .load-more-btn:hover { transform:scale(1.02); box-shadow:0 5px 15px rgba(255,90,138,0.4); }
    /* Admin, Avisos, Doação, etc. */
    .admin-form, .inicio-card, .donation-card {
      background:rgba(22,16,41,0.9); border-radius:32px; padding:28px;
      margin-bottom:30px; animation:fadeInUp 0.4s ease;
    }
    .admin-form input, .admin-form textarea {
      width:100%; padding:12px; margin:8px 0; background:#251f36;
      border-radius:24px; color:white; border:1px solid rgba(255,90,138,0.3);
    }
    .categories-checkbox-group {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
      gap:10px; margin:15px 0; padding:15px; background:rgba(37,31,54,0.6); border-radius:24px;
    }
    .season-item {
      background:rgba(31,24,48,0.8); padding:16px; border-radius:20px; margin-bottom:16px;
    }
    .episode-item {
      background:rgba(42,35,64,0.8); padding:12px; border-radius:16px;
      margin-bottom:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    }
    .announcement-card {
      background:linear-gradient(135deg,rgba(42,26,58,0.9),rgba(31,24,48,0.9));
      border-left:6px solid #ff5a8a; padding:16px 20px; border-radius:24px; margin-bottom:16px;
      transition:0.2s;
    }
    .announcement-card:hover { transform:translateX(6px); }
    /* Doação com animações e layout bonito */
    .donation-container { max-width:1000px; margin:0 auto; }
    .donation-card { text-align:center; transition:0.3s; }
    .donation-card:hover { transform:translateY(-5px); border-color:rgba(255,90,138,0.6); }
    .donation-header h2 {
      background:linear-gradient(135deg,#ff90b5,#ff5a8a);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      font-size:34px; margin-bottom:10px;
    }
    .donation-content { display:flex; flex-wrap:wrap; gap:40px; justify-content:center; align-items:center; margin-top:30px; }
    .donation-info { flex:1; text-align:left; }
    .donation-info ul { list-style:none; margin:20px 0; }
    .donation-info li { margin:12px 0; display:flex; align-items:center; gap:12px; }
    .donation-info li span { font-size:24px; }
    .goal-box {
      background:rgba(255,90,138,0.12); border-radius:28px; padding:20px;
      margin-top:20px; text-align:center; border:1px solid rgba(255,90,138,0.3);
      transition:0.2s;
    }
    .goal-box:hover { background:rgba(255,90,138,0.18); transform:scale(1.01); }
    .goal-box .amount { font-size:36px; font-weight:bold; color:#ff5a8a; }
    .qr-code-container {
      background:white; padding:20px; border-radius:32px;
      animation:float 4s ease-in-out infinite; transition:0.2s;
      display:inline-block;
    }
    .qr-code-container:hover { transform:scale(1.02); }
    .pix-key {
      background:#1a1329; padding:10px; border-radius:20px;
      word-break:break-all; cursor:pointer; margin-top:15px; transition:0.2s;
    }
    .pix-key:hover { background:#ff5a8a; }
    .copy-btn {
      background:#ff5a8a; border:none; padding:10px 20px; border-radius:40px;
      color:white; cursor:pointer; margin-top:15px; transition:0.2s;
    }
    .copy-btn:hover { background:#ff3366; transform:scale(1.02); }
    .stats-grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:20px; margin-bottom:30px;
    }
    .stat-card {
      background:rgba(31,24,48,0.8); border-radius:28px; padding:20px;
      text-align:center; transition:0.2s;
    }
    .stat-card:hover { transform:translateY(-3px); background:rgba(31,24,48,1); }
    .stat-number { font-size:36px; font-weight:bold; color:#ff5a8a; }
    .stat-label { font-size:14px; color:#ccb0e0; margin-top:8px; }
    .promote-btn {
      background:#ff5a8a; border:none; border-radius:40px; padding:6px 16px;
      cursor:pointer; color:white; transition:0.2s;
    }
    .promote-btn:hover { transform:scale(1.03); background:#ff3366; }
    /* Modal de detalhes completo */
    .modal-overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.95); backdrop-filter:blur(12px);
      display:flex; align-items:center; justify-content:center;
      z-index:200; visibility:hidden; opacity:0; transition:0.2s;
    }
    .modal-overlay.active { visibility:visible; opacity:1; }
    .modal-detail {
      background:#1c152e; width:95vw; max-width:1200px; height:85vh;
      border-radius:48px; display:flex; flex-direction:column;
      border:1px solid #ff7aa8; overflow:hidden; animation:fadeInUp 0.3s ease;
    }
    .modal-header {
      padding:16px 24px; border-bottom:1px solid rgba(255,90,138,0.3);
      display:flex; justify-content:space-between; align-items:center;
    }

<script>
  // ==================== FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyCTnC0RGSWRcr2ehQGimK6nIra9H8NH8Ks",
    authDomain: "yk-comunidade.firebaseapp.com",
    projectId: "yk-comunidade",
    storageBucket: "yk-comunidade.appspot.com",
    messagingSenderId: "682166331452",
    appId: "1:682166331452:web:9e0e8553646d44060ebb39"

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();
  const MASTER_EMAIL = "joaodidier@proton.me";

  let currentUser = null;
  let userData = null;
  let isLogin = true;
  let userFavorites = new Set();
  let userWatchlist = new Set();

  const PIX_KEY = "00020101021126580014br.gov.bcb.pix0136f92a7e16-56aa-421e-9fac-521d9b5089075204000053039865802BR5915JOAO G L DIDIER6006RECIFE62070503***6304D05A";
  const CATEGORIES = ["Ação", "Comédia", "Drama", "Shounen", "Isekai", "Romance", "Fantasia", "Terror", "Esportes", "Mecha", "Slice of Life", "Shoujo", "Aventura", "Suspense", "Psicológico"];

  function showMessage(text, isError = true) {
    const div = document.createElement('div');
    div.className = `toast ${!isError ? 'success' : ''}`;
    div.innerText = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2500);
  }
  function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
  function getItemCategories(item) { return item.categories && Array.isArray(item.categories) ? item.categories : (item.category ? [item.category] : []); }
  function isNovidade(date) { if (!date) return false; const d = date.toDate ? date.toDate() : new Date(date); return (new Date() - d) / (1000 * 3600 * 24) <= 7; }

  // Estrelas com cache
  let ratingsCache = new Map();
  async function getUserRating(mediaId) {
    if (!currentUser) return null;
    if (ratingsCache.has(`${currentUser.uid}_${mediaId}`)) return ratingsCache.get(`${currentUser.uid}_${mediaId}`);
    const doc = await db.collection("ratings").doc(`${currentUser.uid}_${mediaId}`).get();
    const rating = doc.exists ? doc.data().rating : null;
    ratingsCache.set(`${currentUser.uid}_${mediaId}`, rating);
    return rating;
  }
  async function saveUserRating(mediaId, rating) {
    if (!currentUser) { showMessage("Faça login para avaliar!"); return; }
    const docId = `${currentUser.uid}_${mediaId}`;
    await db.collection("ratings").doc(docId).set({ userId: currentUser.uid, mediaId, rating, updatedAt: new Date() }, { merge: true });
    ratingsCache.set(docId, rating);
    showMessage(`Avaliação ${rating} estrela${rating>1?'s':''} salva!`, false);
  }
  let avgRatingsCache = new Map();
  async function getAverageRating(mediaId) {
    if (avgRatingsCache.has(mediaId)) return avgRatingsCache.get(mediaId);
    const snapshot = await db.collection("ratings").where("mediaId", "==", mediaId).get();
    if (snapshot.empty) return null;
    let total = 0;
    snapshot.forEach(doc => total += doc.data().rating);
    const avg = (total / snapshot.size).toFixed(1);
    avgRatingsCache.set(mediaId, avg);
    return avg;
  }

  // Favoritos / Watchlist
  async function loadUserFavorites() { if (!currentUser) return; try { const s = await db.collection("favoritos").doc(currentUser.uid).get(); userFavorites = new Set(s.exists && s.data().itens ? s.data().itens : []); } catch(e){} }
  async function toggleFavorite(id) { if (!currentUser) { showMessage("Login necessário"); return; } const ref = db.collection("favoritos").doc(currentUser.uid); const doc = await ref.get(); let arr = doc.exists && doc.data().itens ? doc.data().itens : []; if (userFavorites.has(id)) { arr = arr.filter(i=>i!==id); userFavorites.delete(id); showMessage("Removido dos favoritos", false); } else { arr.push(id); userFavorites.add(id); showMessage("Adicionado aos favoritos", false); } await ref.set({ itens: arr, userId: currentUser.uid, updatedAt: new Date() }); }
  async function loadUserWatchlist() { if (!currentUser) return; try { const s = await db.collection("watchlist").doc(currentUser.uid).get(); userWatchlist = new Set(s.exists && s.data().itens ? s.data().itens : []); } catch(e){} }
  async function toggleWatchlist(id) { if (!currentUser) { showMessage("Login necessário"); return; } const ref = db.collection("watchlist").doc(currentUser.uid); const doc = await ref.get(); let arr = doc.exists && doc.data().itens ? doc.data().itens : []; if (userWatchlist.has(id)) { arr = arr.filter(i=>i!==id); userWatchlist.delete(id); showMessage("Removido da lista 'Assistir Depois'", false); } else { arr.push(id); userWatchlist.add(id); showMessage("Adicionado à lista 'Assistir Depois'", false); } await ref.set({ itens: arr, userId: currentUser.uid, updatedAt: new Date() }); }

  // Modal de Perfil
  async function openProfileModal() {
    const modal = document.getElementById("profileModal");
    const body = document.getElementById("profileModalBody");
    const userDoc = await db.collection("users").doc(currentUser.uid).get();
    const photoURL = userDoc.data()?.photoURL;
    const avatarHtml = photoURL ? `<img src="${photoURL}">` : `<span>${userData.name.charAt(0).toUpperCase()}</span>`;
    body.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div class="profile-avatar" id="profileAvatar">${avatarHtml}</div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none;">
        <button id="uploadAvatarBtn" class="profile-btn" style="background:#6a4c7c; margin-bottom:20px;">Trocar foto</button>
      </div>
      <div class="profile-tabs">
        <div class="profile-tab active" data-tab="favoritos">❤️ Favoritos</div>
        <div class="profile-tab" data-tab="watchlist">⏰ Assistir Depois</div>
        <div class="profile-tab" data-tab="config">⚙️ Configurações</div>
      </div>
      <div id="profileFavoritos" class="profile-section active"><div id="favGrid" class="fav-watchlist-grid"></div></div>
      <div id="profileWatchlist" class="profile-section"><div id="watchlistGrid" class="fav-watchlist-grid"></div></div>
      <div id="profileConfig" class="profile-section">
        <div class="change-password-form">
          <h3>Alterar senha</h3>
          <input type="password" id="currentPwd" placeholder="Senha atual">
          <input type="password" id="newPwd" placeholder="Nova senha">
          <input type="password" id="confirmPwd" placeholder="Confirmar nova senha">
          <button id="confirmChangePwd" class="profile-btn" style="background:#ff5a8a;">Salvar</button>
        </div>
      </div>
    `;
    await loadProfileFavWatchlist();
    document.getElementById("uploadAvatarBtn").onclick = () => document.getElementById("avatarFile").click();
    document.getElementById("avatarFile").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const storageRef = storage.ref(`avatars/${currentUser.uid}`);
      await storageRef.put(file);
      const url = await storageRef.getDownloadURL();
      await db.collection("users").doc(currentUser.uid).update({ photoURL: url });
      document.getElementById("profileAvatar").innerHTML = `<img src="${url}">`;
      showMessage("Foto atualizada!", false);
    };
    document.getElementById("confirmChangePwd").onclick = async () => {
      const current = document.getElementById("currentPwd").value;
      const newPwd = document.getElementById("newPwd").value;
      const confirm = document.getElementById("confirmPwd").value;
      if (newPwd !== confirm) { showMessage("As senhas não coincidem"); return; }
      if (newPwd.length < 6) { showMessage("Mínimo 6 caracteres"); return; }
      try {
        const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, current);
        await currentUser.reauthenticateWithCredential(credential);
        await currentUser.updatePassword(newPwd);
        showMessage("Senha alterada com sucesso!", false);
        document.getElementById("currentPwd").value = "";
        document.getElementById("newPwd").value = "";
        document.getElementById("confirmPwd").value = "";
      } catch (err) { showMessage("Erro: " + err.message); }
    };
    document.querySelectorAll(".profile-tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".profile-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        document.querySelectorAll(".profile-section").forEach(s => s.classList.remove("active"));
        document.getElementById(`profile${tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)}`).classList.add("active");
      };
    });
    modal.classList.add("active");
    document.querySelector(".close-profile-modal").onclick = () => modal.classList.remove("active");
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("active"); };
  }
  async function loadProfileFavWatchlist() {
    const favIds = Array.from(userFavorites);
    const watchIds = Array.from(userWatchlist);
    const [favItems, watchItems] = await Promise.all([fetchItemsByIds(favIds), fetchItemsByIds(watchIds)]);
    renderProfileGrid("favGrid", favItems);
    renderProfileGrid("watchlistGrid", watchItems);
  }
  async function fetchItemsByIds(ids) {
    if (!ids.length) return [];
    const items = [];
    for (const coll of ["animes", "series"]) {
      if (ids.length) {
        const snap = await db.collection(coll).where(firebase.firestore.FieldPath.documentId(), "in", ids.slice(0,10)).get();
        snap.forEach(doc => items.push({ id: doc.id, ...doc.data(), type: coll }));
      }
    }
    return items;
  }
  function renderProfileGrid(containerId, items) {
    const container = document.getElementById(containerId);
    if (!items.length) { container.innerHTML = "<p>Nenhum item encontrado.</p>"; return; }
    container.innerHTML = items.map(item => `
      <div class="anime-card" data-item='${JSON.stringify(item).replace(/'/g,"&#39;")}'>
        <div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23555%22%3E%3Cpath d=%22M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6z%22/%3E%3C/svg%3E'" style="object-fit:contain; background:#1a1530;"></div>
        <div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="watch-btn">🎬 ${item.seasons ? Object.keys(item.seasons).length : 0} episódios</div></div>
      </div>
    `).join('');
    container.querySelectorAll(".anime-card").forEach(card => {
      card.addEventListener("click", () => {
        const raw = card.dataset.item;
        if (raw) openDetailModal(JSON.parse(raw));
      });
    });
  }

  // ==================== CATÁLOGO OTIMIZADO ====================
  let currentCatalogType = "animes";
  let catalogLastDoc = null;
  let catalogIsLoading = false;
  let catalogCurrentSort = "recent";
  let catalogCurrentFilter = "Todos";
  let catalogCurrentSearch = "";
  let catalogAllLoaded = false;

  async function loadCatalog(reset = true) {
    if (reset) {
      catalogLastDoc = null;
      catalogAllLoaded = false;
      document.getElementById("content").innerHTML = '<div style="display:flex; justify-content:center; padding:50px;"><div class="loading-spinner"></div></div>';
      document.getElementById("catalogHeader").style.display = "flex";
    }
    if (catalogIsLoading) return;
    catalogIsLoading = true;
    let query = db.collection(currentCatalogType);
    if (catalogCurrentSort === "recent") query = query.orderBy("createdAt", "desc");
    else if (catalogCurrentSort === "oldest") query = query.orderBy("createdAt", "asc");
    else if (catalogCurrentSort === "az") query = query.orderBy("title", "asc");
    else if (catalogCurrentSort === "za") query = query.orderBy("title", "desc");
    if (catalogLastDoc && !reset) query = query.startAfter(catalogLastDoc);
    query = query.limit(12);
    const snap = await query.get();
    if (snap.empty) { catalogAllLoaded = true; catalogIsLoading = false; if (!reset) showMessage("Todos os itens carregados", false); return; }
    catalogLastDoc = snap.docs[snap.docs.length-1];
    let items = []; snap.forEach(d => items.push({ id: d.id, ...d.data(), type: currentCatalogType }));
    if (reset) {
      let html = `<div class="anime-grid" id="mediaGrid"></div><button id="loadMoreBtn" class="load-more-btn">Carregar mais</button>`;
      if (userData?.isAdmin) {
        const tipoLabel = currentCatalogType === "animes" ? "FILME" : "SÉRIE";
        html = `<div class="admin-form"><h3>📢 PUBLICAR NOVO ${tipoLabel}</h3>
          <input id="newTitle" placeholder="Título"><textarea id="newDesc" rows="3" placeholder="Descrição"></textarea>
          <div class="categories-checkbox-group"><strong>Categorias:</strong><br>${CATEGORIES.map(c => `<label><input type="checkbox" value="${c}" class="cat-checkbox"> ${c}</label>`).join('')}</div>
          <input id="newImage" placeholder="URL da capa"><div id="seasonsContainer"></div>
          <button type="button" id="addSeasonBtn" class="add-season-btn">+ Adicionar Temporada</button>
          <button id="publishBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); margin-top:15px; padding:12px; width:100%; border-radius:60px; border:none; color:white; font-weight:bold;">✨ PUBLICAR ✨</button></div>` + html;
      }
      document.getElementById("content").innerHTML = html;
      if (userData?.isAdmin) {
        let seasonCounter=1;
        function addSeason(seasonName=null) {
          const container = document.getElementById("seasonsContainer");
          const seasonId = Date.now() + seasonCounter;
          const seasonTitle = seasonName || `Temporada ${seasonCounter}`;
          const div = document.createElement('div'); div.className = "season-item"; div.setAttribute("data-season-id", seasonId);
          div.innerHTML = `<h4>${escapeHtml(seasonTitle)} <button class="remove-season-btn" style="background:#a5426a; padding:4px 12px; border-radius:40px;">Remover</button></h4><div class="episodes-list-${seasonId}"></div><button class="add-ep-btn-season" data-season="${seasonId}" style="background:#6a4c7c; padding:6px 12px; border-radius:40px;">+ Episódio</button>`;
          container.appendChild(div);
          div.querySelector(".remove-season-btn").onclick = () => div.remove();
          div.querySelector(".add-ep-btn-season").onclick = () => addEpisode(seasonId);
          seasonCounter++;
        }
        function addEpisode(seasonId) {
          const seasonDiv = document.querySelector(`.season-item[data-season-id="${seasonId}"]`);
          const episodesDiv = seasonDiv.querySelector(`.episodes-list-${seasonId}`);
          const epDiv = document.createElement('div'); epDiv.className = "episode-item";
          epDiv.innerHTML = `<input class="ep-name" placeholder="Nome do episódio" style="flex:1; min-width:120px;"><input class="ep-dub-link" placeholder="Link DUB" style="flex:2;"><input class="ep-leg-link" placeholder="Link LEG" style="flex:2;"><input class="ep-img" placeholder="URL da imagem" style="flex:1;"><button class="remove-ep" style="background:#a5426a; padding:4px 10px; border-radius:40px;">Remover</button>`;
          epDiv.querySelector(".remove-ep").onclick = () => epDiv.remove();
          episodesDiv.appendChild(epDiv);
        }
        document.getElementById("addSeasonBtn").onclick = () => addSeason();
        addSeason("Temporada 1");
        document.getElementById("publishBtn").onclick = async () => {
          const title = document.getElementById("newTitle").value.trim();
          const desc = document.getElementById("newDesc").value;
          const cats = Array.from(document.querySelectorAll(".cat-checkbox:checked")).map(cb => cb.value);
          const img = document.getElementById("newImage").value;
          if (!title) return showMessage("Título obrigatório");
          if (!cats.length) return showMessage("Selecione categorias");
          const seasons = {};
          const sDivs = document.querySelectorAll("#seasonsContainer .season-item");
          for (let s of sDivs) {
            let sName = s.querySelector("h4")?.innerText.replace("Remover", "").trim();
            if (!sName) continue;
            const eps = [];
            const eDivs = s.querySelectorAll(".episode-item");
            for (let e of eDivs) {
              const epName = e.querySelector(".ep-name")?.value.trim();
              const dub = e.querySelector(".ep-dub-link")?.value.trim();
              const leg = e.querySelector(".ep-leg-link")?.value.trim();
              const epImg = e.querySelector(".ep-img")?.value.trim();
              if (epName && (dub || leg)) eps.push({ name: epName, dubLink: dub || "", legLink: leg || "", imageUrl: epImg || "" });
            }
            if (eps.length) seasons[sName] = eps;
          }
          if (Object.keys(seasons).length === 0) return showMessage("Adicione pelo menos uma temporada com episódios!");
          await db.collection(currentCatalogType).add({ title, description: desc, categories: cats, imageUrl: img, seasons, createdAt: new Date() });
          showMessage("Publicado!", false);
          loadCatalog(true);
        };
      }
      document.getElementById("toggleFilmesBtn").onclick = () => { currentCatalogType = "animes"; loadCatalog(true); };
      document.getElementById("toggleSeriesBtn").onclick = () => { currentCatalogType = "series"; loadCatalog(true); };
      document.getElementById("sortSelect").onchange = (e) => { catalogCurrentSort = e.target.value; loadCatalog(true); };
      document.getElementById("loadMoreBtn").onclick = () => loadCatalog(false);
      document.getElementById("searchInput").oninput = (e) => { catalogCurrentSearch = e.target.value.toLowerCase(); renderGrid(items, catalogCurrentFilter, catalogCurrentSearch); };

      genresContent.innerHTML = `<a data-cat="Todos">Todos</a>` + CATEGORIES.map(c => `<a data-cat="${c}">${c}</a>`).join('');

        e.stopPropagation();
        genresContent.classList.toggle("show");

      document.addEventListener("click", (e) => {

          genresContent.classList.remove("show");

      });
      genresContent.querySelectorAll("a").forEach(a => {
        a.onclick = (e) => {

      });
    }
    async function renderGrid(list, filter, search) {

          <div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="categories-wrapper">${getItemCategories(item).map(c=>`<span class="category-badge">${escapeHtml(c)}</span>`).join('')}</div><div class="rating-stars">${starsHtml}</div><div class="watch-btn">🎬 ${totalEpisodes(item)} episódios</div></div>
        </div>`);
      }
      const newCardsHtml = newCards.join('');
      if (reset) grid.innerHTML = newCardsHtml;
      else grid.insertAdjacentHTML('beforeend', newCardsHtml);
      document.querySelectorAll(".anime-card").forEach(card => {
        card.addEventListener("click", (e) => { if(e.target.classList.contains("favorite-btn-overlay")||e.target.classList.contains("watchlist-btn-overlay")) return; const raw = card.dataset.item; if(raw) openDetailModal(JSON.parse(raw)); });
      });
      document.querySelectorAll(".favorite-btn-overlay").forEach(btn => { btn.onclick = async e => { e.stopPropagation(); await toggleFavorite(btn.dataset.id); await loadUserFavorites(); renderGrid([...items, ...(reset?[]:[])], catalogCurrentFilter, catalogCurrentSearch); }; });
      document.querySelectorAll(".watchlist-btn-overlay").forEach(btn => { btn.onclick = async e => { e.stopPropagation(); await toggleWatchlist(btn.dataset.id); await loadUserWatchlist(); renderGrid([...items, ...(reset?[]:[])], catalogCurrentFilter, catalogCurrentSearch); }; });
    }
    await renderGrid(items, catalogCurrentFilter, catalogCurrentSearch);

  // ==================== MODAL DE DETALHES COMPLETO ====================
  async function openDetailModal(item, seasonToOpen = null, episodeToOpen = null) {
    const modal = document.getElementById("detailModal");
    const modalBody = document.getElementById("modalBody");
    const seasons = item.seasons || {};
    const seasonNames = Object.keys(seasons);
    let currentSeason = seasonToOpen || seasonNames[0] || "";
    let currentEpisodes = seasons[currentSeason] || [];
    let currentEpisodeIndex = episodeToOpen !== null ? episodeToOpen : -1;
    let searchTerm = "";

    function isDirectVideoLink(url) { if (!url) return false; return /\.(mp4|webm|mkv|mov|avi)(\?.*)?$/i.test(url); }

    async function loadMediaAtIndex(idx) {
      if (idx < 0 || idx >= currentEpisodes.length) { showMessage("Fim dos episódios!", false); closePlayer(); return; }
      currentEpisodeIndex = idx;
      const ep = currentEpisodes[idx];
      let mediaUrl = ep.dubLink || ep.legLink;
      if (!mediaUrl) { showMessage("Nenhum link de vídeo"); return; }
      const container = document.getElementById("videoPlayerContainer");
      const videoElem = document.getElementById("nativeVideo");
      const iframeElem = document.getElementById("embedIframe");
      if (!container) return;
      videoElem.style.display = "none"; iframeElem.style.display = "none";
      videoElem.pause(); videoElem.src = ""; iframeElem.src = "";
      container.style.display = "block";
      if (isDirectVideoLink(mediaUrl)) {
        videoElem.style.display = "block"; iframeElem.style.display = "none";
        videoElem.src = mediaUrl; videoElem.load();
        videoElem.play().catch(e => console.log);
        const progDoc = await db.collection("progresso").doc(`${currentUser?.uid}_${item.id}_${currentSeason}_${idx}`).get();
        if (progDoc.exists && progDoc.data().currentTime) {
          videoElem.currentTime = progDoc.data().currentTime;
        }
        videoElem.ontimeupdate = () => {
          saveProgress(item.id, currentSeason, idx, ep.dubLink ? "dub" : "leg", videoElem.currentTime);
        };
      } else {
        videoElem.style.display = "none"; iframeElem.style.display = "block";
        let embedUrl = mediaUrl;
        if (mediaUrl.includes("<iframe")) { const m = mediaUrl.match(/src=["']([^"']+)["']/); if (m) embedUrl = m[1]; else embedUrl = mediaUrl; }
        iframeElem.src = embedUrl;
      }
      if (currentUser && item.id) saveProgress(item.id, currentSeason, idx, ep.dubLink ? "dub" : "leg");
      showMessage(`Reproduzindo: ${ep.name}`, false);
      setTimeout(() => { container.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
    }

    function closePlayer() {
      const c = document.getElementById("videoPlayerContainer"); if (c) c.style.display = "none";
      const v = document.getElementById("nativeVideo"); if (v) { v.pause(); v.src = ""; }
      const i = document.getElementById("embedIframe"); if (i) i.src = "";
    }

    function nextEpisode() {
      if (currentEpisodeIndex + 1 < currentEpisodes.length) {
        showMessage("Carregando próximo episódio...", false);
        loadMediaAtIndex(currentEpisodeIndex + 1);
      } else { showMessage("Último episódio da temporada!", false); closePlayer(); }
    }

    function renderSeasonEpisodes(sname) {
      let eps = seasons[sname] || [];
      if (searchTerm) {
        eps = eps.filter(ep => ep.name.toLowerCase().includes(searchTerm.toLowerCase()));
      }
      currentEpisodes = eps;
      if (eps.length === 0) return '<div style="text-align:center;padding:20px;">Nenhum episódio encontrado</div>';
      return `<div class="modal-episode-list">${eps.map((ep, i) => `
        <div class="modal-episode-item" data-ep-index="${i}" data-ep-name="${escapeHtml(ep.name)}">
          <span>▶ ${escapeHtml(ep.name)}</span>
          <div style="display:flex; gap:8px;">
            ${ep.dubLink ? `<span class="episode-audio-badge" data-audio="dub">DUB</span>` : ''}
            ${ep.legLink ? `<span class="episode-audio-badge" data-audio="leg">LEG</span>` : ''}
            <button class="episode-watched-btn" data-ep-index="${i}" style="background:#4caf50; border:none; border-radius:30px; padding:4px 12px; cursor:pointer;">✓</button>
            <button class="episode-share-btn" data-ep-index="${i}" style="background:#6a4c7c; border:none; border-radius:30px; padding:4px 12px; cursor:pointer;">🔗</button>
          </div>
        </div>
      `).join('')}</div>`;
    }

    function renderSeasonTabs() {
      if (seasonNames.length === 0) return '<div>Nenhuma temporada cadastrada</div>';
      return `<div class="season-tabs" id="seasonTabsModal">${seasonNames.map(s => `<div class="season-tab" data-season="${s}">${escapeHtml(s)}</div>`).join('')}</div>
              <div class="episode-search-bar"><input type="text" id="episodeSearch" placeholder="Buscar episódio..."></div>
              <div id="episodesListModal">${renderSeasonEpisodes(currentSeason)}</div>`;
    }

    const ratingContainer = document.createElement('div');
    ratingContainer.className = 'modal-rating';
    ratingContainer.innerHTML = '<strong>Sua nota:</strong> <div id="starsTarget"></div>';

    modalBody.innerHTML = `
      <div class="modal-top">
        <div class="modal-image"><img src="${item.imageUrl || 'https://placehold.co/600x900?text=YK'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23555%22%3E%3Cpath d=%22M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6z%22/%3E%3C/svg%3E'" style="object-fit:contain; background:#1a1530;"></div>
        <div class="modal-info">
          <h3>${escapeHtml(item.title)}</h3>
          <div class="modal-categories">${getItemCategories(item).map(c => `<span class="modal-cat">${c}</span>`).join('')}</div>
          <div class="modal-desc">${escapeHtml(item.description || "Sem descrição.").replace(/\n/g, '<br>')}</div>
          <div id="starsContainer"></div>
          <button id="watchlistModalBtn" style="margin-top:10px; background:${userWatchlist.has(item.id) ? '#ff5a8a' : '#6a4c7c'}; border:none; border-radius:40px; padding:8px 20px; color:white; cursor:pointer;">${userWatchlist.has(item.id) ? '❤️ Assistir Depois' : '🤍 Assistir Depois'}</button>
        </div>
      </div>
      <div id="videoPlayerContainer" class="video-player-container" style="display:none;">
        <video id="nativeVideo" controls style="width:100%; height:400px; background:#000; display:none;"></video>
        <iframe id="embedIframe" frameborder="0" allowfullscreen style="width:100%; height:400px; display:none;"></iframe>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
          <button class="close-player-btn" id="closePlayerBtn">Fechar</button>
          <button class="next-ep-btn" id="nextEpisodeBtn">Próximo episódio</button>
        </div>
      </div>
      <div>${renderSeasonTabs()}</div>
    `;

    const starsContainerDiv = document.getElementById("starsContainer");
    if (starsContainerDiv) {
      await renderStarsInContainer(item.id, starsContainerDiv, true);
    }

    document.getElementById("watchlistModalBtn")?.addEventListener("click", async () => {
      await toggleWatchlist(item.id);
      const btn = document.getElementById("watchlistModalBtn");
      if (btn) {
        const isInWatchlist = userWatchlist.has(item.id);
        btn.innerHTML = isInWatchlist ? '❤️ Assistir Depois' : '🤍 Assistir Depois';
        btn.style.background = isInWatchlist ? '#ff5a8a' : '#6a4c7c';
      }
    });
    document.getElementById("nextEpisodeBtn")?.addEventListener("click", nextEpisode);
    document.getElementById("closePlayerBtn")?.addEventListener("click", closePlayer);
    document.getElementById("nativeVideo")?.addEventListener("ended", nextEpisode);

    document.querySelectorAll("#seasonTabsModal .season-tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll("#seasonTabsModal .season-tab").forEach(tt => tt.classList.remove("active"));
        t.classList.add("active"); currentSeason = t.dataset.season;
        document.getElementById("episodesListModal").innerHTML = renderSeasonEpisodes(currentSeason);
        attachEpisodeEvents(); closePlayer();
      };
    });
    if (seasonNames.length) document.querySelector("#seasonTabsModal .season-tab")?.classList.add("active");
    document.getElementById("episodeSearch")?.addEventListener("input", (e) => {
      searchTerm = e.target.value.toLowerCase();
      document.getElementById("episodesListModal").innerHTML = renderSeasonEpisodes(currentSeason);
      attachEpisodeEvents();
    });

    function attachEpisodeEvents() {
      document.querySelectorAll(".modal-episode-item").forEach(el => {
        const idx = parseInt(el.dataset.epIndex);
        el.querySelectorAll(".episode-audio-badge").forEach(badge => {
          badge.onclick = (e) => { e.stopPropagation(); loadMediaAtIndex(idx); };
        });
        el.querySelector(".episode-watched-btn")?.addEventListener("click", async (e) => {
          e.stopPropagation();
          await toggleWatched(item.id, currentSeason, idx);
          document.getElementById("episodesListModal").innerHTML = renderSeasonEpisodes(currentSeason);
          attachEpisodeEvents();
        });
        el.querySelector(".episode-share-btn")?.addEventListener("click", (e) => {
          e.stopPropagation();
          shareEpisode(item.id, currentSeason, idx, currentEpisodes[idx].name);
        });
      });
    }
    attachEpisodeEvents();

    if (episodeToOpen !== null) loadMediaAtIndex(episodeToOpen);
    modal.classList.add("active");
    modal.dataset.currentItem = JSON.stringify(item);
    document.getElementById("closeModalBtn").onclick = () => { closePlayer(); modal.classList.remove("active"); };
    modal.onclick = e => { if (e.target === modal) { closePlayer(); modal.classList.remove("active"); } };
  }

  async function saveProgress(mediaId, seasonName, episodeIndex, audioType, currentTime = 0) {
    if (!currentUser) return;
    await db.collection("progresso").doc(`${currentUser.uid}_${mediaId}_${seasonName}_${episodeIndex}`).set({
      userId: currentUser.uid, mediaId, seasonName, episodeIndex, audioType,
      currentTime, updatedAt: new Date()
    }, { merge: true });
  }
  async function toggleWatched(mediaId, seasonName, episodeIndex) {
    if (!currentUser) return;
    const progRef = db.collection("progresso").doc(`${currentUser.uid}_${mediaId}_${seasonName}_${episodeIndex}`);
    const doc = await progRef.get();
    const wasWatched = doc.exists && doc.data().watched === true;
    await progRef.set({ watched: !wasWatched, updatedAt: new Date() }, { merge: true });
    showMessage(wasWatched ? "Marcado como não assistido" : "Marcado como assistido!", false);
    const modal = document.getElementById("detailModal");
    if (modal.classList.contains("active") && modal.dataset.currentItem) {
      const item = JSON.parse(modal.dataset.currentItem);
      openDetailModal(item);
    }
  }
  function shareEpisode(mediaId, seasonName, episodeIndex, episodeName) {
    const url = `${window.location.origin}${window.location.pathname}?media=${mediaId}&season=${encodeURIComponent(seasonName)}&ep=${episodeIndex}`;
    navigator.clipboard.writeText(url);
    showMessage(`Link copiado: ${episodeName}`, false);
  }

  async function renderStarsInContainer(mediaId, containerElement, interactive = true) {
    const userRating = await getUserRating(mediaId);
    const avgRating = await getAverageRating(mediaId);
    containerElement.innerHTML = '';
    const starsDiv = document.createElement('div');
    starsDiv.style.display = 'flex';
    starsDiv.style.gap = '8px';
    for (let i = 1; i <= 5; i++) {
      const star = document.createElement('span');
      star.textContent = '★';
      star.style.fontSize = '28px';
      star.style.cursor = interactive ? 'pointer' : 'default';
      star.style.color = (userRating && i <= userRating) ? '#ffcc00' : '#555';
      star.style.transition = 'transform 0.1s';
      if (interactive) {
        star.addEventListener('click', async (e) => {
          e.stopPropagation();
          await saveUserRating(mediaId, i);
          await renderStarsInContainer(mediaId, containerElement, true);
          const avgElement = containerElement.parentElement?.querySelector('.average-rating');
          if (avgElement) {
            const newAvg = await getAverageRating(mediaId);
            avgElement.textContent = newAvg ? `Média: ${newAvg} ⭐` : 'Seja o primeiro a avaliar!';
          }
        });
        star.addEventListener('mouseenter', () => star.style.transform = 'scale(1.2)');
        star.addEventListener('mouseleave', () => star.style.transform = 'scale(1)');
      }
      starsDiv.appendChild(star);
    }
    const avgSpan = document.createElement('div');
    avgSpan.className = 'average-rating';
    avgSpan.style.marginTop = '8px';
    avgSpan.style.fontSize = '13px';
    avgSpan.style.color = '#ccb0e0';
    avgSpan.textContent = avgRating ? `Média: ${avgRating} ⭐` : 'Seja o primeiro a avaliar!';
    containerElement.appendChild(starsDiv);
    containerElement.appendChild(avgSpan);
  }

  async function loadAvisos() {
    const snap = await db.collection("avisos").orderBy("createdAt", "desc").get();
    let avisos = []; snap.forEach(d => avisos.push({ id: d.id, ...d.data() }));
    let html = `<div class="admin-form"><h3>Central de Avisos</h3>`;
    if (userData?.isAdmin) html += `<textarea id="newAvisoMsg" rows="3" placeholder="Escreva um novo aviso..." style="width:100%; background:#251f36; border-radius:20px; padding:12px; margin-bottom:10px;"></textarea><button id="postAvisoBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); padding:10px 24px; border-radius:60px; border:none; color:white; font-weight:bold; cursor:pointer;">Publicar Aviso</button><hr>`;
    html += `<div id="avisosList">`;
    if (avisos.length === 0) html += `<p style="text-align:center; padding:20px;">Nenhum aviso ainda.</p>`;
    else avisos.forEach(a => { html += `<div class="announcement-card"><strong>Sylnar</strong> <small>${a.createdAt?.toDate?.().toLocaleString() || ''}</small><p style="margin-top:8px;">${escapeHtml(a.message)}</p>${userData?.isAdmin ? `<button class="deleteAvisoBtn" data-id="${a.id}" style="background:#a5426a; border:none; border-radius:40px; padding:4px 12px; margin-top:8px; cursor:pointer;">Remover</button>` : ''}</div>`; });
    html += `</div></div>`;
    document.getElementById("content").innerHTML = html;
    if (userData?.isAdmin) {
      document.getElementById("postAvisoBtn")?.addEventListener("click", async () => { const msg = document.getElementById("newAvisoMsg").value.trim(); if (!msg) return; await db.collection("avisos").add({ message: msg, authorName: "Sylnar", authorId: currentUser.uid, createdAt: new Date() }); showMessage("Aviso publicado!", false); loadAvisos(); });
      document.querySelectorAll(".deleteAvisoBtn").forEach(btn => { btn.onclick = async () => { if (confirm("Remover?")) { await db.collection("avisos").doc(btn.dataset.id).delete(); loadAvisos(); } }; });
    }
  }

  // ==================== EDIÇÃO (MODO EDIT) ====================
  async function loadEditMode() {
    const content = document.getElementById("content");
    content.innerHTML = `<div class="admin-form"><h2>MODO EDIÇÃO - GERENCIAR OBRAS</h2><div style="display:flex; gap:15px; margin-bottom:25px;"><button id="editFilmesBtn" class="filter-chip active">Editar Filmes</button><button id="editSeriesBtn" class="filter-chip">Editar Séries</button></div><div id="editGridContainer"></div></div>`;
    let currentType = "animes";
    async function loadEditGrid() {
      const snap = await db.collection(currentType).get();
      let items = []; snap.forEach(d => items.push({ id: d.id, ...d.data(), type: currentType }));
      const container = document.getElementById("editGridContainer");
      if (!items.length) { container.innerHTML = "<p style='text-align:center;padding:40px;'>Nenhum item encontrado</p>"; return; }
      container.innerHTML = `<div class="anime-grid">${items.map(item => `<div class="anime-card" style="position:relative;"><button class="edit-btn" data-id="${item.id}" data-type="${currentType}">Editar</button><button class="move-btn" data-id="${item.id}" data-type="${currentType}">Mover</button><button class="duplicate-btn" data-id="${item.id}" data-type="${currentType}">Duplicar</button><button class="delete-btn" data-id="${item.id}" data-type="${currentType}">Excluir</button><div class="anime-image"><img src="${item.imageUrl||'https://placehold.co/600x900?text=YK'}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23555%22%3E%3Cpath d=%22M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6z%22/%3E%3C/svg%3E'" style="object-fit:contain; background:#1a1530;"></div><div class="card-content"><h3>${escapeHtml(item.title)}</h3><div class="watch-btn">${item.seasons?Object.keys(item.seasons).length:0} temporada(s)</div></div></div>`).join('')}</div>`;
      document.querySelectorAll(".edit-btn").forEach(btn => { btn.onclick = async e => { e.stopPropagation(); const id = btn.dataset.id; const type = btn.dataset.type; const doc = await db.collection(type).doc(id).get(); if (doc.exists) openFullEditModal({ id, ...doc.data(), type }); }; });
      document.querySelectorAll(".move-btn").forEach(btn => { btn.onclick = async e => { e.stopPropagation(); const id = btn.dataset.id; const type = btn.dataset.type; const doc = await db.collection(type).doc(id).get(); if (doc.exists) showMoveDialog({ id, ...doc.data(), type }); }; });
      document.querySelectorAll(".duplicate-btn").forEach(btn => { btn.onclick = async e => { e.stopPropagation(); const id = btn.dataset.id; const type = btn.dataset.type; const doc = await db.collection(type).doc(id).get(); if (doc.exists) duplicateItem({ id, ...doc.data(), type }); }; });
      document.querySelectorAll(".delete-btn").forEach(btn => { btn.onclick = async e => { e.stopPropagation(); if (confirm("Deletar permanentemente?")) { await db.collection(btn.dataset.type).doc(btn.dataset.id).delete(); showMessage("Deletado!", false); loadEditGrid(); } }; });
    }
    document.getElementById("editFilmesBtn").onclick = () => { currentType = "animes"; document.getElementById("editFilmesBtn").classList.add("active"); document.getElementById("editSeriesBtn").classList.remove("active"); loadEditGrid(); };
    document.getElementById("editSeriesBtn").onclick = () => { currentType = "series"; document.getElementById("editSeriesBtn").classList.add("active"); document.getElementById("editFilmesBtn").classList.remove("active"); loadEditGrid(); };
    loadEditGrid();
  }
  async function duplicateItem(item) {
    const newId = `${item.id}_copy_${Date.now()}`;
    const newData = { ...item };
    delete newData.id;
    delete newData.type;
    newData.title = `${item.title} (cópia)`;
    newData.createdAt = new Date();
    await db.collection(item.type).doc(newId).set(newData);
    showMessage(`"${item.title}" duplicado!`, false);
    loadEditMode();
  }
  async function showMoveDialog(item) {
    const modalDiv = document.createElement('div');
    modalDiv.style.position = 'fixed';
    modalDiv.style.top = '0';
    modalDiv.style.left = '0';
    modalDiv.style.width = '100%';
    modalDiv.style.height = '100%';
    modalDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
    modalDiv.style.display = 'flex';
    modalDiv.style.alignItems = 'center';
    modalDiv.style.justifyContent = 'center';
    modalDiv.style.zIndex = '1000';
    modalDiv.innerHTML = `
      <div style="background:#1c152e; padding:30px; border-radius:30px; text-align:center; border:1px solid #ff5a8a;">
        <h3 style="margin-bottom:20px;">Mover: ${escapeHtml(item.title)}</h3>
        <div style="display:flex; gap:20px; justify-content:center;">
          <button id="moveToMovies" style="background:#ff5a8a; border:none; padding:10px 25px; border-radius:40px; color:white; cursor:pointer;">Filmes</button>
          <button id="moveToSeries" style="background:#6a4c7c; border:none; padding:10px 25px; border-radius:40px; color:white; cursor:pointer;">Séries</button>
          <button id="cancelMove" style="background:#a5426a; border:none; padding:10px 25px; border-radius:40px; color:white; cursor:pointer;">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById('moveToMovies').onclick = () => { modalDiv.remove(); moveItemBetweenCollections(item, 'animes'); };
    document.getElementById('moveToSeries').onclick = () => { modalDiv.remove(); moveItemBetweenCollections(item, 'series'); };
    document.getElementById('cancelMove').onclick = () => modalDiv.remove();
  }
  async function moveItemBetweenCollections(item, targetCollection) {
    if (!confirm(`Mover "${item.title}" para ${targetCollection === 'animes' ? 'FILMES' : 'SÉRIES'}?`)) return;
    try {
      const sourceCollection = item.type;
      if (sourceCollection === targetCollection) { showMessage("O item já está nesta categoria!"); return; }
      const newDocRef = db.collection(targetCollection).doc(item.id);
      const newData = { ...item };
      delete newData.type;
      await newDocRef.set(newData);
      await db.collection(sourceCollection).doc(item.id).delete();
      const favSnapshot = await db.collection("favoritos").get();
      for (const favDoc of favSnapshot.docs) {
        const data = favDoc.data();
        if (data.itens && data.itens.includes(item.id)) {
          const newItens = data.itens.filter(id => id !== item.id);
          newItens.push(item.id);
          await favDoc.ref.update({ itens: newItens, updatedAt: new Date() });
        }
      }
      const progSnapshot = await db.collection("progresso").where("mediaId", "==", item.id).get();
      for (const progDoc of progSnapshot.docs) {
        await progDoc.ref.update({ mediaId: item.id });
      }
      showMessage(`Item movido para ${targetCollection === 'animes' ? 'FILMES' : 'SÉRIES'}!`, false);
      loadEditMode();
    } catch (error) { showMessage("Erro ao mover item."); }
  }
  async function openFullEditModal(item) {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal-overlay active';
    modalDiv.style.visibility = 'visible'; modalDiv.style.opacity = '1';
    let seasonsHtml = '';
    const seasons = item.seasons || {};
    for (let [seasonName, episodes] of Object.entries(seasons)) {
      let epsHtml = '';
      episodes.forEach(ep => {
        epsHtml += `<div class="episode-edit-item">
          <input type="text" class="edit-ep-name" value="${escapeHtml(ep.name)}" placeholder="Nome do Episódio" style="width:100%; margin-bottom:5px;">
          <input type="text" class="edit-ep-dub" value="${escapeHtml(ep.dubLink || '')}" placeholder="Link DUB" style="width:100%; margin-bottom:5px;">
          <input type="text" class="edit-ep-leg" value="${escapeHtml(ep.legLink || '')}" placeholder="Link LEG" style="width:100%; margin-bottom:5px;">
          <input type="text" class="edit-ep-img" value="${escapeHtml(ep.imageUrl || '')}" placeholder="URL da Imagem" style="width:100%;">
          <button class="remove-episode-btn" style="margin-top:5px; background:#a5426a; border:none; border-radius:20px; padding:4px 12px; color:white; cursor:pointer;">Remover Episódio</button>
        </div>`;
      });
      seasonsHtml += `<div class="season-edit-item" data-season-name="${escapeHtml(seasonName)}">
        <div class="edit-season-header"><input type="text" class="edit-season-name" value="${escapeHtml(seasonName)}" placeholder="Nome da Temporada" style="flex:1;"><button class="remove-season-btn" style="background:#a5426a; border:none; border-radius:20px; padding:4px 12px; margin-left:10px;">Remover Temporada</button></div>
        <div class="episodes-edit-container">${epsHtml}</div><button class="add-episode-btn" style="margin-top:10px; background:#6a4c7c; border:none; border-radius:20px; padding:6px 12px;">+ Adicionar Episódio</button>
      </div>`;
    }
    modalDiv.innerHTML = `<div class="edit-form-modal"><div style="display:flex; justify-content:space-between;"><h2>Editando: ${escapeHtml(item.title)}</h2><button class="close-edit-modal" style="background:none; border:none; font-size:28px;">✕</button></div>
      <input id="editTitle" value="${escapeHtml(item.title)}" placeholder="Título"><textarea id="editDesc" rows="3">${escapeHtml(item.description || '')}</textarea>
      <div class="categories-checkbox-group">${CATEGORIES.map(c => `<label><input type="checkbox" value="${c}" class="edit-cat" ${getItemCategories(item).includes(c) ? 'checked' : ''}> ${c}</label>`).join('')}</div>
      <input id="editImage" value="${escapeHtml(item.imageUrl || '')}" placeholder="URL da capa"><div id="editSeasonsContainer">${seasonsHtml || '<p>Nenhuma temporada.</p>'}</div>
      <button id="addSeasonEditBtn" class="add-season-btn" style="margin-top:15px;">+ Nova Temporada</button>
      <button id="saveEditBtn" style="background:linear-gradient(135deg,#ff5a8a,#ff3366); margin-top:20px; padding:12px; width:100%; border-radius:60px; color:white; font-weight:bold;">SALVAR ALTERAÇÕES</button></div>`;
    document.body.appendChild(modalDiv);
    modalDiv.querySelector('.close-edit-modal').onclick = () => modalDiv.remove();
    modalDiv.onclick = (e) => { if (e.target === modalDiv) modalDiv.remove(); };
    modalDiv.querySelector('#addSeasonEditBtn').onclick = () => {
      const newSeasonName = prompt("Nome da nova temporada:");
      if (!newSeasonName) return;
      const container = modalDiv.querySelector('#editSeasonsContainer');
      const seasonDiv = document.createElement('div'); seasonDiv.className = 'season-edit-item';
      seasonDiv.innerHTML = `<div class="edit-season-header"><input type="text" class="edit-season-name" value="${escapeHtml(newSeasonName)}" style="flex:1;"><button class="remove-season-btn" style="background:#a5426a; border:none; border-radius:20px; padding:4px 12px; margin-left:10px;">Remover Temporada</button></div><div class="episodes-edit-container"></div><button class="add-episode-btn" style="margin-top:10px; background:#6a4c7c; border:none; border-radius:20px; padding:6px 12px;">+ Adicionar Episódio</button>`;
      attachSeasonEvents(seasonDiv);
      container.appendChild(seasonDiv);
    };
    function attachSeasonEvents(seasonDiv) {
      seasonDiv.querySelector('.add-episode-btn').onclick = () => {
        const epsContainer = seasonDiv.querySelector('.episodes-edit-container');
        const epDiv = document.createElement('div'); epDiv.className = 'episode-edit-item';
        epDiv.innerHTML = `<input type="text" class="edit-ep-name" placeholder="Nome do Episódio" style="width:100%;"><input type="text" class="edit-ep-dub" placeholder="Link DUB" style="width:100%;"><input type="text" class="edit-ep-leg" placeholder="Link LEG" style="width:100%;"><input type="text" class="edit-ep-img" placeholder="URL da Imagem" style="width:100%;"><button class="remove-episode-btn" style="background:#a5426a; border:none; border-radius:20px; padding:4px 12px;">Remover Episódio</button>`;
        epDiv.querySelector('.remove-episode-btn').onclick = () => epDiv.remove();
        epsContainer.appendChild(epDiv);
      };
      seasonDiv.querySelector('.remove-season-btn').onclick = () => seasonDiv.remove();
    }
    modalDiv.querySelectorAll('.season-edit-item').forEach(attachSeasonEvents);
    modalDiv.querySelector('#saveEditBtn').onclick = async () => {
      const newTitle = modalDiv.querySelector('#editTitle').value.trim();
      const newDesc = modalDiv.querySelector('#editDesc').value;
      const newCats = Array.from(modalDiv.querySelectorAll('.edit-cat:checked')).map(cb => cb.value);
      const newImg = modalDiv.querySelector('#editImage').value;
      if (!newTitle) return showMessage("Título obrigatório!");
      if (!newCats.length) return showMessage("Selecione pelo menos uma categoria!");
      const newSeasons = {};
      const seasonDivs = modalDiv.querySelectorAll('#editSeasonsContainer .season-edit-item');
      for (let sDiv of seasonDivs) {
        let seasonName = sDiv.querySelector('.edit-season-name')?.value.trim();
        if (!seasonName) continue;
        const episodes = [];
        const epDivs = sDiv.querySelectorAll('.episode-edit-item');
        for (let epDiv of epDivs) {
          const epName = epDiv.querySelector('.edit-ep-name')?.value.trim();
          const dubLink = epDiv.querySelector('.edit-ep-dub')?.value.trim();
          const legLink = epDiv.querySelector('.edit-ep-leg')?.value.trim();
          const epImg = epDiv.querySelector('.edit-ep-img')?.value.trim();
          if (epName && (dubLink || legLink)) episodes.push({ name: epName, dubLink: dubLink || "", legLink: legLink || "", imageUrl: epImg || "" });
        }
        if (episodes.length) newSeasons[seasonName] = episodes;
      }
      await db.collection(item.type).doc(item.id).update({ title: newTitle, description: newDesc, categories: newCats, imageUrl: newImg, seasons: newSeasons, updatedAt: new Date() });
      showMessage("Obra atualizada com sucesso!", false);
      modalDiv.remove();
      loadEditMode();
    };
  }

  async function loadAdminPanel() {
    if (!userData?.isAdmin) { document.getElementById("content").innerHTML = "<div class='admin-form'>Acesso restrito</div>"; return; }
    const usersCount = (await db.collection("users").get()).size;
    const filmesCount = (await db.collection("animes").get()).size;
    const seriesCount = (await db.collection("series").get()).size;
    const favsCount = (await db.collection("favoritos").get()).size;
    const avisosCount = (await db.collection("avisos").get()).size;
    const usersSnapshot = await db.collection("users").get();
    let usersListHtml = "";
    usersSnapshot.forEach(doc => { const u = doc.data(); usersListHtml += `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:#1f1830; margin:8px 0; border-radius:28px; flex-wrap:wrap;"><div><strong>${escapeHtml(u.name)}</strong><br><small>${u.email}</small></div>${!u.isAdmin && u.email !== MASTER_EMAIL ? `<button class="promote-btn" data-uid="${doc.id}">Promover a Admin</button>` : u.isAdmin ? "<span style='color:#ff5a8a;'>Administrador</span>" : "<span style='color:#888;'>Usuário comum</span>"}</div>`; });
    let html = `<div class="admin-form">
      <h3>📊 Estatísticas do Sistema</h3>
      <div class="stats-grid"><div class="stat-card"><div class="stat-number">${usersCount}</div><div class="stat-label">Usuários</div></div><div class="stat-card"><div class="stat-number">${filmesCount}</div><div class="stat-label">Filmes</div></div><div class="stat-card"><div class="stat-number">${seriesCount}</div><div class="stat-label">Séries</div></div><div class="stat-card"><div class="stat-number">${favsCount}</div><div class="stat-label">Favoritos (total)</div></div><div class="stat-card"><div class="stat-number">${avisosCount}</div><div class="stat-label">Avisos</div></div></div>
      <h3>👥 Gerenciar Administradores</h3>${usersListHtml}
      <hr><h3>✨ Informações do Sistema</h3>
      <p>✅ Avaliações por estrelas funcionando com Firestore!</p><p>✅ Watchlist (Assistir Depois)</p><p>✅ Episódios assistidos (checkmark)</p><p>✅ Compartilhar episódio (link direto)</p><p>✅ Paginação e ordenação</p><p>✅ Botão duplicar no modo edição</p><p>✅ QR Code centralizado com animação</p>
    </div>`;
    document.getElementById("content").innerHTML = html;
    document.querySelectorAll(".promote-btn").forEach(btn => { btn.onclick = async () => { await db.collection("users").doc(btn.dataset.uid).update({ isAdmin: true }); showMessage("Promovido!", false); loadAdminPanel(); }; });
  }

  // ==================== NAVEGAÇÃO ====================
  async function loadTab(tab) {
    document.getElementById("catalogHeader").style.display = tab === "catalogo" ? "flex" : "none";
    if (tab === "inicio") await loadInicio();
    else if (tab === "catalogo") await loadCatalog(true);
    else if (tab === "doacao") await loadDoacao();
    else if (tab === "avisos") await loadAvisos();
    else if (tab === "edit" && userData?.isAdmin) await loadEditMode();
    else if (tab === "admin") await loadAdminPanel();
  }
  function attachNavEvents() {
    document.querySelectorAll(".nav-link").forEach(el => {
      if(el.dataset.tab) {
        el.onclick = () => { loadTab(el.dataset.tab); document.querySelectorAll(".nav-link").forEach(n=>n.classList.remove("active")); el.classList.add("active"); };
      }
    });
  }

  // ==================== AUTH ====================
  function updateUI() {
    const btn = document.getElementById("loginBtn");
    const sw = document.getElementById("switchMode");
    const loginFields = document.getElementById("loginFields");
    const signupFields = document.getElementById("signupFields");
    if (isLogin) {
      btn.innerText = "Entrar";
      sw.innerText = "Criar nova conta";
      loginFields.style.display = "block";
      signupFields.style.display = "none";
    } else {
      btn.innerText = "Cadastrar";
      sw.innerText = "Já tenho conta";
      loginFields.style.display = "none";
      signupFields.style.display = "block";
    }
  }
  document.getElementById("switchMode").onclick = () => { isLogin = !isLogin; updateUI(); };
  document.getElementById("forgotBtn").onclick = async () => { const email = prompt("Digite seu e-mail:"); if (email) try { await auth.sendPasswordResetEmail(email); showMessage("Email de recuperação enviado!", false); } catch(e) { showMessage("Erro ao enviar email"); } };
  document.getElementById("loginBtn").onclick = async () => {
    const loading = document.getElementById("loadingScreen");
    loading.style.display = "flex";
    try {
      if (isLogin) {
        const email = document.getElementById("email").value;
        const pwd = document.getElementById("password").value;
        if (!email || !pwd) { showMessage("Preencha email e senha!"); loading.style.display = "none"; return; }
        await auth.signInWithEmailAndPassword(email, pwd);
        showMessage("Login realizado!", false);
      } else {
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value;
        const pwd = document.getElementById("signupPassword").value;
        if (!name || !email || !pwd) { showMessage("Preencha todos os campos!"); loading.style.display = "none"; return; }
        if (pwd.length < 6) { showMessage("Senha precisa ter 6+ caracteres"); loading.style.display = "none"; return; }
        const cred = await auth.createUserWithEmailAndPassword(email, pwd);
        await cred.user.sendEmailVerification();
        await db.collection("users").doc(cred.user.uid).set({ name, email, isAdmin: email === MASTER_EMAIL, createdAt: new Date() });
        showMessage("Conta criada! Verifique seu e-mail.", false);
        await auth.signOut();
        isLogin = true; updateUI();
      }
    } catch(e) { showMessage("Erro: " + e.message); }
    finally { loading.style.display = "none"; }
  };
  document.getElementById("logoutBtn").onclick = () => auth.signOut();

  auth.onAuthStateChanged(async (user) => {
    const loading = document.getElementById("loadingScreen");
    if (user) {
      loading.style.display = "flex";
      if (!user.emailVerified && user.email !== MASTER_EMAIL) { showMessage("Verifique seu e-mail antes de acessar."); await auth.signOut(); loading.style.display = "none"; return; }
      let doc = await db.collection("users").doc(user.uid).get();
      let userName = user.email.split("@")[0];
      if (!doc.exists) await db.collection("users").doc(user.uid).set({ name: userName, email: user.email, isAdmin: user.email === MASTER_EMAIL, createdAt: new Date() });
      else userName = doc.data().name;
      currentUser = user;
      userData = { name: userName, email: user.email, isAdmin: user.email === MASTER_EMAIL };
      document.getElementById("userNameDisplay").innerHTML = userName;
      const isAdmin = user.email === MASTER_EMAIL;
      document.getElementById("adminTab").style.display = isAdmin ? "block" : "none";
      document.getElementById("editTab").style.display = isAdmin ? "block" : "none";
      document.getElementById("settingsIcon").onclick = () => openProfileModal();
      await loadUserFavorites();
      await loadUserWatchlist();
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "flex";
      loading.style.display = "none";
      attachNavEvents();
      loadTab("inicio");
    } else {
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("app").style.display = "none";
      loading.style.display = "none";
      isLogin = true; updateUI();
    }
  });
</script>
</body>
