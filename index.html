<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="YK Server - Streaming de animes e séries com a melhor qualidade">
    <meta name="theme-color" content="#0f0f23">
    <title>YK Server · Streaming Premium</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=64">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ======== RESET & BASE STYLES ======== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #ff5a8a, #ff3366, #ff1a75);
            --secondary-gradient: linear-gradient(135deg, #ff90b5, #ff5a8a, #ff4081);
            --accent-gradient: linear-gradient(135deg, #7c3aed, #a855f7, #b046ff);
            --dark-bg: radial-gradient(ellipse at top, #1a0f2e 0%, #0a0512 50%, #050208 100%);
            --surface-bg: rgba(23, 17, 38, 0.95);
            --card-bg: rgba(31, 24, 48, 0.8);
            --input-bg: rgba(42, 34, 59, 0.8);
            --border-color: rgba(255, 90, 138, 0.2);
            --border-hover: rgba(255, 90, 138, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #e4d4f1;
            --text-muted: #b19cd9;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 32px rgba(255, 90, 138, 0.3);
            --shadow-neon: 0 0 20px rgba(255, 90, 138, 0.5), 0 0 40px rgba(255, 51, 102, 0.3);
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 90, 138, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: ambientPulse 8s ease-in-out infinite;
        }

        /* ======== SCROLLBAR ======== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 26, 42, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: opacity 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }

        /* ======== ANIMATIONS ======== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes starPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.3);
                filter: brightness(1.2);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 90, 138, 0.4);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 90, 138, 0.8);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        
        @keyframes ambientPulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-60px) rotateY(-15deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
        }
        
        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-200deg) scale(0.5);
            }
            to {
                opacity: 1;
                transform: rotate(0) scale(1);
            }
        }
        
        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.3);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes flipInX {
            from {
                opacity: 0;
                transform: perspective(400px) rotateX(90deg);
            }
            40% {
                transform: perspective(400px) rotateX(-10deg);
            }
            70% {
                transform: perspective(400px) rotateX(10deg);
            }
            100% {
                opacity: 1;
                transform: perspective(400px) rotateX(0deg);
            }
        }
        
        @keyframes flipInY {
            from {
                opacity: 0;
                transform: perspective(400px) rotateY(90deg);
            }
            40% {
                transform: perspective(400px) rotateY(-10deg);
            }
            70% {
                transform: perspective(400px) rotateY(10deg);
            }
            100% {
                opacity: 1;
                transform: perspective(400px) rotateY(0deg);
            }
        }
        
        @keyframes lightSpeedIn {
            from {
                opacity: 0;
                transform: translateX(100%) skewX(-30deg);
            }
            60% {
                transform: translateX(-20%) skewX(20deg);
            }
            80% {
                transform: translateX(0%) skewX(-5deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0%) skewX(0deg);
            }
        }
        
        @keyframes heartBeat {
            0% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.3);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.3);
            }
            70% {
                transform: scale(1);
            }
        }
        
        @keyframes rubberBand {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scaleX(1.25) scaleY(0.75);
            }
            40% {
                transform: scaleX(0.75) scaleY(1.25);
            }
            60% {
                transform: scaleX(1.15) scaleY(0.85);
            }
            100% {
                transform: scale(1);
            }
        }
        
        @keyframes wobble {
            0% {
                transform: translateX(0%);
            }
            15% {
                transform: translateX(-25%) rotate(-5deg);
            }
            30% {
                transform: translateX(20%) rotate(3deg);
            }
            45% {
                transform: translateX(-15%) rotate(-3deg);
            }
            60% {
                transform: translateX(10%) rotate(2deg);
            }
            75% {
                transform: translateX(-5%) rotate(-1deg);
            }
            100% {
                transform: translateX(0%);
            }
        }
        
        @keyframes tada {
            0% {
                transform: scale(1) rotate(0deg);
            }
            10%, 20% {
                transform: scale(0.9) rotate(-3deg);
            }
            30%, 50%, 70%, 90% {
                transform: scale(1.1) rotate(3deg);
            }
            40%, 60%, 80% {
                transform: scale(1.1) rotate(-3deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }
        
        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 90, 138, 0.4);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 90, 138, 0.8), 0 0 60px rgba(255, 51, 102, 0.4);
            }
        }
        
        @keyframes neonGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 90, 138, 0.8), 0 0 20px rgba(255, 90, 138, 0.6), 0 0 30px rgba(255, 90, 138, 0.4);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 90, 138, 1), 0 0 30px rgba(255, 90, 138, 0.8), 0 0 40px rgba(255, 90, 138, 0.6);
            }
        }

        /* ======== UTILITY CLASSES ======== */
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        .slide-in-right {
            animation: slideInRight 0.4s ease-out;
        }
        
        .bounce-in {
            animation: bounceIn 0.8s ease-out;
        }
        
        .slide-in-left {
            animation: slideInLeft 0.6s ease-out;
        }
        
        .rotate-in {
            animation: rotateIn 0.6s ease-out;
        }
        
        .zoom-in {
            animation: zoomIn 0.5s ease-out;
        }
        
        .flip-in-x {
            animation: flipInX 0.6s ease-out;
        }
        
        .flip-in-y {
            animation: flipInY 0.6s ease-out;
        }
        
        .light-speed-in {
            animation: lightSpeedIn 0.8s ease-out;
        }
        
        .heart-beat {
            animation: heartBeat 1.3s ease-in-out infinite;
        }
        
        .rubber-band {
            animation: rubberBand 1s ease-in-out;
        }
        
        .wobble {
            animation: wobble 1s ease-in-out;
        }
        
        .tada {
            animation: tada 1s ease-in-out;
        }
        
        .neon-glow {
            animation: neonGlow 2s ease-in-out infinite;
        }

        .text-gradient {
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .gradient-border {
            border: 1px solid transparent;
            background: linear-gradient(var(--dark-bg), var(--dark-bg)) padding-box,
                        var(--primary-gradient) border-box;
        }


        /* ======== ICON SYSTEM ======== */
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .icon:hover {
            color: var(--text-primary);
            transform: scale(1.2) rotateY(10deg);
        }
        
        .icon:active {
            transform: scale(0.95) rotateY(-5deg);
        }

        .icon-lg {
            width: 24px;
            height: 24px;
        }

        .icon-xl {
            width: 32px;
            height: 32px;
        }

        .icon-float {
            animation: float 3s ease-in-out infinite;
        }
        
        .icon-glow {
            animation: glow 2s ease-in-out infinite;
        }
        
        .icon-pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .icon-spin {
            animation: spin 2s linear infinite;
        }
        
        .icon-bounce {
            animation: bounceIn 0.8s ease-out;
        }
        
        .icon-shake {
            animation: wobble 0.8s ease-in-out;
        }

        /* SVG Icons */
        .icon-home { width: 20px; height: 20px; }
        .icon-tv { width: 20px; height: 20px; }
        .icon-heart { width: 20px; height: 20px; }
        .icon-settings { width: 20px; height: 20px; }
        .icon-search { width: 20px; height: 20px; }
        .icon-play { width: 20px; height: 20px; }
        .icon-plus { width: 20px; height: 20px; }
        .icon-star { width: 20px; height: 20px; }
        .icon-clock { width: 20px; height: 20px; }
        .icon-fire { width: 20px; height: 20px; }
        .icon-new { width: 20px; height: 20px; }
        .icon-edit { width: 16px; height: 16px; }
        .icon-trash { width: 16px; height: 16px; }
        .icon-check { width: 16px; height: 16px; }
        .icon-x { width: 16px; height: 16px; }

        /* ======== TOAST NOTIFICATIONS ======== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 10000;
            font-size: 14px;
            animation: slideInRight 0.3s ease, bounceIn 0.6s ease-out;
            box-shadow: var(--shadow-xl), var(--shadow-neon);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            transform-style: preserve-3d;
        }

        .toast.success {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: var(--shadow-xl), 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .toast.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: var(--shadow-xl), 0 0 20px rgba(239, 68, 68, 0.4);
        }
        
        .toast-icon {
            font-size: 18px;
            animation: heartBeat 1.3s ease-in-out infinite;
        }

        /* ======== LOADING SCREEN ======== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, #1a0f2e, #0a0512);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 32px;
        }
        
        .loading-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 90, 138, 0.1) 0%, transparent 70%);
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 90, 138, 0.2);
            border-top: 4px solid #ff5a8a;
            border-right: 4px solid #ff3366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite, glow 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        
        .loading-spinner::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1.2s linear infinite reverse;
        }

        .loading-text {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: slideInUp 0.6s ease-out, pulse 1.5s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        /* ======== LOGIN SCREEN ======== */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, #1a0f2e, #0a0512);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .login-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%);
            animation: ambientPulse 6s ease-in-out infinite reverse;
        }

        .login-card {
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            padding: 48px;
            border-radius: 24px;
            width: 440px;
            max-width: 90%;
            border: 1px solid var(--border-color);
            text-align: center;
            animation: flipInY 0.8s ease-out, bounceIn 0.6s ease-out;
            box-shadow: var(--shadow-xl), var(--shadow-neon);
            position: relative;
            z-index: 1;
            transform-style: preserve-3d;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--primary-gradient);
            border-radius: 24px;
            z-index: -1;
            opacity: 0.3;
            animation: neonGlow 3s ease-in-out infinite;
        }

        .login-card h2 {
            margin-bottom: 32px;
            font-size: 36px;
            font-weight: 900;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            animation: slideInUp 0.6s ease-out;
        }

        .login-card input {
            width: 100%;
            padding: 16px 20px;
            margin: 12px 0;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .login-card input:focus {
            border-color: #ff5a8a;
            box-shadow: 0 0 0 3px rgba(255, 90, 138, 0.1), var(--shadow-neon);
            transform: translateY(-2px) rotateX(2deg);
        }
        
        .login-card input:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .login-card input::placeholder {
            color: var(--text-muted);
        }

        .login-card button {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            transform-style: preserve-3d;
        }
        
        .login-card button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-card button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-lg), var(--shadow-neon);
        }
        
        .login-card button:hover::before {
            left: 100%;
        }

        .login-card button:active {
            transform: translateY(0) scale(0.98);
        }

        .login-card .switch {
            margin-top: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }
        
        .login-card .switch::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }

        .login-card .switch:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        
        .login-card .switch:hover::after {
            width: 100%;
        }

        /* ======== MAIN APP ======== */
        .app {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .app.active {
            display: flex;
            opacity: 1;
            animation: slideInUp 0.8s ease-out;
        }

        /* ======== NAVIGATION ======== */
        .navbar {
            background: rgba(15, 12, 25, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 32px;
            transform-style: preserve-3d;
        }
        
        .navbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 90, 138, 0.05), transparent);
            animation: lightSpeedIn 1s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-area:hover {
            transform: scale(1.05);
        }

        .yk-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover;
            box-shadow: var(--shadow-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        .site-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-item {
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: -1;
            transform: translateZ(-1px);
        }
        
        .nav-item::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.4s ease;
        }

        .nav-item:hover {
            color: var(--text-primary);
            transform: translateY(-2px) rotateX(5deg);
        }
        
        .nav-item:hover::before {
            opacity: 0.1;
        }
        
        .nav-item:hover::after {
            width: 100px;
            height: 100px;
        }

        .nav-item.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-md), var(--shadow-neon);
            transform: translateY(-2px) scale(1.05);
        }
        
        .nav-item.active::before {
            opacity: 1;
        }

        .nav-section {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .search-icon:hover {
            color: var(--text-primary);
            background: rgba(255, 90, 138, 0.1);
            transform: scale(1.1) rotateY(10deg);
            box-shadow: var(--shadow-neon);
        }
        
        .search-icon:active {
            transform: scale(0.95) rotateY(-5deg);
        }

        .search-input {
            width: 0;
            padding: 0;
            border: none;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            border-radius: 12px;
            opacity: 0;
            transform-style: preserve-3d;
        }

        .search-input.expanded {
            width: 320px;
            padding: 12px 16px;
            opacity: 1;
            border: 1px solid var(--border-color);
            margin-left: 8px;
            animation: flipInX 0.4s ease-out;
        }

        .search-input.expanded:focus {
            border-color: #ff5a8a;
            box-shadow: 0 0 0 3px rgba(255, 90, 138, 0.1), var(--shadow-neon);
            transform: translateY(-1px) rotateX(1deg);
        }
        
        .search-input.expanded:hover {
            border-color: var(--border-hover);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
        }
        
        .user-name::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-gradient);
            transition: width 0.3s ease;
        }

        .user-name:hover {
            color: var(--text-primary);
            transform: translateY(-1px) scale(1.05);
        }
        
        .user-name:hover::after {
            width: 100%;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        .logout-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 90, 138, 0.3), transparent);
            transition: left 0.5s;
        }

        .logout-btn:hover {
            background: rgba(255, 90, 138, 0.2);
            border-color: #ff5a8a;
            color: var(--text-primary);
            transform: translateY(-2px) scale(1.05) rotateX(2deg);
            box-shadow: var(--shadow-neon);
        }
        
        .logout-btn:hover::before {
            left: 100%;
        }
        
        .logout-btn:active {
            transform: translateY(0) scale(0.95);
        }

        /* ======== CONTENT AREA ======== */
        .content-wrapper {
            flex: 1;
            padding: 0;
            max-width: 100%;
            margin: 0;
            width: 100%;
        }

        .content-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 32px 32px;
        }

        /* ======== CATALOG TABS ======== */
        .catalog-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            flex-wrap: wrap;
        }

        .catalog-tab {
            padding: 12px 24px;
            border-radius: 12px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            border: 1px solid transparent;
            color: var(--text-secondary);
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        .catalog-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 90, 138, 0.2), transparent);
            transition: left 0.5s;
        }

        .catalog-tab:hover {
            background: rgba(255, 90, 138, 0.1);
            border-color: var(--border-color);
            color: var(--text-primary);
            transform: translateY(-2px) scale(1.05) rotateX(2deg);
            box-shadow: var(--shadow-md);
        }
        
        .catalog-tab:hover::before {
            left: 100%;
        }
        
        .catalog-tab:active {
            transform: translateY(0) scale(0.95);
        }

        .catalog-tab.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--shadow-md), var(--shadow-neon);
            animation: bounceIn 0.6s ease-out;
        }
        .filter-bar {
            margin: 32px 0;
            padding: 24px;
            background: var(--surface-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .filter-bar.active {
            display: block;
        }

        .filter-section {
            margin-bottom: 24px;
        }

        .filter-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-secondary);
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .filter-btn:hover::before {
            opacity: 0.1;
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        /* ======== HERO BANNER ======== */
        .hero-banner {
            position: relative;
            height: 70vh;
            min-height: 500px;
            margin-bottom: 48px;
            border-radius: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a152e, #0f0f23);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 90, 138, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(124, 58, 237, 0.15) 0%, transparent 50%);
            animation: ambientPulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }
        
        /* Particle effects */
        .hero-banner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 90, 138, 0.4), transparent),
                radial-gradient(1px 1px at 50px 50px, rgba(124, 58, 237, 0.3), transparent),
                radial-gradient(1px 1px at 80px 10px, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255, 90, 138, 0.3), transparent),
                radial-gradient(1px 1px at 110px 120px, rgba(124, 58, 237, 0.4), transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.4);
            transform: scale(1.05);
            transition: transform 0.8s ease;
            animation: zoomIn 1s ease-out;
        }

        .hero-banner:hover .hero-background {
            transform: scale(1.1) rotateX(2deg);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(10, 10, 15, 0.9) 0%, 
                rgba(10, 10, 15, 0.6) 50%,
                rgba(10, 10, 15, 0.3) 100%);
            z-index: 3;
        }

        .hero-content {
            position: relative;
            z-index: 4;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 60px;
            max-width: 60%;
            transform-style: preserve-3d;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            line-height: 1.1;
            letter-spacing: -1px;
            animation: slideInLeft 0.8s ease-out, lightSpeedIn 1s ease-out;
            transform-style: preserve-3d;
        }
        
        .hero-title::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0.3;
            transform: translateZ(-1px);
            z-index: -1;
        }

        .hero-description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 32px;
            opacity: 0.9;
            display: -webkit-box;
            display: -moz-box;
            display: box;
            -webkit-line-clamp: 3;
            -moz-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            -moz-box-orient: vertical;
            box-orient: vertical;
            overflow: hidden;
            animation: slideInUp 0.6s ease-out 0.2s both;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            animation: slideInUp 0.6s ease-out 0.4s both;
        }

        .hero-btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .hero-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .hero-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.4s ease;
        }

        .hero-btn-primary {
            background: white;
            color: black;
            box-shadow: var(--shadow-md);
        }

        .hero-btn-primary:hover {
            transform: translateY(-2px) scale(1.05) rotateX(2deg);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3), var(--shadow-neon);
        }
        
        .hero-btn-primary:hover::before {
            left: 100%;
        }
        
        .hero-btn-primary:hover::after {
            width: 150px;
            height: 150px;
        }
        
        .hero-btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .hero-btn-secondary {
            background: rgba(109, 109, 110, 0.8);
            color: white;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero-btn-secondary:hover {
            background: rgba(109, 109, 110, 0.9);
            transform: translateY(-2px) scale(1.05) rotateX(2deg);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow-neon);
        }
        
        .hero-btn-secondary:hover::before {
            left: 100%;
        }
        
        .hero-btn-secondary:hover::after {
            width: 150px;
            height: 150px;
        }
        
        .hero-btn-secondary:active {
            transform: translateY(0) scale(0.98);
        }

        /* ======== CONTENT SECTIONS ======== */
        .content-section {
            margin-bottom: 56px;
            position: relative;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            transition: transform 0.3s ease;
            letter-spacing: -0.5px;
        }

        .section-title:hover {
            transform: scale(1.02);
        }

        .section-action {
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .section-action:hover {
            color: var(--text-primary);
        }

        /* ======== CAROUSELS ======== */
        .carousel-container {
            position: relative;
        }

        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 20px;
            padding: 8px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .carousel-container:hover .carousel-btn {
            opacity: 1;
        }

        .carousel-btn:hover {
            background: var(--primary-gradient);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-btn-left {
            left: -24px;
        }

        .carousel-btn-right {
            right: -24px;
        }

        /* ======== ENHANCED MEDIA CARDS ======== */
        .media-card {
            flex: 0 0 200px;
            background: var(--surface-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            transform: scale(1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .media-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 90, 138, 0.1), rgba(124, 58, 237, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .media-card:hover {
            transform: scale(1.05) translateY(-8px) rotateY(5deg);
            box-shadow: var(--shadow-xl), 0 0 30px rgba(255, 90, 138, 0.3), var(--shadow-neon);
            border-color: #ff5a8a;
            z-index: 10;
            border-radius: 12px;
        }
        
        .media-card:hover::before {
            opacity: 1;
        }
        
        .media-card:hover .media-poster img {
            transform: scale(1.1) rotateX(2deg);
            filter: brightness(1.1) contrast(1.05);
        }

        .media-poster {
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #2a1a3a, #1a0f2e);
            transform-style: preserve-3d;
        }
        
        .media-poster::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
            pointer-events: none;
        }
        
        .media-card:hover .media-poster::after {
            opacity: 1;
        }

        .media-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .media-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, 
                rgba(0, 0, 0, 0.95) 0%, 
                rgba(0, 0, 0, 0.7) 50%,
                transparent 100%);
            padding: 60px 12px 12px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(20px);
            z-index: 3;
        }

        .media-card:hover .media-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .media-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            animation: slideInUp 0.3s ease-out 0.1s both;
        }

        .media-actions {
            display: flex;
            gap: 8px;
            animation: slideInUp 0.3s ease-out 0.2s both;
        }

        .media-action-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            text-align: center;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        .media-action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .media-action-btn:hover {
            background: var(--primary-gradient);
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 90, 138, 0.4), var(--shadow-neon);
        }
        
        .media-action-btn:hover::before {
            left: 100%;
        }
        
        .media-action-btn:active {
            transform: scale(0.95);
        }

        .media-action-btn.active {
            background: var(--primary-gradient);
            box-shadow: 0 0 20px rgba(255, 90, 138, 0.3);
            animation: heartBeat 1.3s ease-in-out;
        }

        .media-info {
            padding: 12px;
            background: rgba(15, 12, 25, 0.6);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 1;
        }

        .media-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #fbbf24;
            font-weight: 600;
        }
        
        .rating .icon {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .star-rating {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 8px;
        }
        
        .star {
            font-size: 16px;
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
            transform-style: preserve-3d;
        }
        
        .star:hover {
            color: #fbbf24;
            transform: scale(1.2) rotateY(10deg);
        }
        
        .star.filled {
            color: #fbbf24;
            animation: starPulse 1s ease-in-out;
        }

        /* ======== GRID LAYOUT ======== */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 28px;
            animation: fadeInUp 0.6s ease;
        }

        .media-grid .media-card {
            flex: 1;
            max-width: 280px;
        }

        /* ======== MODAL ======== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
            padding: 20px;
            transform-style: preserve-3d;
        }
        
        .modal-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 90, 138, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
            animation: fadeInUp 0.4s ease-out;
        }
        
        .modal-overlay.active::before {
            opacity: 1;
            animation: pulse 3s ease-in-out infinite;
        }

        .modal-content {
            background: var(--surface-bg);
            width: 100%;
            max-width: 1200px;
            height: 85vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            overflow: hidden;
            animation: flipInY 0.6s ease-out, bounceIn 0.4s ease-out;
            box-shadow: var(--shadow-xl), var(--shadow-neon);
            transform-style: preserve-3d;
            position: relative;
            z-index: 1;
        }
        
        .modal-content::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--primary-gradient);
            border-radius: 16px;
            z-index: -1;
            opacity: 0.2;
            animation: neonGlow 4s ease-in-out infinite;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 12, 25, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
        }
        
        .modal-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-gradient);
            opacity: 0.3;
            animation: lightSpeedIn 1s ease-out;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: slideInLeft 0.6s ease-out;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }
        
        .modal-close::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 90, 138, 0.1);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: #ff5a8a;
            background: rgba(255, 90, 138, 0.1);
            transform: rotate(90deg) scale(1.1);
            box-shadow: var(--shadow-neon);
        }
        
        .modal-close:hover::before {
            opacity: 1;
        }
        
        .modal-close:active {
            transform: rotate(90deg) scale(0.95);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            z-index: 1;
        }
        
        .modal-body::-webkit-scrollbar {
            width: 8px;
        }
        
        .modal-body::-webkit-scrollbar-track {
            background: rgba(30, 26, 42, 0.3);
            border-radius: 10px;
        }
        
        .modal-body::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: opacity 0.2s;
        }
        
        .modal-body::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }

        /* ======== ADMIN PANEL ======== */
        .admin-panel {
            background: var(--surface-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-xl), var(--shadow-neon);
            animation: slideInUp 0.6s ease-out;
            transform-style: preserve-3d;
        }
        
        .admin-panel::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--primary-gradient);
            border-radius: 16px;
            z-index: -1;
            opacity: 0.1;
            animation: neonGlow 4s ease-in-out infinite;
        }

        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 12px 24px;
            border-radius: 12px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            border: 1px solid transparent;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        .admin-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 90, 138, 0.2), transparent);
            transition: left 0.5s;
        }

        .admin-tab:hover {
            background: rgba(255, 90, 138, 0.1);
            border-color: var(--border-color);
            transform: translateY(-2px) scale(1.05) rotateX(2deg);
            box-shadow: var(--shadow-md);
        }
        
        .admin-tab:hover::before {
            left: 100%;
        }
        
        .admin-tab:active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--shadow-md), var(--shadow-neon);
            animation: bounceIn 0.6s ease-out;
        }

        .admin-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-textarea,
        .form-select {
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #ff5a8a;
            box-shadow: 0 0 0 3px rgba(255, 90, 138, 0.1), var(--shadow-neon);
            transform: translateY(-1px) rotateX(1deg);
        }
        
        .form-input:hover,
        .form-textarea:hover,
        .form-select:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            justify-self: start;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.05) rotateX(2deg);
            box-shadow: var(--shadow-lg), var(--shadow-neon);
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .users-table {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: var(--shadow-md);
            animation: slideInUp 0.6s ease-out;
        }

        .users-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .users-table th {
            background: rgba(255, 90, 138, 0.1);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .users-table tr:hover {
            background: rgba(255, 90, 138, 0.05);
        }

        .user-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .user-status.active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .user-status.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .user-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* ======== FOOTER ======== */
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: rgba(10, 5, 18, 0.8);
            margin-top: auto;
        }

        /* ======== RESPONSIVE DESIGN ======== */
        @media (max-width: 1024px) {
            .hero-content {
                padding: 0 40px;
                max-width: 70%;
            }
            
            .hero-title {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .content-inner {
                padding: 0 16px 16px;
            }
            
            .navbar-content {
                flex-direction: column;
                gap: 20px;
            }
            
            .nav-section {
                width: 100%;
                justify-content: space-between;
            }
            
            .hero-content {
                padding: 0 20px;
                max-width: 100%;
            }
            
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-description {
                font-size: 1rem;
            }
            
            .media-card {
                flex: 0 0 150px;
            }
            
            .carousel-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            
            .filter-bar {
                margin: 16px 0;
                padding: 16px;
            }
            
            .modal-content {
                height: 90vh;
                border-radius: 12px;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
            
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-buttons {
                flex-direction: column;
            }
            
            .hero-btn {
                width: 100%;
                justify-content: center;
            }
            
            .media-card {
                flex: 0 0 120px;
            }
            
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 16px;
            }
        }

        /* ======== ACCESSIBILITY ======== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ======== FOCUS STYLES ======== */
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid #ff5a8a;
            outline-offset: 2px;
        }

        /* ======== LOADING STATES ======== */
        .skeleton {
            background: linear-gradient(90deg, 
                rgba(255, 90, 138, 0.1) 25%, 
                rgba(255, 90, 138, 0.3) 50%, 
                rgba(255, 90, 138, 0.1) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>

    <script>
        // ======== FIREBASE CONFIGURATION ========
        const firebaseConfig = {
            apiKey: "AIzaSyCTnC0RGSWRcr2ehQGimK6nIra9H8NH8Ks",
            authDomain: "yk-comunidade.firebaseapp.com",
            projectId: "yk-comunidade",
            storageBucket: "yk-comunidade.appspot.com",

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ======== GLOBAL STATE ========
        let currentUser = null;
        let userData = null;
        let isLoginMode = true;
        let userFavorites = new Set();
        let userWatchlist = new Set();
        let allContentCache = [];
        let currentFilter = 'all';
        let currentGenre = 'Todos';
        let currentCatalogTab = 'Todos';
        let searchTerm = '';
        let currentTab = 'home';
        let mockUsers = [];

        // ======== UTILITY FUNCTIONS ========
        function showToast(message, type = 'error') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? '✓' : '⚠️';
            toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function handleAuth() {
            const loading = document.getElementById('loadingScreen');
            loading.style.display = 'flex';
            
            try {
                if (isLoginMode) {
                    // Login
                    const email = document.getElementById('emailInput').value.trim();
                    const password = document.getElementById('passwordInput').value;
                    
                    if (!email || !password) {
                        throw new Error('Preencha e-mail e senha');
                    }
                    
                    await auth.signInWithEmailAndPassword(email, password);
                    showToast('Login realizado com sucesso!', 'success');
                } else {
                    // Signup
                    const name = document.getElementById('nameInput').value.trim();
                    const email = document.getElementById('signupEmailInput').value.trim();
                    const password = document.getElementById('signupPasswordInput').value;
                    
                    if (!name || !email || !password) {
                        throw new Error('Preencha todos os campos');
                    }
                    
                    if (password.length < 6) {
                        throw new Error('A senha deve ter pelo menos 6 caracteres');
                    }
                    
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    
                    // Send email verification
                    await userCredential.user.sendEmailVerification();
                    
                    // Create user document
                    await db.collection('users').doc(userCredential.user.uid).set({
                        name: name,
                        email: email,
                        isAdmin: false,
                        createdAt: new Date(),
                        emailVerified: false
                    });
                    
                    showToast('Conta criada! Verifique seu e-mail.', 'success');
                    await auth.signOut();
                    isLoginMode = true;
                    updateAuthUI();
                }
            } catch (error) {
                showToast('Erro: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function toggleFavorite(itemId) {
            if (!currentUser) {
                showToast('Faça login para usar esta função');
                return;
            }
            
            try {
                const favoritesRef = db.collection('favorites').doc(currentUser.uid);
                const doc = await favoritesRef.get();
                
                let items = [];
                if (doc.exists) {
                    items = doc.data().items || [];
                }
                
                if (userFavorites.has(itemId)) {
                    // Remove from favorites
                    items = items.filter(id => id !== itemId);
                    userFavorites.delete(itemId);
                    showToast('Removido dos favoritos', 'success');

                    // Add to favorites
                    items.push(itemId);
                    userFavorites.add(itemId);

                await favoritesRef.set({

        // ======== CONTENT LOADING FUNCTIONS ========
        // ======== LOCAL STORAGE BACKUP ========
        function saveToLocalStorage(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }

        function loadFromLocalStorage(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            } catch (error) {
                console.error('Error loading from localStorage:', error);
                return null;
            }
        }

        // Enhanced content loading with localStorage fallback
        async function loadAllContent() {
            if (allContentCache.length > 0) {
                return allContentCache;
            }
            
            try {
                const [animesSnap, seriesSnap] = await Promise.all([
                    db.collection('animes').get(),
                    db.collection('series').get()
                ]);
                
                let items = [];
                
                animesSnap.forEach(doc => {
                    items.push({
                        id: doc.id,
                        type: 'movies',
                        ...doc.data()
                    });
                });
                
                seriesSnap.forEach(doc => {
                    items.push({
                        id: doc.id,
                        type: 'series',
                        ...doc.data()
                    });
                });
                
                if (items.length === 0) {
                    items = loadFromLocalStorage('cachedContent') || generateMockContent();
                }
                
                allContentCache = items;
                saveToLocalStorage('cachedContent', items);
                return items;
            } catch (error) {
                console.error('Error loading from Firebase:', error);
                const cached = loadFromLocalStorage('cachedContent');
                if (cached) {
                    allContentCache = cached;
                    return cached;
                }
                return generateMockContent();
            }
        }
