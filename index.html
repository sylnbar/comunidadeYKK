<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YK Server - Streaming de animes e séries com a melhor qualidade">
    <meta name="theme-color" content="#0f0f23">
    <title>YK Server · Streaming Premium</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=64">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ======== RESET & BASE STYLES ======== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-pink: #ff6b9d;
            --primary-pink-dark: #e84a7f;
            --primary-pink-light: #ff8fb3;
            --secondary-purple: #c084fc;
            --bg-primary: #1a0a1a;
            --bg-secondary: #2d1a2d;
            --bg-card: #3d203d;
            --bg-hover: #4d2a4d;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #6b3d6b;
            --border-hover: #ff6b9d;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
            --transition-fast: 150ms;
            --transition-normal: 250ms;
        }

        html { scroll-behavior: smooth; font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--primary-pink); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-pink-dark); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; gap: 24px;
        }

        .loading-spinner {
            width: 50px; height: 50px; border: 3px solid var(--bg-card);
            border-top-color: var(--primary-pink); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text { font-size: 16px; color: var(--text-secondary); font-weight: 500; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); color: var(--text-primary); padding: 12px 24px;
            border-radius: 8px; font-weight: 500; font-size: 14px; z-index: 10000;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);
            animation: slideUp var(--transition-normal);
        }

        .toast.success { background: #1a4d2e; border-color: #2ecc71; }
        .toast.error { background: #4a1a1a; border-color: #e74c3c; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 15, 35, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); padding: 0 24px; height: 64px;
        }

        .navbar-content { display: flex; align-items: center; justify-content: space-between; height: 100%; max-width: 100%; }

        .logo-section { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: opacity var(--transition-fast); }
        .logo-section:hover { opacity: 0.9; }

        .yk-logo { width: 36px; height: 36px; border-radius: 8px; background: url('https://cdn.discordapp.com/icons/1486530333502476291/a8d75f72c4b218fd42e24de370278b4d.png?size=4096') center/cover; }
        .site-title { font-size: 18px; font-weight: 700; color: var(--primary-pink); }

        .nav-menu { display: flex; gap: 8px; }

        .nav-item {
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
            font-size: 14px; color: var(--text-secondary); border: none; background: transparent;
            transition: all var(--transition-fast); display: flex; align-items: center; gap: 8px;
        }

        .nav-item:hover { color: var(--text-primary); background: var(--bg-hover); }
        .nav-item.active { color: var(--text-primary); background: var(--primary-pink); }

        .nav-section { display: flex; align-items: center; gap: 16px; }

        .search-container { position: relative; display: flex; align-items: center; }

        .search-icon {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); border-radius: 8px; transition: all var(--transition-fast);
        }

        .search-icon:hover { color: var(--text-primary); background: var(--bg-hover); }

        .search-input {
            width: 0; padding: 0; border: none; background: var(--bg-card); color: var(--text-primary);
            font-size: 14px; outline: none; border-radius: 8px; opacity: 0; transition: all var(--transition-normal);
        }

        .search-input.expanded { width: 280px; padding: 10px 16px; opacity: 1; border: 1px solid var(--border-color); }
        .search-input.expanded:focus { border-color: var(--primary-pink); }

        .user-section { display: flex; align-items: center; gap: 12px; }

        .user-name { font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: color var(--transition-fast); }
        .user-name:hover { color: var(--text-primary); }

        .logout-btn {
            background: transparent; border: 1px solid var(--border-color); padding: 8px 16px;
            border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 14px;
            font-weight: 500; transition: all var(--transition-fast);
        }

        .logout-btn:hover { background: var(--bg-hover); border-color: var(--primary-pink); color: var(--text-primary); }

        .hamburger-menu { display: none; flex-direction: column; gap: 4px; cursor: pointer; padding: 8px; }
        .hamburger-menu span { width: 24px; height: 2px; background: var(--text-primary); transition: all var(--transition-fast); }

        .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 16px; z-index: 99; }
        .mobile-menu.active { display: block; }
        .mobile-menu .nav-item { width: 100%; padding: 12px; justify-content: center; margin-bottom: 8px; }

        .content-wrapper { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .content-section { margin-bottom: 48px; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .section-action { color: var(--primary-pink); font-size: 14px; cursor: pointer; font-weight: 600; transition: color var(--transition-fast); }
        .section-action:hover { color: var(--primary-pink-dark); }

        .hero-banner { position: relative; height: 500px; margin-bottom: 48px; border-radius: 12px; overflow: hidden; background: var(--bg-secondary); }
        .hero-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: brightness(0.4); }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(15, 15, 35, 0.95) 0%, rgba(15, 15, 35, 0.7) 50%, rgba(15, 15, 35, 0.3) 100%); }
        .hero-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 48px; max-width: 60%; }
        .hero-title { font-size: 48px; font-weight: 800; margin-bottom: 16px; line-height: 1.1; }
        .hero-description { font-size: 16px; line-height: 1.6; margin-bottom: 24px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

        .hero-btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; transition: all var(--transition-fast); }
        .hero-btn-primary { background: var(--primary-pink); color: white; }
        .hero-btn-primary:hover { background: var(--primary-pink-dark); transform: translateY(-2px); }
        .hero-btn-secondary { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.3); }
        .hero-btn-secondary:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        .media-card {
            background: var(--bg-card); border-radius: 8px; overflow: hidden; cursor: pointer;
            transition: all var(--transition-normal); border: 1px solid transparent; position: relative;
        }

        .media-card:hover { transform: translateY(-4px); border-color: var(--primary-pink); box-shadow: var(--shadow-lg); }

        .media-card-image { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: var(--bg-secondary); position: relative; }
        .media-card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-normal); }
        .media-card:hover .media-card-image img { transform: scale(1.05); }

        .media-card-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.3) 60%, transparent 100%);
            opacity: 0; transition: opacity var(--transition-normal); display: flex; align-items: flex-end; padding: 12px;
        }

        .media-card:hover .media-card-overlay { opacity: 1; }

        .media-card-actions { display: flex; gap: 8px; width: 100%; }

        .media-card-action-btn {
            flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600;
            font-size: 12px; transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        .media-card-action-btn.play { background: var(--primary-pink); color: white; }
        .media-card-action-btn.play:hover { background: var(--primary-pink-dark); }
        .media-card-action-btn.favorite { background: rgba(255, 255, 255, 0.2); color: white; }
        .media-card-action-btn.favorite:hover { background: rgba(255, 255, 255, 0.3); }
        .media-card-action-btn.favorite.active { background: #e74c3c; }

        .media-card-content { padding: 12px; }
        .media-card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .media-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
        .media-card-rating { display: flex; align-items: center; gap: 4px; color: var(--primary-pink); font-weight: 600; }
        .media-card-year { background: var(--bg-secondary); padding: 2px 8px; border-radius: 4px; }

        .carousel-container { position: relative; }
        .carousel { display: flex; overflow-x: auto; gap: 16px; padding: 8px 0; scroll-behavior: smooth; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        .carousel .media-card { flex: 0 0 200px; }

        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: var(--bg-card);
            border: 1px solid var(--border-color); color: var(--text-primary); width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all var(--transition-fast); opacity: 0;
        }

        .carousel-container:hover .carousel-btn { opacity: 1; }
        .carousel-btn:hover { background: var(--primary-pink); border-color: var(--primary-pink); }
        .carousel-btn-left { left: -20px; }
        .carousel-btn-right { right: -20px; }

        .catalog-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; }
        .catalog-tab { padding: 8px 16px; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 600; border: none; color: var(--text-secondary); font-size: 14px; transition: all var(--transition-fast); }
        .catalog-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
        .catalog-tab.active { color: var(--text-primary); background: var(--primary-pink); }

        .filter-bar { background: var(--bg-card); padding: 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border-color); }
        .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-secondary); cursor: pointer; font-size: 14px; font-weight: 500; transition: all var(--transition-fast); }
        .filter-btn:hover { border-color: var(--primary-pink); color: var(--text-primary); }
        .filter-btn.active { background: var(--primary-pink); border-color: var(--primary-pink); color: white; }

        .anime-detail { display: grid; grid-template-columns: 300px 1fr; gap: 32px; margin-bottom: 48px; }
        .anime-poster { width: 100%; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; background: var(--bg-card); }
        .anime-poster img { width: 100%; height: 100%; object-fit: cover; }
        .anime-info { background: var(--bg-card); padding: 24px; border-radius: 12px; }
        .anime-info h1 { font-size: 32px; font-weight: 800; margin-bottom: 16px; }
        .anime-meta { display: flex; gap: 16px; margin-bottom: 16px; font-size: 14px; color: var(--text-secondary); }
        .anime-description { color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
        .anime-genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .genre-tag { padding: 6px 12px; background: var(--bg-secondary); border-radius: 20px; font-size: 12px; color: var(--text-secondary); }

        .seasons-container { margin-top: 32px; }
        .season-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 16px; background: var(--bg-card); border-radius: 8px; cursor: pointer; transition: background var(--transition-fast); }
        .season-header:hover { background: var(--bg-hover); }
        .season-title { font-size: 18px; font-weight: 700; }
        .season-episodes-count { color: var(--text-muted); font-size: 14px; }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 16px; }
        .episode-card { background: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: all var(--transition-fast); border: 1px solid transparent; }
        .episode-card:hover { border-color: var(--primary-pink); background: var(--bg-hover); }
        .episode-number { font-size: 12px; color: var(--primary-pink); font-weight: 600; margin-bottom: 4px; }
        .episode-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .episode-actions { display: flex; gap: 8px; }
        .episode-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all var(--transition-fast); }
        .episode-btn.dub { background: var(--primary-pink); color: white; }
        .episode-btn.dub:hover { background: var(--primary-pink-dark); }
        .episode-btn.leg { background: var(--secondary-purple); color: white; }
        .episode-btn.leg:hover { background: #a855f7; }

        .admin-panel { background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; }
        .admin-tab { padding: 8px 16px; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 600; border: none; color: var(--text-secondary); font-size: 14px; transition: all var(--transition-fast); }
        .admin-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
        .admin-tab.active { color: var(--text-primary); background: var(--primary-pink); }

        .admin-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .form-input, .form-select, .form-textarea {
            padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; outline: none;
            transition: border-color var(--transition-fast);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary-pink); }
        .form-textarea { min-height: 100px; resize: vertical; font-family: inherit; }

        .btn-primary { padding: 12px 24px; border-radius: 8px; background: var(--primary-pink); color: white; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: background var(--transition-fast); }
        .btn-primary:hover { background: var(--primary-pink-dark); }
        .btn-danger { padding: 8px 16px; border-radius: 6px; background: #e74c3c; color: white; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: background var(--transition-fast); }
        .btn-danger:hover { background: #c0392b; }

        .donation-container { max-width: 600px; margin: 0 auto; text-align: center; }
        .donation-card { background: var(--bg-card); padding: 32px; border-radius: 12px; border: 1px solid var(--border-color); }
        .donation-card h2 { margin-bottom: 16px; color: var(--primary-pink); }
        .donation-card p { color: var(--text-secondary); margin-bottom: 24px; }
        .pix-key { background: var(--bg-secondary); padding: 16px; border-radius: 8px; font-family: monospace; word-break: break-all; margin-bottom: 16px; color: var(--text-primary); cursor: pointer; }
        .qr-container { background: white; padding: 20px; border-radius: 12px; display: inline-block; margin-bottom: 24px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-primary); }
        .empty-state p { font-size: 14px; }

        .hidden { display: none !important; }

        .video-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
        }
        .video-modal-content {
            position: relative;
            width: 90%;
            max-width: 1200px;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            z-index: 1;
        }
        .video-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .video-modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: var(--text-primary);
        }
        .video-modal-close {
            background: var(--bg-hover);
            border: none;
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .video-modal-close:hover {
            background: var(--primary-pink);
        }
        .video-modal-body {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }
        .video-modal-body iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .rating-section {
            margin-top: 24px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }
        .rating-section h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: var(--text-primary);
        }
        .rating-stars {
            display: flex;
            gap: 8px;
        }
        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.1s;
        }
        .star-btn:hover {
            color: var(--primary-pink);
            transform: scale(1.1);
        }
        .star-btn.active {
            color: var(--primary-pink);
        }
        .star-btn svg {
            display: block;
        }

        @media (max-width: 1024px) {
            .hero-content { max-width: 80%; }
            .anime-detail { grid-template-columns: 250px 1fr; }
        }

        @media (max-width: 768px) {
            .navbar { padding: 0 16px; }
            .nav-menu { display: none; }
            .hamburger-menu { display: flex; }
            .search-input.expanded { width: 200px; }
            .content-wrapper { padding: 16px; }
            .hero-banner { height: 400px; }
            .hero-content { padding: 0 24px; max-width: 100%; }
            .hero-title { font-size: 32px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
            .anime-detail { grid-template-columns: 1fr; }
            .anime-poster { max-width: 300px; margin: 0 auto; }
            .episodes-grid { grid-template-columns: 1fr; }
            .carousel-btn { display: none; }
        }

        @media (max-width: 480px) {
            .hero-title { font-size: 24px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .section-title { font-size: 20px; }
            .user-name { display: none; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando YK Server...</div>
    </div>

    <div id="app">
        <header class="navbar">
            <div class="navbar-content">

        async function loadAllContent() {
            // Force reload from Firebase - no cache, no mock
            allContentCache = [];
            
            try {
                console.log('=== LOADING FROM FIREBASE ===');
                const [animesSnap, seriesSnap, ratingsSnap] = await Promise.all([
                    db.collection('animes').get(),
                    db.collection('series').get(),
                    db.collection('ratings').get()
                ]);
                
                console.log('Animes from Firebase:', animesSnap.size);
                console.log('Series from Firebase:', seriesSnap.size);
                console.log('Ratings from Firebase:', ratingsSnap.size);
                
                let items = [];
                
                animesSnap.forEach(doc => {
                    const data = doc.data();
                    items.push({
                        id: doc.id,
                        type: 'movies',
                        ...data
                    });
                });
                
                seriesSnap.forEach(doc => {
                    const data = doc.data();
                    items.push({
                        id: doc.id,
                        type: 'series',
                        ...data
                    });
                });
                
                // Calculate average ratings from user ratings
                const ratingsMap = {};
                ratingsSnap.forEach(doc => {
                    const data = doc.data();
                    const animeId = data.animeId;
                    if (!ratingsMap[animeId]) {
                        ratingsMap[animeId] = [];
                    }
                    ratingsMap[animeId].push(data.rating);
                });
                
                // Update items with calculated average rating
                items.forEach(item => {
                    if (!item.averageRating && ratingsMap[item.id]) {
                        const ratings = ratingsMap[item.id];
                        const sum = ratings.reduce((a, b) => a + b, 0);
                        item.averageRating = sum / ratings.length;
                    }
                    // Ensure averageRating exists (default to 0)
                    if (!item.averageRating) {
                        item.averageRating = 0;
                    }
                });
                
                console.log('Total items from Firebase:', items.length);
                console.log('Item titles:', items.map(i => i.title));
                console.log('==========================');
                
                allContentCache = items;
                return items;
            } catch (error) {
                console.error('Error loading from Firebase:', error);
                showToast('Erro ao carregar do Firebase: ' + error.message);
                return [];
            }
        }

        function getItemCategories(item) {
            return item.categories && Array.isArray(item.categories) ? item.categories : (item.category ? [item.category] : []);
        }

        function filterContent(items) {
            let filtered = [...items];
            
            // Filter by catalog tab
            if (currentCatalogTab !== 'Todos') {
                if (currentCatalogTab === 'Filmes') {
                    filtered = filtered.filter(item => item.type === 'movies');
                } else if (currentCatalogTab === 'Séries') {
                    filtered = filtered.filter(item => item.type === 'series');
                }
            }
            
            // Filter by genre
            if (currentGenre !== 'Todos') {
                filtered = filtered.filter(item => 
                    getItemCategories(item).includes(currentGenre)
                );
            }
            
            // Filter by search term
            if (searchTerm) {
                const searchLower = searchTerm.toLowerCase();
                filtered = filtered.filter(item => 
                    item.title.toLowerCase().includes(searchLower) ||
                    getItemCategories(item).some(cat => 
                        cat.toLowerCase().includes(searchLower)
                    )
                );
            }
            
            // Sort by most recent
            filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            return filtered;
        }

        function showToast(message, type = 'error') {
            const toast = document.createElement('div');

            setTimeout(() => toast.remove(), 3000);

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);

                    <div class="filter-buttons">${allGenres.map(genre => `<button class="filter-btn ${currentGenre === genre ? 'active' : ''}" data-genre="${genre}">${genre}</button>`).join('')}</div>
                </div>`;
            
            if (filteredItems.length === 0) {
                html += '<div class="empty-state"><h3>Nenhum conteúdo encontrado</h3><p>Tente ajustar os filtros ou o termo de busca.</p></div>';
            } else {
                html += `<div class="media-grid">${filteredItems.map(anime => renderMediaCard(anime)).join('')}</div>`;
            }
            
            contentArea.innerHTML = html;
            attachMediaCardListeners();
            attachFilterListeners();
        }

        async function loadDonationTab() {
            const contentArea = document.getElementById('contentArea');
            const PIX_KEY = "00020101021126580014br.gov.bcb.pix0136f92a7e16-56aa-421e-9fac-521d9b5089075204000053039865802BR5915JOAO G L DIDIER6006RECIFE62070503***6304D05A";
            contentArea.innerHTML = `
                <div class="donation-container">
                    <div class="donation-card">
                        <h2>❤️ Apoie o YK Server</h2>
                        <p>Ajude-nos a manter o servidor no ar e trazer mais conteúdo para você!</p>
                        <div class="qr-container" id="qrcode-container"></div>
                        <p style="margin-bottom: 8px; color: var(--text-secondary);">Chave PIX:</p>
                        <div class="pix-key" style="cursor: pointer;" id="pixKeyDisplay">${PIX_KEY}</div>
                        <button class="btn-primary" id="copyPixBtn" style="margin-top: 16px;">📋 Copiar Chave PIX</button>
                        <p style="margin-top: 24px; color: var(--text-muted); font-size: 14px;">Qualquer valor ajuda! ❤️<br>Sua contribuição faz toda a diferença.</p>
                    </div>
                </div>`;
            
            setTimeout(() => {
                const qrContainer = document.getElementById('qrcode-container');
                if (qrContainer) {
                    new QRCode(qrContainer, { text: PIX_KEY, width: 200, height: 200, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
                }
            }, 100);
            
            const copyToClipboard = () => {
                navigator.clipboard.writeText(PIX_KEY).then(() => showToast('Chave PIX copiada!', 'success')).catch(() => showToast('Erro ao copiar chave'));
            };
            document.getElementById('copyPixBtn')?.addEventListener('click', copyToClipboard);
            document.getElementById('pixKeyDisplay')?.addEventListener('click', copyToClipboard);
        }

        function attachMediaCardListeners() {
            document.querySelectorAll('.media-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.media-card-action-btn')) return;
                    loadAnimeDetail(card.dataset.id);
                });
            });
            document.querySelectorAll('.media-card-action-btn.play').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation(); loadAnimeDetail(btn.dataset.id); });
            });
            document.querySelectorAll('.media-card-action-btn.favorite').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    btn.classList.toggle('active');
                    showToast(btn.classList.contains('active') ? 'Adicionado aos favoritos!' : 'Removido dos favoritos', 'success');
                });
            });
        }

        function attachCarouselListeners() {
            document.querySelectorAll('.carousel-btn-left').forEach(btn => {
                btn.addEventListener('click', () => { btn.nextElementSibling.scrollBy({ left: -800, behavior: 'smooth' }); });
            });
            document.querySelectorAll('.carousel-btn-right').forEach(btn => {
                btn.addEventListener('click', () => { btn.previousElementSibling.scrollBy({ left: 800, behavior: 'smooth' }); });
            });
        }

        function attachHeroListeners() {
            document.querySelectorAll('.hero-btn').forEach(btn => {
                btn.addEventListener('click', () => loadAnimeDetail(btn.dataset.id));
            });
        }

        function attachFilterListeners() {
            document.querySelectorAll('.catalog-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.catalog-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCatalogTab = tab.dataset.catalogTab;
                    loadCatalogTab();
                });
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentGenre = btn.dataset.genre;
                    loadCatalogTab();
                });
            });
        }

        function attachEpisodeListeners() {
            document.querySelectorAll('.episode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const link = btn.dataset.link;
                    if (link && link !== '#') {
                        openVideoModal(link);
                        showToast('Abrindo player de vídeo...', 'success');
                    } else {
                        showToast('Link não disponível');
                    }
                });
            });
        }

        function openVideoModal(link) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            const title = document.getElementById('videoModalTitle');
            
            player.src = link;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            
            player.src = '';
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function highlightStars(rating) {
            const stars = document.querySelectorAll('.star-btn');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function resetStars() {
            const ratingStars = document.getElementById('ratingStars');
            if (!ratingStars) return;
            const animeId = ratingStars.dataset.animeId;
            const userRating = localStorage.getItem(`user_rating_${animeId}`) || 0;
            highlightStars(parseInt(userRating));
        }

        async function rateAnime(animeId, rating) {
            try {
                const userId = currentUser.uid;
                const ratingRef = db.collection('ratings').doc(`${userId}_${animeId}`);
                
                await ratingRef.set({
                    userId,
                    animeId,
                    rating,
                    timestamp: new Date()
                });
                
                localStorage.setItem(`user_rating_${animeId}`, rating);
                
                highlightStars(rating);
                document.getElementById('ratingText').textContent = `Você avaliou com ${rating} estrela${rating > 1 ? 's' : ''}!`;
                
                showToast('Avaliação salva com sucesso!', 'success');
                
                await calculateAverageRating(animeId);
            } catch (error) {
                console.error('Error saving rating:', error);
                showToast('Erro ao salvar avaliação');
            }
        }

        async function loadUserRating(animeId) {
            try {
                const userId = currentUser.uid;
                const ratingDoc = await db.collection('ratings').doc(`${userId}_${animeId}`).get();
                
                if (ratingDoc.exists) {
                    const rating = ratingDoc.data().rating;
                    localStorage.setItem(`user_rating_${animeId}`, rating);
                    highlightStars(rating);
                    document.getElementById('ratingText').textContent = `Você avaliou com ${rating} estrela${rating > 1 ? 's' : ''}`;
                } else {
                    const cachedRating = localStorage.getItem(`user_rating_${animeId}`);
                    if (cachedRating) {
                        highlightStars(parseInt(cachedRating));
                        document.getElementById('ratingText').textContent = `Você avaliou com ${cachedRating} estrela${cachedRating > 1 ? 's' : ''}`;
                    }
                }
            } catch (error) {
                console.error('Error loading user rating:', error);
            }
        }

        async function calculateAverageRating(animeId) {
            try {
                const ratingsSnap = await db.collection('ratings').where('animeId', '==', animeId).get();
                
                if (ratingsSnap.empty) return;
                
                let total = 0;
                ratingsSnap.forEach(doc => {
                    total += doc.data().rating;
                });
                
                const average = total / ratingsSnap.size;
                
                const collectionName = animeId.startsWith('mock') ? 'animes' : 'series';
                const doc = await db.collection(collectionName).doc(animeId).get();
                
                if (doc.exists) {
                    await db.collection(collectionName).doc(animeId).update({
                        averageRating: average
                    });
                    
                    allContentCache = [];
                    
                    const ratingDisplay = document.querySelector('.anime-meta span:first-child');
                    if (ratingDisplay) {
                        ratingDisplay.textContent = `⭐ ${average.toFixed(1)}`;
                    }
                }
            } catch (error) {
                console.error('Error calculating average rating:', error);
            }
        }

        function attachSeasonListeners() {
            document.querySelectorAll('.season-header').forEach(header => {
                header.addEventListener('click', () => {
                    document.getElementById(`episodes-${header.dataset.seasonId}`).classList.toggle('hidden');
                });
            });
        }

        function attachAdminListeners() {
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.add('hidden'));
                    document.getElementById(`admin-${tab.dataset.adminTab}`).classList.remove('hidden');
                });
            });
            
            document.querySelectorAll('[data-edit-id]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.editId;
                    const type = btn.dataset.editType;
                    const items = await loadAllContent();
                    const item = items.find(i => i.id === id);
                    
                    if (!item) return;
                    
                    if (type === 'movies') {
                        document.getElementById('editAnimeId').value = id;
                        document.getElementById('editAnimeTitle').value = item.title || '';
                        document.getElementById('editAnimeDescription').value = item.description || '';
                        document.getElementById('editAnimeImage').value = item.imageUrl || '';
                        document.getElementById('editAnimeDubLink').value = item.dubLink || '';
                        document.getElementById('editAnimeLegLink').value = item.legLink || '';
                        document.getElementById('editAnimeCategories').value = (item.categories || []).join(', ');
                        
                        // Switch to edit anime tab
                        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                        document.querySelector('[data-admin-tab="edit-anime"]').classList.add('active');
                        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.add('hidden'));
                        document.getElementById('admin-edit-anime').classList.remove('hidden');
                    } else if (type === 'series') {
                        document.getElementById('editSeriesId').value = id;
                        document.getElementById('editSeriesTitle').value = item.title || '';
                        document.getElementById('editSeriesDescription').value = item.description || '';
                        document.getElementById('editSeriesImage').value = item.imageUrl || '';
                        document.getElementById('editSeriesCategories').value = (item.categories || []).join(', ');
                        
                        // Switch to edit series tab
                        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                        document.querySelector('[data-admin-tab="edit-series"]').classList.add('active');
                        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.add('hidden'));
                        document.getElementById('admin-edit-series').classList.remove('hidden');
                    }
                });
            });
            
            document.querySelectorAll('[data-delete-id]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.deleteId;
                    const type = btn.dataset.deleteType;
                    if (confirm('Tem certeza que deseja excluir este item?')) {
                        try {
                            await db.collection(type).doc(id).delete();
                            allContentCache = [];
                            showToast('Item excluído com sucesso!', 'success');
                            loadAdminTab();
                        } catch (error) {
                            showToast('Erro ao excluir: ' + error.message);
                        }
                    }
                });
            });
            
            document.querySelectorAll('[data-delete-season]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const seriesId = btn.dataset.deleteSeason;
                    const seasonName = btn.dataset.seasonName;
                    if (confirm('Tem certeza que deseja excluir esta temporada?')) {
                        try {
                            const doc = await db.collection('series').doc(seriesId).get();
                            if (doc.exists) {
                                const data = doc.data();
                                const seasons = data.seasons || {};
                                delete seasons[seasonName];
                                await db.collection('series').doc(seriesId).update({ seasons });
                                allContentCache = [];
                                showToast('Temporada excluída com sucesso!', 'success');
                                loadAdminTab();
                            }
                        } catch (error) {
                            showToast('Erro ao excluir: ' + error.message);
                        }
                    }
                });
            });
            
            document.querySelectorAll('[data-delete-episode]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const seriesId = btn.dataset.deleteEpisode;
                    const seasonName = btn.dataset.seasonName;
                    const epIndex = parseInt(btn.dataset.epIndex);
                    if (confirm('Tem certeza que deseja excluir este episódio?')) {
                        try {
                            const doc = await db.collection('series').doc(seriesId).get();
                            if (doc.exists) {
                                const data = doc.data();
                                const seasons = data.seasons || {};
                                if (seasons[seasonName]) {
                                    seasons[seasonName].splice(epIndex, 1);
                                    await db.collection('series').doc(seriesId).update({ seasons });
                                    allContentCache = [];
                                    showToast('Episódio excluído com sucesso!', 'success');
                                    loadAdminTab();
                                }
                            }
                        } catch (error) {
                            showToast('Erro ao excluir: ' + error.message);
                        }
                    }
                });
            });
            
            document.getElementById('addAnimeForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newAnime = {
                    title: document.getElementById('animeTitle').value,
                    description: document.getElementById('animeDescription').value,
                    imageUrl: document.getElementById('animeImage').value,
                    dubLink: document.getElementById('animeDubLink').value,
                    legLink: document.getElementById('animeLegLink').value,
                    categories: document.getElementById('animeCategories').value.split(',').map(g => g.trim()),
                    createdAt: new Date()
                };
                try {
                    await db.collection('animes').add(newAnime);
                    allContentCache = [];
                    showToast('Filme adicionado com sucesso!', 'success');
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao adicionar: ' + error.message);
                }
            });
            
            document.getElementById('editAnimeForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('editAnimeId').value;
                const updatedAnime = {
                    title: document.getElementById('editAnimeTitle').value,
                    description: document.getElementById('editAnimeDescription').value,
                    imageUrl: document.getElementById('editAnimeImage').value,
                    dubLink: document.getElementById('editAnimeDubLink').value,
                    legLink: document.getElementById('editAnimeLegLink').value,
                    categories: document.getElementById('editAnimeCategories').value.split(',').map(g => g.trim())
                };
                try {
                    await db.collection('animes').doc(id).update(updatedAnime);
                    allContentCache = [];
                    showToast('Filme atualizado com sucesso!', 'success');
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao atualizar: ' + error.message);
                }
            });
            
            document.getElementById('editSeriesForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('editSeriesId').value;
                const updatedSeries = {
                    title: document.getElementById('editSeriesTitle').value,
                    description: document.getElementById('editSeriesDescription').value,
                    imageUrl: document.getElementById('editSeriesImage').value,
                    categories: document.getElementById('editSeriesCategories').value.split(',').map(g => g.trim())
                };
                try {
                    await db.collection('series').doc(id).update(updatedSeries);
                    allContentCache = [];
                    showToast('Série atualizada com sucesso!', 'success');
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao atualizar: ' + error.message);
                }
            });
            
            document.getElementById('addSeriesForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const seasons = {};
                const seasonDivs = document.querySelectorAll('#seriesSeasonsContainer > div');
                seasonDivs.forEach(seasonDiv => {
                    const seasonName = seasonDiv.querySelector('.season-name-input').value;
                    const episodes = [];
                    seasonDiv.querySelectorAll('.season-episodes > div').forEach(epDiv => {
                        const epName = epDiv.querySelector('.ep-name').value;
                        const dubLink = epDiv.querySelector('.ep-dub').value;
                        const legLink = epDiv.querySelector('.ep-leg').value;
                        if (epName && (dubLink || legLink)) {
                            episodes.push({ name: epName, dubLink, legLink });
                        }
                    });
                    if (episodes.length > 0) {
                        seasons[seasonName] = episodes;
                    }
                });
                
                const newSeries = {
                    title: document.getElementById('seriesTitle').value,
                    description: document.getElementById('seriesDescription').value,
                    imageUrl: document.getElementById('seriesImage').value,
                    categories: document.getElementById('seriesCategories').value.split(',').map(g => g.trim()),
                    seasons,
                    createdAt: new Date()
                };
                try {
                    await db.collection('series').add(newSeries);
                    allContentCache = [];
                    showToast('Série adicionada com sucesso!', 'success');
                    loadAdminTab();
                } catch (error) {
                    showToast('Erro ao adicionar: ' + error.message);
                }
            });
            
            document.getElementById('addSeasonForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const seriesId = document.getElementById('seasonSeriesSelect').value;
                const seasonName = document.getElementById('seasonName').value;
                try {
                    const doc = await db.collection('series').doc(seriesId).get();
                    if (doc.exists) {
                        const data = doc.data();
                        const seasons = data.seasons || {};
                        seasons[seasonName] = seasons[seasonName] || [];
                        await db.collection('series').doc(seriesId).update({ seasons });
                        allContentCache = [];
                        showToast('Temporada adicionada com sucesso!', 'success');
                        loadAdminTab();
                    }
                } catch (error) {
                    showToast('Erro ao adicionar: ' + error.message);
                }
            });
            
            document.getElementById('addEpisodeForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const seriesId = document.getElementById('episodeSeriesSelect').value;
                const seasonName = document.getElementById('episodeSeasonSelect').value;
                const episodeName = document.getElementById('episodeName').value;
                const dubLink = document.getElementById('episodeDubLink').value;
                const legLink = document.getElementById('episodeLegLink').value;
                try {
                    const doc = await db.collection('series').doc(seriesId).get();
                    if (doc.exists) {
                        const data = doc.data();
                        const seasons = data.seasons || {};
                        if (!seasons[seasonName]) {
                            seasons[seasonName] = [];
                        }
                        seasons[seasonName].push({ name: episodeName, dubLink, legLink });
                        await db.collection('series').doc(seriesId).update({ seasons });
                        allContentCache = [];
                        showToast('Episódio adicionado com sucesso!', 'success');
                        loadAdminTab();
                    }
                } catch (error) {
                    showToast('Erro ao adicionar: ' + error.message);
                }
            });
        }

        function updateEpisodeSeasonSelect() {
            const seriesSelect = document.getElementById('episodeSeriesSelect');
            const seasonSelect = document.getElementById('episodeSeasonSelect');
            if (!seriesSelect || !seasonSelect) return;
            
            const seriesId = seriesSelect.value;
            loadAllContent().then(items => {
                const series = items.find(i => i.id === seriesId);
                if (series && series.seasons) {
                    seasonSelect.innerHTML = Object.keys(series.seasons)
                        .map(seasonName => `<option value="${seasonName}">${escapeHtml(seasonName)}</option>`)
                        .join('');
                } else {
                    seasonSelect.innerHTML = '<option value="">Nenhuma temporada</option>';
                }
            });
        }

        function setupNavigation() {
            // Hide admin tab for non-admin users
            if (!userData || !userData.isAdmin) {
                document.querySelectorAll('[data-tab="admin"]').forEach(el => el.style.display = 'none');
            }
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const tab = item.dataset.tab;
                    if (tab) {
                        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                        document.querySelectorAll('.nav-item').forEach(nav => {
                            if (nav.dataset.tab === tab) nav.classList.add('active');
                        });
                        loadTab(tab);
                    }
                    document.getElementById('mobileMenu').classList.remove('active');
                });
            });

            document.getElementById('logoSection')?.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                document.querySelector('[data-tab="home"]').classList.add('active');
                loadTab('home');
            });

            document.getElementById('searchToggle')?.addEventListener('click', () => {
                document.getElementById('searchInput').classList.toggle('expanded');
                if (document.getElementById('searchInput').classList.contains('expanded')) {
                    document.getElementById('searchInput').focus();
                }
            });

            document.getElementById('searchInput')?.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                if (currentTab === 'catalog') loadCatalogTab();
                else if (currentTab === 'home') loadHomeTab();
            });

            document.getElementById('hamburgerMenu')?.addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.toggle('active');
            });

            document.getElementById('logoutButton')?.addEventListener('click', () => {
                if (confirm('Tem certeza que deseja sair?')) {
                    auth.signOut().then(() => {
                        showToast('Logout realizado com sucesso!', 'success');
                        location.reload();
                    }).catch((error) => {
                        showToast('Erro ao fazer logout: ' + error.message);
                    });
                }
            });
        }

        async function loadTab(tabName) {
            currentTab = tabName;
            try {
                switch (tabName) {
                    case 'home': await loadHomeTab(); break;
                    case 'catalog': await loadCatalogTab(); break;
                    case 'admin': await loadAdminTab(); break;
                    case 'donation': await loadDonationTab(); break;
                    default: await loadHomeTab();
                }
            } catch (error) {
                console.error('Error loading tab:', error);
                showToast('Erro ao carregar conteúdo');
            }
        }

        async function initializeApp() {
            try {
                console.log('Initializing YK Server...');
                
                // Check for authenticated user
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists) {
                            userData = userDoc.data();
                        } else {
                            userData = { name: user.email.split('@')[0], email: user.email, isAdmin: false };
                        }
                        document.getElementById('userNameDisplay').textContent = userData.name;
                        setupNavigation();
                        await loadTab('home');
                        const app = document.getElementById('app');
                        const loading = document.getElementById('loadingScreen');
                        app.style.display = 'block';
                        setTimeout(() => app.classList.add('active'), 100);
                        loading.style.display = 'none';
                        console.log('YK Server initialized successfully');
                    } else {
                        // Show login screen
                        showLoginScreen();
                    }
                });
            } catch (error) {
                console.error('Error initializing app:', error);
                showToast('Erro ao inicializar aplicação');
                const app = document.getElementById('app');
                const loading = document.getElementById('loadingScreen');
                if (app) app.style.display = 'block';
                if (loading) loading.style.display = 'none';
            }
        }

        function showLoginScreen() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
                    <div style="background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px;">
                        <h2 style="text-align: center; margin-bottom: 24px; color: var(--primary-pink);">YK Server</h2>
                        <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="loginEmail" required placeholder="seu@email.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-input" id="loginPassword" required placeholder="******">
                            </div>
                            <button type="submit" class="btn-primary">Entrar</button>
                            <button type="button" class="btn-secondary" id="registerBtn">Criar conta</button>
                        </form>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    showToast('Login realizado com sucesso!', 'success');
                } catch (error) {
                    showToast('Erro ao fazer login: ' + error.message);
                }
            });
            
            document.getElementById('registerBtn')?.addEventListener('click', showRegisterScreen);
            
            const loading = document.getElementById('loadingScreen');
            if (loading) loading.style.display = 'none';
            const app = document.getElementById('app');
            if (app) { app.style.display = 'block'; app.classList.add('active'); }
        }

        function showRegisterScreen() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
                    <div style="background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px;">
                        <h2 style="text-align: center; margin-bottom: 24px; color: var(--primary-pink);">Criar Conta</h2>
                        <form id="registerForm" style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-group">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-input" id="registerName" required placeholder="Seu nome">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" id="registerEmail" required placeholder="seu@email.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-input" id="registerPassword" required placeholder="******" minlength="6">
                            </div>
                            <button type="submit" class="btn-primary">Criar conta</button>
                            <button type="button" class="btn-secondary" id="backToLoginBtn">Voltar</button>
                        </form>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('registerName').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection('users').doc(userCredential.user.uid).set({
                        name,
                        email,
                        isAdmin: false,
                        createdAt: new Date()
                    });
                    showToast('Conta criada com sucesso!', 'success');
                } catch (error) {
                    showToast('Erro ao criar conta: ' + error.message);
                }
            });
            
            document.getElementById('backToLoginBtn')?.addEventListener('click', showLoginScreen);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loading = document.getElementById('loadingScreen');
                const app = document.getElementById('app');
                if (loading && loading.style.display !== 'none') {
                    console.warn('Loading timeout - forcing app to show');
                    loading.style.display = 'none';
                    if (app) { app.style.display = 'block'; app.classList.add('active'); }
                }
            }, 3000);
            initializeApp();
        });

        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showToast('Ocorreu um erro inesperado');
        });
    </script>
</body>
